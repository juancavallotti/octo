version: '3'

# Module taskfiles live next to the code they drive and are imported here.
# Their tasks are available under a namespace, e.g. `task runtime:test`,
# `task platform:dev`. The thin aggregators below preserve the short top-level
# targets (`task lint`, `task test`, ...) used by CI and day-to-day work.
# Local, gitignored, and read before anything runs.
#
# It exists for values that cannot live in a committed file because they are
# credentials — today that is EMBEDDINGS_API_KEY, which decides whether
# `task cluster:deploy` brings up the embedding server. Task exports whatever it
# finds here into the environment of every command below, which is what puts it
# where devspace.yaml's `source: env` var can see it.
#
# A missing .env is not an error: every variable it would carry is optional, and
# a checkout with no .env deploys a cluster with no embedding server.
#
# See .env.example for the whole set.
dotenv: ['.env']

includes:
  runtime:
    taskfile: ./runtime/Taskfile.yml
    dir: ./runtime
  platform:
    taskfile: ./apps/platform/Taskfile.yml
    dir: ./apps/platform
  standalone:
    taskfile: ./apps/standalone/Taskfile.yml
    dir: ./apps/standalone
  orchestrator:
    taskfile: ./orchestrator/Taskfile.yml
    dir: ./orchestrator
  logs:
    taskfile: ./logs/Taskfile.yml
    dir: ./logs
  sidecars:
    taskfile: ./sidecars/Taskfile.yml
    dir: ./sidecars

# Global env reaches every task, including those in included taskfiles (task-level
# env does not propagate to called tasks). The platform app reads these server-side
# to enable its dev RUN feature: OCTO_BIN_PATH is the runner spawned on RUN, and
# OCTO_RUN_DIR is where the rendered config is written for `octo -watch`. Running
# the app directly inside the module (bypassing this root Taskfile) leaves them
# unset, which simply disables RUN.
env:
  OCTO_BIN_PATH: '{{.ROOT_DIR}}/bin/octo'
  OCTO_RUN_DIR: '{{.ROOT_DIR}}/.octo-run'
  # Where the standalone app reads/writes local flow YAML under `task dev`.
  OCTO_FS_DIR: '{{.ROOT_DIR}}/.octo-flows'
  # The octo binary dolphin drives, so a dolphin run from this repo tests against the
  # octo we just built and not whatever is on PATH. Distinct from OCTO_BIN_PATH above,
  # which is the platform app's runner: different consumers, do not merge them.
  OCTO_PATH: '{{.ROOT_DIR}}/bin/octo'
  # The dolphin binary the app spawns for the editor's Testing tab. That makes three
  # binary variables, and they are three because they answer three different questions:
  #   OCTO_BIN_PATH     which octo does the APP run?      (RUN, invoke, schema)
  #   OCTO_PATH         which octo does DOLPHIN drive?    (dolphin's own override)
  #   DOLPHIN_BIN_PATH  which dolphin does the APP run?   (the Testing tab)
  # Unset leaves the Testing tab visible but unable to run, which is the honest state.
  DOLPHIN_BIN_PATH: '{{.ROOT_DIR}}/bin/dolphin'

# The kube context k3d creates for our cluster. Every cluster:* task pins to it
# explicitly so a stray current-context (e.g. a remote EKS cluster) can never be
# the target of a deploy/purge/dev command.
vars:
  KCTX: k3d-octo
  # The ten images the orchestrator and the chart expect to find already in the
  # node's containerd. Declared once because three tasks need the same list, and a
  # list that drifts between them is how a cluster ends up holding a subset of it.
  # Nothing pulls these: they exist only in the local docker daemon, so an image
  # that misses the import is not a slow start but a hard ImagePullBackOff.
  CLUSTER_IMAGES: >-
    octo-platform:dev octo-orchestrator:dev octo-logs:dev octo-schema:dev
    octo-runtime:dev octo-devsidecar:dev octo-devruntime:dev
    octo-agenticrunner:dev octo-embeddings:dev octo-api:dev

  # Every image task below copies host-built binaries in rather than compiling
  # them, and this is the flag pair that says so. A NAMED build context, because
  # three of the images build with their own module dir as the context and could
  # not otherwise reach a repo-root dist/ — and because a named context is exempt
  # from the root .dockerignore, which excludes dist/ from the ordinary one.
  #
  # BIN_SOURCE still has to be passed per image (the runtime one picks a variant
  # with it); this var is only the half they all share.
  PREBUILT_CTX: '--build-context prebuilt=dist/bin'

tasks:
  fmt:
    desc: Format all Go modules
    cmds:
      - task: runtime:fmt
      - task: orchestrator:fmt
      - task: logs:fmt
      - task: sidecars:fmt

  test:
    desc: Run tests across all modules (runtime + platform + standalone + orchestrator + logs + sidecars)
    cmds:
      - task: runtime:test
      # The sample flows, run through dolphin against a real octo. They are the runtime's
      # end-to-end tests: the unit tests above prove the engine works, these prove a flow
      # someone might actually copy still does what its comments say.
      - task: runtime:test:samples
      # The two apps this repo ships as images rather than as samples: the platform
      # agent and the embedding server. Neither is reachable from the samples glob,
      # and each runs on its own config directory — dolphin merges directories that
      # are passed together.
      - task: runtime:test:agent
      - task: runtime:test:embeddings
      - task: platform:test
      - task: standalone:test
      - task: orchestrator:test
      - task: logs:test
      - task: sidecars:test

  build:
    desc: Build all modules (CLI binaries + platform + standalone + orchestrator + logs + sidecars)
    cmds:
      - task: runtime:build
      - task: platform:build
      - task: standalone:build
      - task: orchestrator:build
      - task: logs:build
      - task: sidecars:build

  dev:
    desc: Build the runner, then run the standalone editor (local files + RUN enabled)
    cmds:
      # standalone:dev builds the runner (runtime:build) itself before starting.
      - task: standalone:dev

  tidy:
    desc: Tidy all Go modules
    cmds:
      - task: runtime:tidy
      - task: orchestrator:tidy
      - task: logs:tidy
      - task: sidecars:tidy

  lint:
    desc: Lint all modules (runtime + platform + standalone + orchestrator + logs + sidecars)
    cmds:
      - task: runtime:lint
      - task: platform:lint
      - task: standalone:lint
      - task: orchestrator:lint
      - task: logs:lint
      - task: sidecars:lint

  run:
    desc: Run the CLI with a config file
    cmds:
      - task: runtime:run

  run:sample:
    desc: 'Run a config from samples/ (e.g. task run:sample -- heartbeat.yaml)'
    cmds:
      - task: runtime:run:sample

  new-connector:
    desc: Interactively scaffold a new connector
    interactive: true
    cmds:
      - ./scripts/new-connector.sh {{.CLI_ARGS}}

  docs:dev:
    desc: Run the docs site locally (http://localhost:3100/octo/)
    cmds:
      - pnpm --filter docs dev

  docs:build:
    desc: Static-export the docs site to apps/docs/out
    cmds:
      - pnpm --filter docs build

  docs:openapi:
    desc: Refresh the downloadable platform API contract under apps/docs/public
    cmds:
      # -tags api, because the contract and the command that prints it belong to
      # the api module: the default binary carries neither, on purpose, so that no
      # build offers a contract it cannot itself speak.
      - go build -tags api -o bin/octo-api ./runtime/octo
      # The document lives in that binary, so this is a copy — and a copy is
      # exactly the thing that goes stale, which is why CI diffs it afterwards.
      - ./bin/octo-api openapi --out apps/docs/public/octo-platform-api.yaml

  docs:check:
    desc: Fail if connector/block docs drift from the runtime registry
    cmds:
      - task: runtime:build
      - node scripts/check-docs-drift.mjs

  lint-strict:
    desc: Verify lint configuration is present
    cmds:
      - test -f runtime/.golangci.yml
      - test -f apps/platform/eslint.config.mjs
      - test -f apps/standalone/eslint.config.mjs
      - test -f docs/linting-policy.md

  policy-check:
    desc: Verify governance files exist
    cmds:
      - test -f AGENTS.md
      - test -f docs/coding-standards.md
      - test -f docs/linting-policy.md
      - test -f docs/commit-and-review-policy.md
      - test -f docs/release-process.md
      - test -f go.mod

  release-check:
    desc: Verify release readiness files exist
    cmds:
      - task: policy-check
      - test -f .github/workflows/release.yml
      - test -f .github/workflows/release-please.yml
      - test -f release-please-config.json
      - test -f .release-please-manifest.json
      - test -f README.md
      # GoReleaser builds the release archives for both CLIs, and release-please
      # stamps each one's version const — a missing version.go here means a binary
      # that ships claiming whatever version it was born with, forever.
      - test -f .goreleaser.yaml
      - test -f runtime/octo/version.go
      - test -f runtime/dolphin/version.go

  cluster:preflight:
    desc: Verify docker, k3d and devspace are installed
    silent: true
    cmds:
      - |
        missing=
        for tool in docker k3d devspace; do
          command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
        done
        if [ -n "$missing" ]; then
          echo "✖ missing required tools:$missing" >&2
          echo "  install hints:" >&2
          echo "    docker   — Docker Desktop (https://www.docker.com)" >&2
          echo "    k3d      — https://k3d.io  (brew install k3d)" >&2
          echo "    devspace — https://devspace.sh  (brew install devspace)" >&2
          exit 1
        fi
        echo "✓ docker, k3d, devspace present"

  bins:linux:
    desc: 'Cross-compile every Linux binary the images copy, into dist/bin/linux_<arch> (optional GOARCH)'
    # Once per architecture per invocation. `task cluster:dev` reaches this task
    # twice — through cluster:deploy and again for the dev images — and both want
    # the same binaries; a run that also builds for another GOARCH still gets its
    # own pass, because the fingerprint includes the vars.
    run: when_changed
    vars:
      HOST_GOARCH:
        sh: go env GOARCH
      ARCH: '{{.GOARCH | default .HOST_GOARCH}}'
      OUT: '{{.ROOT_DIR}}/dist/bin/linux_{{.ARCH}}'
    cmds:
      # Why this exists: `task cluster:deploy` used to run the Go compiler ten
      # times across eight docker builds — seven of them on the root module, for
      # three distinct binaries — each starting from an empty GOCACHE inside its
      # own container. Built here instead, they share the host's cache: the first
      # run is one cold compile, every run after it is a handful of seconds.
      #
      # This is safe to do outside the image only because every binary is pure Go
      # (sqlite is modernc, not cgo — see .goreleaser.yaml), so CGO_ENABLED=0 plus
      # GOOS/GOARCH cross-compiles with nothing installed but the Go toolchain.
      #
      # Deliberately NOT the same outputs as `task build`: bin/ holds host-native
      # binaries for local dev and the docs-drift check, these are linux/<arch>
      # for the images. Same sources, different targets, so they cannot share a
      # directory without one silently overwriting the other.
      - |
        set -e
        out="{{.OUT}}"
        mkdir -p "$out"
        # Uncomment to compile with the same toolchain the images use
        # (golang:1.27-alpine) instead of whatever `go` is on PATH. Go downloads
        # and caches it once. Off by default so this matches `task build`.
        # export GOTOOLCHAIN=go1.27.0
        export CGO_ENABLED=0 GOOS=linux GOARCH="{{.ARCH}}"
        # Stamp the build date the same way every Dockerfile and goreleaser does,
        # so `octo --version` reads the same wherever the binary came from.
        ld="-s -w -X main.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        cd "{{.ROOT_DIR}}"

        # The root module, four ways. octo, octo-k8s and octo-api are the same
        # package with mutually exclusive build tags (providers_standalone.go /
        # providers_k8s.go / providers_api.go), which is why they are three files on
        # disk and not one image argument.
        echo "▶ octo            (standalone)"
        go build -trimpath -ldflags "$ld" -o "$out/octo" ./runtime/octo
        echo "▶ octo-k8s        (-tags k8s)"
        go build -trimpath -tags k8s -ldflags "$ld" -o "$out/octo-k8s" ./runtime/octo
        echo "▶ octo-api        (-tags api)"
        go build -trimpath -tags api -ldflags "$ld" -o "$out/octo-api" ./runtime/octo
        echo "▶ dolphin"
        go build -trimpath -ldflags "$ld" -o "$out/dolphin" ./runtime/dolphin

        # The three self-contained service modules. No ldflags, matching what
        # their own Dockerfiles and Taskfiles already build with.
        echo "▶ orchestrator"
        (cd orchestrator && go build -trimpath -o "$out/orchestrator" .)
        echo "▶ logs"
        (cd logs && go build -trimpath -o "$out/logs" .)
        echo "▶ dev-sidecar"
        (cd sidecars && go build -trimpath -o "$out/dev-sidecar" ./dev)

        echo "✓ linux/{{.ARCH}} binaries in dist/bin/linux_{{.ARCH}}"

  cluster:images:
    desc: Build the platform/orchestrator/logs/schema/runtime/devsidecar/devruntime/agenticrunner/embeddings images and load them into the k3d 'octo' cluster
    cmds:
      # Compile every Go binary once, on the host, for the node's architecture —
      # then the eight builds below only copy them in. Left to the Dockerfiles,
      # this list runs the Go compiler ten times from a cold cache; see bins:linux.
      - task: bins:linux
      # Platform build context is the repo ROOT so its Dockerfile can reach both
      # runtime/ (to build octo) and the pnpm workspace (apps/platform).
      - docker build {{.PREBUILT_CTX}} --build-arg BIN_SOURCE=prebuilt -t octo-platform:dev -f apps/platform/Dockerfile .
      - docker build {{.PREBUILT_CTX}} --build-arg BIN_SOURCE=prebuilt -t octo-orchestrator:dev -f orchestrator/Dockerfile ./orchestrator
      - docker build {{.PREBUILT_CTX}} --build-arg BIN_SOURCE=prebuilt -t octo-logs:dev -f logs/Dockerfile ./logs
      # No binary in this one — it is a psql client image plus schema.sql. It stays
      # on postgres:16-alpine: the Job only runs psql, so it does not need the
      # pgvector server image the chart deploys.
      - docker build -t octo-schema:dev -f sql/Dockerfile ./sql
      # Generic runtime image the orchestrator deploys per integration (build
      # context is the repo root, where the Go module is rooted).
      - docker build {{.PREBUILT_CTX}} --build-arg BIN_SOURCE=prebuilt-k8s -t octo-runtime:dev -f runtime/Dockerfile .
      # The dev-run pair: the sidecar that owns a dev run's workspace, and the
      # STANDALONE runtime it runs beside. Standalone and not the image above, because
      # an editor Run must not ship logs to the aggregator or take cluster queues —
      # and the k8s build has no standalone provider to fall back to. That choice is
      # BIN_SOURCE here rather than the GOTAGS it used to be: same distinction, made
      # once at the host build, and see runtime/Dockerfile for why it is one knob.
      - docker build {{.PREBUILT_CTX}} --build-arg BIN_SOURCE=prebuilt -t octo-devsidecar:dev -f sidecars/dev/Dockerfile ./sidecars
      - docker build {{.PREBUILT_CTX}} --build-arg BIN_SOURCE=prebuilt-standalone -t octo-devruntime:dev -f runtime/Dockerfile .
      # The agentic runner: the image a deployment runs when it asks for
      # `runner: agentic`. Its own Dockerfile rather than a GOTAGS arm of the one
      # above, because it carries three binaries on a base with a shell.
      - docker build {{.PREBUILT_CTX}} --build-arg BIN_SOURCE=prebuilt -t octo-agenticrunner:dev -f runtime/Dockerfile.agentic .
      # The embedding server: the standalone binary plus one small app. Standalone
      # because it needs no cluster services, and depending on the orchestrator
      # would make it unavailable exactly when the orchestrator is being diagnosed.
      - docker build {{.PREBUILT_CTX}} --build-arg BIN_SOURCE=prebuilt -t octo-embeddings:dev -f embeddings/Dockerfile .
      # The API-delegating runtime: the flavour whose platform capabilities all come
      # from an HTTP API somebody else implements (RUNTIME_SERVICES_MODULE=api). It
      # is one image for three deployment shapes — a Cloud Run service, a central
      # service pods call, or a sidecar's neighbour — because all three differ only
      # in what OCTO_PLATFORM_API_URL points at.
      - docker build {{.PREBUILT_CTX}} --build-arg BIN_SOURCE=prebuilt-api -t octo-api:dev -f runtime/Dockerfile .
      # Load the images straight into the cluster's containerd (no registry needed).
      - k3d image import {{.CLUSTER_IMAGES}} -c octo
      # Then prove they landed, and are still there. A gap never surfaces here: it
      # surfaces much later and in another component, as an integration pod stuck
      # on "pull access denied" for an image that was never meant to be pulled.
      # Two ways to open one — an import interrupted partway, or the kubelet
      # reclaiming images it already holds (see verify). A second spent here names
      # the missing image instead of leaving it to be found from the other end.
      - task: cluster:images:verify

  cluster:images:verify:
    desc: Check that the k3d 'octo' cluster holds every image the orchestrator deploys
    silent: true
    cmds:
      - |
        node="$(k3d node list 2>/dev/null | awk '$2 == "server" && $3 == "octo" {print $1; exit}')"
        if [ -z "$node" ]; then
          echo "✖ no k3d 'octo' server node — run 'task cluster:deploy' first" >&2
          exit 1
        fi
        # crictl is the node's own view. Asking docker instead would answer a
        # different question — the daemon is where these images already are.
        have="$(docker exec "$node" crictl images 2>/dev/null | awk 'NR > 1 {print $1 ":" $2}')"
        missing=
        for img in {{.CLUSTER_IMAGES}}; do
          printf '%s\n' "$have" | grep -qx "docker.io/library/$img" || missing="$missing $img"
        done
        if [ -z "$missing" ]; then
          echo "✓ all eight images present in cluster 'octo'"
          exit 0
        fi
        echo "✖ cluster 'octo' is missing:$missing" >&2
        echo "  these exist only in the local docker daemon, so the kubelet cannot pull them:" >&2
        echo "  any pod that needs one fails with ImagePullBackOff / 'pull access denied'." >&2
        # An import that landed and then vanished is the confusing case, and it has
        # a specific cause: the node's image filesystem is the docker VM's disk,
        # shared with every build cache and volume on the host. Over the kubelet's
        # 85% high threshold, image GC deletes images no running pod references —
        # which is exactly the dev-run pair and any runtime not currently serving.
        # Re-importing does not stick, so say so rather than recommending a loop.
        use="$(docker exec "$node" df -P / 2>/dev/null | awk 'NR == 2 {print 0 + $5}')"
        if [ -n "$use" ] && [ "$use" -ge 85 ]; then
          echo "" >&2
          echo "  the node's image filesystem is ${use}% full, over the kubelet's 85% threshold," >&2
          echo "  so these were likely garbage-collected after a successful import." >&2
          echo "  re-importing alone will not hold — reclaim space on the docker host first:" >&2
          echo "    docker builder prune     # build cache is usually the bulk of it" >&2
          echo "    docker image prune -a    # then unreferenced images" >&2
          echo "  check with: docker system df" >&2
        fi
        echo "" >&2
        echo "  run: task cluster:images" >&2
        exit 1

  cluster:images:kind:
    desc: Build the eight images and load them into a kind 'octo' cluster
    cmds:
      # Same builds as cluster:images, including the host-side compile.
      - task: bins:linux
      - docker build {{.PREBUILT_CTX}} --build-arg BIN_SOURCE=prebuilt -t octo-platform:dev -f apps/platform/Dockerfile .
      - docker build {{.PREBUILT_CTX}} --build-arg BIN_SOURCE=prebuilt -t octo-orchestrator:dev -f orchestrator/Dockerfile ./orchestrator
      - docker build {{.PREBUILT_CTX}} --build-arg BIN_SOURCE=prebuilt -t octo-logs:dev -f logs/Dockerfile ./logs
      - docker build -t octo-schema:dev -f sql/Dockerfile ./sql
      - docker build {{.PREBUILT_CTX}} --build-arg BIN_SOURCE=prebuilt-k8s -t octo-runtime:dev -f runtime/Dockerfile .
      - docker build {{.PREBUILT_CTX}} --build-arg BIN_SOURCE=prebuilt -t octo-devsidecar:dev -f sidecars/dev/Dockerfile ./sidecars
      - docker build {{.PREBUILT_CTX}} --build-arg BIN_SOURCE=prebuilt-standalone -t octo-devruntime:dev -f runtime/Dockerfile .
      - docker build {{.PREBUILT_CTX}} --build-arg BIN_SOURCE=prebuilt -t octo-agenticrunner:dev -f runtime/Dockerfile.agentic .
      - docker build {{.PREBUILT_CTX}} --build-arg BIN_SOURCE=prebuilt-api -t octo-api:dev -f runtime/Dockerfile .
      # The embedding server: the standalone binary plus one small app. Standalone
      # because it needs no cluster services, and depending on the orchestrator
      # would make it unavailable exactly when the orchestrator is being diagnosed.
      - docker build {{.PREBUILT_CTX}} --build-arg BIN_SOURCE=prebuilt -t octo-embeddings:dev -f embeddings/Dockerfile .
      # No verify step to match cluster:images: that check reads the k3d node's
      # containerd, and a kind node is a different name and a different runtime.
      - kind load docker-image --name octo {{.CLUSTER_IMAGES}}

  cluster:images:dev:
    desc: Build + load the dev (hot-reload) images into the k3d 'octo' cluster
    cmds:
      # Only the platform dev image carries binaries; the orchestrator and logs
      # dev images run `go run` against synced source and compile nothing here.
      - task: bins:linux
      - docker build {{.PREBUILT_CTX}} --build-arg BIN_SOURCE=prebuilt -t octo-platform-dev:dev -f apps/platform/Dockerfile.dev .
      - docker build -t octo-orchestrator-dev:dev -f orchestrator/Dockerfile.dev ./orchestrator
      - docker build -t octo-logs-dev:dev -f logs/Dockerfile.dev ./logs
      - k3d image import octo-platform-dev:dev octo-orchestrator-dev:dev octo-logs-dev:dev -c octo

  cluster:dev:
    desc: Bring up the cluster, then run DevSpace dev mode (hot reload + tailed logs)
    # Inherits EMBEDDINGS_API_KEY through cluster:deploy below — see the note
    # there. The embedding server has no dev image and no hot reload: it is one
    # small app that changes when its config does, so a `task cluster:deploy`
    # rebuild is the whole of its dev loop.
    cmds:
      # Ensure the cluster + Postgres + schema are up (idempotent), then load the
      # dev images and hand off to `devspace dev`, which swaps the app pods for
      # their dev images, syncs source for hot reload, and tails logs. Stays
      # attached until Ctrl-C; `devspace reset pods -n octo-dev` restores prod pods.
      - task: cluster:deploy
      - task: cluster:images:dev
      - devspace dev --kube-context {{.KCTX}} --namespace octo-dev

  cluster:deploy:
    desc: Spin up the local k3d (k3s) cluster and deploy platform, Postgres, orchestrator
    # EMBEDDINGS_API_KEY is the one thing this task reads from your shell rather
    # than from a committed file, because it is a credential. Set it and the
    # embedding server comes up too, so searching agent memory ranks by meaning:
    #
    #   EMBEDDINGS_API_KEY=sk-... task cluster:deploy
    #
    # Unset is the default and is a supported way to run locally — search matches
    # text. See the vars block in devspace.yaml.
    cmds:
      - task: cluster:preflight
      - |
        if k3d cluster list 2>/dev/null | grep -qw octo; then
          echo "✓ k3d cluster 'octo' already exists"
        else
          echo "▶ creating k3d cluster 'octo' (Postgres data -> ./data)..."
          mkdir -p data
          # ./data is mounted into the node at the path the chart's static
          # PersistentVolume binds (postgres.storage.hostPath in values-k3d.yaml),
          # so Postgres lives at ./data/pgdata. Deliberately not the local-path
          # provisioner's directory: that names volumes after the claim's UID, so
          # this task — which recreates the cluster — would get a fresh, empty
          # database every time and leave the old one orphaned on disk.
          k3d cluster create --config deploy/k3d/cluster.yaml \
            --volume "$(pwd)/data:/var/lib/octo-data@server:0"
        fi
      # Build + load images, then install the Helm chart via DevSpace
      # (deployments.octo in devspace.yaml -> ./helm with values-k3d.yaml).
      - task: cluster:images
      - devspace deploy --kube-context {{.KCTX}} --namespace octo-dev
      # Fixed :dev tags don't change between runs, so nudge the apps to pull the
      # freshly imported images. Harmless on first run; ignored if not yet present.
      #
      # Every deployment built above belongs here. octo-logs was missing, and the
      # way that surfaces is nasty: the build succeeds, the import succeeds, verify
      # passes — and the pod keeps serving the previous binary. A route added to the
      # aggregator then 404s in the cluster while working locally, which reads as a
      # wrong URL or a permission problem rather than as a pod that was never
      # replaced.
      #
      # Skipping a deployment that does not exist yet is the only failure worth
      # tolerating, and it is checked for by name rather than by discarding every
      # error: `|| true` also swallowed a wrong context, an unreachable cluster and a
      # missing namespace, so the task reported success while nothing restarted —
      # which is the same silence the missing octo-logs above produced.
      - |
        for dep in octo-platform octo-orchestrator octo-logs octo-embeddings; do
          if ! kubectl --context {{.KCTX}} -n octo-dev get deployment "$dep" >/dev/null 2>&1; then
            echo "· $dep not deployed yet, skipping restart"
            continue
          fi
          kubectl --context {{.KCTX}} -n octo-dev rollout restart deployment "$dep"
        done
      - |
        echo ""
        echo "✓ cluster up:"
        echo "    platform      http://localhost:3000"
        echo "    orchestrator  http://localhost:8090/healthz  (and /db-version)"
        if [ -n "$EMBEDDINGS_API_KEY" ]; then
          echo "    embeddings    deployed (agent memory search ranks by meaning)"
        else
          # Said every run, because the absence is silent otherwise: search still
          # works, it just matches text, and the difference only shows up as
          # results that are not as good as expected.
          echo "    embeddings    not deployed — set EMBEDDINGS_API_KEY and re-run"
          echo "                  to rank agent memory search by meaning"
        fi
        echo "  pods: kubectl get pods -n octo-dev"

  cluster:stop:
    desc: Tear down the local k3d cluster and free resources (keeps ./data)
    cmds:
      - devspace purge --kube-context {{.KCTX}} --namespace octo-dev || true
      - |
        if k3d cluster list 2>/dev/null | grep -qw octo; then
          k3d cluster delete octo
          echo "✓ k3d cluster 'octo' deleted; Docker memory reclaimed"
        else
          echo "✓ no k3d cluster 'octo' to delete"
        fi
      - echo "ℹ Postgres data preserved in ./data — run 'task cluster:db:reset' to wipe it"

  cluster:db:reset:
    desc: Delete the local Postgres data dir (./data) so the DB is recreated fresh on next deploy
    prompt: This permanently deletes ./data and all local Postgres data. Continue?
    cmds:
      # Postgres holds the data dir open while the cluster runs; deleting it then
      # would corrupt the volume. Require the cluster down first.
      - |
        if k3d cluster list 2>/dev/null | grep -qw octo; then
          echo "✖ k3d cluster 'octo' is running; stop it first so Postgres releases ./data:" >&2
          echo "    task cluster:stop" >&2
          exit 1
        fi
      - rm -rf data
      - echo "✓ ./data removed; 'task cluster:deploy' will recreate Postgres and re-apply the schema fresh"

  # --- Publishing to Artifact Registry (for the GCP/k3s deployment) ---
  # IMAGE_BASE is the repository path output by deploy/terraform/infra (image_base),
  # e.g. us-central1-docker.pkg.dev/PROJECT/octo. The seven images live under it
  # (IMAGE_BASE/octo-platform-paas:TAG ...) and the OCI chart under IMAGE_BASE/octo.

  images:push:
    desc: 'Build the eight octo images and push them to Artifact Registry (set IMAGE_BASE and TAG; run `gcloud auth configure-docker <region>-docker.pkg.dev` first)'
    requires:
      vars: [IMAGE_BASE, TAG]
    cmds:
      # NOTE: plain `docker build`, so these come out host-arch — unlike images:ttl
      # and images:ar below, which force linux/amd64. The prebuild follows suit and
      # targets the host arch too, so the binaries match the images they land in.
      - task: bins:linux
      # Same build contexts as cluster:images; the platform context is the repo
      # root so its Dockerfile reaches both runtime/ and the pnpm workspace.
      - docker build {{.PREBUILT_CTX}} --build-arg BIN_SOURCE=prebuilt -t {{.IMAGE_BASE}}/octo-platform-paas:{{.TAG}} -f apps/platform/Dockerfile .
      - docker build {{.PREBUILT_CTX}} --build-arg BIN_SOURCE=prebuilt -t {{.IMAGE_BASE}}/octo-orchestrator-paas:{{.TAG}} -f orchestrator/Dockerfile ./orchestrator
      - docker build {{.PREBUILT_CTX}} --build-arg BIN_SOURCE=prebuilt -t {{.IMAGE_BASE}}/octo-logs-paas:{{.TAG}} -f logs/Dockerfile ./logs
      - docker build -t {{.IMAGE_BASE}}/octo-schema-paas:{{.TAG}} -f sql/Dockerfile ./sql
      - docker build {{.PREBUILT_CTX}} --build-arg BIN_SOURCE=prebuilt-k8s -t {{.IMAGE_BASE}}/octo-runtime-paas:{{.TAG}} -f runtime/Dockerfile .
      - docker build {{.PREBUILT_CTX}} --build-arg BIN_SOURCE=prebuilt -t {{.IMAGE_BASE}}/octo-devsidecar-paas:{{.TAG}} -f sidecars/dev/Dockerfile ./sidecars
      # prebuilt-standalone is the untagged build; the k8s one is octo-runtime-paas above.
      - docker build {{.PREBUILT_CTX}} --build-arg BIN_SOURCE=prebuilt-standalone -t {{.IMAGE_BASE}}/octo-devruntime-paas:{{.TAG}} -f runtime/Dockerfile .
      # The agentic runner has its own Dockerfile, not a BIN_SOURCE arm of the one above.
      - docker build {{.PREBUILT_CTX}} --build-arg BIN_SOURCE=prebuilt -t {{.IMAGE_BASE}}/octo-agenticrunner-paas:{{.TAG}} -f runtime/Dockerfile.agentic .
      # prebuilt-api is the -tags api build: the flavour that delegates every
      # platform capability to an operator-implemented HTTP API.
      - docker build {{.PREBUILT_CTX}} --build-arg BIN_SOURCE=prebuilt-api -t {{.IMAGE_BASE}}/octo-api-paas:{{.TAG}} -f runtime/Dockerfile .
      - docker push {{.IMAGE_BASE}}/octo-platform-paas:{{.TAG}}
      - docker push {{.IMAGE_BASE}}/octo-orchestrator-paas:{{.TAG}}
      - docker push {{.IMAGE_BASE}}/octo-logs-paas:{{.TAG}}
      - docker push {{.IMAGE_BASE}}/octo-schema-paas:{{.TAG}}
      - docker push {{.IMAGE_BASE}}/octo-runtime-paas:{{.TAG}}
      - docker push {{.IMAGE_BASE}}/octo-devsidecar-paas:{{.TAG}}
      - docker push {{.IMAGE_BASE}}/octo-devruntime-paas:{{.TAG}}
      - docker push {{.IMAGE_BASE}}/octo-agenticrunner-paas:{{.TAG}}
      - docker push {{.IMAGE_BASE}}/octo-api-paas:{{.TAG}}

  images:ttl:
    desc: 'Build the eight octo images from the working tree and push them to ttl.sh for cluster testing (optional PREFIX, TTL)'
    vars:
      # ttl.sh's tag IS the image's lifetime, and 24h is its maximum.
      TTL: '{{.TTL | default "12h"}}'
      PREFIX: '{{.PREFIX | default ""}}'
    cmds:
      # linux/amd64, because that is what the images below are built --platform for.
      - task: bins:linux
        vars: { GOARCH: amd64 }
      # For testing a cluster against the CURRENT working tree. The published
      # images track releases, so any chart change made since the last one has no
      # matching image to run against; ttl.sh is an anonymous, unauthenticated
      # registry that expires what you push, which is exactly the shape of a test
      # deploy. Nothing here needs a login, a repository to be created, or cleanup.
      #
      # Feed the result to the release roots with -var image_values_file=...
      # (task gke:standard:apply IMAGE_VALUES=dist/values.ttl.yaml).
      - |
        set -e
        PREFIX="{{.PREFIX}}"
        # ttl.sh is one shared public namespace: whoever pushes a name last owns it.
        # A random path segment is what keeps a test run from colliding with (or
        # being clobbered by) a stranger's.
        [ -n "$PREFIX" ] || PREFIX="octo-$(openssl rand -hex 6)"
        REGISTRY="ttl.sh/$PREFIX"
        TAG="{{.TTL}}"

        # --platform linux/amd64 is not optional: a plain `docker build` on Apple
        # Silicon produces arm64 images, and every pod on a GKE/EKS node then
        # CrashLoops with "exec format error". buildx pushes straight to the
        # registry, so nothing is loaded into the local daemon.
        #
        # $4 carries the image's BIN_SOURCE. The binaries themselves were
        # cross-compiled for linux/amd64 by the bins:linux step above and are
        # copied in from dist/bin — which matters most here of anywhere: this is
        # a --platform build, so a compile inside the image would run the Go
        # toolchain under QEMU emulation, minutes per binary. Passing no $4 (the
        # schema image) leaves BIN_SOURCE at its compile default, which that
        # image does not use anyway.
        build() {
          echo "→ $REGISTRY/$1:$TAG"
          docker buildx build --platform linux/amd64 --push \
            --build-context prebuilt=dist/bin \
            -t "$REGISTRY/$1:$TAG" -f "$2" $4 "$3"
        }
        build octo-platform-paas     apps/platform/Dockerfile .           "--build-arg BIN_SOURCE=prebuilt"
        build octo-orchestrator-paas orchestrator/Dockerfile  ./orchestrator "--build-arg BIN_SOURCE=prebuilt"
        build octo-logs-paas         logs/Dockerfile          ./logs      "--build-arg BIN_SOURCE=prebuilt"
        build octo-schema-paas       sql/Dockerfile           ./sql       ""
        build octo-devsidecar-paas   sidecars/dev/Dockerfile  ./sidecars  "--build-arg BIN_SOURCE=prebuilt"
        # The k8s build is what makes the runtime talk to the orchestrator; the
        # standalone one is what a dev run executes.
        build octo-runtime-paas      runtime/Dockerfile       .           "--build-arg BIN_SOURCE=prebuilt-k8s"
        build octo-devruntime-paas   runtime/Dockerfile       .           "--build-arg BIN_SOURCE=prebuilt-standalone"
        # The agentic runner, from its own Dockerfile: three binaries on a base with
        # a shell, for a deployment that asks for `runner: agentic`.
        build octo-agenticrunner-paas runtime/Dockerfile.agentic .          "--build-arg BIN_SOURCE=prebuilt"

        mkdir -p dist
        {
          echo "# Rendered by 'task images:ttl TTL=$TAG' — do not edit."
          echo "# Ephemeral images: ttl.sh deletes them $TAG after the push above."
          echo "image:"
          echo "  registry: $REGISTRY"
          echo "  tag: \"$TAG\""
          # The tag is a lifetime, not a version, so it gets reused across runs.
          # IfNotPresent would silently keep running whatever a node cached first.
          echo "  pullPolicy: Always"
        } > dist/values.ttl.yaml
        echo
        echo "✓ wrote dist/values.ttl.yaml  (registry $REGISTRY, expires in $TAG)"
        echo "  task gke:standard:apply IMAGE_VALUES=dist/values.ttl.yaml"

  registry:test:
    desc: 'Create the public Artifact Registry repo that images:ar pushes to (run once; optional PROJECT, REGION, REPO)'
    vars:
      PROJECT: '{{.PROJECT | default "juancavallotti"}}'
      REGION: '{{.REGION | default "us-west1"}}'
      REPO: '{{.REPO | default "octo-test"}}'
    cmds:
      # A registry for test images, separate from the release one the infra root
      # creates: this holds working-tree builds, is world-readable, and is meant
      # to be deleted after a test round.
      #
      # PUBLIC on purpose, and it is not laziness. The EKS test cluster's nodes
      # run in AWS and have no way to hold a Google credential, so an authenticated
      # GCP registry would mean minting a service-account key and threading it
      # through an imagePullSecret — a long-lived credential created to test a
      # cluster that exists for an afternoon. Anonymous read means one registry
      # serves both GKE and EKS with no secret anywhere. Nothing here is private:
      # the images are built from a public repository.
      - |
        set -e
        HOST="{{.REGION}}-docker.pkg.dev"
        gcloud artifacts repositories create {{.REPO}} \
          --repository-format=docker --location={{.REGION}} --project={{.PROJECT}} \
          --description="octo working-tree test images (public read); delete with task registry:test:delete" \
          2>/dev/null || echo "  repository {{.REPO}} already exists"
        # Anonymous pull. Skipped silently if it is already bound.
        gcloud artifacts repositories add-iam-policy-binding {{.REPO}} \
          --location={{.REGION}} --project={{.PROJECT}} \
          --member=allUsers --role=roles/artifactregistry.reader >/dev/null
        gcloud auth configure-docker "$HOST" --quiet
        echo
        echo "✓ $HOST/{{.PROJECT}}/{{.REPO}} ready, world-readable"
        echo "  task images:ar"
        echo "  task registry:test:delete   # when you are done"

  registry:test:delete:
    desc: 'Delete the public test Artifact Registry repo and everything in it (optional PROJECT, REGION, REPO)'
    vars:
      PROJECT: '{{.PROJECT | default "juancavallotti"}}'
      REGION: '{{.REGION | default "us-west1"}}'
      REPO: '{{.REPO | default "octo-test"}}'
    cmds:
      # Deletes images and repository together. Storage is ~$0.10/GB/month and a
      # full set of octo images is ~1.5GB, so leaving it costs cents — but a public
      # registry is worth taking down when it has nothing left to serve.
      - gcloud artifacts repositories delete {{.REPO}} --location={{.REGION}} --project={{.PROJECT}} --quiet
      - 'echo "✓ deleted {{.REGION}}-docker.pkg.dev/{{.PROJECT}}/{{.REPO}}"'

  images:ar:
    desc: 'Build the eight octo images from the working tree and push them to the public Artifact Registry repo (optional TAG, PROJECT, REGION, REPO)'
    vars:
      TAG: '{{.TAG | default "test"}}'
      PROJECT: '{{.PROJECT | default "juancavallotti"}}'
      REGION: '{{.REGION | default "us-west1"}}'
      REPO: '{{.REPO | default "octo-test"}}'
    cmds:
      # linux/amd64, because that is what the images below are built --platform for.
      - task: bins:linux
        vars: { GOARCH: amd64 }
      # The same job as images:ttl, against a registry that can actually keep up.
      # ttl.sh needs no setup at all, which is why it is still here — but it mints
      # a fresh repository name per run, so every layer uploads in full every time
      # (~315MB for the platform image alone) at a fraction of the throughput. This
      # target reuses one repository, so a second push sends only what changed, and
      # it sits in the same region as the GKE cluster, so the nodes pull locally
      # rather than dragging the images across the internet on every pod start.
      #
      # Run `task registry:test` once first.
      - |
        set -e
        REGISTRY="{{.REGION}}-docker.pkg.dev/{{.PROJECT}}/{{.REPO}}"
        TAG="{{.TAG}}"

        # --platform linux/amd64 is not optional: a plain `docker build` on Apple
        # Silicon produces arm64 images, and every pod on a GKE/EKS node then
        # CrashLoops with "exec format error". buildx pushes straight to the
        # registry, so nothing is loaded into the local daemon.
        #
        # $4 carries the image's BIN_SOURCE. The binaries themselves were
        # cross-compiled for linux/amd64 by the bins:linux step above and are
        # copied in from dist/bin — which matters most here of anywhere: this is
        # a --platform build, so a compile inside the image would run the Go
        # toolchain under QEMU emulation, minutes per binary. Passing no $4 (the
        # schema image) leaves BIN_SOURCE at its compile default, which that
        # image does not use anyway.
        build() {
          echo "→ $REGISTRY/$1:$TAG"
          docker buildx build --platform linux/amd64 --push \
            --build-context prebuilt=dist/bin \
            -t "$REGISTRY/$1:$TAG" -f "$2" $4 "$3"
        }
        build octo-platform-paas     apps/platform/Dockerfile .           "--build-arg BIN_SOURCE=prebuilt"
        build octo-orchestrator-paas orchestrator/Dockerfile  ./orchestrator "--build-arg BIN_SOURCE=prebuilt"
        build octo-logs-paas         logs/Dockerfile          ./logs      "--build-arg BIN_SOURCE=prebuilt"
        build octo-schema-paas       sql/Dockerfile           ./sql       ""
        build octo-devsidecar-paas   sidecars/dev/Dockerfile  ./sidecars  "--build-arg BIN_SOURCE=prebuilt"
        # The k8s build is what makes the runtime talk to the orchestrator; the
        # standalone one is what a dev run executes.
        build octo-runtime-paas      runtime/Dockerfile       .           "--build-arg BIN_SOURCE=prebuilt-k8s"
        build octo-devruntime-paas   runtime/Dockerfile       .           "--build-arg BIN_SOURCE=prebuilt-standalone"
        # The agentic runner, from its own Dockerfile: three binaries on a base with
        # a shell, for a deployment that asks for `runner: agentic`.
        build octo-agenticrunner-paas runtime/Dockerfile.agentic .          "--build-arg BIN_SOURCE=prebuilt"

        mkdir -p dist
        {
          echo "# Rendered by 'task images:ar TAG=$TAG' — do not edit."
          echo "# Public Artifact Registry: no pull secret needed on GKE or EKS."
          echo "image:"
          echo "  registry: $REGISTRY"
          echo "  tag: \"$TAG\""
          # The default tag is reused across runs, so a node that cached it once
          # would otherwise keep running the old image. Pass a unique TAG and this
          # can drop to IfNotPresent.
          echo "  pullPolicy: Always"
        } > dist/values.ar.yaml
        echo
        echo "✓ wrote dist/values.ar.yaml  (registry $REGISTRY, tag $TAG)"
        echo "  task gke:autopilot:apply IMAGE_VALUES=dist/values.ar.yaml"

  helm:lint:
    desc: Lint the octo Helm chart
    cmds:
      - helm lint helm

  helm:test:
    desc: Lint and schema-validate the chart's rendered manifests across every environment profile
    silent: true
    cmds:
      # The chart targets clusters this repo cannot spin up on a whim (GKE
      # Autopilot, EKS), so rendering every profile and running the output
      # through the real Kubernetes schemas is the automated gate. It catches
      # the failure mode that matters for a library chart — a helper change that
      # renders fine under the defaults and produces invalid YAML under a
      # profile — without the churn of checked-in golden files.
      - |
        set -e
        command -v helm >/dev/null 2>&1 || { echo "✖ helm is required (https://helm.sh/docs/intro/install/)" >&2; exit 1; }
        if command -v kubeconform >/dev/null 2>&1; then
          schema=yes
        else
          schema=no
          echo "ℹ kubeconform not found — rendering only, without schema validation (brew install kubeconform)"
        fi
        out="$(mktemp)"
        trap 'rm -f "$out"' EXIT
        # -ignore-missing-schemas skips CRDs that are not in the upstream schema
        # set (GKE's ManagedCertificate/BackendConfig/FrontendConfig); everything
        # with a published schema is still checked, and -strict rejects unknown
        # fields rather than waving them through.
        check() {
          name="$1"; shift
          printf '  %-18s ' "$name"
          # The three values that have no default and are required wherever they
          # apply — an Ingress host, a password for the bundled Postgres, and the
          # dev-run hash secret (dev runs are on by default, so it is required
          # everywhere the feature is not turned off). Supplied here the way a real
          # install must; profiles that set their own land on the same values.
          required="--set ingress.host=octo.example.com --set postgres.auth.password=rendertest --set orchestrator.devRuns.hashSecret=rendertest"
          # lint, not template, is what covers NOTES.txt: `helm template` skips the
          # file entirely, and lint renders it along with everything else.
          if ! helm lint helm $required "$@" >"$out" 2>&1; then echo "FAILED (lint)"; cat "$out"; return 1; fi
          if ! helm template octo helm --namespace octo $required "$@" >"$out" 2>&1; then echo "FAILED (template)"; cat "$out"; return 1; fi
          if [ "$schema" = yes ]; then
            kubeconform -strict -ignore-missing-schemas -summary <"$out"
          else
            echo "rendered ok"
          fi
        }
        # The other half of the gate: renders that MUST fail. Every guard in the
        # chart exists because the combination it catches would otherwise install
        # cleanly and serve nothing, so a guard that silently stops firing is the
        # same bug returning. `check` can never notice that — it asserts success.
        # This asserts the failure, and that the message names the value to fix.
        check_fails() {
          name="$1"; want="$2"; shift 2
          printf '  %-22s ' "$name"
          required="--set ingress.host=octo.example.com --set postgres.auth.password=rendertest --set orchestrator.devRuns.hashSecret=rendertest"
          if render="$(helm template octo helm --namespace octo $required "$@" 2>&1)"; then
            echo "FAILED (rendered, but should not have)"; return 1
          fi
          case "$render" in
            *"$want"*) echo "refused" ;;
            *) echo "FAILED (refused for the wrong reason)"; echo "$render" | tail -3; return 1 ;;
          esac
        }
        # A grep-able absence check, for guards whose whole point is a resource
        # that must NOT appear. Rendering successfully proves nothing here.
        check_absent() {
          name="$1"; absent="$2"; shift 2
          printf '  %-22s ' "$name"
          required="--set ingress.host=octo.example.com --set postgres.auth.password=rendertest --set orchestrator.devRuns.hashSecret=rendertest"
          if ! render="$(helm template octo helm --namespace octo $required "$@" 2>&1)"; then
            echo "FAILED (did not render)"; echo "$render" | tail -3; return 1
          fi
          if printf '%s' "$render" | grep -q "$absent"; then
            echo "FAILED ($absent was rendered, and must not be)"; return 1
          fi
          echo "absent as expected"
        }
        # The mirror of check_absent, for a guard whose point is that a resource
        # IS rendered and carries the right value. Rendering successfully proves
        # nothing when the interesting part is one annotation inside it.
        check_contains() {
          name="$1"; shift
          wants=""
          while [ "$1" != "--" ]; do wants="$wants|$1"; shift; done
          shift
          printf '  %-22s ' "$name"
          required="--set ingress.host=octo.example.com --set postgres.auth.password=rendertest --set orchestrator.devRuns.hashSecret=rendertest"
          if ! render="$(helm template octo helm --namespace octo $required "$@" 2>&1)"; then
            echo "FAILED (did not render)"; echo "$render" | tail -3; return 1
          fi
          old_ifs="$IFS"; IFS='|'
          for want in $wants; do
            [ -n "$want" ] || continue
            if ! printf '%s' "$render" | grep -qF "$want"; then
              IFS="$old_ifs"; echo "FAILED (missing: $want)"; return 1
            fi
          done
          IFS="$old_ifs"
          echo "present as expected"
        }
        # The profiles as shipped. "defaults" is values.yaml alone — what an
        # install straight from OCI gets with no -f at all.
        check defaults
        check k3d           -f helm/values-k3d.yaml
        check kind          -f helm/values-kind.yaml
        check gke-autopilot -f helm/values-gke-autopilot.yaml
        check gke-standard  -f helm/values-gke-standard.yaml
        check eks           -f helm/values-eks.yaml
        # Paths no profile enables by default, which would otherwise only ever be
        # rendered by hand — and so would break silently.
        #
        # The ingress class is one axis worth covering deliberately: `defaults`
        # above is the no-class render (the cluster's default IngressClass claims
        # it), the GKE profiles render nginx and EKS renders alb, and this covers
        # traefik, which no profile does since the k3s path sets it from Terraform.
        check traefik-ingress \
          --set ingress.className=traefik --set orchestrator.ingressClass=traefik
        # Gateway API. Both halves of the design get rendered: attaching to a
        # Gateway somebody else owns (the default, and the reason the mode is
        # worth having) and creating one, which is what an all-in-one install
        # needs and the only path that renders listeners at all. The wildcard
        # variant is the full arrangement — an editor host and a *.baseDomain
        # listener on one Gateway, with the certificates the orchestrator no
        # longer has to know about.
        #
        # kubeconform skips the Gateway API kinds (-ignore-missing-schemas):
        # they are CRDs, so what these profiles gate is that the templates render
        # valid YAML and that no Ingress-shaped value leaks into a route.
        check gateway-attach \
          --set networking.mode=gateway --set networking.gateway.name=shared-gw \
          --set networking.gateway.namespace=ingress \
          --set orchestrator.baseDomain=apps.example.com
        check gateway-create \
          --set networking.mode=gateway --set networking.gateway.create=true \
          --set networking.gateway.className=kgateway
        check gateway-wildcard \
          --set networking.mode=gateway --set networking.gateway.create=true \
          --set networking.gateway.className=kgateway \
          --set orchestrator.baseDomain=apps.example.com \
          --set wildcardTLS.enabled=true --set wildcardTLS.clusterIssuer=letsencrypt-dns
        check gke-gce-ingress -f helm/values-gke-autopilot.yaml \
          --set ingress.className=gce --set ingress.tls.mode=gke-managed-cert \
          --set gke.backendConfig.enabled=true --set gke.frontendConfig.enabled=true
        check external-db \
          --set postgres.enabled=false --set externalDatabase.host=db.example.com \
          --set externalDatabase.existingSecret=db-creds --set externalDatabase.existingSecretPasswordKey=password
        # A managed Redis instead of the bundled one. The URL is the whole
        # connection here, unlike the database's, so this is the only render that
        # proves the helper prefers it over the in-cluster Service name.
        check external-redis \
          --set redis.enabled=false --set externalRedis.url=redis://cache.example:6379
        # The same, with the URL in a Secret the caller owns — the path a managed
        # Redis with a password takes. It renders a secretKeyRef where the others
        # render a literal, and nothing else in the chart does that for Redis.
        check external-redis-secret \
          --set redis.enabled=false --set externalRedis.existingSecret=octo-redis
        # The bundled Redis with its ceiling written as a byte count rather than a
        # suffixed string, which is how a values file that wants an exact figure
        # would write it — and which renders an integer into an args list the API
        # server requires strings in.
        check redis-numeric-max \
          --set redis.maxmemory=268435456
        # The bundled database with its password in a Secret the caller owns. The
        # empty --set clears the one $required supplies, so this also proves an
        # existing Secret is sufficient on its own.
        # A private-registry install: pull secrets must reach both the chart's own
        # workloads and, through the orchestrator's env, the integration pods it
        # creates. Nothing else renders that env var.
        check pull-secrets \
          --set defaults.imagePullSecrets[0].name=regcred
        check pg-existing-secret \
          --set postgres.auth.password= --set postgres.auth.existingSecret=db-creds \
          --set postgres.auth.existingSecretPasswordKey=password
        check oidc \
          --set auth.oidc.enabled=true --set auth.oidc.issuer=https://id.example.com \
          --set auth.oidc.clientId=octo --set auth.oidc.clientSecret=shh --set auth.secret=shh
        check wildcard-tls \
          --set wildcardTLS.enabled=true --set wildcardTLS.clusterIssuer=letsencrypt-dns \
          --set orchestrator.baseDomain=apps.example.com
        # The same wildcard with no issuer: the Secret exists already, so the
        # chart references it and creates no Certificate. Worth its own profile
        # because the difference is a resource that must NOT be rendered, which
        # nothing else here would catch.
        check wildcard-existing \
          --set wildcardTLS.enabled=true --set wildcardTLS.clusterIssuer= \
          --set orchestrator.baseDomain=apps.example.com
        # Dev runs (the editor's Run as a pod of its own) are on by default now, so
        # `check defaults` already renders the two images, the sidecar port, the idle
        # timeout and the hash Secret. What this adds is a baseDomain — the published
        # per-integration endpoint the bare defaults leave unset.
        check dev-runs \
          --set orchestrator.baseDomain=apps.example.com
        # The arrangement dev runs actually want: one *.baseDomain certificate rather
        # than a per-host one, so a dev-run hostname stays out of public CT logs.
        check dev-runs-wildcard \
          --set orchestrator.baseDomain=apps.example.com \
          --set wildcardTLS.enabled=true --set wildcardTLS.clusterIssuer=letsencrypt-dns
        # The retention CronJob is on by default, so `check defaults` already
        # renders it. What this adds is the tuning knobs — the ones an operator
        # actually reaches for — since a values key that no profile sets is a key
        # whose plumbing nothing renders.
        check retention-tuned \
          --set retention.schedule='30 4 * * 0' --set retention.timeoutSeconds=120 \
          --set retention.concurrencyPolicy=Replace --set retention.backoffLimit=0
        # Every guard, asserted. Each of these combinations would otherwise
        # install cleanly and publish endpoints nothing serves.
        check_fails bad-mode          "is not one of ingress, gateway" \
          --set networking.mode=httproute
        check_fails gw-no-name        "networking.gateway.name is required" \
          --set networking.mode=gateway
        check_fails gw-no-class       "networking.gateway.className is required" \
          --set networking.mode=gateway --set networking.gateway.create=true
        check_fails gw-foreign-ns     "cannot live elsewhere" \
          --set networking.mode=gateway --set networking.gateway.create=true \
          --set networking.gateway.className=kgateway --set networking.gateway.namespace=ingress
        check_fails gw-nothing-to-do  "publishes nothing" \
          --set networking.mode=gateway --set networking.gateway.create=true \
          --set networking.gateway.className=kgateway --set ingress.enabled=false
        check_fails gw-managed-cert   "no Gateway API equivalent" \
          --set networking.mode=gateway --set networking.gateway.create=true \
          --set networking.gateway.className=kgateway --set ingress.tls.mode=gke-managed-cert
        check_fails gw-acm            "no Gateway API equivalent" \
          --set networking.mode=gateway --set networking.gateway.create=true \
          --set networking.gateway.className=kgateway --set ingress.tls.mode=acm \
          --set ingress.tls.certificateArn=arn:aws:acm:us-east-1:1:certificate/x
        # The orchestrator refuses to start without the hash secret, so rendering a
        # release that would CrashLoopBackOff is the failure this catches. Deliberately
        # not generated by the chart: see helm/templates/orchestrator/devrun-secret.yaml.
        check_fails devruns-no-secret "devRuns.hashSecret is required" \
          --set orchestrator.devRuns.enabled=true \
          --set orchestrator.devRuns.hashSecret= \
          --set orchestrator.baseDomain=apps.example.com
        # Dev runs turned off: the env var and the hash Secret both vanish, and with
        # them the requirement — clearing the secret here proves a disabled install
        # needs none. The inverse of the on-by-default the chart now ships.
        check_absent devruns-disabled "DEV_RUN_HASH_SECRET" \
          --set orchestrator.devRuns.enabled=false \
          --set orchestrator.devRuns.hashSecret= \
          --set orchestrator.baseDomain=apps.example.com
        # The two keys held in a Secret the operator owns instead of given as values.
        # Both halves matter and neither is provable by a successful render alone:
        # the chart must create no Secret of its own (a second one would fight the
        # first over the same name), and no key material may appear in the output at
        # all — which is the entire reason to use an existing Secret, since Helm keeps
        # every value it is given in the release history.
        check_absent kv-existing-secret "name: octo-kv" \
          --set kv.encryptionKey= --set kv.existingSecret=my-kv \
          --set kv.existingSecretKey=enc
        check_contains kv-existing-secret-ref \
          "name: my-kv" "key: enc" -- \
          --set kv.encryptionKey= --set kv.existingSecret=my-kv \
          --set kv.existingSecretKey=enc
        # The dev-run key from an existing Secret, with the key name left to default.
        # This is also the one render proving the `required` above does NOT fire when
        # the value legitimately has nowhere to come from: hashSecret is cleared here.
        check_contains devruns-existing-secret \
          "name: my-devruns" "key: dev-run-hash-secret" -- \
          --set orchestrator.devRuns.hashSecret= \
          --set orchestrator.devRuns.existingSecret=my-devruns \
          --set orchestrator.baseDomain=apps.example.com
        check_absent devruns-existing-no-chart-secret "dev-run-hash-secret: " \
          --set orchestrator.devRuns.hashSecret= \
          --set orchestrator.devRuns.existingSecret=my-devruns \
          --set orchestrator.baseDomain=apps.example.com
        # Retention turned off: the CronJob vanishes entirely. It is the only
        # CronJob the chart has, and the flag's whole job is to remove it, so
        # nothing that asserts a successful render could catch this regressing.
        # The endpoint it calls is served either way — the switch governs the
        # schedule, not the capability.
        check_absent retention-disabled "kind: CronJob" \
          --set retention.enabled=false
        # An empty issuer means the Secret exists already. What that produces is
        # the absence of a Certificate, which every success-only check misses.
        check_absent wildcard-no-cert "kind: Certificate" \
          --set wildcardTLS.enabled=true --set wildcardTLS.clusterIssuer= \
          --set orchestrator.baseDomain=apps.example.com --set ingress.tls.mode=secret
        # Redis is not optional the way NATS is: the aggregator will not start
        # without one, so an install with neither the bundled server nor a managed
        # URL has to fail while rendering rather than come up and quietly stop
        # folding trace records.
        check_fails redis-missing     "redis is required" \
          --set redis.enabled=false
        # A credentialled URL must never reach a workload template as a literal.
        # The guard is the absence of the value, which no successful render proves.
        check_absent redis-secret-not-literal "rediss://default:pw@" \
          --set redis.enabled=false --set externalRedis.existingSecret=octo-redis \
          --set externalRedis.url='rediss://default:pw@cache.example:6380'
        # Pointed at a managed Redis, the chart must not also run one. Rendering
        # successfully proves nothing here — the StatefulSet's absence is the
        # whole point, and only its component label distinguishes it from the two
        # StatefulSets that remain.
        check_absent redis-not-bundled "app.kubernetes.io/component: redis" \
          --set redis.enabled=false --set externalRedis.url=redis://cache.example:6379

        # The gateway error pages. The catch-all matches every hostname under the
        # wildcard, so its precedence controls are the whole safety story — a
        # Traefik router with no explicit priority outranks the exact-Host routers
        # it was meant to sit behind, and every published endpoint stops working.
        # These pin the annotation per controller, and that the Traefik Middleware
        # the Ingress addresses is actually rendered under that name.
        check_contains errorpages-nginx \
          "nginx.ingress.kubernetes.io/rewrite-target: /gateway-error" \
          'host: "*.apps.example.com"' -- \
          --set orchestrator.baseDomain=apps.example.com --set orchestrator.ingressClass=nginx
        check_contains errorpages-traefik \
          'traefik.ingress.kubernetes.io/router.priority: "1"' \
          "traefik.ingress.kubernetes.io/router.middlewares: octo-octo-gateway-errors@kubernetescrd" \
          "kind: Middleware" \
          "name: octo-gateway-errors" \
          "path: /gateway-error" -- \
          --set orchestrator.baseDomain=apps.example.com --set orchestrator.ingressClass=traefik
        check_contains errorpages-alb \
          'alb.ingress.kubernetes.io/group.order: "900"' -- \
          --set orchestrator.baseDomain=apps.example.com --set orchestrator.ingressClass=alb
        # A class name is free-form, so the controller is read from the name only
        # as a convenience; "traefik-public" must still get Traefik's pinning.
        check_contains errorpages-odd-class \
          'traefik.ingress.kubernetes.io/router.priority: "1"' -- \
          --set orchestrator.baseDomain=apps.example.com --set orchestrator.ingressClass=traefik-public
        # And a name nothing can be inferred from renders NO catch-all rather than
        # one whose precedence nobody can vouch for.
        check_absent errorpages-unknown-class "octo-gateway-errors" \
          --set orchestrator.baseDomain=apps.example.com --set orchestrator.ingressClass=acme-lb
        # The other direction of the same hazard: a substring test would read
        # "notraefik" as Traefik and hang Traefik's annotations on something that
        # is not Traefik. Segments are matched whole, so it falls through instead.
        check_absent errorpages-substring-class "octo-gateway-errors" \
          --set orchestrator.baseDomain=apps.example.com --set orchestrator.ingressClass=notraefik
        check_contains errorpages-prefixed-class \
          "nginx.ingress.kubernetes.io/rewrite-target: /gateway-error" -- \
          --set orchestrator.baseDomain=apps.example.com --set orchestrator.ingressClass=internal-nginx
        check_contains errorpages-explicit-controller \
          'traefik.ingress.kubernetes.io/router.priority: "1"' -- \
          --set orchestrator.baseDomain=apps.example.com --set orchestrator.ingressClass=acme-lb \
          --set errorPages.controller=traefik
        # A typo'd controller is the one error-page case worth failing over: the
        # value was typed on purpose, and rendering an unpinned wildcard instead
        # would be worse than either alternative.
        check_fails errorpages-bad-controller "expected one of nginx, traefik, alb" \
          --set orchestrator.baseDomain=apps.example.com --set orchestrator.ingressClass=nginx \
          --set errorPages.controller=traefik2
        check_absent errorpages-disabled "octo-gateway-errors" \
          --set orchestrator.baseDomain=apps.example.com --set orchestrator.ingressClass=nginx \
          --set errorPages.enabled=false
        # Gateway mode needs no controller: the spec orders by hostname
        # specificity, so the catch-all loses to exact hostnames by construction.
        check_contains errorpages-gateway \
          "kind: HTTPRoute" "replaceFullPath: /gateway-error" "sectionName: \"integrations\"" -- \
          --set orchestrator.baseDomain=apps.example.com --set networking.mode=gateway \
          --set networking.gateway.create=true --set networking.gateway.className=envoy-gateway
        # backendErrors is the half that touches every deployment's own Ingress,
        # so it stays off until asked for.
        check_absent errorpages-backend-off "custom-http-errors" \
          --set orchestrator.baseDomain=apps.example.com --set orchestrator.ingressClass=nginx
        check_contains errorpages-backend-on \
          "custom-http-errors" "default-backend" -- \
          --set orchestrator.baseDomain=apps.example.com --set orchestrator.ingressClass=nginx \
          --set errorPages.backendErrors=true
        # The backend-error annotations read the RESOLVED controller, like the
        # catch-all does. Keyed off the class name they would silently skip a class
        # named "internal-nginx" while still rendering the catch-all, leaving 502s
        # unbranded with nothing to show for it.
        check_contains errorpages-backend-odd-class \
          "custom-http-errors" -- \
          --set orchestrator.baseDomain=apps.example.com --set orchestrator.ingressClass=internal-nginx \
          --set errorPages.backendErrors=true
        # The editor may legitimately live UNDER the integrations wildcard. Its own
        # hostnames go to the proxy so the guard does not serve the error page to
        # the editor itself and lock everyone out.
        check_contains errorpages-platform-hosts \
          "PLATFORM_HOSTS" "octo.apps.example.com" -- \
          --set ingress.host=octo.apps.example.com --set orchestrator.baseDomain=apps.example.com \
          --set orchestrator.ingressClass=nginx
        check_contains errorpages-platform-extra-hosts \
          "octo.apps.example.com,alias.apps.example.com" -- \
          --set ingress.host=octo.apps.example.com --set orchestrator.baseDomain=apps.example.com \
          --set orchestrator.ingressClass=nginx \
          --set ingress.extraHosts[0]=alias.apps.example.com
        # The way-out link's scheme follows the editor's own TLS, so a plaintext
        # install does not hand out an https link that goes nowhere.
        check_contains errorpages-plaintext-url \
          'value: "http://octo.example.com"' -- \
          --set orchestrator.baseDomain=apps.example.com --set orchestrator.ingressClass=nginx \
          --set ingress.tls.enabled=false
        # No published editor endpoint, so no URL to point the way-out link at.
        check_absent errorpages-no-ingress "PLATFORM_URL" \
          --set orchestrator.baseDomain=apps.example.com --set orchestrator.ingressClass=nginx \
          --set ingress.enabled=false
        echo "✓ chart lints and renders valid manifests for every profile, and refuses every combination it should"

  helm:package:
    desc: Lint and package both charts into dist/ (octo-<version>.tgz and octo-common-<version>.tgz)
    cmds:
      - mkdir -p dist
      - helm lint helm
      # octo-common is vendored under helm/charts/, so `helm package helm` already
      # bundles it into the octo tarball and an install needs nothing else. It is
      # packaged separately as well so it can be published and depended on
      # directly, the same as cloudbuild.yaml and the release workflow do.
      - helm package helm/charts/octo-common -d dist
      - helm package helm -d dist

  helm:push:
    desc: 'Package and push both charts to Artifact Registry OCI (set IMAGE_BASE; run `helm registry login <region>-docker.pkg.dev` first)'
    requires:
      vars: [IMAGE_BASE]
    cmds:
      - task: helm:package
      - |
        set -e
        # Read each version from its own Chart.yaml rather than assuming they
        # match, even though release-please keeps them in lockstep.
        LIB_VERSION="$(awk '/^version:/ {print $2}' helm/charts/octo-common/Chart.yaml)"
        APP_VERSION="$(awk '/^version:/ {print $2}' helm/Chart.yaml)"
        helm push "dist/octo-common-${LIB_VERSION}.tgz" "oci://{{.IMAGE_BASE}}"
        helm push "dist/octo-${APP_VERSION}.tgz" "oci://{{.IMAGE_BASE}}"

  helm:values:images:
    desc: 'Render dist/values.images.yaml pinning every octo image by digest (set IMAGE_BASE and TAG)'
    requires:
      vars: [IMAGE_BASE, TAG]
    cmds:
      # The local equivalent of cloudbuild.yaml's render-image-values step, for a
      # manual apply or for checking what a tag actually resolves to. The digests
      # are read from the registry (imagetools inspects remotely, no pull), where
      # Cloud Build reads them from the image it just pushed — same output, but
      # this works for any published tag rather than only a fresh build.
      #
      # Feed it to Helm with -f dist/values.images.yaml, or to the release root
      # with -var image_values_file=dist/values.images.yaml.
      - |
        set -e
        mkdir -p dist
        {
          echo "# Rendered by 'task helm:values:images IMAGE_BASE={{.IMAGE_BASE}} TAG={{.TAG}}' — do not edit."
          echo "# Each octo image is pinned by digest; the chart prefers image.digest over any tag."
          echo "image:"
          echo "  registry: {{.IMAGE_BASE}}"
          echo "  pullPolicy: IfNotPresent"
          for c in platform orchestrator logs schema runtime devsidecar devruntime agenticrunner embeddings; do
            repo="octo-${c}-paas"
            ref="{{.IMAGE_BASE}}/${repo}:{{.TAG}}"
            digest="$(docker buildx imagetools inspect "$ref" | awk '/^Digest:/ {print $2; exit}')"
            if [ -z "$digest" ]; then
              echo "✖ no digest for $ref — is it published?" >&2
              exit 1
            fi
            echo "${c}:"
            echo "  image:"
            echo "    repository: ${repo}"
            echo "    digest: \"${digest}\""
          done
        } > dist/values.images.yaml
        echo "✓ wrote dist/values.images.yaml"

  deploy:kubeconfig:
    desc: 'Fetch the k3s kubeconfig from the VM for the Terraform release root (set DOMAIN; optional INSTANCE, ZONE)'
    requires:
      vars: [DOMAIN]
    vars:
      INSTANCE: '{{.INSTANCE | default "octo"}}'
      ZONE: '{{.ZONE | default "us-west1-a"}}'
      OUT: '{{.OUT | default "deploy/terraform/infra/kubeconfig.yaml"}}'
    cmds:
      # k3s writes the kubeconfig with server https://127.0.0.1:6443; rewrite it to
      # the public domain (covered by the API cert via --tls-san) so the Terraform
      # Helm provider can reach the cluster. The file is gitignored (cluster admin).
      - |
        set -e
        gcloud compute ssh {{.INSTANCE}} --zone {{.ZONE}} --tunnel-through-iap --quiet --command 'sudo cat /etc/rancher/k3s/k3s.yaml' \
          | sed "s#https://127.0.0.1:6443#https://{{.DOMAIN}}:6443#" > {{.OUT}}
        echo "✓ wrote {{.OUT}} (server https://{{.DOMAIN}}:6443)"

  deploy:
    desc: 'Deploy/upgrade the octo release on the cluster from an already-published tag (set TAG; optional DOMAIN, INSTANCE, ZONE). Same path Cloud Build runs on a version tag.'
    requires:
      vars: [TAG]
    vars:
      DOMAIN: '{{.DOMAIN | default "octopaas.dev"}}'
      INSTANCE: '{{.INSTANCE | default "octo"}}'
      ZONE: '{{.ZONE | default "us-west1-a"}}'
    cmds:
      # Fetch a fresh kubeconfig (-> deploy/terraform/infra/kubeconfig.yaml), then
      # apply the release root with the chart version derived from helm/Chart.yaml.
      - task: deploy:kubeconfig
        vars: { DOMAIN: '{{.DOMAIN}}', INSTANCE: '{{.INSTANCE}}', ZONE: '{{.ZONE}}' }
      - |
        set -e
        CHART_VERSION="$(helm show chart helm | awk '/^version:/ {print $2}')"
        terraform -chdir=deploy/terraform/release init -input=false -backend-config=../backend.hcl
        # No -var-file: the root's own terraform.tfvars is loaded automatically. No
        # -compact-warnings either — every root declares exactly what it uses, so a
        # warning here means a real mistake rather than noise to be suppressed.
        terraform -chdir=deploy/terraform/release apply -auto-approve \
          -var image_tag={{.TAG}} \
          -var chart_version="${CHART_VERSION}"

  state:bucket:
    desc: 'Create the GCS bucket backing every Terraform root''s state (run once; set PROJECT, optional REGION)'
    requires:
      vars: [PROJECT]
    vars:
      REGION: '{{.REGION | default "us-west1"}}'
    cmds:
      # One versioned bucket, one prefix per root (infra/, release/, gke-standard/,
      # ...). Versioning is the point: a bad apply or a corrupted state is
      # recoverable from an earlier generation.
      - |
        set -e
        BUCKET="gs://octo-tfstate-{{.PROJECT}}"
        gcloud storage buckets create "$BUCKET" --location={{.REGION}} --uniform-bucket-level-access
        gcloud storage buckets update "$BUCKET" --versioning
        echo "✓ created $BUCKET (versioned)"
        echo "  now: cp deploy/terraform/backend.hcl.example deploy/terraform/backend.hcl"
        echo "       and set bucket = \"octo-tfstate-{{.PROJECT}}\""

  tf:check:
    desc: 'Format-check and validate every Terraform root and module (no cloud access needed)'
    silent: true
    cmds:
      # The whole automated gate for Terraform. `validate` needs providers, so it
      # needs an init — but -backend=false skips the backend entirely, so this runs
      # without credentials, without a state bucket, and in CI.
      - |
        set -e
        cd deploy/terraform
        echo "→ terraform fmt"
        terraform fmt -recursive -check -diff
        for root in infra release gke-standard gke-autopilot eks; do
          [ -d "$root" ] || continue
          echo "→ $root"
          terraform -chdir="$root" init -backend=false -input=false >/dev/null
          terraform -chdir="$root" validate
        done
        echo "✓ terraform fmt + validate clean"

  infra:apply:
    desc: 'Apply the one-time infra root: Artifact Registry + the k3s VM (with its Postgres data disk) + optional Cloud Build'
    cmds:
      # -backend-config supplies the state bucket, which a backend block cannot take
      # from a variable. Variables come from infra/terraform.tfvars automatically.
      - terraform -chdir=deploy/terraform/infra init -input=false -backend-config=../backend.hcl
      - terraform -chdir=deploy/terraform/infra apply

  # --- Managed-cluster test roots (GKE Standard, GKE Autopilot, EKS) ---
  #
  # Each stands up a cluster, its prerequisite controllers, DNS and the octo chart
  # in one apply, to exercise the matching helm/values-*.yaml profile on a real
  # cluster. They are meant to be brought up, tested and destroyed — run ONE at a
  # time: the two GKE roots write the same DNS records by default.
  #
  # Test the working tree rather than the last release's published images:
  #   task images:ttl TTL=12h
  #   task gke:standard:apply IMAGE_VALUES=dist/values.ttl.yaml

  gke:standard:apply:
    desc: 'Stand up a GKE Standard cluster and deploy octo onto it (optional IMAGE_VALUES)'
    cmds:
      - task: tf:apply
        vars: { ROOT: gke-standard, IMAGE_VALUES: '{{.IMAGE_VALUES}}' }

  gke:standard:destroy:
    desc: 'Tear down the GKE Standard cluster (phased, so no load balancer is orphaned)'
    cmds:
      - task: tf:destroy
        vars: { ROOT: gke-standard, PHASES: 'module.octo_gke.module.octo module.octo_gke.module.addons' }

  gke:autopilot:apply:
    desc: 'Stand up a GKE Autopilot cluster and deploy octo onto it (optional IMAGE_VALUES)'
    cmds:
      - task: tf:apply
        vars: { ROOT: gke-autopilot, IMAGE_VALUES: '{{.IMAGE_VALUES}}' }

  gke:autopilot:destroy:
    desc: 'Tear down the GKE Autopilot cluster (phased, so no load balancer is orphaned)'
    cmds:
      - task: tf:destroy
        vars: { ROOT: gke-autopilot, PHASES: 'module.octo_gke.module.octo module.octo_gke.module.addons' }

  tf:apply:
    internal: true
    requires:
      vars: [ROOT]
    vars:
      BACKEND: '{{.BACKEND | default "backend.hcl"}}'
    cmds:
      - |
        set -e
        cd deploy/terraform
        terraform -chdir={{.ROOT}} init -input=false -backend-config=../{{.BACKEND}}
        # image_values_file is a path resolved relative to the ROOT, not the repo,
        # so a repo-relative IMAGE_VALUES has to be made absolute here.
        ARGS=""
        if [ -n "{{.IMAGE_VALUES}}" ]; then
          ARGS="-var image_values_file={{.ROOT_DIR}}/{{.IMAGE_VALUES}}"
        fi
        terraform -chdir={{.ROOT}} apply $ARGS
        echo
        terraform -chdir={{.ROOT}} output

  tf:destroy:
    internal: true
    requires:
      vars: [ROOT]
    vars:
      BACKEND: '{{.BACKEND | default "backend.hcl"}}'
    cmds:
      # Phased on purpose. The ingress controller (GKE) and the AWS Load Balancer
      # Controller (EKS) create cloud load balancers that Terraform does not know
      # about; they are only cleaned up when the controller observes its Ingress or
      # Service being deleted. Destroying everything at once races that, and the
      # orphaned forwarding rule or ALB then blocks the VPC delete twenty minutes
      # later with an error that names an ENI rather than the cause.
      #
      # Terraform's dependency graph gets this order right within a single destroy;
      # the phases are what save you when one errors partway through.
      - |
        set -e
        cd deploy/terraform
        terraform -chdir={{.ROOT}} init -input=false -backend-config=../{{.BACKEND}}
        for target in {{.PHASES}}; do
          echo "→ destroying $target"
          terraform -chdir={{.ROOT}} destroy -auto-approve -target="$target"
        done
        # GKE only, and best-effort. A LoadBalancer Service makes the GKE service
        # controller create five objects Terraform does not know about: a
        # forwarding rule, a target pool, a health check and two firewall rules.
        # Deleting the Service — the addons phase above — normally reclaims all
        # five, but that cleanup races the cluster delete and the health-check
        # firewall rule is the one that loses often enough to matter.
        #
        # On its own the leftover rule is free and harmless. It matters because a
        # network cannot be deleted while any firewall rule references it, so the
        # final destroy below fails on the VPC with an error naming the rule and
        # not the cause, leaving the run half-finished.
        #
        # Gated on the output rather than on the root name: only the GKE roots
        # expose network_name, so this is a silent no-op for EKS. Nothing here may
        # abort the run — if gcloud is missing or broken, falling through to the
        # destroy is strictly better than failing before it.
        NETWORK=$(terraform -chdir={{.ROOT}} output -raw network_name 2>/dev/null || true)
        PROJECT=$(terraform -chdir={{.ROOT}} output -raw project_id 2>/dev/null || true)
        if [ -n "$NETWORK" ] && [ -n "$PROJECT" ] && command -v gcloud >/dev/null 2>&1; then
          # `k8s-` is the service controller's own prefix and never Terraform's,
          # so this cannot delete a resource still in state. Anchoring the network
          # match keeps it off a similarly-named VPC.
          for fw in $(gcloud compute firewall-rules list --project "$PROJECT" \
                        --filter="network~${NETWORK}\$ AND name~^k8s-" \
                        --format='value(name)' 2>/dev/null || true); do
            echo "→ sweeping orphaned firewall rule $fw"
            gcloud compute firewall-rules delete "$fw" --project "$PROJECT" --quiet || true
          done
        fi
        # -auto-approve like the phases above. Prompting only here is worse than
        # not prompting at all: by this point the release and the controllers are
        # already gone, so the confirmation guards the least destructive step of
        # the three — and an unanswered prompt leaves the cluster, the database and
        # the VPC standing while the run reports failure, which is exactly the way
        # to get billed for something you believed you had destroyed.
        echo "→ destroying the rest"
        terraform -chdir={{.ROOT}} destroy -auto-approve

  eks:state:bucket:
    desc: 'Create the S3 bucket backing the EKS Terraform state (run once; set BUCKET, optional REGION)'
    requires:
      vars: [BUCKET]
    vars:
      REGION: '{{.REGION | default "us-east-1"}}'
    cmds:
      # No DynamoDB table: the backend uses native S3 conditional-write locking
      # (use_lockfile), so the bucket is the whole bootstrap. Versioning is the
      # point — a corrupted state is recoverable from an earlier version.
      - |
        set -e
        aws s3api create-bucket --bucket {{.BUCKET}} --region {{.REGION}} \
          $([ "{{.REGION}}" = "us-east-1" ] || echo "--create-bucket-configuration LocationConstraint={{.REGION}}")
        aws s3api put-bucket-versioning --bucket {{.BUCKET}} --versioning-configuration Status=Enabled
        aws s3api put-public-access-block --bucket {{.BUCKET}} \
          --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
        echo "✓ created s3://{{.BUCKET}} (versioned, private)"
        echo "  now: cp deploy/terraform/backend-aws.hcl.example deploy/terraform/backend-aws.hcl"
        echo "       and set bucket = \"{{.BUCKET}}\" / region = \"{{.REGION}}\""

  eks:apply:
    desc: 'Stand up an EKS cluster and deploy octo onto it (optional IMAGE_VALUES). Control plane is ~$73/mo — destroy when done.'
    cmds:
      - task: tf:apply
        vars: { ROOT: eks, BACKEND: backend-aws.hcl, IMAGE_VALUES: '{{.IMAGE_VALUES}}' }

  eks:destroy:
    desc: 'Tear down the EKS cluster (phased, so the ALB is not orphaned into blocking the VPC delete)'
    cmds:
      - task: tf:destroy
        vars: { ROOT: eks, BACKEND: backend-aws.hcl, PHASES: 'module.octo module.addons' }

  eks:kubeconfig:
    desc: 'Fetch kubectl credentials for the EKS test cluster'
    cmds:
      - |
        set -e
        cd deploy/terraform
        eval "$(terraform -chdir=eks output -raw kubeconfig_command)"

  gke:kubeconfig:
    desc: 'Fetch kubectl credentials for a GKE test cluster (set ROOT=gke-standard|gke-autopilot)'
    vars:
      ROOT: '{{.ROOT | default "gke-standard"}}'
    cmds:
      # Terraform itself needs no kubeconfig — it authenticates with an access
      # token — but you will want one to look around.
      - |
        set -e
        cd deploy/terraform
        eval "$(terraform -chdir={{.ROOT}} output -raw kubeconfig_command)"
