flow: list-conversations

# The list the panel shows when someone opens their past conversations. It reads
# one object — the index the recorder maintains — because core.KV has no list, and
# because a listing of keys could not carry a title even if it did.
#
# HONEST LIMIT: an invoke has an empty KV store, so every case here is the
# empty-list path. That is the one worth pinning anyway: it is the path a new user
# takes, and returning null instead of an empty list is how a panel breaks on
# somebody's first visit.

env:
  LLM_CONNECTOR_TYPE: llm-anthropic
  LLM_API_KEY: sk-ant-not-a-real-key
  LLM_MODEL: claude-sonnet-4-6
  ORCHESTRATOR_URL: http://127.0.0.1:9
  AGENT_WORKSPACE: /tmp
  AGENT_OCTO_BIN: /bin/echo
  AGENT_DOLPHIN_BIN: /bin/echo
  AGENT_CURL_BIN: /bin/echo
  AGENT_FIND_BIN: /bin/echo
  AGENT_JQ_BIN: /bin/echo

inputs:
  a signed-in user:
    data:
      user: { id: u-1, name: Ada }
  # What the chat route sends before anyone has signed in — SSO off, local
  # development. It must not error and must not read somebody else's list.
  nobody in particular:
    data: {}

cases:
  - name: a user with no conversations gets an empty list, not a null
    input: a signed-in user
    expect:
      body: { items: [] }
      that:
        # The key is built from the user the route authenticated, exactly as the
        # memory key is, so a request cannot ask for anyone else's list.
        - 'vars.userKey == "u-1"'

  - name: an unauthenticated request reads the anonymous list rather than failing
    input: nobody in particular
    expect:
      body: { items: [] }
      that:
        - 'vars.userKey == "anonymous"'
