flow: read-conversation

# One past conversation, replayed into the panel. Not the agent's memory: that is
# compacted, so its early turns have been replaced by a summary of them and it is
# not what the person read.
#
# HONEST LIMIT: an invoke has an empty KV store, so this is the not-found path.
# It is also the path a stolen thread id takes — the key is built from the user
# the route authenticated, so somebody else's conversation simply is not there —
# which is why an empty record is the right answer rather than an error.

env:
  LLM_CONNECTOR_TYPE: llm-anthropic
  LLM_API_KEY: sk-ant-not-a-real-key
  LLM_MODEL: claude-sonnet-4-6
  ORCHESTRATOR_URL: http://127.0.0.1:9
  AGENT_WORKSPACE: /tmp
  AGENT_OCTO_BIN: /bin/echo
  AGENT_DOLPHIN_BIN: /bin/echo
  AGENT_CURL_BIN: /bin/echo
  AGENT_FIND_BIN: /bin/echo
  AGENT_JQ_BIN: /bin/echo

inputs:
  someone else's thread:
    # threadId reaches the flow as a path parameter, which an invoke has to seed
    # because it does not go through the http source.
    vars: { threadId: t-1 }
    data:
      user: { id: u-1, name: Ada }

cases:
  - name: a conversation this user does not have reads as an empty one
    input: someone else's thread
    expect:
      body: { threadId: t-1, title: "", turns: [] }
      that:
        - 'vars.userKey == "u-1"'
