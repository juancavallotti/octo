# The specialists the coordinator delegates to. Connectors, env and skills are
# declared in octo.yaml.
flows:
  # --------------------------------------------------------- the specialists
  #
  # Two agents, each a flow of its own, each reached from a tool slot on the
  # coordinator by a synchronous flow-ref. A subagent is a tool whose process
  # chain happens to be another agent, with its own prompt, its own tool set and
  # its own loop: the coordinator writes a brief, the specialist works, and one
  # report comes back as the tool result.
  #
  # They are flows rather than inline blocks because a flow is the unit that can
  # be invoked. dolphin can drive either one with a brief and assert on the
  # answer — no coordinator, no tool call to provoke, one model to mock instead
  # of two. Inline, the only way to reach a specialist was through a
  # conversation that decided to delegate, which is a lot of machinery standing
  # between a test and the thing it is testing.
  #
  # The split into two specialists is a separate decision from the split into
  # flows, and it buys three things a single twenty-tool agent could not have:
  #
  #   - A prompt each. "How to write a definition and prove it" and "how this
  #     installation is deployed and diagnosed" are different jobs wanting
  #     different instructions, and a single prompt carrying both is mostly
  #     irrelevant on any given turn.
  #   - A working context each. A builder's loop fills a transcript with YAML
  #     drafts and test reports; an operator's fills with API responses. Kept
  #     apart, neither is paying to re-read the other, and the conversation the
  #     user is actually having stays short — what comes back to it is one
  #     report, not forty tool results.
  #   - A boundary. The builder's orchestrator tool is GET-only. The
  #     coordinator's is GET-only. There is exactly one unrestricted octo_api in
  #     this file and it is inside the operator, so a write to the platform is
  #     always a deliberate delegation.
  #
  # What it costs: a delegation is a whole model run, and the specialist starts
  # blind. Both are stated in the coordinator's prompt, because the failure mode
  # is a thin brief and the second is delegating a question that one GET would
  # have answered. It is also why the SSE route's maxDuration is 30m: one turn
  # there can be a whole loop here.
  #
  # Neither declares a source, so neither is reachable from outside — a
  # specialist is called, never posted to.

  - name: integration-builder
    process:
      - type: ai-agent
        name: builder
        connector: llm
        answer: text
        # A conversation of its own, and a disposable one.
        #
        # vars.toolScope is minted by the coordinator's tool call: stable
        # for as long as the conversation it belongs to, distinct per
        # tool. So a second delegation in the same chat reaches the same
        # builder — it still has the definition it drafted a moment ago,
        # and does not have to be told it twice. A third conversation
        # gets a fresh one.
        #
        # Volatile because a specialist's transcript is scaffolding. It
        # belongs in the tier that evicts rather than the one the
        # platform backs up, and losing it costs a re-read of a brief.
        memoryThreadId: vars.toolScope
        memoryVolatile: true
        # Not recorded. A specialist works a thread its caller minted for
        # it, so recording those would mint a conversation row per
        # delegation forever — the accumulation the volatile tier exists to
        # avoid. (memoryVolatile implies this; written out because the
        # implication is easy to miss when reading.)
        history: off
        # Its own ceiling, deliberately not the coordinator's: a delegated
        # job is a whole loop of its own, and a specialist that runs out of
        # turns mid-fix hands back half an answer the coordinator then has
        # to relay as if it were one.
        maxIterations: 40
        input: >-
          body.task +
            (vars.?environmentContext.orValue("") != ""
              ? "\n\n---\n" + vars.environmentContext
              : "") +
            (has(body.context) && body.context != ""
              ? "\n\nContext you cannot see, from the conversation:\n" + body.context
              : "")
        emit: [tool_call, tool_result]
        events:
          process:
            # The specialist's tool calls reach the same panel the
            # coordinator's do, so a delegation is watchable rather than a
            # chip that sits open for two minutes with nothing under it.
            # ifClosed: ignore and not stop — the coordinator's own events
            # path already ends the run when the panel closes, and a stop
            # raised from inside a tool would follow the coordinator out of
            # the tool call it is waiting on.
            - type: sse-event
              name: stream-event
              settings:
                event: agent
                ifClosed: ignore
        prompt: |
          You are the integration builder: the specialist Dr. Octo hands a
          definition to. You write octo flow definitions and you prove them
          before you answer.

          You cannot see the chat you were called from, who the user is, or
          what was said in it. The brief you were given is what you know,
          and your reply is everything that comes back — so it has to stand
          on its own.

          You do remember your own work. A second job in the same
          conversation reaches you with your earlier ones still in front of
          you: the definition you drafted, the tests you ran, what failed.
          Use that rather than starting from nothing — and say when you are
          building on it, because the coordinator cannot see it.

          THE LOOP, and it is not optional:

            1. Load the skills you need. flow-file for the file's shape,
               best-practices for how to write it well, blocks for what a
               process chain may contain, connectors for their settings,
               expressions for CEL, testing for a suite.
               The schema moves faster than your training data. A definition
               written from memory is a guess.
            2. write_workspace_file the definition to <dir>/config.yaml.
            3. write_workspace_file a suite to <dir>/config_test.yaml —
               run_flow_tests runs every *_test.yaml in <dir> against the
               whole directory.
            4. run_flow_tests <dir>. Exit 0 is passed; exit 1 means the FLOW
               is wrong, which is the answer you asked for; exit 2 means the
               SUITE did not parse, so nothing ran and nothing there is about
               your flow — load the testing skill and fix the suite.
            5. Fix and run again. invoke_flow when you want to see what one
               flow actually returns; builder_check_expression to settle a
               CEL question instead of reasoning about one.

          Two limits to keep straight, and to state in your answer rather
          than let a reader assume past. The workspace is scratch: an empty
          directory that dies with the pod, so nothing you write there is
          saved anywhere. And an invoked flow runs STANDALONE — in-process
          KV and queues, no cluster resources, no connectors reaching
          anything real. It proves the shape of a definition and the logic
          in it, never what a deployment would see.

          builder_octo_read is a GET against the orchestrator, for reading
          what already exists: /integrations for the list, /integrations/{id}
          for one definition (the YAML arrives as a string in `definition`),
          /integrations/{id}/resources for its env files and templates. Use
          it when the brief names an integration instead of quoting it.

          You cannot save anything. No PUT, no POST, no deploy — that is the
          platform operator's job, and the coordinator will delegate it if
          the user asks for it. Hand back the definition; do not pretend it
          is stored.

          ANSWER IN MARKDOWN, and answer like a colleague reporting back:

            - What you built or changed, in a sentence or two.
            - The complete definition in a ```yaml fence — complete, not an
              excerpt with "..." in it. It is going to be quoted verbatim.
            - What you ran and what it said. Name the cases that passed. If
              something still fails, say exactly what and why.
            - What you could NOT verify, plainly. An untested branch, a
              connector that only exists in a cluster, an assumption you had
              to make about the brief. This is the most valuable line in the
              report; never leave it out to look finished.
        tools:
          # ------------------------------------------------------ workspace
          #
          # The difference between an agent that can describe a fix and one
          # that can try it. It drafts a definition into the workspace,
          # invokes it, runs its suite, reads the envelope, and does it
          # again — the loop a person gets at a terminal, in the cluster
          # where the problem is.
          #
          # The design rule they all follow: THE MODEL SUPPLIES DATA, THE
          # FLOW SUPPLIES ARGV. No string the model chose ever lands where
          # it could be read as a flag.
          - name: read_workspace_file
            description: >
              Read a file from your workspace. The path is relative to the
              workspace root; a path that leaves it is refused.
            inputSchema: |
              {
                "type": "object",
                "required": ["path"],
                "properties": {
                  "path": { "type": "string", "description": "Workspace-relative path, e.g. demo/config.yaml" }
                }
              }
            process:
              - type: file-read
                name: read-file
                settings:
                  connector: workspace
                  path: body.path
                  resultVar: contents
              - type: set-payload
                name: read-workspace-file-result
                settings:
                  value: '{"path": body.path, "content": vars.contents}'

          - name: write_workspace_file
            description: >
              Write a file into your workspace, creating parent directories
              as needed. Put a single-file draft in `<dir>/config.yaml` and
              its suite in `<dir>/config_test.yaml`. In a multi-file project
              name each suite after the flow it tests, never after a flow
              file. The workspace is scratch and dies with the pod.
            inputSchema: |
              {
                "type": "object",
                "required": ["path", "content"],
                "properties": {
                  "path":    { "type": "string", "description": "Workspace-relative path, e.g. demo/config.yaml" },
                  "content": { "type": "string", "description": "The file's full contents." }
                }
              }
            process:
              - type: file-write
                name: write-file
                settings:
                  connector: workspace
                  path: body.path
                  content: body.content
                  resultVar: receipt
              - type: set-payload
                name: write-workspace-file-result
                settings:
                  value: 'vars.receipt'

          - name: list_workspace
            description: >
              List everything in your workspace. Takes no arguments — it
              returns the whole tree, which is small.
            inputSchema: |
              { "type": "object", "properties": {} }
            process:
              # No argument, and that is the design rather than a
              # simplification: constant argv puts find's -exec out of reach
              # by construction rather than by an allow list.
              - type: cli-run
                name: find-workspace
                program: env.AGENT_FIND_BIN
                args: '[".", "-maxdepth", "4", "-not", "-path", "*/.*"]'
                allow: ["${AGENT_FIND_BIN}"]
                env: [PATH]
                workDir: ${AGENT_WORKSPACE}
                timeout: ${AGENT_CLI_TIMEOUT}
                onExit: continue

          - name: invoke_flow
            description: >
              Run one flow from a definition in your workspace, once, and
              return what it produced. `dir` is a single workspace directory
              name holding the .yaml files; `flow` is the flow's name; `data`
              is the request body.

              The answer is an outcome envelope — {"result":…} if the flow
              completed, {"dropped":true} if a filter dropped the message,
              {"error":"…"} if it failed. A flow that fails is an answer, not
              a failure of this tool.

              Sources are NOT started, so pass in the body a source would
              have. And it runs under the STANDALONE services provider — so
              an object-read that is empty here says nothing about the
              deployment.
            inputSchema: |
              {
                "type": "object",
                "required": ["dir", "flow"],
                "properties": {
                  "dir":  { "type": "string", "description": "Workspace directory holding the definition, e.g. demo. No slashes." },
                  "flow": { "type": "string", "description": "Name of the flow to invoke." },
                  "data": { "type": "object", "description": "JSON request body for the flow." }
                }
              }
            process:
              - type: if
                name: safe-dir
                condition: >-
                  body.dir.matches("^[A-Za-z0-9.][A-Za-z0-9._-]{0,63}$")
                    && !body.dir.contains("..")
                then:
                  process:
                    - type: cli-run
                      name: octo-invoke
                      program: env.AGENT_OCTO_BIN
                      # --envelope says "completed", "dropped" and "failed"
                      # in one JSON object and exits 0 for a flow that
                      # failed, which is what makes this usable by a model.
                      args: >-
                        ["invoke", "--config", body.dir, "--flow", body.flow, "--envelope",
                         "--data", toJson(has(body.data) ? body.data : {})]
                      allow: ["${AGENT_OCTO_BIN}"]
                      env: [PATH, HOME]
                      workDir: ${AGENT_WORKSPACE}
                      timeout: ${AGENT_CLI_TIMEOUT}
                      onExit: continue
                else:
                  process:
                    - type: set-payload
                      name: bad-dir
                      settings:
                        value: >-
                          {"error": "dir must be a single workspace directory name — no slashes,
                          no '..'. Write the definition into a directory first, then pass its name."}

          - name: run_flow_tests
            description: >
              Run the dolphin suite for the definitions in a workspace
              directory. Every `*_test.yaml` in it runs against the whole
              directory, so write the definitions and their suites side by
              side and pass the directory.

              Exit 0 means every case passed. Exit 1 means the FLOWS are
              wrong — that is the answer you asked for. Exit 2 means the
              suite or the runner is wrong, which is a different problem.
            inputSchema: |
              {
                "type": "object",
                "required": ["dir"],
                "properties": {
                  "dir": { "type": "string", "description": "Workspace directory holding the definitions and their suites. No slashes." }
                }
              }
            process:
              - type: if
                name: safe-dir
                condition: >-
                  body.dir.matches("^[A-Za-z0-9.][A-Za-z0-9._-]{0,63}$")
                    && !body.dir.contains("..")
                then:
                  process:
                    - type: cli-run
                      name: dolphin-test
                      program: env.AGENT_DOLPHIN_BIN
                      args: '["test", body.dir]'
                      allow: ["${AGENT_DOLPHIN_BIN}"]
                      # OCTO_PATH is what makes dolphin drive the standalone
                      # octo rather than this pod's k8s entrypoint. Both the
                      # image variable and this list are required and neither
                      # is sufficient — drop it and every suite exits 2.
                      env: [PATH, HOME, OCTO_PATH]
                      workDir: ${AGENT_WORKSPACE}
                      timeout: ${AGENT_CLI_TIMEOUT}
                      onExit: continue
                    # The exit code in words, because 0/1/2 mean three
                    # different things and only one is "something went
                    # wrong". Left bare, a model reads any non-zero as a
                    # broken tool and apologises instead of fixing the flow.
                    - type: set-payload
                      name: verdict
                      settings:
                        value: >-
                          {
                            "verdict": body.exitCode == 0 ? "passed"
                              : body.exitCode == 1 ? "the flows are wrong: cases failed — read the report and fix the definition"
                              : "the SUITE did not parse, so no flow ran and nothing here is about your flows. Load the testing skill and check the suite's shape against it before editing again.",
                            "exitCode": body.exitCode,
                            "report": body.stdout,
                            "stderr": body.stderr
                          }
                else:
                  process:
                    - type: set-payload
                      name: bad-dir
                      settings:
                        value: >-
                          {"error": "dir must be a single workspace directory name — no slashes, no '..'."}

          - name: builder_check_expression
            description: >
              Evaluate one CEL expression against a message body and return
              the result. Use it to prove an expression before you put it in
              a definition.
            inputSchema: |
              {
                "type": "object",
                "required": ["expr"],
                "properties": {
                  "expr": { "type": "string", "description": "The CEL expression, e.g. body.items.size() > 0" },
                  "data": { "type": "object", "description": "The message body to evaluate it against." }
                }
              }
            process:
              - type: cli-run
                name: octo-eval
                program: env.AGENT_OCTO_BIN
                args: >-
                  ["eval", "--expr", body.expr,
                   "--data", toJson(has(body.data) ? body.data : {})]
                allow: ["${AGENT_OCTO_BIN}"]
                env: [PATH, HOME]
                workDir: ${AGENT_WORKSPACE}
                timeout: ${AGENT_CLI_TIMEOUT}
                onExit: continue

          - name: run_command
            description: >
              Run one of your own programs directly, when the tools above do
              not fit the shape of what you need. Programs available: octo,
              dolphin, curl, find and jq. Arguments are passed as argv, so
              there is no shell: a pipe or a semicolon is a literal
              character, not an operator.
            inputSchema: |
              {
                "type": "object",
                "required": ["program"],
                "properties": {
                  "program": { "type": "string", "enum": ["octo", "dolphin", "curl", "find", "jq"] },
                  "args":    { "type": "array", "items": { "type": "string" }, "description": "Arguments, as argv." },
                  "stdin":   { "type": "string", "description": "Written to the process's standard input." }
                }
              }
            process:
              # BE HONEST ABOUT WHAT THIS LIST IS. It is a guardrail, not a
              # boundary. `octo` is on it, and `octo invoke` runs whatever
              # definition it is pointed at — including one written into the
              # workspace a moment earlier, with a `cli-run` block carrying
              # no allow list at all. The boundary is the POD.
              - type: cli-run
                name: run-program
                program: >-
                  body.program == "octo" ? env.AGENT_OCTO_BIN
                    : body.program == "dolphin" ? env.AGENT_DOLPHIN_BIN
                    : body.program == "curl" ? env.AGENT_CURL_BIN
                    : body.program == "find" ? env.AGENT_FIND_BIN
                    : env.AGENT_JQ_BIN
                args: 'has(body.args) ? body.args : []'
                stdin: 'has(body.stdin) ? body.stdin : ""'
                allow:
                  - ${AGENT_OCTO_BIN}
                  - ${AGENT_DOLPHIN_BIN}
                  - ${AGENT_CURL_BIN}
                  - ${AGENT_FIND_BIN}
                  - ${AGENT_JQ_BIN}
                env: [PATH, HOME, OCTO_PATH]
                workDir: ${AGENT_WORKSPACE}
                timeout: ${AGENT_CLI_TIMEOUT}
                onExit: continue

          # The same GET-only read the coordinator holds, so the builder can
          # fetch a definition it was asked to change instead of being handed
          # one. It cannot save the result, which is the whole point.
          - name: builder_octo_read
            description: >
              Read anything from the orchestrator API — GET only.
              /integrations for the list, /integrations/{id} for one
              definition, /integrations/{id}/resources for its env files and
              templates. Path only, never a full URL. A 4xx comes back as
              data rather than an error. Writing is refused here.
            inputSchema: |
              {
                "type": "object",
                "required": ["path"],
                "properties": {
                  "path":  { "type": "string", "description": "Path only, e.g. /integrations/abc." },
                  "query": { "type": "object", "description": "Query parameters." }
                }
              }
            process:
              - type: rest-dynamic
                name: call-octo-read
                settings:
                  connector: octo
                  headers: '{"Authorization": "Bearer " + vars.authToken, "X-Octo-Environment": vars.?environment.orValue("")}'
                  method: '"GET"'
                  path: body.path
                  allowMethods: [GET]
                  query: 'has(body.query) ? body.query : {}'
                  failOnError: false
        skills:
          - name: flow-file
            description: >
              The shape of a flow definition: service, env, resources,
              connectors, flows, sources and process chains.
            resource: flow-file
          - name: best-practices
            description: >
              How to write a flow well: multi-transform for setter runs, enrich
              around destructive calls, subflows, the octo.yaml globals file,
              block names. Load before writing a definition.
            resource: best-practices
          - name: blocks
            description: >
              The blocks a process chain can contain — control flow, data,
              storage, AI and integration — and what each is for.
            resource: blocks
          - name: connectors
            description: >
              The connectors available (HTTP, database, queue, cron, LLM, and
              the rest) and the settings each takes.
            resource: connectors
          - name: expressions
            description: >
              CEL as octo uses it: the message activation, the octo extension
              functions, and where expressions are allowed.
            resource: expressions
          - name: testing
            description: >
              Writing dolphin test suites for a flow: cases, inputs, mocks
              and spies.
            resource: testing

  - name: platform-operator
    process:
      - type: ai-agent
        name: operator
        connector: llm
        answer: text
        # Its own conversation, on the same terms as the builder's: the
        # coordinator mints the scope, and the transcript is scaffolding
        # rather than history. An investigation that takes two
        # delegations remembers what the first one found.
        memoryThreadId: vars.toolScope
        memoryVolatile: true
        # Not recorded. A specialist works a thread its caller minted for
        # it, so recording those would mint a conversation row per
        # delegation forever — the accumulation the volatile tier exists to
        # avoid. (memoryVolatile implies this; written out because the
        # implication is easy to miss when reading.)
        history: off
        maxIterations: 32
        input: >-
          body.task +
            (vars.?environmentContext.orValue("") != ""
              ? "\n\n---\n" + vars.environmentContext
              : "") +
            (has(body.context) && body.context != ""
              ? "\n\nContext you cannot see, from the conversation:\n" + body.context
              : "")
        emit: [tool_call, tool_result]
        events:
          process:
            - type: sse-event
              name: stream-event
              settings:
                event: agent
                ifClosed: ignore
        prompt: |
          You are the platform operator: the specialist Dr. Octo hands the
          installation to. You read its state and you change it — save,
          tag, deploy, roll out, scale, undeploy — and you read the stored
          logs and traces that say what already happened.

          You cannot see the chat you were called from or who is asking. The
          brief is what you know; your reply is everything that comes back.

          You do remember your own work: a second job in the same
          conversation reaches you with the earlier ones still in front of
          you — the ids you read, what the platform answered, what you
          changed. Use it, and say when you are building on it.

          THE MAP. These are the routes, so you do not have to rediscover
          them from the OpenAPI on every call. It is a map and not a
          contract: when a call is refused, read_api_docs for that tag is
          how you find out what actually changed.

            integrations
              GET    /integrations                      list: id, name
              POST   /integrations                      {"name","definition"}
              GET    /integrations/{id}                 the WORKING COPY
              PUT    /integrations/{id}                 {"name","definition"} — whole replace, there is no patch
              DELETE /integrations/{id}

            resources — env files and templates the integration owns
              GET    /integrations/{id}/resources
              POST   /integrations/{id}/resources       {"kind":"env"|"template","name","content"}
              GET|PUT|DELETE /integrations/{id}/resources/{resourceId}

            version tags — an immutable freeze of the definition AND its resources
              GET    /integrations/{id}/snapshots       id, integrationId, tag, createdAt — no definition; newest first
              POST   /integrations/{id}/snapshots       {"tag":"v4"}
              GET    /snapshots/{id}                    one tag with its frozen definition
              DELETE /snapshots/{id}
              GET    /snapshots/{id}/resources[/content]

            deployments
              GET    /integrations/{id}/deployments/options   what a deploy would need — read this FIRST
              GET    /integrations/{id}/deployments
              POST   /integrations/{id}/deployments
                     {"snapshotId","replicas","slug","expose":"external","subdomain",
                      "env":{"NAME":{"value":"..."}|{"secret":"name"}},
                      "tracing":bool,"observabilityApi":bool,"orchestratorApi":bool,"runner":""}
              GET    /deployments/{id}                  status, reason, pods, restart counts
              PATCH  /deployments/{id}                  {"replicas":n}
              POST   /deployments/{id}/rollout          {"snapshotId","env","tracing","runtimeVersion"} — omitted keeps current; runtimeVersion pins a release, "latest" unpins
              POST   /deployments/{id}/testruns         {"snapshotId","rolloutOnPass":bool} — run its suites on this install's runtime
              GET    /deployments/{id}/testruns[/{runId}]  status: running|passed|failed|errored|timed_out, report
              GET    /upgrades                          who runs an older runtime, has suites, is pinned, last test run
              GET    /runtimes                          the releases a deployment can be pinned to
              DELETE /deployments/{id}                  undeploy
              GET    /deployments/{id}/pods/{pod}/logs  LIVE output of a pod that still exists

            a deployment's own storage
              GET    /deployments/{id}/namespaces
              GET    /deployments/{id}/objects?namespace=
              GET|PUT|DELETE /deployments/{id}/objects/{key}
              GET|PUT|DELETE /deployments/{id}/kv/{namespace}/{key}

            the installation
              GET    /settings/health                   whether the orchestrator can reach what it needs
              GET|PUT /settings/llm, /settings/email
              GET    /secrets                           names only, never values
              PUT|DELETE /secrets/{name}
              GET|POST /folders, /devruns               folders tree; dev runs of a WORKING COPY
              POST   /email/send                        the coordinator's report tool uses this

            stored history — the observability API, through observability_api, all GET
              /logs?deploymentId=&level=&q=&from=&to=&before=&limit=
              /traces?deploymentId=&integrationId=&flow=&status=failed&hasLlm=&minDurationMs=&q=&limit=
              /traces/{traceId}?bodies=true             the whole run, block by block
              /traces/{traceId}/records/{id}
              /traces/apps
              /stats/{deploymentId}/pods|metrics|series   pod CPU, memory and flow metrics
              /settings/storage                         how full Redis and Postgres are

          THE THREE THINGS THAT ARE NOT THE SAME THING, and most confusion
          is one of them: the INTEGRATION is the working copy and editing it
          changes nothing that runs; a VERSION TAG is a frozen copy and
          never changes; a DEPLOYMENT runs one tag. So shipping an edit is
          always three calls — PUT the definition, POST a snapshot, POST a
          rollout onto it (or POST a deployment if there is none). A rollout
          keeps the id, address, scale and exposure, and keeps any setting
          you omit.

          Tracing only changes on a rollout — the runtime reads it at
          startup. A tag that adds or removes the HTTP source is refused on
          a rollout: undeploy and redeploy instead.

          WHEN SOMETHING WILL NOT START, in this order, because each rules
          out the next: GET /deployments/{id} for status, reason and restart
          counts; a required env var with no binding, which is refused
          before a pod is ever created and names the variables in the error;
          the pod logs for a config that will not load; a secret binding
          naming a secret that does not exist, which fails the pod and not
          the deploy. For anything that is not happening right now, prefer
          the traces: a pod's logs vanish with the pod, and a crash loop
          replaces it repeatedly. status=failed on /traces goes straight to
          the runs that broke.

          If the observability tools answer that the observability API was not
          granted, report that sentence. It is not the same answer as
          "nothing found", and only one of the two is true.

          BEFORE YOU CHANGE ANYTHING. You have write access to a live
          installation. Read before you write; do not delete an integration,
          a deployment or a secret unless the brief plainly asks for that;
          and when a brief is ambiguous about something irreversible, do the
          reversible part and say what you did not do. After you change an
          integration, call refresh_platform_ui with its id and name so an
          open editor offers to reload.

          ANSWER IN MARKDOWN: what you did, as a short list of the calls
          that mattered with the ids they returned; what the platform says
          now; and what you deliberately did not do. Quote a status or an
          error verbatim rather than paraphrasing it — the coordinator is
          going to relay this to the person who asked.
        tools:
          - name: list_api_operations
            description: >
              List every route the orchestrator API serves — method, path,
              summary and tag. Cheap. Read this when the map in your prompt
              does not cover what you need.
            inputSchema: |
              { "type": "object", "properties": {} }
            process:
              - type: rest
                name: fetch-api-operations
                settings:
                  connector: octo
                  method: GET
                  path: /openapi/operations

          - name: read_api_docs
            description: >
              Read the orchestrator's OpenAPI description, narrowed to one
              tag (from list_api_operations) or one path prefix. Pass one or
              the other, never both. Without a filter this is very large.
            inputSchema: |
              {
                "type": "object",
                "properties": {
                  "tag": { "type": "string", "description": "Keep only operations with this tag." },
                  "path": { "type": "string", "description": "Keep only routes starting with this prefix." }
                }
              }
            process:
              - type: rest
                name: fetch-api-docs
                settings:
                  connector: octo
                  method: GET
                  path: /openapi.json
                  query:
                    tag: 'has(body.tag) ? body.tag : ""'
                    path: 'has(body.path) ? body.path : ""'

          - name: octo_api
            description: >
              Call the orchestrator API. The map in your prompt covers the
              routes; read_api_docs settles anything it does not. Returns the
              response body; the HTTP status is in vars.statusCode, and a 4xx
              comes back as data rather than an error, so read it and correct
              the call.
            inputSchema: |
              {
                "type": "object",
                "required": ["method", "path"],
                "properties": {
                  "method": { "type": "string", "enum": ["GET", "POST", "PUT", "PATCH", "DELETE"] },
                  "path":   { "type": "string", "description": "Path only, e.g. /integrations/abc. Never a full URL." },
                  "query":  { "type": "object", "description": "Query parameters." },
                  "payload": { "type": "object", "description": "JSON request body." }
                }
              }
            process:
              # To restrict what the operator may do, add allowMethods or
              # pathPrefix here — this is the one place that decides it.
              - type: rest-dynamic
                name: call-octo-api
                settings:
                  connector: octo
                  headers: '{"Authorization": "Bearer " + vars.authToken, "X-Octo-Environment": vars.?environment.orValue("")}'
                  method: body.method
                  path: body.path
                  query: 'has(body.query) ? body.query : {}'
                  body: 'has(body.payload) ? body.payload : null'
                  failOnError: false

          # The three observability tools each open with the same guard. When OBSERVABILITY_URL
          # is still the sentinel, this deployment was never granted the
          # observability API, and that sentence is the honest answer —
          # cheaper than a request to an address that does not resolve.
          - name: list_observability_operations
            description: >
              List every route the observability API serves — stored logs,
              traces and pod stats. A 404 here means the observability service
              is older than these tools and serves no description — report
              that as an out-of-date service, never as missing access.
            inputSchema: |
              { "type": "object", "properties": {} }
            process:
              - type: if
                name: observability-granted
                condition: env.OBSERVABILITY_URL != "http://observability-not-granted.invalid"
                then:
                  process:
                    - type: rest
                      name: fetch-observability-operations
                      settings:
                        connector: observability
                        method: GET
                        path: /openapi/operations
                        failOnError: false
                else:
                  process:
                    - type: set-payload
                      name: not-granted
                      settings:
                        value: '{"error": "This installation has not granted this deployment the observability API, so stored logs and traces cannot be read. Say so — it does not mean there are none."}'

          - name: read_observability_docs
            description: >
              Read the observability API's OpenAPI description, narrowed to
              one tag or one path prefix. Pass one or the other, never both.
              A 404 means the observability service is older than these tools,
              not that access is missing.
            inputSchema: |
              {
                "type": "object",
                "properties": {
                  "tag": { "type": "string", "description": "Keep only operations with this tag." },
                  "path": { "type": "string", "description": "Keep only routes starting with this prefix." }
                }
              }
            process:
              - type: if
                name: observability-granted
                condition: env.OBSERVABILITY_URL != "http://observability-not-granted.invalid"
                then:
                  process:
                    - type: rest
                      name: fetch-observability-docs
                      settings:
                        connector: observability
                        method: GET
                        path: /openapi.json
                        failOnError: false
                        query:
                          tag: 'has(body.tag) ? body.tag : ""'
                          path: 'has(body.path) ? body.path : ""'
                else:
                  process:
                    - type: set-payload
                      name: not-granted
                      settings:
                        value: '{"error": "This installation has not granted this deployment the observability API, so stored logs and traces cannot be read. Say so — it does not mean there are none."}'

          - name: observability_api
            description: >
              Query stored logs, traces and pod stats. This is history — what
              already happened, across every deployment. For what a pod is
              printing right now, use octo_api instead. A 4xx comes back as
              data, so read it and correct the call — a 404 is a wrong path or
              a service older than these tools, never a statement about
              access.
            inputSchema: |
              {
                "type": "object",
                "required": ["path"],
                "properties": {
                  "path":  { "type": "string", "description": "Path only, e.g. /traces. Never a full URL." },
                  "query": { "type": "object", "description": "Query parameters." }
                }
              }
            process:
              - type: if
                name: observability-granted
                condition: env.OBSERVABILITY_URL != "http://observability-not-granted.invalid"
                then:
                  process:
                    # allowMethods is the whole of what keeps this read-only:
                    # the API also serves PUT /settings/retention and POST
                    # /retention/run, and the second of those deletes.
                    - type: rest-dynamic
                      name: call-observability-api
                      settings:
                        connector: observability
                        method: '"GET"'
                        path: body.path
                        allowMethods: [GET]
                        query: 'has(body.query) ? body.query : {}'
                        headers: '{"Authorization": "Bearer " + vars.authToken, "X-Octo-Environment": vars.?environment.orValue("")}'
                        failOnError: false
                else:
                  process:
                    - type: set-payload
                      name: not-granted
                      settings:
                        value: '{"error": "This installation has not granted this deployment the observability API, so stored logs and traces cannot be read. Say so — it does not mean there are none."}'

          - name: alerts_api
            description: >
              Read and write alert watches, and preview a definition before
              saving it. Bounded to /alerts — this is the one tool that can
              change what the platform announces, and it can reach nothing
              else. Preview with POST /alerts/preview before POST
              /alerts/watches: it evaluates the definition against real data
              without storing anything or telling anybody, and it is the only
              way to know a watch would ever fire. A 4xx comes back as data;
              read it and correct the call, because the validator names the
              field it refused.
            inputSchema: |
              {
                "type": "object",
                "required": ["path", "method"],
                "properties": {
                  "path":   { "type": "string", "description": "Path under /alerts, e.g. /alerts/watches. Never a full URL." },
                  "method": { "type": "string", "enum": ["GET", "POST", "PUT", "DELETE"] },
                  "query":  { "type": "object", "description": "Query parameters." },
                  "body":   { "type": "object", "description": "The watch definition, for POST and PUT." }
                }
              }
            process:
              - type: if
                name: observability-granted
                condition: env.OBSERVABILITY_URL != "http://observability-not-granted.invalid"
                then:
                  process:
                    # pathPrefix is what makes this safe to hand write methods:
                    # the same connector also serves PUT /settings/retention and
                    # POST /retention/run, and the second of those deletes. The
                    # prefix bounds this tool to alerting and nothing beside it.
                    - type: rest-dynamic
                      name: call-alerts-api
                      settings:
                        connector: observability
                        method: body.method
                        path: body.path
                        pathPrefix: /alerts
                        allowMethods: [GET, POST, PUT, DELETE]
                        query: 'has(body.query) ? body.query : {}'
                        body: 'has(body.body) ? body.body : {}'
                        headers: '{"Authorization": "Bearer " + vars.authToken, "X-Octo-Environment": vars.?environment.orValue("")}'
                        failOnError: false
                else:
                  process:
                    - type: set-payload
                      name: not-granted
                      settings:
                        value: '{"error": "This installation has not granted this deployment the observability API, so alerts cannot be read or written. Say so — it does not mean there are none."}'

          - name: http_fetch
            description: >
              Make an HTTP request to any address this pod can reach, and
              return the response with its status. For checking whether an
              endpoint is up, what a deployed integration answers, or what an
              upstream actually returns. http:// and https:// only. To call
              the orchestrator use octo_api instead — that one is
              authenticated and bounded, and this is not.
            inputSchema: |
              {
                "type": "object",
                "required": ["url"],
                "properties": {
                  "url":     { "type": "string", "description": "Full http:// or https:// URL." },
                  "method":  { "type": "string", "enum": ["GET", "POST", "PUT", "PATCH", "DELETE", "HEAD"] },
                  "headers": { "type": "object", "description": "Request headers, as a flat name→value object." },
                  "body":    { "type": "string", "description": "Raw request body, already serialized." }
                }
              }
            process:
              # The scheme check runs before anything is spawned and is doing
              # more work than it looks like: curl reads file:// and would
              # hand back /proc/1/environ, including LLM_API_KEY. A value
              # that must start with "http" also cannot start with "-", which
              # closes -o, -T, -K and @file.
              - type: if
                name: http-scheme-only
                condition: 'body.url.matches("^https?://")'
                then:
                  process:
                    - type: cli-run
                      name: curl
                      program: env.AGENT_CURL_BIN
                      args: >-
                        ["-sS", "--proto", "=http,https", "--proto-redir", "=http,https",
                         "--max-time", env.AGENT_HTTP_MAX_TIME, "--max-filesize", "1048576",
                         "-w", "\n---\nHTTP %{http_code} %{content_type} %{size_download}b\n",
                         "-X", (has(body.method) && body.method != "" ? body.method : "GET")]
                        + (has(body.headers) ? body.headers.map(k, ["-H", k + ": " + body.headers[k]]).flatten() : [])
                        + (has(body.body) && body.body != "" ? ["--data-raw", body.body] : [])
                        + [body.url]
                      allow: ["${AGENT_CURL_BIN}"]
                      # PATH and no HOME, deliberately: curl reads
                      # $HOME/.curlrc, and with HOME unset there is no file.
                      env: [PATH]
                      timeout: ${AGENT_CLI_TIMEOUT}
                      onExit: continue
                else:
                  process:
                    - type: set-payload
                      name: bad-scheme
                      settings:
                        value: '{"error": "url must start with http:// or https://."}'

          - name: refresh_platform_ui
            description: >
              Tell the platform an integration changed, so an editor with it
              open offers to reload. Call this after writing an integration.
              Fire-and-forget.
            inputSchema: |
              {
                "type": "object",
                "required": ["id", "name"],
                "properties": {
                  "id":   { "type": "string", "description": "The integration's id." },
                  "name": { "type": "string", "description": "The integration's name." }
                }
              }
            process:
              # The system: prefix publishes to the platform's own subject
              # instead of this deployment's, so no HTTP hop is needed.
              - type: publish-event
                name: publish-refresh
                settings:
                  subject: '"system:internal.integrations.events"'
                  value: '{"type": "integration.updated", "id": body.id, "name": body.name}'
              - type: set-payload
                name: refresh-platform-ui-result
                settings:
                  value: '{"published": true}'
        skills:
          - name: platform
            description: >
              How the platform runs an integration: version tags,
              deployments, resources, cluster secrets, and what a failing
              deployment looks like.
            resource: platform
          - name: flow-file
            description: >
              The shape of a flow definition: service, env, resources,
              connectors, flows, sources and process chains.
            resource: flow-file
          - name: best-practices
            description: >
              How to write a flow well: multi-transform for setter runs, enrich
              around destructive calls, subflows, the octo.yaml globals file,
              block names. Load before writing a definition.
            resource: best-practices
          - name: alerts
            description: >
              How to build a watch that fires when somebody would want to be
              woken and stays quiet otherwise: the metrics you can ask about,
              the three kinds of condition, scope, the four durations, and
              previewing a definition before it becomes somebody's pager. Load
              before creating or editing an alert.
            resource: alerts
