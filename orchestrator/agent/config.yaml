service:
  name: dr-octo

# Dr. Octo — the platform's own agent.
#
# The joke is load-bearing: this is an Octo App. Not a service with a flow engine
# bolted on, not a sidecar — a config.yaml with an ai-agent block in it, deployed
# by the same POST /integrations/{id}/deployments that deploys anything a user
# builds. That is what makes tracing, pod logs, scaling, version tags and rollback
# work on the agent without any of them being written for it. And it is why you can
# open this in the editor and change the prompt, add a tool, or take one away.
#
# The chat flow is a coordinator and two specialist subagents rather than one
# agent holding twenty tools — see "the specialists" below for what that buys and
# what it costs.
#
# Run it standalone exactly as the orchestrator runs it:
#
#   export LLM_CONNECTOR_TYPE=llm-anthropic LLM_API_KEY=sk-ant-... \
#          LLM_MODEL=claude-sonnet-4-6 ORCHESTRATOR_URL=http://localhost:8090
#   export AGENT_WORKSPACE=$(mktemp -d) \
#          AGENT_OCTO_BIN=$PWD/bin/octo AGENT_DOLPHIN_BIN=$PWD/bin/dolphin \
#          AGENT_CURL_BIN=$(command -v curl) AGENT_FIND_BIN=$(command -v find) \
#          AGENT_JQ_BIN=$(command -v jq)
#   bin/octo run --config orchestrator/agent

env:
  # Which provider to talk to, as a connector type. The orchestrator binds this
  # from the site's LLM settings at install. It is an env var and not three
  # connectors because every declared connector is started eagerly and each LLM
  # connector fails startup on an empty apiKey — so declaring all three would mean
  # two guaranteed failures. Substitution rewrites the parsed YAML before it is
  # decoded, so a connector's *type* can come from a variable like anything else.
  - name: LLM_CONNECTOR_TYPE # llm-anthropic | llm-openai | llm-gemini | llm-openrouter
    required: true
  - name: LLM_API_KEY
    required: true
  - name: LLM_MODEL
    required: true

  # Where the orchestrator lives. Required *and* bound at deploy time: the
  # orchestrator injects ORCHESTRATOR_URL into every pod, but the deploy-time check
  # for required variables looks only at bindings and .env resources, so an unbound
  # declaration is refused before the pod is ever created.
  - name: ORCHESTRATOR_URL
    required: true

  # Where stored logs and traces are queried. Deliberately NOT required, and it has
  # no counterpart binding: LOGS_URL is orchestrator-managed, injected only into a
  # deployment granted the observability API, and the deploy-time check for required
  # variables reads bindings and .env resources only — so declaring it required would
  # refuse every deploy, including the ones that were granted it.
  #
  # The default is a sentinel, and it is load-bearing twice over.
  #
  # It exists at all because connectors start eagerly and http-client refuses an
  # empty baseURL, which would crash-loop the whole agent on an install that never
  # granted him the API. And every logs tool below compares against it before doing
  # anything, so "not granted" is answered from a CEL check rather than from a failed
  # request — no waiting on a connection, and an explanation instead of a transport
  # error the model has to interpret.
  #
  # The host is under .invalid, reserved by RFC 2606 to never resolve, so the
  # sentinel is also a safe address: anything that ever slipped past the checks
  # fails to connect rather than reaching something real.
  - name: LOGS_URL
    default: http://observability-not-granted.invalid

  # How long a conversation runs before it is compacted. Half a million rather than
  # a million: this is what the model is billed to re-read on every turn of a long
  # thread, and the compaction is a summary, so the tail of the conversation stays
  # verbatim either way.
  - name: AGENT_MEMORY_TOKENS
    default: "500000"

  # How many tool-calling turns one run may take before the guardrail ends it.
  #
  # Sixty rather than twenty-four because twenty-four was not enough for the work
  # he is actually asked to do. A single real request — read the traces for a
  # failing deployment, work out why, write a fix and prove it with a test suite —
  # spends a turn per tool call, and the loop above is docs, then API, then write,
  # then run, then read, then fix.
  #
  # It is a ceiling and not a budget: a run that finishes in four takes four. What
  # it costs is the tail — a genuinely stuck run now burns sixty turns before the
  # guardrail catches it, which is the trade being made deliberately.
  #
  # Under the split below this counts the COORDINATOR's turns only. A delegation is
  # one turn here and up to forty inside the specialist.
  #
  # Overridable per installation from Admin, Platform agent; that binding, when
  # set, replaces this default.
  - name: AGENT_MAX_ITERATIONS
    default: "60"

  # Where his workspace is, and where the programs he runs live.
  #
  # These are variables and not literals, and that is load-bearing rather than
  # tidy. A `cli-run` allow list is resolved when the flow is BUILT — every entry
  # goes through the same PATH lookup the program will, and an entry that resolves
  # to nothing fails the build (buildAllowList, runtime/core/internal/engine/cli.go).
  # So a literal /opt/octo/bin/dolphin here would make this whole app fail to load
  # anywhere that path does not exist: on a laptop, in the dolphin suite beside this
  # file, and on any install without the agentic runner. Wrapping the blocks in an
  # `if` would not help — the builder builds both branches.
  #
  # The defaults are the agentic runner's layout, which is the only image the
  # installer deploys him on. Everywhere else, override them; see the header above.
  - name: AGENT_WORKSPACE
    default: /workspace
  # The STANDALONE octo, deliberately not the /usr/local/bin/octo that is this pod's
  # own entrypoint. That one is the k8s build and exits without a runtime-services
  # module, so it cannot run a flow on its own.
  - name: AGENT_OCTO_BIN
    default: /opt/octo/bin/octo
  - name: AGENT_DOLPHIN_BIN
    default: /opt/octo/bin/dolphin
  - name: AGENT_CURL_BIN
    default: /usr/bin/curl
  - name: AGENT_FIND_BIN
    default: /usr/bin/find
  - name: AGENT_JQ_BIN
    default: /usr/bin/jq

  # How long any one command may run. A command holds a flow worker while it runs,
  # so cli-run has no unbounded option at all — which is why `octo run` is not
  # something this agent does: he invokes a flow once and runs a suite, both of
  # which end. Longer than cli-run's own 30s default because a cold `octo invoke`
  # starts every connector the definition declares before it runs anything.
  - name: AGENT_CLI_TIMEOUT
    default: 120s
  # curl's own --max-time, in seconds. Comfortably inside AGENT_CLI_TIMEOUT so a
  # slow endpoint is reported by curl, with a status line, rather than killed by the
  # block with nothing to show for it.
  - name: AGENT_HTTP_MAX_TIME
    default: "20"

  - name: HTTP_HOST
    default: 0.0.0.0
  # Declaring HTTP_PORT with a numeric default is what makes this deployment
  # networked, which is what earns it a stable internal address for the platform to
  # proxy the chat panel to.
  - name: HTTP_PORT
    default: "8080"

resources:
  templates:
    - resource: skills/flow-file.md
      as: flow-file
    - resource: skills/blocks.md
      as: blocks
    - resource: skills/connectors.md
      as: connectors
    - resource: skills/expressions.md
      as: expressions
    - resource: skills/testing.md
      as: testing
    - resource: skills/platform.md
      as: platform
    - resource: skills/email-reports.md
      as: email-reports

connectors:
  - name: llm
    type: ${LLM_CONNECTOR_TYPE}
    settings:
      apiKey: ${LLM_API_KEY}
      model: ${LLM_MODEL}
      maxTokens: 8192

  # The same provider, key and model as `llm` above, for the one call that wants
  # none of its reasoning: naming a conversation in five words. `llm` cannot carry
  # this setting, because the chat agent it serves reasons for a living.
  #
  # Reasoning tokens are spent before any answer and count against the same
  # ceiling, so a reasoning model asked for a handful of tokens spends them all
  # thinking and returns an empty body. That is not hypothetical — it is what the
  # title call did in production against a reasoning model, surfacing as
  # `ai-mapping: response is not valid JSON: unexpected end of JSON input`.
  #
  # Both spellings of the setting are set, because the type is chosen at deploy
  # time by an environment variable and each provider names this differently.
  # Settings decode through a plain json.Unmarshal, so whichever connector starts
  # reads the key it knows and ignores the other; getting one of them wrong would
  # be silent, which is why the pairing is written down here rather than inferred.
  #
  #   reasoning: none   llm-openrouter, llm-openai — genuinely suppresses it
  #   thinking: off     llm-anthropic — sends no thinking field, and that API
  #                     reasons only when asked, so not asking is off
  #                     llm-gemini — also sends nothing, but a 2.5 model reasons
  #                     by default and the connector cannot express a zero budget,
  #                     so there the ceiling below is what saves the call
  #
  # 1024 rather than the 100 the title block used to ask for: enough that a model
  # which reasons anyway still has room to emit the object, and small enough that
  # a runaway costs nothing. See issue #344 for the general fix in the connectors.
  - name: llm-fast
    type: ${LLM_CONNECTOR_TYPE}
    settings:
      apiKey: ${LLM_API_KEY}
      model: ${LLM_MODEL}
      reasoning: none
      # Quoted: bare off is a YAML 1.1 boolean, and this setting is a string.
      thinking: "off"
      maxTokens: 1024

  - name: api
    type: http
    settings:
      host: ${HTTP_HOST}
      port: ${HTTP_PORT}

  # The orchestrator's own API. baseURL is the security boundary for every tool
  # below: rest-dynamic can build any path under it and no path at all outside it.
  - name: octo
    type: http-client
    settings:
      baseURL: ${ORCHESTRATOR_URL}
      timeout: 60s

  # The log aggregator's query API — stored logs and traces, for every deployment on
  # the install. A second boundary, restrictable independently of the one above, and
  # read-only in a way that one is not: every route it serves is a GET.
  - name: logs
    type: http-client
    settings:
      baseURL: ${LOGS_URL}
      # Shorter than the orchestrator's. A query that has to reach an address this
      # deployment was never granted should come back while someone is still reading
      # the answer, not sixty seconds later.
      timeout: 20s

  # His workspace: somewhere to draft a definition, write a test suite beside it,
  # and read back what a run produced.
  #
  # The root is a real boundary, and the only one in this file that is. Paths
  # resolve through os.OpenRoot, so containment is the kernel's answer about the
  # path actually walked rather than a string comparison — a symlink inside the
  # workspace cannot name a file outside it — and an absolute path is refused
  # outright instead of being folded back under the root. Contrast the `allow`
  # lists below, which are a guardrail and not a boundary; see run_command.
  #
  # It is scratch. The volume is an emptyDir that dies with the pod, so anything
  # worth keeping goes back through octo_api, and what he remembers about a person
  # is already the KV store.
  - name: workspace
    type: file
    settings:
      root: ${AGENT_WORKSPACE}
      createDirs: true

flows:
  - name: chat
    source:
      connector: api
      type: http
      settings:
        path: /chat
        methods: [POST]
        # How a second request ends the run this one started. The header is the
        # whole signal: the agent's stopWhen below only has to notice it is there.
        headers: [X-Agent-Stop]
        # On an SSE route this bounds the wait for the FIRST frame only. An agent
        # takes a moment to produce its first token.
        timeout: 60s
        sse:
          enabled: true
          finalEvent: true
          finalEventName: answer
          heartbeat: 15s
          # 30m, not the 10m this shipped with. A run that delegates is waiting on a
          # whole second model run — a builder drafting, testing and fixing — and
          # 10 minutes was cutting those off mid-answer.
          maxDuration: 30m
    process:
      # The key is the user the platform authenticated, plus the thread — so a
      # stolen thread id names a conversation that does not exist. The user block is
      # injected server-side by the chat route and overwritten there, so a forged one
      # in the request never reaches this expression.
      - type: set-variable
        name: user-key
        settings:
          name: userKey
          value: >-
            has(body.user) && has(body.user.id) && body.user.id != ""
              ? body.user.id : "anonymous"

      - type: set-variable
        name: thread-id
        settings:
          name: threadId
          value: 'has(body.threadId) && body.threadId != "" ? body.threadId : "default"'

      - type: set-variable
        name: thread-key
        settings:
          name: threadKey
          value: vars.userKey + "/" + vars.threadId

      # The question, kept before the agent replaces the body with its answer. The
      # conversation record needs both halves and can only see one of them at a
      # time.
      - type: set-variable
        name: keep-question
        settings:
          name: question
          value: 'has(body.message) ? body.message : ""'

      # The agent's input, stated rather than inherited. The email is dropped — it
      # identifies a real person to an external provider and nothing in the prompt
      # needs it.
      - type: set-payload
        name: agent-input
        settings:
          value: >-
            {
              "message": has(body.message) ? body.message : "",
              "page": has(body.page) ? body.page : "",
              "routes": has(body.routes) ? body.routes : [],
              "user": has(body.user) && has(body.user.name) ? {"name": body.user.name} : {}
            }

      - type: ai-agent
        name: dr-octo
        connector: llm
        stream: true
        maxIterations: ${AGENT_MAX_ITERATIONS}

        # A person reads this answer, so it is prose and not a document.
        answer: text

        # The question is the turn; everything else is labelled as context. The
        # catalogue is sent once per run, not once per message: a follow-up joins a
        # conversation that already holds it.
        input: >-
          size(body.routes) > 0
            ? body.message +
              "\n\n---\nContext, not part of the question. The user is on page " +
              body.page + ". Pages you may navigate to, and who is asking:\n" +
              toJson({"routes": body.routes, "user": body.user})
            : body.message

        memoryThreadId: vars.threadKey
        contextMaxTokens: ${AGENT_MEMORY_TOKENS}
        memoryCompaction: summarize

        # Named, which is what opts him into the runtime's first-class memory:
        # conversations recorded uncompacted and kept per integration, so they
        # survive a reinstall rather than being purged with the deployment.
        #
        # Stated and never derived. A name taken from the block's position would
        # make renaming this block, or moving it into another branch, silently
        # destroy every conversation anyone has had with him.
        agentId: dr-octo
        userId: vars.userKey

        stopWhen: '"X-Agent-Stop" in vars && vars["X-Agent-Stop"] != ""'

        emit: [thinking, text, tool_call, tool_result, turn_end,
               compaction_start, compaction_end, signal, done, error, guardrail]
        events:
          process:
            - type: sse-event
              settings:
                event: agent
                ifClosed: stop

        prompt: >
          You are Dr. Octo, the agent built into this Octo platform. You are a
          parody of Dr. Evil from the Austin Powers films — bald, black Nehru
          collar, steepled fingers, a fondness for calling perfectly ordinary work
          a scheme — and you have all of his theatricality and none of his ethics
          problem. You are genuinely helpful, you never hold anything to ransom,
          and you do not do the one-MILLION-dollars bit unprompted.


          The register: a dry aside now and then, an occasional pause for effect, a
          routine deployment referred to as a plan coming together. That is
          seasoning on competent work and never a substitute for it. If the choice
          is between landing a joke and answering the question, answer the
          question. Drop the register entirely when someone is stuck, something is
          broken in production, or the answer is bad news.


          You are also, literally, an Octo App — a flow definition with an ai-agent
          block, deployed by the orchestrator exactly like the integrations you help
          build. Mention that only if someone asks; it is a fact, not a personality.


          You are talking to a signed-in user of this platform. Their name arrives in
          body.user.name, and the page they are on arrives in body.page — use the page
          for context about what they mean by "this" or "here", and use their name
          sparingly and naturally. When body.user is empty, authentication is off and
          you are talking to a local developer.


          body.routes lists the pages you can send them to: each has a path and a
          description of what it shows, and a path containing a segment like {id} is a
          template you fill in. When the answer to a question is a page, take them
          there with navigate_to instead of describing how to find it — but say what
          you are showing them in the same turn, because a panel that moves the page
          without a word is unsettling. Never navigate to a path that is not built
          from that list.


          You help with the platform: reading and explaining integrations, writing
          and fixing flow definitions, investigating deployments that will not
          start, and reading logs and traces. You do the talking and the thinking.
          Two specialists do the heavy work, and choosing between them — and
          briefing whichever one it is — is most of your job.


          octo_read is yours, and it is a GET: which integrations exist, what one
          definition says, what a deployment's status is. Use it freely, and answer
          from it when that is the whole answer. It cannot write, deliberately —
          every change to this installation goes through the operator below, which
          means a write is always something you decided to delegate.


          integration_builder writes and proves flow definitions. It knows the
          schema, holds the workspace, the standalone octo and the dolphin suite
          runner, and it does not answer until the thing has run. Send it anything
          that ends in YAML — a new integration, a fix to a flow, a test suite, a
          CEL expression you want settled. It cannot save anything.


          platform_operator changes and inspects the installation: saving a
          definition, version tags, deploys, rollouts, scaling, undeploys,
          resources, secrets, settings, and every question about stored logs and
          traces. Send it anything that ends in an API call.


          Both are blind and stateless. They cannot see this conversation, the
          user, the page, or what the other one was asked. The brief is everything
          they get, so it carries everything: the ids, the definition text quoted
          in full, what has already been tried, what must not be touched, and what
          "done" looks like. "Fix it" is not a brief. A vague brief comes back as a
          specialist guessing confidently, which is the failure mode this whole
          arrangement is here to avoid.


          They are also not free — each delegation is a whole model run, and the
          panel goes quiet while it works. Do not delegate a question one octo_read
          answers, and do not delegate the same job twice because the first report
          was not what you hoped. Say what you are handing over before you hand it
          over, in one line, so the wait means something.


          A shipped change is usually both of them in order: the builder produces a
          definition that passes its suite, then the operator saves it, tags it and
          rolls it out. Pass the builder's YAML into the operator's brief verbatim
          — the operator has no way to see it otherwise.


          When someone asks for a report by email, the specialists gather the rows
          and you write and send it: load the email-reports skill, compose the HTML
          and its plain-text twin, say who it is going to, then send_email_report.


          Say what you are about to do before anything destructive, and prefer
          showing a definition to silently saving one. Load a skill yourself when
          you are explaining the schema rather than writing it; the specialists
          load their own.


          Relay results honestly. A specialist reports what it actually did, which
          tests passed and what it could not verify — pass that through, keep the
          definition it hands you verbatim, and never round "I could not check
          this" up to "this works". If a specialist comes back empty or stuck, say
          so and say what you would try next; do not fill the gap yourself.


          You remember people between conversations. Call recall_facts when the
          answer might depend on how someone works, and remember_fact — with both
          a short stable name and the fact itself — when they tell you something
          worth keeping: how they like flows written, which integration is theirs,
          what to call them. Remember preferences and context, not the contents of
          a conversation, and never a credential. If they tell you something has
          changed, update the fact under the same name; if they ask you to forget
          something, forget it without arguing.


          Write in Markdown — the panel renders it. Fenced code blocks with a language
          on them, tables, lists and links all display properly, so a flow definition
          belongs in a ```yaml fence and a comparison belongs in a table. Keep it
          light otherwise: no heading on a one-paragraph reply, and never wrap an
          ordinary sentence in a code fence. You are a chat panel, not a JSON API —
          answer in prose with structure where structure helps, never as a bare JSON
          object.

        guardrail: >
          If the request is not about this Octo platform, its integrations,
          deployments or the flows a user is building, take the default path.

        tools:
          # A read of the orchestrator API, and only a read.
          #
          # Two tools call the same API in this file and they are not the same
          # tool: this one is bounded to GET by allowMethods, which is a runtime
          # refusal rather than an instruction, and it is the one the coordinator
          # and the builder hold. Everything that changes the installation goes
          # through the operator specialist, whose octo_api is unrestricted — so
          # "who can write" is answered by which agent was delegated to, not by how
          # persuasively somebody asked.
          - name: octo_read
            description: >
              Read anything from the orchestrator API — GET only. The small lookups
              an answer needs: /integrations to list them, /integrations/{id} for
              one definition, /integrations/{id}/deployments for what is running,
              /deployments/{id} for its status. Path only, never a full URL. A 4xx
              comes back as data rather than an error, so read it and correct the
              call. Writing is refused here; delegate a change to the platform
              operator.
            inputSchema: |
              {
                "type": "object",
                "required": ["path"],
                "properties": {
                  "path":  { "type": "string", "description": "Path only, e.g. /integrations/abc." },
                  "query": { "type": "object", "description": "Query parameters." }
                }
              }
            process:
              - type: rest-dynamic
                settings:
                  connector: octo
                  method: '"GET"'
                  path: body.path
                  allowMethods: [GET]
                  query: 'has(body.query) ? body.query : {}'
                  failOnError: false

          - name: check_expression
            description: >
              Evaluate one CEL expression against a message body and return the
              result. Use it to prove an expression before you put it in a definition
              — the expressions skill says to, and this is how.
            inputSchema: |
              {
                "type": "object",
                "required": ["expr"],
                "properties": {
                  "expr": { "type": "string", "description": "The CEL expression, e.g. body.items.size() > 0" },
                  "data": { "type": "object", "description": "The message body to evaluate it against." }
                }
              }
            process:
              - type: cli-run
                name: octo-eval
                program: env.AGENT_OCTO_BIN
                args: >-
                  ["eval", "--expr", body.expr,
                   "--data", toJson(has(body.data) ? body.data : {})]
                allow: ["${AGENT_OCTO_BIN}"]
                env: [PATH, HOME]
                workDir: ${AGENT_WORKSPACE}
                timeout: ${AGENT_CLI_TIMEOUT}
                onExit: continue

          # ------------------------------------------------------- the specialists
          #
          # Two ai-agent blocks standing in a tool slot, which is all a subagent is
          # here: a tool whose process chain happens to be another agent, with its
          # own prompt, its own tool set and its own loop. The coordinator writes a
          # brief, the specialist works, and one report comes back as the tool
          # result.
          #
          # The split is not tidiness. It buys three things that a single
          # twenty-tool agent could not have:
          #
          #   - A prompt each. "How to write a definition and prove it" and "how
          #     this installation is deployed and diagnosed" are different jobs
          #     wanting different instructions, and a single prompt carrying both
          #     is mostly irrelevant on any given turn.
          #   - A working context each. A builder's loop fills a transcript with
          #     YAML drafts and test reports; an operator's fills with API
          #     responses. Kept apart, neither is paying to re-read the other, and
          #     the conversation the user is actually having stays short — what
          #     comes back to it is one report, not forty tool results.
          #   - A boundary. The builder's orchestrator tool is GET-only. The
          #     coordinator's is GET-only. There is exactly one unrestricted
          #     octo_api in this file and it is inside the operator, so a write to
          #     the platform is always a deliberate delegation.
          #
          # What it costs: a delegation is a whole model run, and the specialist
          # starts blind. Both are stated in the coordinator's prompt, because the
          # failure mode is a thin brief and the second is delegating a question
          # that one GET would have answered. It is also why the SSE route's
          # maxDuration is 30m: one turn here can be a whole loop somewhere else.
          #
          # The builder's two borrowed tools carry a builder_ prefix, and that is a
          # readability choice rather than a requirement: the runtime keeps tool
          # branches apart by address, so `check_expression` in both levels loads
          # fine. It is the trace and the panel's tool chips that show a bare name
          # and nothing else — two `octo_read` chips in one answer say nothing
          # about which agent made the call. (It also keeps this app loading on an
          # installation whose validator reads tool branches as one flat
          # namespace and refuses the repeat.)

          - name: integration_builder
            description: >
              Hand a flow definition to the specialist who writes them. It knows the
              schema, has the workspace, the standalone octo and the dolphin test
              runner, and it does not answer until the definition has actually run.
              Send it anything that ends in YAML: a new integration, a fix to a flow,
              a test suite, a CEL expression to settle. It reads the orchestrator API
              but cannot write to it, so nothing it produces is saved — it hands back
              a definition and the evidence it works. The brief must be complete: it
              cannot see this conversation, so quote the YAML, the ids and what
              "done" looks like.
            inputSchema: |
              {
                "type": "object",
                "required": ["task"],
                "properties": {
                  "task":    { "type": "string", "description": "The whole brief, self-contained: what to do, the ids, the definitions, what done looks like." },
                  "context": { "type": "string", "description": "Anything from the conversation it needs and cannot see — what was already tried, constraints, preferences." }
                }
              }
            process:
              - type: ai-agent
                name: builder
                connector: llm
                answer: text
                # A conversation of its own, and a disposable one.
                #
                # vars.toolScope is minted by the coordinator's tool call: stable
                # for as long as the conversation it belongs to, distinct per
                # tool. So a second delegation in the same chat reaches the same
                # builder — it still has the definition it drafted a moment ago,
                # and does not have to be told it twice. A third conversation
                # gets a fresh one.
                #
                # Volatile because a specialist's transcript is scaffolding. It
                # belongs in the tier that evicts rather than the one the
                # platform backs up, and losing it costs a re-read of a brief.
                memoryThreadId: vars.toolScope
                memoryVolatile: true
                # Not recorded. A specialist works a thread its caller minted for
                # it, so recording those would mint a conversation row per
                # delegation forever — which is the accumulation the volatile tier
                # exists to avoid. (memoryVolatile implies this; it is written out
                # because the implication is easy to miss when reading.)
                history: off
                # Its own ceiling, deliberately not the coordinator's: a delegated
                # job is a whole loop of its own, and a specialist that runs out of
                # turns mid-fix hands back half an answer the coordinator then has
                # to relay as if it were one.
                maxIterations: 40
                input: >-
                  body.task + (has(body.context) && body.context != ""
                    ? "\n\n---\nContext you cannot see, from the conversation:\n" + body.context
                    : "")
                emit: [tool_call, tool_result]
                events:
                  process:
                    # The specialist's tool calls reach the same panel the
                    # coordinator's do, so a delegation is watchable rather than a
                    # chip that sits open for two minutes with nothing under it.
                    # ifClosed: ignore and not stop — the coordinator's own events
                    # path already ends the run when the panel closes, and a stop
                    # raised from inside a tool would follow the coordinator out of
                    # the tool call it is waiting on.
                    - type: sse-event
                      settings:
                        event: agent
                        ifClosed: ignore
                prompt: |
                  You are the integration builder: the specialist Dr. Octo hands a
                  definition to. You write octo flow definitions and you prove them
                  before you answer.

                  You cannot see the chat you were called from, who the user is, or
                  what was said in it. The brief you were given is what you know,
                  and your reply is everything that comes back — so it has to stand
                  on its own.

                  You do remember your own work. A second job in the same
                  conversation reaches you with your earlier ones still in front of
                  you: the definition you drafted, the tests you ran, what failed.
                  Use that rather than starting from nothing — and say when you are
                  building on it, because the coordinator cannot see it.

                  THE LOOP, and it is not optional:

                    1. Load the skills you need. flow-file for the file's shape,
                       blocks for what a process chain may contain, connectors for
                       their settings, expressions for CEL, testing for a suite.
                       The schema moves faster than your training data. A definition
                       written from memory is a guess.
                    2. write_workspace_file the definition to <dir>/config.yaml.
                    3. write_workspace_file a suite to <dir>/config_test.yaml —
                       dolphin pairs x.yaml with x_test.yaml beside it.
                    4. run_flow_tests <dir>. Exit 0 is passed; exit 1 means the FLOW
                       is wrong, which is the answer you asked for; exit 2 means the
                       SUITE did not parse, so nothing ran and nothing there is about
                       your flow — load the testing skill and fix the suite.
                    5. Fix and run again. invoke_flow when you want to see what one
                       flow actually returns; builder_check_expression to settle a
                       CEL question instead of reasoning about one.

                  Two limits to keep straight, and to state in your answer rather
                  than let a reader assume past. The workspace is scratch: an empty
                  directory that dies with the pod, so nothing you write there is
                  saved anywhere. And an invoked flow runs STANDALONE — in-process
                  KV and queues, no cluster resources, no connectors reaching
                  anything real. It proves the shape of a definition and the logic
                  in it, never what a deployment would see.

                  builder_octo_read is a GET against the orchestrator, for reading
                  what already exists: /integrations for the list, /integrations/{id}
                  for one definition (the YAML arrives as a string in `definition`),
                  /integrations/{id}/resources for its env files and templates. Use
                  it when the brief names an integration instead of quoting it.

                  You cannot save anything. No PUT, no POST, no deploy — that is the
                  platform operator's job, and the coordinator will delegate it if
                  the user asks for it. Hand back the definition; do not pretend it
                  is stored.

                  ANSWER IN MARKDOWN, and answer like a colleague reporting back:

                    - What you built or changed, in a sentence or two.
                    - The complete definition in a ```yaml fence — complete, not an
                      excerpt with "..." in it. It is going to be quoted verbatim.
                    - What you ran and what it said. Name the cases that passed. If
                      something still fails, say exactly what and why.
                    - What you could NOT verify, plainly. An untested branch, a
                      connector that only exists in a cluster, an assumption you had
                      to make about the brief. This is the most valuable line in the
                      report; never leave it out to look finished.
                tools:
                  # ------------------------------------------------------ workspace
                  #
                  # The difference between an agent that can describe a fix and one
                  # that can try it. It drafts a definition into the workspace,
                  # invokes it, runs its suite, reads the envelope, and does it
                  # again — the loop a person gets at a terminal, in the cluster
                  # where the problem is.
                  #
                  # The design rule they all follow: THE MODEL SUPPLIES DATA, THE
                  # FLOW SUPPLIES ARGV. No string the model chose ever lands where
                  # it could be read as a flag.
                  - name: read_workspace_file
                    description: >
                      Read a file from your workspace. The path is relative to the
                      workspace root; a path that leaves it is refused.
                    inputSchema: |
                      {
                        "type": "object",
                        "required": ["path"],
                        "properties": {
                          "path": { "type": "string", "description": "Workspace-relative path, e.g. demo/config.yaml" }
                        }
                      }
                    process:
                      - type: file-read
                        settings:
                          connector: workspace
                          path: body.path
                          resultVar: contents
                      - type: set-payload
                        settings:
                          value: '{"path": body.path, "content": vars.contents}'

                  - name: write_workspace_file
                    description: >
                      Write a file into your workspace, creating parent directories
                      as needed. Put a flow in `<dir>/config.yaml` and its suite in
                      `<dir>/config_test.yaml`, which is the pairing dolphin looks
                      for. The workspace is scratch and dies with the pod.
                    inputSchema: |
                      {
                        "type": "object",
                        "required": ["path", "content"],
                        "properties": {
                          "path":    { "type": "string", "description": "Workspace-relative path, e.g. demo/config.yaml" },
                          "content": { "type": "string", "description": "The file's full contents." }
                        }
                      }
                    process:
                      - type: file-write
                        settings:
                          connector: workspace
                          path: body.path
                          content: body.content
                          resultVar: receipt
                      - type: set-payload
                        settings:
                          value: 'vars.receipt'

                  - name: list_workspace
                    description: >
                      List everything in your workspace. Takes no arguments — it
                      returns the whole tree, which is small.
                    inputSchema: |
                      { "type": "object", "properties": {} }
                    process:
                      # No argument, and that is the design rather than a
                      # simplification: constant argv puts find's -exec out of reach
                      # by construction rather than by an allow list.
                      - type: cli-run
                        name: find-workspace
                        program: env.AGENT_FIND_BIN
                        args: '[".", "-maxdepth", "4", "-not", "-path", "*/.*"]'
                        allow: ["${AGENT_FIND_BIN}"]
                        env: [PATH]
                        workDir: ${AGENT_WORKSPACE}
                        timeout: ${AGENT_CLI_TIMEOUT}
                        onExit: continue

                  - name: invoke_flow
                    description: >
                      Run one flow from a definition in your workspace, once, and
                      return what it produced. `dir` is a single workspace directory
                      name holding the .yaml files; `flow` is the flow's name; `data`
                      is the request body.

                      The answer is an outcome envelope — {"result":…} if the flow
                      completed, {"dropped":true} if a filter dropped the message,
                      {"error":"…"} if it failed. A flow that fails is an answer, not
                      a failure of this tool.

                      Sources are NOT started, so pass in the body a source would
                      have. And it runs under the STANDALONE services provider — so
                      an object-read that is empty here says nothing about the
                      deployment.
                    inputSchema: |
                      {
                        "type": "object",
                        "required": ["dir", "flow"],
                        "properties": {
                          "dir":  { "type": "string", "description": "Workspace directory holding the definition, e.g. demo. No slashes." },
                          "flow": { "type": "string", "description": "Name of the flow to invoke." },
                          "data": { "type": "object", "description": "JSON request body for the flow." }
                        }
                      }
                    process:
                      - type: if
                        name: safe-dir
                        condition: >-
                          body.dir.matches("^[A-Za-z0-9.][A-Za-z0-9._-]{0,63}$")
                            && !body.dir.contains("..")
                        then:
                          process:
                            - type: cli-run
                              name: octo-invoke
                              program: env.AGENT_OCTO_BIN
                              # --envelope says "completed", "dropped" and "failed"
                              # in one JSON object and exits 0 for a flow that
                              # failed, which is what makes this usable by a model.
                              args: >-
                                ["invoke", "--config", body.dir, "--flow", body.flow, "--envelope",
                                 "--data", toJson(has(body.data) ? body.data : {})]
                              allow: ["${AGENT_OCTO_BIN}"]
                              env: [PATH, HOME]
                              workDir: ${AGENT_WORKSPACE}
                              timeout: ${AGENT_CLI_TIMEOUT}
                              onExit: continue
                        else:
                          process:
                            - type: set-payload
                              name: bad-dir
                              settings:
                                value: >-
                                  {"error": "dir must be a single workspace directory name — no slashes,
                                  no '..'. Write the definition into a directory first, then pass its name."}

                  - name: run_flow_tests
                    description: >
                      Run the dolphin suite for the definitions in a workspace
                      directory. dolphin pairs each `x.yaml` with the `x_test.yaml`
                      beside it, so write both and pass the directory.

                      Exit 0 means every case passed. Exit 1 means the FLOWS are
                      wrong — that is the answer you asked for. Exit 2 means the
                      suite or the runner is wrong, which is a different problem.
                    inputSchema: |
                      {
                        "type": "object",
                        "required": ["dir"],
                        "properties": {
                          "dir": { "type": "string", "description": "Workspace directory holding the definitions and their suites. No slashes." }
                        }
                      }
                    process:
                      - type: if
                        name: safe-dir
                        condition: >-
                          body.dir.matches("^[A-Za-z0-9.][A-Za-z0-9._-]{0,63}$")
                            && !body.dir.contains("..")
                        then:
                          process:
                            - type: cli-run
                              name: dolphin-test
                              program: env.AGENT_DOLPHIN_BIN
                              args: '["test", body.dir]'
                              allow: ["${AGENT_DOLPHIN_BIN}"]
                              # OCTO_PATH is what makes dolphin drive the standalone
                              # octo rather than this pod's k8s entrypoint. Both the
                              # image variable and this list are required and neither
                              # is sufficient — drop it and every suite exits 2.
                              env: [PATH, HOME, OCTO_PATH]
                              workDir: ${AGENT_WORKSPACE}
                              timeout: ${AGENT_CLI_TIMEOUT}
                              onExit: continue
                            # The exit code in words, because 0/1/2 mean three
                            # different things and only one is "something went
                            # wrong". Left bare, a model reads any non-zero as a
                            # broken tool and apologises instead of fixing the flow.
                            - type: set-payload
                              name: verdict
                              settings:
                                value: >-
                                  {
                                    "verdict": body.exitCode == 0 ? "passed"
                                      : body.exitCode == 1 ? "the flows are wrong: cases failed — read the report and fix the definition"
                                      : "the SUITE did not parse, so no flow ran and nothing here is about your flows. Load the testing skill and check the suite's shape against it before editing again.",
                                    "exitCode": body.exitCode,
                                    "report": body.stdout,
                                    "stderr": body.stderr
                                  }
                        else:
                          process:
                            - type: set-payload
                              name: bad-dir
                              settings:
                                value: >-
                                  {"error": "dir must be a single workspace directory name — no slashes, no '..'."}

                  - name: builder_check_expression
                    description: >
                      Evaluate one CEL expression against a message body and return
                      the result. Use it to prove an expression before you put it in
                      a definition.
                    inputSchema: |
                      {
                        "type": "object",
                        "required": ["expr"],
                        "properties": {
                          "expr": { "type": "string", "description": "The CEL expression, e.g. body.items.size() > 0" },
                          "data": { "type": "object", "description": "The message body to evaluate it against." }
                        }
                      }
                    process:
                      - type: cli-run
                        name: octo-eval
                        program: env.AGENT_OCTO_BIN
                        args: >-
                          ["eval", "--expr", body.expr,
                           "--data", toJson(has(body.data) ? body.data : {})]
                        allow: ["${AGENT_OCTO_BIN}"]
                        env: [PATH, HOME]
                        workDir: ${AGENT_WORKSPACE}
                        timeout: ${AGENT_CLI_TIMEOUT}
                        onExit: continue

                  - name: run_command
                    description: >
                      Run one of your own programs directly, when the tools above do
                      not fit the shape of what you need. Programs available: octo,
                      dolphin, curl, find and jq. Arguments are passed as argv, so
                      there is no shell: a pipe or a semicolon is a literal
                      character, not an operator.
                    inputSchema: |
                      {
                        "type": "object",
                        "required": ["program"],
                        "properties": {
                          "program": { "type": "string", "enum": ["octo", "dolphin", "curl", "find", "jq"] },
                          "args":    { "type": "array", "items": { "type": "string" }, "description": "Arguments, as argv." },
                          "stdin":   { "type": "string", "description": "Written to the process's standard input." }
                        }
                      }
                    process:
                      # BE HONEST ABOUT WHAT THIS LIST IS. It is a guardrail, not a
                      # boundary. `octo` is on it, and `octo invoke` runs whatever
                      # definition it is pointed at — including one written into the
                      # workspace a moment earlier, with a `cli-run` block carrying
                      # no allow list at all. The boundary is the POD.
                      - type: cli-run
                        name: run-program
                        program: >-
                          body.program == "octo" ? env.AGENT_OCTO_BIN
                            : body.program == "dolphin" ? env.AGENT_DOLPHIN_BIN
                            : body.program == "curl" ? env.AGENT_CURL_BIN
                            : body.program == "find" ? env.AGENT_FIND_BIN
                            : env.AGENT_JQ_BIN
                        args: 'has(body.args) ? body.args : []'
                        stdin: 'has(body.stdin) ? body.stdin : ""'
                        allow:
                          - ${AGENT_OCTO_BIN}
                          - ${AGENT_DOLPHIN_BIN}
                          - ${AGENT_CURL_BIN}
                          - ${AGENT_FIND_BIN}
                          - ${AGENT_JQ_BIN}
                        env: [PATH, HOME, OCTO_PATH]
                        workDir: ${AGENT_WORKSPACE}
                        timeout: ${AGENT_CLI_TIMEOUT}
                        onExit: continue

                  # The same GET-only read the coordinator holds, so the builder can
                  # fetch a definition it was asked to change instead of being handed
                  # one. It cannot save the result, which is the whole point.
                  - name: builder_octo_read
                    description: >
                      Read anything from the orchestrator API — GET only.
                      /integrations for the list, /integrations/{id} for one
                      definition, /integrations/{id}/resources for its env files and
                      templates. Path only, never a full URL. A 4xx comes back as
                      data rather than an error. Writing is refused here.
                    inputSchema: |
                      {
                        "type": "object",
                        "required": ["path"],
                        "properties": {
                          "path":  { "type": "string", "description": "Path only, e.g. /integrations/abc." },
                          "query": { "type": "object", "description": "Query parameters." }
                        }
                      }
                    process:
                      - type: rest-dynamic
                        settings:
                          connector: octo
                          method: '"GET"'
                          path: body.path
                          allowMethods: [GET]
                          query: 'has(body.query) ? body.query : {}'
                          failOnError: false
                skills:
                  - name: flow-file
                    description: >
                      The shape of a flow definition: service, env, resources,
                      connectors, flows, sources and process chains.
                    resource: flow-file
                  - name: blocks
                    description: >
                      The blocks a process chain can contain — control flow, data,
                      storage, AI and integration — and what each is for.
                    resource: blocks
                  - name: connectors
                    description: >
                      The connectors available (HTTP, database, queue, cron, LLM, and
                      the rest) and the settings each takes.
                    resource: connectors
                  - name: expressions
                    description: >
                      CEL as octo uses it: the message activation, the octo extension
                      functions, and where expressions are allowed.
                    resource: expressions
                  - name: testing
                    description: >
                      Writing dolphin test suites for a flow: cases, inputs, mocks
                      and spies.
                    resource: testing

          - name: platform_operator
            description: >
              Hand a change or an investigation to the specialist who runs the
              installation. Saving a definition through the API, version tags,
              deploys, rollouts, scaling, undeploys, resources, secrets, settings —
              and every question about stored logs and traces, which is anything
              about what already happened. It holds the unrestricted orchestrator
              API, so this is the only way anything on the platform changes. Say
              plainly in the brief what may be changed and what may not; it cannot
              see this conversation, so give it the ids and the full definition text
              it needs.
            inputSchema: |
              {
                "type": "object",
                "required": ["task"],
                "properties": {
                  "task":    { "type": "string", "description": "The whole brief, self-contained: what to do, the ids, the definitions, what done looks like." },
                  "context": { "type": "string", "description": "Anything from the conversation it needs and cannot see — what was already tried, constraints, preferences." }
                }
              }
            process:
              - type: ai-agent
                name: operator
                connector: llm
                answer: text
                # Its own conversation, on the same terms as the builder's: the
                # coordinator mints the scope, and the transcript is scaffolding
                # rather than history. An investigation that takes two
                # delegations remembers what the first one found.
                memoryThreadId: vars.toolScope
                memoryVolatile: true
                # Not recorded. A specialist works a thread its caller minted for
                # it, so recording those would mint a conversation row per
                # delegation forever — which is the accumulation the volatile tier
                # exists to avoid. (memoryVolatile implies this; it is written out
                # because the implication is easy to miss when reading.)
                history: off
                maxIterations: 32
                input: >-
                  body.task + (has(body.context) && body.context != ""
                    ? "\n\n---\nContext you cannot see, from the conversation:\n" + body.context
                    : "")
                emit: [tool_call, tool_result]
                events:
                  process:
                    - type: sse-event
                      settings:
                        event: agent
                        ifClosed: ignore
                prompt: |
                  You are the platform operator: the specialist Dr. Octo hands the
                  installation to. You read its state and you change it — save,
                  tag, deploy, roll out, scale, undeploy — and you read the stored
                  logs and traces that say what already happened.

                  You cannot see the chat you were called from or who is asking. The
                  brief is what you know; your reply is everything that comes back.

                  You do remember your own work: a second job in the same
                  conversation reaches you with the earlier ones still in front of
                  you — the ids you read, what the platform answered, what you
                  changed. Use it, and say when you are building on it.

                  THE MAP. These are the routes, so you do not have to rediscover
                  them from the OpenAPI on every call. It is a map and not a
                  contract: when a call is refused, read_api_docs for that tag is
                  how you find out what actually changed.

                    integrations
                      GET    /integrations                      list: id, name
                      POST   /integrations                      {"name","definition"}
                      GET    /integrations/{id}                 the WORKING COPY
                      PUT    /integrations/{id}                 {"name","definition"} — whole replace, there is no patch
                      DELETE /integrations/{id}

                    resources — env files and templates the integration owns
                      GET    /integrations/{id}/resources
                      POST   /integrations/{id}/resources       {"kind":"env"|"template","name","content"}
                      GET|PUT|DELETE /integrations/{id}/resources/{resourceId}

                    version tags — an immutable freeze of the definition AND its resources
                      GET    /integrations/{id}/snapshots
                      POST   /integrations/{id}/snapshots       {"tag":"v4"}
                      DELETE /snapshots/{id}
                      GET    /snapshots/{id}/resources[/content]

                    deployments
                      GET    /integrations/{id}/deployments/options   what a deploy would need — read this FIRST
                      GET    /integrations/{id}/deployments
                      POST   /integrations/{id}/deployments
                             {"snapshotId","replicas","slug","expose":"external","subdomain",
                              "env":{"NAME":{"value":"..."}|{"secret":"name"}},
                              "tracing":bool,"observabilityApi":bool,"orchestratorApi":bool,"runner":""}
                      GET    /deployments/{id}                  status, reason, pods, restart counts
                      PATCH  /deployments/{id}                  {"replicas":n}
                      POST   /deployments/{id}/rollout          {"snapshotId","env","tracing"} — omitted keeps current
                      DELETE /deployments/{id}                  undeploy
                      GET    /deployments/{id}/pods/{pod}/logs  LIVE output of a pod that still exists

                    a deployment's own storage
                      GET    /deployments/{id}/namespaces
                      GET    /deployments/{id}/objects?namespace=
                      GET|PUT|DELETE /deployments/{id}/objects/{key}
                      GET|PUT|DELETE /deployments/{id}/kv/{namespace}/{key}

                    the installation
                      GET    /settings/health                   whether the orchestrator can reach what it needs
                      GET    /settings/storage                  how full the two stores are
                      GET|PUT /settings/llm, /settings/email
                      GET    /secrets                           names only, never values
                      PUT|DELETE /secrets/{name}
                      GET|POST /folders, /devruns               folders tree; dev runs of a WORKING COPY
                      POST   /email/send                        the coordinator's report tool uses this

                    stored history — the logs API, through logs_api, all GET
                      /logs?deploymentId=&level=&q=&from=&to=&before=&limit=
                      /traces?deploymentId=&integrationId=&flow=&status=failed&hasLlm=&minDurationMs=&q=&limit=
                      /traces/{traceId}?bodies=true             the whole run, block by block
                      /traces/{traceId}/records/{id}
                      /traces/apps

                  THE THREE THINGS THAT ARE NOT THE SAME THING, and most confusion
                  is one of them: the INTEGRATION is the working copy and editing it
                  changes nothing that runs; a VERSION TAG is a frozen copy and
                  never changes; a DEPLOYMENT runs one tag. So shipping an edit is
                  always three calls — PUT the definition, POST a snapshot, POST a
                  rollout onto it (or POST a deployment if there is none). A rollout
                  keeps the id, address, scale and exposure, and keeps any setting
                  you omit.

                  Tracing only changes on a rollout — the runtime reads it at
                  startup. A tag that adds or removes the HTTP source is refused on
                  a rollout: undeploy and redeploy instead.

                  WHEN SOMETHING WILL NOT START, in this order, because each rules
                  out the next: GET /deployments/{id} for status, reason and restart
                  counts; a required env var with no binding, which is refused
                  before a pod is ever created and names the variables in the error;
                  the pod logs for a config that will not load; a secret binding
                  naming a secret that does not exist, which fails the pod and not
                  the deploy. For anything that is not happening right now, prefer
                  the traces: a pod's logs vanish with the pod, and a crash loop
                  replaces it repeatedly. status=failed on /traces goes straight to
                  the runs that broke.

                  If the logs tools answer that the observability API was not
                  granted, report that sentence. It is not the same answer as
                  "nothing found", and only one of the two is true.

                  BEFORE YOU CHANGE ANYTHING. You have write access to a live
                  installation. Read before you write; do not delete an integration,
                  a deployment or a secret unless the brief plainly asks for that;
                  and when a brief is ambiguous about something irreversible, do the
                  reversible part and say what you did not do. After you change an
                  integration, call refresh_platform_ui with its id and name so an
                  open editor offers to reload.

                  ANSWER IN MARKDOWN: what you did, as a short list of the calls
                  that mattered with the ids they returned; what the platform says
                  now; and what you deliberately did not do. Quote a status or an
                  error verbatim rather than paraphrasing it — the coordinator is
                  going to relay this to the person who asked.
                tools:
                  - name: list_api_operations
                    description: >
                      List every route the orchestrator API serves — method, path,
                      summary and tag. Cheap. Read this when the map in your prompt
                      does not cover what you need.
                    inputSchema: |
                      { "type": "object", "properties": {} }
                    process:
                      - type: rest
                        settings:
                          connector: octo
                          method: GET
                          path: /openapi/operations

                  - name: read_api_docs
                    description: >
                      Read the orchestrator's OpenAPI description, narrowed to one
                      tag (from list_api_operations) or one path prefix. Pass one or
                      the other, never both. Without a filter this is very large.
                    inputSchema: |
                      {
                        "type": "object",
                        "properties": {
                          "tag": { "type": "string", "description": "Keep only operations with this tag." },
                          "path": { "type": "string", "description": "Keep only routes starting with this prefix." }
                        }
                      }
                    process:
                      - type: rest
                        settings:
                          connector: octo
                          method: GET
                          path: /openapi.json
                          query:
                            tag: 'has(body.tag) ? body.tag : ""'
                            path: 'has(body.path) ? body.path : ""'

                  - name: octo_api
                    description: >
                      Call the orchestrator API. The map in your prompt covers the
                      routes; read_api_docs settles anything it does not. Returns the
                      response body; the HTTP status is in vars.statusCode, and a 4xx
                      comes back as data rather than an error, so read it and correct
                      the call.
                    inputSchema: |
                      {
                        "type": "object",
                        "required": ["method", "path"],
                        "properties": {
                          "method": { "type": "string", "enum": ["GET", "POST", "PUT", "PATCH", "DELETE"] },
                          "path":   { "type": "string", "description": "Path only, e.g. /integrations/abc. Never a full URL." },
                          "query":  { "type": "object", "description": "Query parameters." },
                          "payload": { "type": "object", "description": "JSON request body." }
                        }
                      }
                    process:
                      # To restrict what the operator may do, add allowMethods or
                      # pathPrefix here — this is the one place that decides it.
                      - type: rest-dynamic
                        settings:
                          connector: octo
                          method: body.method
                          path: body.path
                          query: 'has(body.query) ? body.query : {}'
                          body: 'has(body.payload) ? body.payload : null'
                          failOnError: false

                  # The three logs tools each open with the same guard. When LOGS_URL
                  # is still the sentinel, this deployment was never granted the
                  # observability API, and that sentence is the honest answer —
                  # cheaper than a request to an address that does not resolve.
                  - name: list_logs_operations
                    description: >
                      List every route the observability API serves — stored logs and
                      traces. A 404 here means the log aggregator is older than these
                      tools and serves no description — report that as an
                      out-of-date service, never as missing access.
                    inputSchema: |
                      { "type": "object", "properties": {} }
                    process:
                      - type: if
                        name: observability-granted
                        condition: env.LOGS_URL != "http://observability-not-granted.invalid"
                        then:
                          process:
                            - type: rest
                              settings:
                                connector: logs
                                method: GET
                                path: /openapi/operations
                                failOnError: false
                        else:
                          process:
                            - type: set-payload
                              name: not-granted
                              settings:
                                value: '{"error": "This installation has not granted this deployment the observability API, so stored logs and traces cannot be read. Say so — it does not mean there are none."}'

                  - name: read_logs_docs
                    description: >
                      Read the observability API's OpenAPI description, narrowed to
                      one tag or one path prefix. Pass one or the other, never both.
                      A 404 means the log aggregator is older than these tools, not
                      that access is missing.
                    inputSchema: |
                      {
                        "type": "object",
                        "properties": {
                          "tag": { "type": "string", "description": "Keep only operations with this tag." },
                          "path": { "type": "string", "description": "Keep only routes starting with this prefix." }
                        }
                      }
                    process:
                      - type: if
                        name: observability-granted
                        condition: env.LOGS_URL != "http://observability-not-granted.invalid"
                        then:
                          process:
                            - type: rest
                              settings:
                                connector: logs
                                method: GET
                                path: /openapi.json
                                failOnError: false
                                query:
                                  tag: 'has(body.tag) ? body.tag : ""'
                                  path: 'has(body.path) ? body.path : ""'
                        else:
                          process:
                            - type: set-payload
                              name: not-granted
                              settings:
                                value: '{"error": "This installation has not granted this deployment the observability API, so stored logs and traces cannot be read. Say so — it does not mean there are none."}'

                  - name: logs_api
                    description: >
                      Query stored logs and traces. This is history — what already
                      happened, across every deployment. For what a pod is printing
                      right now, use octo_api instead. A 4xx comes back as data, so
                      read it and correct the call — a 404 is a wrong path or an
                      aggregator older than these tools, never a statement about
                      access.
                    inputSchema: |
                      {
                        "type": "object",
                        "required": ["path"],
                        "properties": {
                          "path":  { "type": "string", "description": "Path only, e.g. /traces. Never a full URL." },
                          "query": { "type": "object", "description": "Query parameters." }
                        }
                      }
                    process:
                      - type: if
                        name: observability-granted
                        condition: env.LOGS_URL != "http://observability-not-granted.invalid"
                        then:
                          process:
                            # allowMethods costs nothing here: every route this API
                            # serves is a GET, so the opt-in restriction is simply
                            # true.
                            - type: rest-dynamic
                              settings:
                                connector: logs
                                method: '"GET"'
                                path: body.path
                                allowMethods: [GET]
                                query: 'has(body.query) ? body.query : {}'
                                failOnError: false
                        else:
                          process:
                            - type: set-payload
                              name: not-granted
                              settings:
                                value: '{"error": "This installation has not granted this deployment the observability API, so stored logs and traces cannot be read. Say so — it does not mean there are none."}'

                  - name: http_fetch
                    description: >
                      Make an HTTP request to any address this pod can reach, and
                      return the response with its status. For checking whether an
                      endpoint is up, what a deployed integration answers, or what an
                      upstream actually returns. http:// and https:// only. To call
                      the orchestrator use octo_api instead — that one is
                      authenticated and bounded, and this is not.
                    inputSchema: |
                      {
                        "type": "object",
                        "required": ["url"],
                        "properties": {
                          "url":     { "type": "string", "description": "Full http:// or https:// URL." },
                          "method":  { "type": "string", "enum": ["GET", "POST", "PUT", "PATCH", "DELETE", "HEAD"] },
                          "headers": { "type": "object", "description": "Request headers, as a flat name→value object." },
                          "body":    { "type": "string", "description": "Raw request body, already serialized." }
                        }
                      }
                    process:
                      # The scheme check runs before anything is spawned and is doing
                      # more work than it looks like: curl reads file:// and would
                      # hand back /proc/1/environ, including LLM_API_KEY. A value
                      # that must start with "http" also cannot start with "-", which
                      # closes -o, -T, -K and @file.
                      - type: if
                        name: http-scheme-only
                        condition: 'body.url.matches("^https?://")'
                        then:
                          process:
                            - type: cli-run
                              name: curl
                              program: env.AGENT_CURL_BIN
                              args: >-
                                ["-sS", "--proto", "=http,https", "--proto-redir", "=http,https",
                                 "--max-time", env.AGENT_HTTP_MAX_TIME, "--max-filesize", "1048576",
                                 "-w", "\n---\nHTTP %{http_code} %{content_type} %{size_download}b\n",
                                 "-X", (has(body.method) && body.method != "" ? body.method : "GET")]
                                + (has(body.headers) ? body.headers.map(k, ["-H", k + ": " + body.headers[k]]).flatten() : [])
                                + (has(body.body) && body.body != "" ? ["--data-raw", body.body] : [])
                                + [body.url]
                              allow: ["${AGENT_CURL_BIN}"]
                              # PATH and no HOME, deliberately: curl reads
                              # $HOME/.curlrc, and with HOME unset there is no file.
                              env: [PATH]
                              timeout: ${AGENT_CLI_TIMEOUT}
                              onExit: continue
                        else:
                          process:
                            - type: set-payload
                              name: bad-scheme
                              settings:
                                value: '{"error": "url must start with http:// or https://."}'

                  - name: refresh_platform_ui
                    description: >
                      Tell the platform an integration changed, so an editor with it
                      open offers to reload. Call this after writing an integration.
                      Fire-and-forget.
                    inputSchema: |
                      {
                        "type": "object",
                        "required": ["id", "name"],
                        "properties": {
                          "id":   { "type": "string", "description": "The integration's id." },
                          "name": { "type": "string", "description": "The integration's name." }
                        }
                      }
                    process:
                      # The system: prefix publishes to the platform's own subject
                      # instead of this deployment's, so no HTTP hop is needed.
                      - type: publish-event
                        settings:
                          subject: '"system:internal.integrations.events"'
                          value: '{"type": "integration.updated", "id": body.id, "name": body.name}'
                      - type: set-payload
                        settings:
                          value: '{"published": true}'
                skills:
                  - name: platform
                    description: >
                      How the platform runs an integration: version tags,
                      deployments, resources, cluster secrets, and what a failing
                      deployment looks like.
                    resource: platform
                  - name: flow-file
                    description: >
                      The shape of a flow definition: service, env, resources,
                      connectors, flows, sources and process chains.
                    resource: flow-file

          # ---------------------------------------------------------------- email
          #
          # The one tool whose effect leaves the platform. It is on the coordinator
          # and not on either specialist, deliberately: a report is written for a
          # person, and the coordinator is the only one of the three that knows who
          # asked and what they wanted. A specialist gathers the rows; this sends
          # them.
          #
          # The sender identity and the provider key are the installation's, held in
          # the orchestrator's email settings and never in this request — a body
          # supplying either is refused there, which is what keeps this from being a
          # relay for whatever address the model was talked into using.
          - name: send_email_report
            description: >
              Send an HTML email report through the platform's own email settings.
              Use it only when someone asked for a report by email — an answer they
              can read in the panel does not need to be mailed as well. Load the
              email-reports skill first: mail clients are not browsers, and it holds
              the layout that survives them and the shape each kind of report takes.
              Always send `text` as well as `html`. Never put a secret, a key, an env
              value or a request body from a trace into a report. Say the recipients
              and the subject in the same turn, before you call this.
            inputSchema: |
              {
                "type": "object",
                "required": ["to", "subject", "html"],
                "properties": {
                  "to":      { "type": "array", "items": { "type": "string" }, "description": "Recipient addresses. Only the ones you were given." },
                  "subject": { "type": "string", "description": "One short line, and make it the finding: 3 of 11 deployments failing." },
                  "html":    { "type": "string", "description": "The report as inline-styled, table-based HTML. See the email-reports skill." },
                  "text":    { "type": "string", "description": "The same report in plain text, for clients and previews that show no HTML." }
                }
              }
            process:
              - type: rest
                name: send-report
                settings:
                  connector: octo
                  method: POST
                  path: /email/send
                  body: >-
                    {"to": body.to, "subject": body.subject, "html": body.html,
                     "text": has(body.text) ? body.text : ""}
                  # A 4xx is an answer — email not configured, too many recipients, a
                  # newline in the subject — and the model should read it and say so
                  # rather than have the run fail underneath it.
                  failOnError: false

          - name: navigate_to
            description: >
              Take the user to a page in the platform. Use a path from body.routes,
              filling in any {id} segment. Navigation is a courtesy and not an
              answer — say what you are showing them and why in the same turn.
            inputSchema: |
              {
                "type": "object",
                "required": ["path", "reason"],
                "properties": {
                  "path":   { "type": "string", "description": "A path within the platform, e.g. /platform/i/abc. Never a full URL." },
                  "reason": { "type": "string", "description": "One short line for the user saying why you are taking them there." }
                }
              }
            process:
              # ifClosed: ignore, unlike the events path. A closed panel means nobody
              # is being navigated, which is not a reason to end the run mid-tool.
              #
              # The path is NOT validated here. This app is meant to be edited, so a
              # guard in this file is advice rather than a boundary — the panel
              # performs the navigation and is where a path that is not relative has
              # to be refused.
              - type: sse-event
                settings:
                  event: navigate
                  ifClosed: ignore
                  data: >-
                    {
                      "path": has(body.path) ? body.path : "",
                      "reason": has(body.reason) ? body.reason : ""
                    }
              - type: set-payload
                settings:
                  value: '{"navigated": true}'

          # ---------------------------------------------------------------- facts
          #
          # What Dr. Octo remembers about a person between conversations. Memory
          # holds a *conversation*; this holds what outlives one.
          #
          # All three keep every fact for a user in a single object at
          # facts/{userKey}, because core.KV has get, set and delete but no list.
          # The key is built from vars.userKey, which the model cannot see or set:
          # it names a fact; the flow decides whose.

          - name: recall_facts
            description: >
              Everything you have been told to remember about this user. Read it
              early when the answer might depend on how they work — do not ask them
              to repeat something you were already told.
            inputSchema: |
              { "type": "object", "properties": {} }
            process:
              - type: object-read
                settings:
                  key: '"facts/" + vars.userKey'
                  as: userFacts
                  default: '{"items": []}'
              - type: set-payload
                settings:
                  value: '{"facts": vars.userFacts.items}'

          - name: remember_fact
            description: >
              Remember something about this user for later conversations. Use a
              short stable name so the same fact can be updated rather than
              duplicated — "preferred-model", "main-integration". Remember what
              they tell you about themselves and how they work, not the contents of
              this conversation, and not anything secret.
            inputSchema: |
              {
                "type": "object",
                "required": ["name", "value"],
                "properties": {
                  "name":  { "type": "string", "description": "Short stable identifier for the fact." },
                  "value": { "type": "string", "description": "The fact, in a sentence." }
                }
              }
            process:
              - type: object-read
                settings:
                  key: '"facts/" + vars.userKey'
                  as: userFacts
                  default: '{"items": []}'
              # Filter-then-append is what makes this an upsert.
              - type: set-variable
                name: merge-facts
                settings:
                  name: mergedFacts
                  value: >-
                    vars.userFacts.items.filter(f, f.name != body.name)
                    + [{"name": body.name, "value": body.value}]

              # Capped, oldest first: nothing else bounds this list, and it is read
              # back in full on every recall_facts.
              - type: object-write
                settings:
                  key: '"facts/" + vars.userKey'
                  value: >-
                    {"items": size(vars.mergedFacts) > 200
                      ? vars.mergedFacts.slice(size(vars.mergedFacts) - 200, size(vars.mergedFacts))
                      : vars.mergedFacts}

              - type: set-payload
                settings:
                  value: '{"remembered": body.name}'

          - name: forget_fact
            description: >
              Forget a fact by name. Use this when the user says something is no
              longer true, and when they ask you to forget something.
            inputSchema: |
              {
                "type": "object",
                "required": ["name"],
                "properties": {
                  "name": { "type": "string", "description": "The fact's name, as given to remember_fact." }
                }
              }
            process:
              - type: object-read
                settings:
                  key: '"facts/" + vars.userKey'
                  as: userFacts
                  default: '{"items": []}'
              - type: object-write
                settings:
                  key: '"facts/" + vars.userKey'
                  value: '{"items": vars.userFacts.items.filter(f, f.name != body.name)}'
              - type: set-payload
                settings:
                  value: '{"forgotten": body.name}'

        skills:
          - name: flow-file
            description: >
              The shape of a flow definition: service, env, resources, connectors,
              flows, sources and process chains. Load before writing or editing one.
            resource: flow-file
          - name: blocks
            description: >
              The blocks a process chain can contain — control flow, data, storage,
              AI and integration — and what each is for.
            resource: blocks
          - name: connectors
            description: >
              The connectors available (HTTP, database, queue, cron, LLM, and the
              rest) and the settings each takes.
            resource: connectors
          - name: expressions
            description: >
              CEL as octo uses it: the message activation, the octo extension
              functions, and where expressions are allowed.
            resource: expressions
          - name: testing
            description: >
              Writing dolphin test suites for a flow: cases, inputs, mocks and spies.
            resource: testing
          - name: platform
            description: >
              How the platform runs an integration: version tags, deployments,
              resources, cluster secrets, and what a failing deployment looks like.
            resource: platform
          - name: email-reports
            description: >
              Sending a report by email: the HTML that survives a mail client, the
              shape a report takes, which calls gather each kind, and what must
              never go in one. Load before calling send_email_report.
            resource: email-reports

        default:
          process:
            # The guardrail runs for every reason a run can end without an answer —
            # a refusal, and now also a run that spent its whole turn budget — and
            # the flow cannot tell which: the reason travels on the `guardrail`
            # event, not in this body. So the line has to be true of all of them.
            # It used to say "outside my remit", which is a refusal's answer and a
            # wrong one for a run that worked to its limit and ran out.
            #
            # The panel names the actual reason underneath this, so being specific
            # here would only be a second, less-informed guess at it.
            - type: set-payload
              settings:
                value: >-
                  {"answer": "I have stopped short of an answer on that one — the
                  scheme did not come together. I am Dr. Octo: integrations,
                  deployments, flows, logs and traces are my remit. Narrow it down
                  or point me at something concrete and I will have another go."}

      # ------------------------------------------------------------ the record
      #
      # A wire-tap. The exchange goes onto a queue and this flow returns; the
      # conversation record is written by the flow below, on a worker nobody is
      # waiting on. That separation is the point: naming a conversation takes a
      # model call, and a person watching their answer finish should not be
      # watching it be filed as well.
      #
      # It is a record and not the agent's memory. Memory is compacted — summarize
      # replaces the early turns with a summary of them — so what the engine stores
      # is the model's working set, not the conversation a person had.
      #
      # fork gives the branch its own clone, so the payload it builds for the queue
      # never reaches the body this flow returns — which is the answer, and which
      # the SSE route sends as its closing frame. handle-errors keeps a broker that
      # is having a bad day from failing a chat that already succeeded.
      - type: handle-errors
        name: record-exchange
        process:
          - type: fork
            name: tap
            branches:
              - name: record
                process:
                  # The answer is usually the prose `answer: text` asked for, and is
                  # not always: the agent decodes a final answer that happens to
                  # parse as JSON whatever the format setting says, so an answer of
                  # "42", or one the model fenced, arrives here as a number or a
                  # map. Rendering it back is what keeps a record of it either way.
                  - type: set-payload
                    name: build-record
                    settings:
                      value: >-
                        {"userKey": vars.userKey, "threadId": vars.threadId,
                         "question": vars.question,
                         "answer": type(body) == string ? body : toJson(body)}
                  - type: queue-dispatch
                    name: send-record
                    settings:
                      subject: '"conversation-log"'
        error:
          - type: log
            name: record-failed
            settings:
              level: warn
              message: '"could not record the conversation: " + vars.error.message'

  # ============================================================ the record ====
  #
  # What a person can come back to. Two objects per user, and neither is the
  # agent's memory:
  #
  #   agent-chat/{userKey}/{threadId}   the conversation as it was had
  #   agent-threads/{userKey}           one row per conversation, for the list
  #
  # The index exists because core.KV has get, set and delete but no list — the
  # same reason facts live in one object — and because a listing could not carry
  # a title even if it did. Its rows are what the panel renders before anyone
  # opens anything.
  #
  # Both keys are built from the userKey the chat route authenticated, so a
  # guessed thread id names a conversation that does not exist. The queue message
  # carries that key rather than re-deriving it, and nothing outside this
  # deployment can put a message on the subject.
  - name: record-conversation
    source:
      type: queue                        # implicit connector — no instance needed
      settings:
        subject: conversation-log
        # One listener, deliberately. Reading the record and writing it back are
        # separate blocks, so two exchanges of one conversation handled at the same
        # moment would both read the same turns and the later write would win — the
        # same read-modify-write the facts tools carry and for the same reason.
        # Serialising this replica's recording closes it here; a second replica
        # could still race one, and the cost is a lost turn in a transcript rather
        # than a lost answer.
        #
        # It costs nothing worth having. There is one record write per exchange and
        # nobody is waiting on it, so the only thing a second listener would buy is
        # the chance to lose a turn.
        listeners: 1
    process:
      # The body is about to be replaced by the title call, so what the keys are
      # built from is taken out of it first.
      - type: set-variable
        name: hold-user
        settings:
          name: userKey
          value: body.userKey
      - type: set-variable
        name: hold-thread
        settings:
          name: threadId
          value: body.threadId
      - type: set-variable
        name: hold-exchange
        settings:
          name: exchange
          value: '{"question": body.question, "answer": body.answer}'

      - type: object-read
        name: read-record
        settings:
          key: '"agent-chat/" + vars.userKey + "/" + vars.threadId'
          as: record
          # Whether the object was there is what "this conversation is new" means,
          # and it is the only thing that decides whether a model is asked for a
          # title. Everything after the first exchange keeps the one it has.
          existsVar: recordExists
          default: '{"title": "", "turns": []}'

      - type: set-variable
        name: append-turns
        settings:
          name: turns
          value: >-
            vars.record.turns
              + [{"role": "user", "text": vars.exchange.question},
                 {"role": "agent", "text": vars.exchange.answer}]

      # Capped oldest-first, like facts and for the same reason: nothing else
      # bounds this, it is read back in full on every exchange, and a value that
      # grows without limit eventually will not write. Two hundred turns is a very
      # long conversation and a very small object.
      - type: set-variable
        name: cap-turns
        settings:
          name: turns
          value: >-
            size(vars.turns) > 200
              ? vars.turns.slice(size(vars.turns) - 200, size(vars.turns))
              : vars.turns

      - type: if
        name: name-it
        condition: '!vars.recordExists'
        then:
          process:
            # A name a person recognises in a list, which is worth one small model
            # call at the start of a conversation and nothing thereafter. It runs
            # here rather than in the chat flow precisely because it is a model
            # call: nobody is waiting on this worker.
            #
            # And it is the one thing here that can fail on its own — a provider
            # having a bad minute, a model that answers something the schema
            # refuses. The name is the nice half of this flow and the record is the
            # point, so a failure falls back to the question itself rather than
            # taking the exchange down with it.
            - type: handle-errors
              name: name-or-fall-back
              process:
                - type: set-payload
                  name: title-input
                  settings:
                    value: '{"question": vars.exchange.question, "answer": vars.exchange.answer}'
                - type: ai-mapping
                  name: write-title
                  settings:
                    # llm-fast, not llm: this is the one call on the agent that
                    # wants no reasoning, and reasoning here costs the answer
                    # rather than improving it. See the connector's own comment.
                    connector: llm-fast
                    prompt: >
                      Name this conversation the way a person would name it in a list
                      of their past conversations. Five words at most, no quotes, no
                      trailing period, no "conversation about". Describe what was
                      asked, not what was answered. Use the question's own language.
                    outputExample: '{"title": "Deploying the orders integration"}'
                    outputSchema: |
                      {"type": "object", "required": ["title"],
                       "properties": {"title": {"type": "string", "maxLength": 80}}}
                    # No per-block ceiling: llm-fast already sets one sized for a
                    # model that reasons regardless. A tighter one here would be
                    # the bug this fixed — a title needs a few tokens, but a
                    # reasoning model needs room to reach them.
                - type: set-variable
                  settings:
                    name: title
                    value: body.title
              error:
                - type: log
                  name: title-failed
                  settings:
                    level: warn
                    message: '"could not name a conversation: " + vars.error.message'
                - type: set-variable
                  settings:
                    name: title
                    value: >-
                      size(vars.exchange.question) > 60
                        ? vars.exchange.question.substring(0, 60) + "…"
                        : vars.exchange.question
        else:
          process:
            - type: set-variable
              settings:
                name: title
                value: vars.record.title

      - type: object-write
        name: write-record
        settings:
          key: '"agent-chat/" + vars.userKey + "/" + vars.threadId'
          value: '{"title": vars.title, "turns": vars.turns}'

      # The index carries the moment as well as the name. The object store records
      # when a value was last written, but only the route that lists every key in
      # the namespace can read it, and that route cannot return a title — so the
      # row that has the title carries the timestamp too.
      - type: object-read
        name: read-index
        settings:
          key: '"agent-threads/" + vars.userKey'
          as: index
          default: '{"items": []}'
      # Filter-then-append is what makes this an upsert: a conversation already in
      # the list moves to the end with a fresh timestamp rather than appearing
      # twice.
      - type: set-variable
        name: merge-index
        settings:
          name: rows
          value: >-
            vars.index.items.filter(i, i.id != vars.threadId)
              + [{"id": vars.threadId, "title": vars.title, "updatedAt": string(now)}]
      - type: object-write
        name: write-index
        settings:
          key: '"agent-threads/" + vars.userKey'
          value: >-
            {"items": size(vars.rows) > 200
              ? vars.rows.slice(size(vars.rows) - 200, size(vars.rows))
              : vars.rows}

  # A user's past conversations, most recently written last — the panel sorts. The
  # user block is written server-side by the chat route, exactly as it is for /chat,
  # so this reads one person's list and cannot be asked for anyone else's.
  - name: list-conversations
    source:
      connector: api
      type: http
      settings:
        path: /conversations
        methods: [POST]
        timeout: 10s
    process:
      - type: set-variable
        name: user-key
        settings:
          name: userKey
          value: >-
            has(body.user) && has(body.user.id) && body.user.id != ""
              ? body.user.id : "anonymous"
      - type: object-read
        name: read-index
        settings:
          key: '"agent-threads/" + vars.userKey'
          as: index
          default: '{"items": []}'
      - type: set-payload
        settings:
          value: '{"items": vars.index.items}'

  # One past conversation, as it was had. Not the agent's memory: that is
  # compacted, so its early turns have been replaced by a summary of them.
  - name: read-conversation
    source:
      connector: api
      type: http
      settings:
        path: /conversations/{threadId}
        methods: [POST]
        timeout: 10s
    process:
      - type: set-variable
        name: user-key
        settings:
          name: userKey
          value: >-
            has(body.user) && has(body.user.id) && body.user.id != ""
              ? body.user.id : "anonymous"
      - type: object-read
        name: read-record
        settings:
          key: '"agent-chat/" + vars.userKey + "/" + vars.threadId'
          as: record
          default: '{"title": "", "turns": []}'
      - type: set-payload
        settings:
          value: '{"threadId": vars.threadId, "title": vars.record.title, "turns": vars.record.turns}'
