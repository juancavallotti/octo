service:
  name: dr-octo

# Dr. Octo — the platform's own agent.
#
# The joke is load-bearing: this is an Octo App. Not a service with a flow engine
# bolted on, not a sidecar — a config.yaml with an ai-agent block in it, deployed
# by the same POST /integrations/{id}/deployments that deploys anything a user
# builds. That is what makes tracing, pod logs, scaling, version tags and rollback
# work on the agent without any of them being written for it. And it is why you can
# open this in the editor and change the prompt, add a tool, or take one away.
#
# Run it standalone exactly as the orchestrator runs it:
#
#   export LLM_CONNECTOR_TYPE=llm-anthropic LLM_API_KEY=sk-ant-... \
#          LLM_MODEL=claude-sonnet-4-6 ORCHESTRATOR_URL=http://localhost:8090
#   # He runs on the agentic runner in a cluster, so his workspace and the programs
#   # he drives are at that image's paths. Point them at yours — all six are
#   # required locally, because an allow list is resolved when the flow is built and
#   # an entry that resolves to nothing fails the build rather than the first call.
#   export AGENT_WORKSPACE=$(mktemp -d) \
#          AGENT_OCTO_BIN=$PWD/bin/octo AGENT_DOLPHIN_BIN=$PWD/bin/dolphin \
#          AGENT_CURL_BIN=$(command -v curl) AGENT_FIND_BIN=$(command -v find) \
#          AGENT_JQ_BIN=$(command -v jq)
#   bin/octo run --config orchestrator/agent
#   curl -N -X POST localhost:8080/chat \
#     -d '{"threadId":"t1","message":"list my integrations"}'

env:
  # Which provider to talk to, as a connector type. The orchestrator binds this
  # from the site's LLM settings at install. It is an env var and not three
  # connectors because every declared connector is started eagerly and each LLM
  # connector fails startup on an empty apiKey — so declaring all three would mean
  # two guaranteed failures. Substitution rewrites the parsed YAML before it is
  # decoded, so a connector's *type* can come from a variable like anything else.
  - name: LLM_CONNECTOR_TYPE # llm-anthropic | llm-openai | llm-gemini | llm-openrouter
    required: true
  - name: LLM_API_KEY
    required: true
  - name: LLM_MODEL
    required: true

  # Where the orchestrator lives. Required *and* bound at deploy time: the
  # orchestrator injects ORCHESTRATOR_URL into every pod, but the deploy-time check
  # for required variables looks only at bindings and .env resources, so an unbound
  # declaration is refused before the pod is ever created.
  - name: ORCHESTRATOR_URL
    required: true

  # Where stored logs and traces are queried. Deliberately NOT required, and it has
  # no counterpart binding: LOGS_URL is orchestrator-managed, injected only into a
  # deployment granted the observability API, and the deploy-time check for required
  # variables reads bindings and .env resources only — so declaring it required would
  # refuse every deploy, including the ones that were granted it.
  #
  # The default is a sentinel, and it is load-bearing twice over.
  #
  # It exists at all because connectors start eagerly and http-client refuses an
  # empty baseURL, which would crash-loop the whole agent on an install that never
  # granted him the API. And every logs tool below compares against it before doing
  # anything, so "not granted" is answered from a CEL check rather than from a failed
  # request — no waiting on a connection, and an explanation instead of a transport
  # error the model has to interpret.
  #
  # The host is under .invalid, reserved by RFC 2606 to never resolve, so the
  # sentinel is also a safe address: anything that ever slipped past the checks
  # fails to connect rather than reaching something real.
  - name: LOGS_URL
    default: http://observability-not-granted.invalid

  # How long a conversation runs before it is compacted. Half a million rather than
  # a million: this is what the model is billed to re-read on every turn of a long
  # thread, and the compaction is a summary, so the tail of the conversation stays
  # verbatim either way.
  - name: AGENT_MEMORY_TOKENS
    default: "500000"
  - name: AGENT_MAX_ITERATIONS
    default: "24"

  # Where his workspace is, and where the programs he runs live.
  #
  # These are variables and not literals, and that is load-bearing rather than
  # tidy. A `cli-run` allow list is resolved when the flow is BUILT — every entry
  # goes through the same PATH lookup the program will, and an entry that resolves
  # to nothing fails the build (buildAllowList, runtime/core/internal/engine/cli.go).
  # So a literal /opt/octo/bin/dolphin here would make this whole app fail to load
  # anywhere that path does not exist: on a laptop, in the dolphin suite beside this
  # file, and on any install without the agentic runner. Wrapping the blocks in an
  # `if` would not help — the builder builds both branches.
  #
  # The defaults are the agentic runner's layout, which is the only image the
  # installer deploys him on. Everywhere else, override them; see the header above.
  - name: AGENT_WORKSPACE
    default: /workspace
  # The STANDALONE octo, deliberately not the /usr/local/bin/octo that is this pod's
  # own entrypoint. That one is the k8s build and exits without a runtime-services
  # module, so it cannot run a flow on its own.
  - name: AGENT_OCTO_BIN
    default: /opt/octo/bin/octo
  - name: AGENT_DOLPHIN_BIN
    default: /opt/octo/bin/dolphin
  - name: AGENT_CURL_BIN
    default: /usr/bin/curl
  - name: AGENT_FIND_BIN
    default: /usr/bin/find
  - name: AGENT_JQ_BIN
    default: /usr/bin/jq

  # How long any one command may run. A command holds a flow worker while it runs,
  # so cli-run has no unbounded option at all — which is why `octo run` is not
  # something this agent does: he invokes a flow once and runs a suite, both of
  # which end. Longer than cli-run's own 30s default because a cold `octo invoke`
  # starts every connector the definition declares before it runs anything.
  - name: AGENT_CLI_TIMEOUT
    default: 120s
  # curl's own --max-time, in seconds. Comfortably inside AGENT_CLI_TIMEOUT so a
  # slow endpoint is reported by curl, with a status line, rather than killed by the
  # block with nothing to show for it.
  - name: AGENT_HTTP_MAX_TIME
    default: "20"

  - name: HTTP_HOST
    default: 0.0.0.0
  # Declaring HTTP_PORT with a numeric default is what makes this deployment
  # networked, which is what earns it a stable internal address for the platform to
  # proxy the chat panel to.
  - name: HTTP_PORT
    default: "8080"

resources:
  templates:
    - resource: skills/flow-file.md
      as: flow-file
    - resource: skills/blocks.md
      as: blocks
    - resource: skills/connectors.md
      as: connectors
    - resource: skills/expressions.md
      as: expressions
    - resource: skills/testing.md
      as: testing
    - resource: skills/platform.md
      as: platform

connectors:
  - name: llm
    type: ${LLM_CONNECTOR_TYPE}
    settings:
      apiKey: ${LLM_API_KEY}
      model: ${LLM_MODEL}
      maxTokens: 8192

  - name: api
    type: http
    settings:
      host: ${HTTP_HOST}
      port: ${HTTP_PORT}

  # The orchestrator's own API. baseURL is the security boundary for every tool
  # below: rest-dynamic can build any path under it and no path at all outside it.
  - name: octo
    type: http-client
    settings:
      baseURL: ${ORCHESTRATOR_URL}
      timeout: 60s

  # The log aggregator's query API — stored logs and traces, for every deployment on
  # the install. A second boundary, restrictable independently of the one above, and
  # read-only in a way that one is not: every route it serves is a GET.
  - name: logs
    type: http-client
    settings:
      baseURL: ${LOGS_URL}
      # Shorter than the orchestrator's. A query that has to reach an address this
      # deployment was never granted should come back while someone is still reading
      # the answer, not sixty seconds later.
      timeout: 20s

  # His workspace: somewhere to draft a definition, write a test suite beside it,
  # and read back what a run produced.
  #
  # The root is a real boundary, and the only one in this file that is. Paths
  # resolve through os.OpenRoot, so containment is the kernel's answer about the
  # path actually walked rather than a string comparison — a symlink inside the
  # workspace cannot name a file outside it — and an absolute path is refused
  # outright instead of being folded back under the root. Contrast the `allow`
  # lists below, which are a guardrail and not a boundary; see run_command.
  #
  # It is scratch. The volume is an emptyDir that dies with the pod, so anything
  # worth keeping goes back through octo_api, and what he remembers about a person
  # is already the KV store.
  - name: workspace
    type: file
    settings:
      root: ${AGENT_WORKSPACE}
      createDirs: true

flows:
  - name: chat
    source:
      connector: api
      type: http
      settings:
        path: /chat
        methods: [POST]
        # How a second request ends the run this one started. The header is the
        # whole signal: the agent's stopWhen below only has to notice it is there.
        # It travels as a header rather than in the body so a stop and a follow-up
        # are the same request shape, and the panel sends one or the other.
        headers: [X-Agent-Stop]
        # On an SSE route this bounds the wait for the FIRST frame only. An agent
        # takes a moment to produce its first token.
        timeout: 60s
        sse:
          enabled: true
          finalEvent: true
          finalEventName: answer
          heartbeat: 15s
          maxDuration: 10m
    process:
      # A conversation is addressed by the caller, so the thread id alone cannot be
      # the memory key: anyone could pass someone else's and be handed their
      # transcript. The key is the user the platform authenticated, plus the thread —
      # so a stolen thread id names a conversation that does not exist. The user
      # block is injected server-side by the chat route and overwritten there, so a
      # forged one in the request never reaches this expression.
      # Who the platform authenticated, kept as a variable rather than left in the
      # body. It scopes both the conversation and the remembered facts, and the
      # model never sees it: it supplies a fact's name and value, the flow supplies
      # whose facts they are. That is what makes one user's facts unreachable from
      # another's conversation however the model is asked.
      - type: set-variable
        name: user-key
        settings:
          name: userKey
          value: >-
            has(body.user) && has(body.user.id) && body.user.id != ""
              ? body.user.id : "anonymous"

      - type: set-variable
        name: thread-id
        settings:
          name: threadId
          value: 'has(body.threadId) && body.threadId != "" ? body.threadId : "default"'

      - type: set-variable
        name: thread-key
        settings:
          name: threadKey
          value: vars.userKey + "/" + vars.threadId

      # The question, kept before the agent replaces the body with its answer. The
      # conversation record needs both halves and can only see one of them at a
      # time.
      - type: set-variable
        name: keep-question
        settings:
          name: question
          value: 'has(body.message) ? body.message : ""'

      # The agent's input, stated rather than inherited. Everything in the body
      # reaches the model, so the body is narrowed to what the model is actually for:
      # the question, where it was asked, where it could send them, and who is asking
      # by name. The email is dropped — it identifies a real person to an external
      # provider and nothing in the prompt needs it.
      #
      # The route catalogue comes from the client rather than living here on purpose:
      # the app that owns the routes is the only thing that knows them, and a list
      # baked into this file would rot the first time the platform grew a page.
      - type: set-payload
        name: agent-input
        settings:
          value: >-
            {
              "message": has(body.message) ? body.message : "",
              "page": has(body.page) ? body.page : "",
              "routes": has(body.routes) ? body.routes : [],
              "user": has(body.user) && has(body.user.name) ? {"name": body.user.name} : {}
            }

      - type: ai-agent
        name: dr-octo
        connector: llm
        stream: true
        maxIterations: ${AGENT_MAX_ITERATIONS}

        # A person reads this answer, so it is prose and not a document.
        #
        # The default is json, because an agent's answer is normally the next
        # block's body. Left at the default this agent was told to answer in JSON
        # here and in Markdown by its own prompt below, and which of the two a model
        # obeyed turned out to be the provider's choice: Anthropic wrote the
        # sentence, OpenAI and Gemini wrote {"message":"..."} — a token at a time,
        # into a panel that renders Markdown.
        answer: text

        # The question is the turn; everything else is labelled as context.
        #
        # Without this the agent's opening turn is the whole body as a JSON document
        # ("Accomplish the task for this input message body: {...}"), and a model that
        # answers without reasoning first replies in the shape it was handed: asked
        # "hello chat", one provider answered `{"message":"hello chat"}`. Claude does
        # not, which is why this was invisible until a second provider was configured.
        #
        # Nothing downstream can repair that. The reply streams to the panel a token
        # at a time, so `{"`, `message`, `":"` are already rendered by the time the
        # finished answer could be unwrapped.
        input: >-
          body.message +
          "\n\n---\nContext, not part of the question. The user is on page " +
          body.page + ". Pages you may navigate to, and who is asking:\n" +
          toJson({"routes": body.routes, "user": body.user})

        # Memory rides the deployment's KV store, which under the k8s services module
        # is the orchestrator's own — so a conversation survives a pod restart with
        # nothing written for it here.
        memoryThreadId: vars.threadKey
        contextMaxTokens: ${AGENT_MEMORY_TOKENS}
        memoryCompaction: summarize

        # What ends a run already in flight. A second request carrying the header
        # stops the first and returns nothing of its own — the answer, or the lack
        # of one, is going to whoever is reading the stream that run opened.
        #
        # This is not the same as the panel closing. A shut tab is caught by
        # ifClosed below, which only reaches a run whose stream this connection
        # holds; a stop travels by conversation, so it works from another tab, and
        # from another replica.
        stopWhen: '"X-Agent-Stop" in vars && vars["X-Agent-Stop"] != ""'

        # A type left out of this list is never *built* — no event message, no
        # sub-flow run. On a token stream that is a real lever rather than a filter,
        # which is why turn_start, tool_input and custom are absent: they arrive per
        # token or per turn and the panel reads none of them.
        #
        # `thinking` is here because leaving it out made the panel look broken. A
        # reasoning model spends most of its output on thinking — measured on the
        # first real conversation, 875 of 900 tokens — and every one of those was
        # streamed by the provider and dropped here. The panel showed nothing for
        # five seconds and then the whole answer at once, which reads as a freeze
        # rather than as a model that is working.
        # turn_end carries the exact context gauge — what the provider read plus
        # what it produced, against the budget above — so the panel can show a
        # conversation filling up rather than only the moment it overflowed. The
        # compaction pair brackets a summarize, which is a real model call and can
        # take seconds: without them a conversation losing its early turns looks
        # like a freeze. signal is a message handed to the run mid-answer, or one
        # it never got to.
        emit: [thinking, text, tool_call, tool_result, turn_end,
               compaction_start, compaction_end, signal, done, error, guardrail]
        events:
          process:
            # No configuration: the emitter copies the agent's variables onto every
            # event, and the caller's stream address is one of them. ifClosed: stop
            # ends the run when the panel closes, so a shut tab does not leave a
            # model running at full price with nobody reading it.
            - type: sse-event
              settings:
                event: agent
                ifClosed: stop

        prompt: >
          You are Dr. Octo, the agent built into this Octo platform. You are named
          after a certain bald doctor with a fondness for elaborate schemes, and you
          have his flair without his ethics: you are genuinely helpful, you never
          hold anything to ransom, and one MILLION dollars is not a running joke you
          need to make unprompted. You are also, literally, an Octo App — a flow
          definition with an ai-agent block, deployed by the orchestrator exactly
          like the integrations you help build. Mention that only if someone asks;
          it is a fact, not a personality.


          You are talking to a signed-in user of this platform. Their name arrives in
          body.user.name, and the page they are on arrives in body.page — use the page
          for context about what they mean by "this" or "here", and use their name
          sparingly and naturally. When body.user is empty, authentication is off and
          you are talking to a local developer.


          body.routes lists the pages you can send them to: each has a path and a
          description of what it shows, and a path containing a segment like {id} is a
          template you fill in. When the answer to a question is a page, take them
          there with navigate_to instead of describing how to find it — but say what
          you are showing them in the same turn, because a panel that moves the page
          without a word is unsettling. Never navigate to a path that is not built
          from that list.


          You help with the platform: reading and explaining integrations, writing
          and fixing flow definitions, investigating deployments that will not start,
          and reading logs and traces. You have full read and write access to the
          orchestrator API through octo_api, including deploying — so say what you
          are about to do before you do anything destructive, and prefer showing a
          user a definition over silently saving it.


          Work from evidence rather than memory. Call list_api_operations to see what
          the API offers, read_api_docs for the detail of one tag, then octo_api to
          make the call. Load a skill before writing a flow definition — the schema
          changes faster than any model's training data, and a flow that does not
          load is worse than an admission that you are unsure.


          Stored logs and traces are a second API, reached the same way:
          list_logs_operations, then read_logs_docs for one tag, then logs_api. Reach
          for it whenever the question is about something that already happened —
          why a deployment failed, which flows are erroring, what a run actually did,
          what it cost. Prefer it to pod logs for anything but the present moment:
          pod logs are what one pod is printing now and vanish with it, while a trace
          is the whole run, block by block, and is still there tomorrow. If those
          tools answer that the observability API was not granted, say so plainly
          rather than reporting that you found nothing — those two answers look
          identical to whoever asked, and only one of them is true.


          You have a workspace and the tools to use it, which means you can try a fix
          rather than describe one. The loop: write_workspace_file the definition and
          a _test.yaml suite beside it, run_flow_tests, read the report, fix, run them
          again — and invoke_flow when you want to see what one flow actually returns.
          Prefer proving a definition that way over asserting it is right, especially
          before you save one through octo_api. check_expression settles a CEL
          question in one call; use it instead of reasoning about an expression.


          Two things about that workspace to keep straight. It is scratch — an empty
          directory that dies with your pod — so anything worth keeping goes back
          through octo_api, and you should not promise otherwise. And a flow you
          invoke there runs standalone: in-process KV and queues, no cluster
          resources, no connectors reaching anything you have not given it. It proves
          the shape of a definition and the logic in it, never what the deployment
          would see. Say which of the two you have shown someone.


          http_fetch is for any other address — checking whether an endpoint is up,
          what a deployed integration answers, what an upstream really returns.
          Use octo_api for the orchestrator rather than fetching it: that one is
          authenticated and bounded, and this is neither.


          Commands are bounded, so a long-running thing is not available to you: run
          a flow once, run a suite, and read the result. There is no `octo run`.


          After you change an integration through the API, call refresh_platform_ui
          with its id so an editor with it open offers to reload.


          You remember people between conversations. Call recall_facts when the
          answer might depend on how someone works, and remember_fact — with both
          a short stable name and the fact itself — when they tell you something
          worth keeping — how they like flows written, which
          integration is theirs, what to call them. Remember preferences and
          context, not the contents of a conversation, and never a credential. If
          they tell you something has changed, update the fact under the same name;
          if they ask you to forget something, forget it without arguing.


          Write in Markdown — the panel renders it. Fenced code blocks with a language
          on them, tables, lists and links all display properly, so a flow definition
          belongs in a ```yaml fence and a comparison belongs in a table. Keep it
          light otherwise: no heading on a one-paragraph reply, and never wrap an
          ordinary sentence in a code fence. You are a chat panel, not a JSON API —
          answer in prose with structure where structure helps, never as a bare JSON
          object.

        guardrail: >
          If the request is not about this Octo platform, its integrations,
          deployments or the flows a user is building, take the default path.

        tools:
          - name: list_api_operations
            description: >
              List every route the orchestrator API serves — method, path, summary
              and tag. Cheap. Read this first to find the tag worth asking about.
            inputSchema: |
              { "type": "object", "properties": {} }
            process:
              - type: rest
                settings:
                  connector: octo
                  method: GET
                  path: /openapi/operations

          - name: read_api_docs
            description: >
              Read the orchestrator's OpenAPI description, narrowed to one tag (from
              list_api_operations) or one path prefix. Pass one or the other, never
              both. Without a filter this is very large; use a filter.
            inputSchema: |
              {
                "type": "object",
                "properties": {
                  "tag": { "type": "string", "description": "Keep only operations with this tag." },
                  "path": { "type": "string", "description": "Keep only routes starting with this prefix." }
                }
              }
            process:
              - type: rest
                settings:
                  connector: octo
                  method: GET
                  path: /openapi.json
                  query:
                    tag: 'has(body.tag) ? body.tag : ""'
                    path: 'has(body.path) ? body.path : ""'

          - name: octo_api
            description: >
              Call the orchestrator API. Look the route up with read_api_docs first
              rather than guessing. Returns the response body; the HTTP status is in
              vars.statusCode, and a 4xx comes back as data rather than an error, so
              read it and correct the call.
            inputSchema: |
              {
                "type": "object",
                "required": ["method", "path"],
                "properties": {
                  "method": { "type": "string", "enum": ["GET", "POST", "PUT", "PATCH", "DELETE"] },
                  "path":   { "type": "string", "description": "Path only, e.g. /integrations/abc. Never a full URL." },
                  "query":  { "type": "object", "description": "Query parameters." },
                  "payload": { "type": "object", "description": "JSON request body." }
                }
              }
            process:
              # The tool's arguments arrive as the message body, which is already the
              # shape this block reads. To restrict what Dr. Octo may do, add
              # allowMethods or pathPrefix here — this is the one place that decides
              # it, and it is editable in the integration manager like the rest of
              # the app.
              - type: rest-dynamic
                settings:
                  connector: octo
                  method: body.method
                  path: body.path
                  query: 'has(body.query) ? body.query : {}'
                  body: 'has(body.payload) ? body.payload : null'
                  failOnError: false

          # The three logs tools each open with the same guard: when LOGS_URL is
          # still the sentinel, this deployment was never granted the observability
          # API, and the honest answer is that sentence rather than a request to an
          # address that does not resolve. Answering it here also means the model is
          # told once, on whichever tool it reached for first, instead of learning it
          # from three transport errors in a row.
          # The three logs tools each open with the same guard. When LOGS_URL is still
          # the sentinel, this deployment was never granted the observability API, and
          # that sentence is the honest answer — cheaper than a request to an address
          # that does not resolve, and an explanation rather than a transport error the
          # model has to interpret. Answered per tool so whichever one he reached for
          # first tells him, instead of three failures in a row teaching him the same
          # thing.
          - name: list_logs_operations
            description: >
              List every route the observability API serves — stored logs and traces.
              Cheap. Read this first to find the tag worth asking about. A 404 here
              means the log aggregator is older than these tools and serves no
              description — report that as an out-of-date service, never as missing
              access; the tools say so explicitly when access is what is missing.
            inputSchema: |
              { "type": "object", "properties": {} }
            process:
              - type: if
                name: observability-granted
                condition: env.LOGS_URL != "http://observability-not-granted.invalid"
                then:
                  process:
                    - type: rest
                      settings:
                        connector: logs
                        method: GET
                        path: /openapi/operations
                        failOnError: false
                else:
                  process:
                    - type: set-payload
                      name: not-granted
                      settings:
                        value: '{"error": "This installation has not granted this deployment the observability API, so stored logs and traces cannot be read. Say so \u2014 it does not mean there are none."}'

          - name: read_logs_docs
            description: >
              Read the observability API's OpenAPI description, narrowed to one tag
              (from list_logs_operations) or one path prefix. Pass one or the other,
              never both. Without a filter this is large; use a filter. A 404 means
              the log aggregator is older than these tools, not that access is
              missing.
            inputSchema: |
              {
                "type": "object",
                "properties": {
                  "tag": { "type": "string", "description": "Keep only operations with this tag." },
                  "path": { "type": "string", "description": "Keep only routes starting with this prefix." }
                }
              }
            process:
              - type: if
                name: observability-granted
                condition: env.LOGS_URL != "http://observability-not-granted.invalid"
                then:
                  process:
                    - type: rest
                      settings:
                        connector: logs
                        method: GET
                        path: /openapi.json
                        failOnError: false
                        query:
                          tag: 'has(body.tag) ? body.tag : ""'
                          path: 'has(body.path) ? body.path : ""'
                else:
                  process:
                    - type: set-payload
                      name: not-granted
                      settings:
                        value: '{"error": "This installation has not granted this deployment the observability API, so stored logs and traces cannot be read. Say so \u2014 it does not mean there are none."}'

          - name: logs_api
            description: >
              Query stored logs and traces. Look the route up with read_logs_docs
              first rather than guessing. This is history — what already happened,
              across every deployment. For what a pod is printing right now, use
              octo_api instead. Returns the response body; the HTTP status is in
              vars.statusCode, and a 4xx comes back as data rather than an error, so
              read it and correct the call — a 404 is a wrong path or an aggregator
              older than these tools, and never a statement about access.
            inputSchema: |
              {
                "type": "object",
                "required": ["path"],
                "properties": {
                  "path":  { "type": "string", "description": "Path only, e.g. /traces. Never a full URL." },
                  "query": { "type": "object", "description": "Query parameters." }
                }
              }
            process:
              - type: if
                name: observability-granted
                condition: env.LOGS_URL != "http://observability-not-granted.invalid"
                then:
                  process:
                    # allowMethods is set from the start, unlike octo_api's. It costs
                    # nothing: every route this API serves is a GET, so the restriction
                    # the docs describe as opt-in is simply true here.
                    - type: rest-dynamic
                      settings:
                        connector: logs
                        method: '"GET"'
                        path: body.path
                        allowMethods: [GET]
                        query: 'has(body.query) ? body.query : {}'
                        failOnError: false
                else:
                  process:
                    - type: set-payload
                      name: not-granted
                      settings:
                        value: '{"error": "This installation has not granted this deployment the observability API, so stored logs and traces cannot be read. Say so \u2014 it does not mean there are none."}'

          # ---------------------------------------------------------------- workspace
          #
          # Everything below is the difference between an agent that can describe a
          # fix and one that can try it. He drafts a definition into his workspace,
          # invokes it, runs its suite, reads the envelope, and does it again — the
          # loop a person gets at a terminal, in the cluster where the problem is.
          #
          # The design rule they all follow: THE MODEL SUPPLIES DATA, THE FLOW
          # SUPPLIES ARGV. No string the model chose ever lands where it could be
          # read as a flag. That is what makes each one predictable; it is not what
          # makes the pod safe — see run_command for what does.

          - name: read_workspace_file
            description: >
              Read a file from your workspace. The path is relative to the workspace
              root; a path that leaves it is refused. Use this to read back something
              you wrote, or a report a command produced.
            inputSchema: |
              {
                "type": "object",
                "required": ["path"],
                "properties": {
                  "path": { "type": "string", "description": "Workspace-relative path, e.g. demo/config.yaml" }
                }
              }
            process:
              - type: file-read
                settings:
                  connector: workspace
                  path: body.path
                  resultVar: contents
              - type: set-payload
                settings:
                  value: '{"path": body.path, "content": vars.contents}'

          - name: write_workspace_file
            description: >
              Write a file into your workspace, creating parent directories as
              needed. The path is relative to the workspace root. This is where a
              definition you are drafting goes, and the test suite beside it — put a
              flow in `<dir>/config.yaml` and its suite in `<dir>/config_test.yaml`,
              which is the pairing dolphin looks for. The workspace is scratch and
              dies with the pod, so save anything worth keeping through octo_api.
            inputSchema: |
              {
                "type": "object",
                "required": ["path", "content"],
                "properties": {
                  "path":    { "type": "string", "description": "Workspace-relative path, e.g. demo/config.yaml" },
                  "content": { "type": "string", "description": "The file's full contents." }
                }
              }
            process:
              - type: file-write
                settings:
                  connector: workspace
                  path: body.path
                  content: body.content
                  resultVar: receipt
              - type: set-payload
                settings:
                  value: 'vars.receipt'

          - name: list_workspace
            description: >
              List everything in your workspace. Takes no arguments — it returns the
              whole tree, which is small.
            inputSchema: |
              { "type": "object", "properties": {} }
            process:
              # No argument, and that is the design rather than a simplification. A
              # model-chosen sub-path here would be checked lexically for ".." — a
              # weaker guarantee than the file connector's kernel-enforced root, in
              # the one tool that does not need it, since a 100Mi tree comes back
              # whole in a single cheap call. Constant argv also puts find's -exec
              # out of reach by construction rather than by an allow list.
              - type: cli-run
                name: find-workspace
                program: env.AGENT_FIND_BIN
                args: '[".", "-maxdepth", "4", "-not", "-path", "*/.*"]'
                allow: ["${AGENT_FIND_BIN}"]
                env: [PATH]
                workDir: ${AGENT_WORKSPACE}
                timeout: ${AGENT_CLI_TIMEOUT}
                onExit: continue

          - name: invoke_flow
            description: >
              Run one flow from a definition in your workspace, once, and return what
              it produced. `dir` is a single workspace directory name holding the
              .yaml files; `flow` is the flow's name; `data` is the request body.

              The answer is an outcome envelope — {"result":…} if the flow completed,
              {"dropped":true} if a filter dropped the message, {"error":"…"} if it
              failed. A flow that fails is an answer, not a failure of this tool.

              Sources are NOT started, so nothing populates the message for you: pass
              in the body a source would have. And it runs under the STANDALONE
              services provider — in-process KV and queues, no cluster resources — so
              an object-read that is empty here says nothing about the deployment.
            inputSchema: |
              {
                "type": "object",
                "required": ["dir", "flow"],
                "properties": {
                  "dir":  { "type": "string", "description": "Workspace directory holding the definition, e.g. demo. No slashes." },
                  "flow": { "type": "string", "description": "Name of the flow to invoke." },
                  "data": { "type": "object", "description": "JSON request body for the flow." }
                }
              }
            process:
              - type: if
                name: safe-dir
                condition: >-
                  body.dir.matches("^[A-Za-z0-9.][A-Za-z0-9._-]{0,63}$")
                    && !body.dir.contains("..")
                then:
                  process:
                    - type: cli-run
                      name: octo-invoke
                      program: env.AGENT_OCTO_BIN
                      # --envelope is the whole reason this is usable by a model: a
                      # plain invoke says "completed", "dropped" and "failed" three
                      # different ways — a body, nothing at all, and a log line — and
                      # only the first is on stdout. --envelope says all three in one
                      # JSON object and exits 0 for a flow that failed.
                      args: >-
                        ["invoke", "--config", body.dir, "--flow", body.flow, "--envelope",
                         "--data", toJson(has(body.data) ? body.data : {})]
                      allow: ["${AGENT_OCTO_BIN}"]
                      env: [PATH, HOME]
                      workDir: ${AGENT_WORKSPACE}
                      timeout: ${AGENT_CLI_TIMEOUT}
                      onExit: continue
                else:
                  process:
                    - type: set-payload
                      name: bad-dir
                      settings:
                        value: >-
                          {"error": "dir must be a single workspace directory name — no slashes, no
                          '..'. Write the definition into a directory first, then pass its name."}

          - name: run_flow_tests
            description: >
              Run the dolphin suite for the definitions in a workspace directory.
              dolphin pairs each `x.yaml` with the `x_test.yaml` beside it, so write
              both and pass the directory.

              Exit 0 means every case passed. Exit 1 means the FLOWS are wrong — that
              is the answer you asked for, so read the report and fix the definition.
              Exit 2 means the suite or the runner is wrong, which is a different
              problem: a malformed _test.yaml, or a binary that will not run.
            inputSchema: |
              {
                "type": "object",
                "required": ["dir"],
                "properties": {
                  "dir": { "type": "string", "description": "Workspace directory holding the definitions and their suites. No slashes." }
                }
              }
            process:
              - type: if
                name: safe-dir
                condition: >-
                  body.dir.matches("^[A-Za-z0-9.][A-Za-z0-9._-]{0,63}$")
                    && !body.dir.contains("..")
                then:
                  process:
                    - type: cli-run
                      name: dolphin-test
                      program: env.AGENT_DOLPHIN_BIN
                      args: '["test", body.dir]'
                      allow: ["${AGENT_DOLPHIN_BIN}"]
                      # OCTO_PATH is what makes dolphin drive the standalone octo
                      # rather than this pod's own k8s entrypoint, which exits without
                      # a runtime-services module. The image sets the variable; this
                      # list is what lets it through, because cli-run hands a child
                      # only the variables named here. Both halves are required and
                      # neither is sufficient — drop it and every suite exits 2.
                      env: [PATH, HOME, OCTO_PATH]
                      workDir: ${AGENT_WORKSPACE}
                      timeout: ${AGENT_CLI_TIMEOUT}
                      onExit: continue
                    # The exit code in words, because 0/1/2 mean three different things
                    # here and only one of them is "something went wrong". Left as a
                    # bare number, a model reads any non-zero as a broken tool and
                    # apologises instead of fixing the flow it was asked to fix.
                    - type: set-payload
                      name: verdict
                      settings:
                        value: >-
                          {
                            "verdict": body.exitCode == 0 ? "passed"
                              : body.exitCode == 1 ? "the flows are wrong: cases failed — read the report and fix the definition"
                              : "the SUITE did not parse, so no flow ran and nothing here is about your flows. Load the testing skill and check the suite's shape against it before editing again — guessing at the schema is how this repeats.",
                            "exitCode": body.exitCode,
                            "report": body.stdout,
                            "stderr": body.stderr
                          }
                else:
                  process:
                    - type: set-payload
                      name: bad-dir
                      settings:
                        value: >-
                          {"error": "dir must be a single workspace directory name — no slashes, no '..'."}

          - name: check_expression
            description: >
              Evaluate one CEL expression against a message body and return the
              result. Use it to prove an expression before you put it in a definition
              — the expressions skill says to, and this is how.
            inputSchema: |
              {
                "type": "object",
                "required": ["expr"],
                "properties": {
                  "expr": { "type": "string", "description": "The CEL expression, e.g. body.items.size() > 0" },
                  "data": { "type": "object", "description": "The message body to evaluate it against." }
                }
              }
            process:
              - type: cli-run
                name: octo-eval
                program: env.AGENT_OCTO_BIN
                args: >-
                  ["eval", "--expr", body.expr,
                   "--data", toJson(has(body.data) ? body.data : {})]
                allow: ["${AGENT_OCTO_BIN}"]
                env: [PATH, HOME]
                workDir: ${AGENT_WORKSPACE}
                timeout: ${AGENT_CLI_TIMEOUT}
                onExit: continue

          - name: http_fetch
            description: >
              Make an HTTP request to any address this pod can reach, and return the
              response with its status. For checking whether an endpoint is up, what
              a deployed integration answers, or what an upstream actually returns.

              http:// and https:// only. To call the orchestrator's own API use
              octo_api instead — it is authenticated and bounded, and this is not.
            inputSchema: |
              {
                "type": "object",
                "required": ["url"],
                "properties": {
                  "url":     { "type": "string", "description": "Full http:// or https:// URL." },
                  "method":  { "type": "string", "enum": ["GET", "POST", "PUT", "PATCH", "DELETE", "HEAD"] },
                  "headers": { "type": "object", "description": "Request headers, as a flat name→value object." },
                  "body":    { "type": "string", "description": "Raw request body, already serialized." }
                }
              }
            process:
              # The scheme check runs before anything is spawned, and it is doing more
              # work than it looks like. curl reads file:// and would happily hand back
              # /proc/1/environ — which is this runtime's own environment, including
              # LLM_API_KEY. A value that must start with "http" also cannot start
              # with "-", so the same one assertion closes -o, -T, -K and @file: every
              # other argv element below is written by this flow, not by the model.
              - type: if
                name: http-scheme-only
                condition: 'body.url.matches("^https?://")'
                then:
                  process:
                    - type: cli-run
                      name: curl
                      program: env.AGENT_CURL_BIN
                      # --proto is belt to that brace: even a URL that satisfied the
                      # check above cannot redirect its way onto another scheme.
                      # No -L, so a redirect comes back as a 3xx for the model to
                      # follow deliberately rather than silently.
                      args: >-
                        ["-sS", "--proto", "=http,https", "--proto-redir", "=http,https",
                         "--max-time", env.AGENT_HTTP_MAX_TIME, "--max-filesize", "1048576",
                         "-w", "\n---\nHTTP %{http_code} %{content_type} %{size_download}b\n",
                         "-X", (has(body.method) && body.method != "" ? body.method : "GET")]
                        + (has(body.headers) ? body.headers.map(k, ["-H", k + ": " + body.headers[k]]).flatten() : [])
                        + (has(body.body) && body.body != "" ? ["--data-raw", body.body] : [])
                        + [body.url]
                      allow: ["${AGENT_CURL_BIN}"]
                      # PATH and no HOME, deliberately: curl reads $HOME/.curlrc, and
                      # with HOME unset there is no file for it to read.
                      env: [PATH]
                      timeout: ${AGENT_CLI_TIMEOUT}
                      onExit: continue
                else:
                  process:
                    - type: set-payload
                      name: bad-scheme
                      settings:
                        value: '{"error": "url must start with http:// or https://."}'

          - name: run_command
            description: >
              Run one of your own programs directly, when the tools above do not fit
              the shape of what you need — a flag they do not expose, or a
              subcommand they do not wrap. Programs available: octo, dolphin, curl,
              find and jq. Arguments are passed as argv, so there is no shell: a
              pipe or a semicolon is a literal character, not an operator.
            inputSchema: |
              {
                "type": "object",
                "required": ["program"],
                "properties": {
                  "program": { "type": "string", "enum": ["octo", "dolphin", "curl", "find", "jq"] },
                  "args":    { "type": "array", "items": { "type": "string" }, "description": "Arguments, as argv." },
                  "stdin":   { "type": "string", "description": "Written to the process's standard input." }
                }
              }
            process:
              # BE HONEST ABOUT WHAT THIS LIST IS. It is a guardrail, not a boundary.
              # `octo` is on it, and `octo invoke` runs whatever definition it is
              # pointed at — including one written into the workspace a moment
              # earlier, with a `cli-run` block carrying no allow list at all. So
              # anything reachable from this pod is reachable from this tool, and the
              # list buys predictability and a readable trace rather than containment.
              #
              # The boundary is the POD. What it holds is its own environment and
              # nothing else's, and it carries only the runtime ServiceAccount. That
              # is why the agentic runner is an operator's per-deployment choice and
              # why it must not be granted to an integration whose definition came
              # from somewhere untrusted.
              #
              # allowInterpreters stays false. Not because it would widen what he can
              # reach — it would not, given the above — but because an interpreter on
              # the list makes every trace unreadable: "sh -c ..." says nothing about
              # what ran.
              - type: cli-run
                name: run-program
                program: >-
                  body.program == "octo" ? env.AGENT_OCTO_BIN
                    : body.program == "dolphin" ? env.AGENT_DOLPHIN_BIN
                    : body.program == "curl" ? env.AGENT_CURL_BIN
                    : body.program == "find" ? env.AGENT_FIND_BIN
                    : env.AGENT_JQ_BIN
                args: 'has(body.args) ? body.args : []'
                stdin: 'has(body.stdin) ? body.stdin : ""'
                allow:
                  - ${AGENT_OCTO_BIN}
                  - ${AGENT_DOLPHIN_BIN}
                  - ${AGENT_CURL_BIN}
                  - ${AGENT_FIND_BIN}
                  - ${AGENT_JQ_BIN}
                env: [PATH, HOME, OCTO_PATH]
                workDir: ${AGENT_WORKSPACE}
                timeout: ${AGENT_CLI_TIMEOUT}
                onExit: continue

          - name: refresh_platform_ui
            description: >
              Tell the platform an integration changed, so an editor with it open
              offers to reload. Call this after writing an integration through
              octo_api. Fire-and-forget.
            inputSchema: |
              {
                "type": "object",
                "required": ["id", "name"],
                "properties": {
                  "id":   { "type": "string", "description": "The integration's id." },
                  "name": { "type": "string", "description": "The integration's name." }
                }
              }
            process:
              # The system: prefix publishes to the platform's own subject instead of
              # this deployment's, so no HTTP hop is needed — the pod already holds
              # the broker connection.
              - type: publish-event
                settings:
                  subject: '"system:internal.integrations.events"'
                  value: '{"type": "integration.updated", "id": body.id, "name": body.name}'
              - type: set-payload
                settings:
                  value: '{"published": true}'

          - name: navigate_to
            description: >
              Take the user to a page in the platform. Use a path from body.routes,
              filling in any {id} segment. Navigation is a courtesy and not an
              answer — say what you are showing them and why in the same turn.
            inputSchema: |
              {
                "type": "object",
                "required": ["path", "reason"],
                "properties": {
                  "path":   { "type": "string", "description": "A path within the platform, e.g. /platform/i/abc. Never a full URL." },
                  "reason": { "type": "string", "description": "One short line for the user saying why you are taking them there." }
                }
              }
            process:
              # A tool's process chain runs on the agent's own message, and an SSE
              # route stamps the caller's stream address into a variable on it — so
              # this reaches the open panel with nothing configured, exactly as the
              # events path above does.
              #
              # ifClosed: ignore, unlike the events path. A closed panel means nobody
              # is being navigated, which is not a reason to end the run mid-tool: the
              # stop flag rides in the message variables and this chain shares the
              # agent's message, so a stop here would follow the agent out of the tool
              # call. The events path stops the run at the next token anyway.
              #
              # The path is NOT validated here. This app is meant to be edited, so a
              # guard in this file is advice rather than a boundary — the panel is
              # what performs the navigation and is where a path that is not a
              # relative path within the platform has to be refused.
              - type: sse-event
                settings:
                  event: navigate
                  ifClosed: ignore
                  data: >-
                    {
                      "path": has(body.path) ? body.path : "",
                      "reason": has(body.reason) ? body.reason : ""
                    }
              - type: set-payload
                settings:
                  value: '{"navigated": true}'

          # ---------------------------------------------------------------- facts
          #
          # What Dr. Octo remembers about a person between conversations: how they
          # like flows written, which integration is theirs, that they prefer the
          # short answer. Memory holds a *conversation*; this holds what outlives
          # one.
          #
          # All three keep every fact for a user in a single object at
          # facts/{userKey}. One key per fact would have been the obvious shape and
          # is the wrong one here: core.KV has get, set and delete but no list, so
          # enumerating them would mean an HTTP call to the objects route and the
          # deployment's own id. A list in one value needs neither, and CEL can
          # filter and append it without any of that.
          #
          # The key is built from vars.userKey, which the model cannot see or set.
          # It names a fact; the flow decides whose.

          - name: recall_facts
            description: >
              Everything you have been told to remember about this user. Read it
              early when the answer might depend on how they work — do not ask them
              to repeat something you were already told.
            inputSchema: |
              { "type": "object", "properties": {} }
            process:
              - type: object-read
                settings:
                  key: '"facts/" + vars.userKey'
                  as: userFacts
                  default: '{"items": []}'
              - type: set-payload
                settings:
                  value: '{"facts": vars.userFacts.items}'

          - name: remember_fact
            description: >
              Remember something about this user for later conversations. Use a
              short stable name so the same fact can be updated rather than
              duplicated — "preferred-model", "main-integration". Remember what
              they tell you about themselves and how they work, not the contents of
              this conversation, and not anything secret.
            inputSchema: |
              {
                "type": "object",
                "required": ["name", "value"],
                "properties": {
                  "name":  { "type": "string", "description": "Short stable identifier for the fact." },
                  "value": { "type": "string", "description": "The fact, in a sentence." }
                }
              }
            process:
              - type: object-read
                settings:
                  key: '"facts/" + vars.userKey'
                  as: userFacts
                  default: '{"items": []}'
              # Filter-then-append is what makes this an upsert: remembering a name
              # that is already known replaces it rather than leaving the model to
              # read two versions of the same fact and pick one.
              - type: set-variable
                name: merge-facts
                settings:
                  name: mergedFacts
                  value: >-
                    vars.userFacts.items.filter(f, f.name != body.name)
                    + [{"name": body.name, "value": body.value}]

              # Capped, oldest first. Nothing else bounds this list — the model
              # decides what is worth keeping — and an unbounded value is read back
              # into every recall_facts and eventually into a row that will not
              # write. 200 is far more than anyone accumulates honestly and far
              # less than a problem.
              #
              # Read and write are separate blocks, so two conversations
              # remembering at the same moment can lose one of the two facts.
              # Accepted rather than solved: object-write retries on a version
              # conflict but cannot see a read taken in another block, and the
              # alternative — a key per fact — needs a list API the KV store does
              # not have. The cost is one forgotten preference, and the user can
              # say it again.
              - type: object-write
                settings:
                  key: '"facts/" + vars.userKey'
                  value: >-
                    {"items": size(vars.mergedFacts) > 200
                      ? vars.mergedFacts.slice(size(vars.mergedFacts) - 200, size(vars.mergedFacts))
                      : vars.mergedFacts}

              - type: set-payload
                settings:
                  value: '{"remembered": body.name}'

          - name: forget_fact
            description: >
              Forget a fact by name. Use this when the user says something is no
              longer true, and when they ask you to forget something.
            inputSchema: |
              {
                "type": "object",
                "required": ["name"],
                "properties": {
                  "name": { "type": "string", "description": "The fact's name, as given to remember_fact." }
                }
              }
            process:
              - type: object-read
                settings:
                  key: '"facts/" + vars.userKey'
                  as: userFacts
                  default: '{"items": []}'
              - type: object-write
                settings:
                  key: '"facts/" + vars.userKey'
                  value: '{"items": vars.userFacts.items.filter(f, f.name != body.name)}'
              - type: set-payload
                settings:
                  value: '{"forgotten": body.name}'

        skills:
          - name: flow-file
            description: >
              The shape of a flow definition: service, env, resources, connectors,
              flows, sources and process chains. Load before writing or editing one.
            resource: flow-file
          - name: blocks
            description: >
              The blocks a process chain can contain — control flow, data, storage,
              AI and integration — and what each is for.
            resource: blocks
          - name: connectors
            description: >
              The connectors available (HTTP, database, queue, cron, LLM, and the
              rest) and the settings each takes.
            resource: connectors
          - name: expressions
            description: >
              CEL as octo uses it: the message activation, the octo extension
              functions, and where expressions are allowed.
            resource: expressions
          - name: testing
            description: >
              Writing dolphin test suites for a flow: cases, inputs, mocks and spies.
            resource: testing
          - name: platform
            description: >
              How the platform runs an integration: version tags, deployments,
              resources, cluster secrets, and what a failing deployment looks like.
            resource: platform

        default:
          process:
            - type: set-payload
              settings:
                value: >-
                  {"answer": "That one is outside my remit. I am Dr. Octo — I run
                  this Octo platform, and my schemes extend to integrations,
                  deployments and the flows you are building. Ask me about those."}

      # ------------------------------------------------------------ the record
      #
      # A wire-tap. The exchange goes onto a queue and this flow returns; the
      # conversation record is written by the flow below, on a worker nobody is
      # waiting on. That separation is the point: naming a conversation takes a
      # model call, and a person watching their answer finish should not be
      # watching it be filed as well.
      #
      # It is a record and not the agent's memory. Memory is compacted — summarize
      # replaces the early turns with a summary of them — so what the engine stores
      # is the model's working set, not the conversation a person had. Only one of
      # those can be read back to them.
      #
      # fork gives the branch its own clone, so the payload it builds for the queue
      # never reaches the body this flow returns — which is the answer, and which
      # the SSE route sends as its closing frame. handle-errors keeps a broker that
      # is having a bad day from failing a chat that already succeeded: the answer
      # has streamed by the time this runs, and an error here would put a failure
      # on the stream after it.
      - type: handle-errors
        name: record-exchange
        process:
          - type: fork
            name: tap
            branches:
              - name: record
                process:
                  # The answer is usually the prose `answer: text` asked for, and
                  # is not always: the agent decodes a final answer that happens to
                  # parse as JSON whatever the format setting says, so an answer of
                  # "42", or one the model fenced, arrives here as a number or a
                  # map. Rendering it back is what keeps a record of it either way —
                  # string() would simply fail on the second kind, and the whole
                  # exchange would go unrecorded.
                  - type: set-payload
                    name: build-record
                    settings:
                      value: >-
                        {"userKey": vars.userKey, "threadId": vars.threadId,
                         "question": vars.question,
                         "answer": type(body) == string ? body : toJson(body)}
                  - type: queue-dispatch
                    name: send-record
                    settings:
                      subject: '"conversation-log"'
        error:
          - type: log
            name: record-failed
            settings:
              level: warn
              message: '"could not record the conversation: " + vars.error.message'

  # ============================================================ the record ====
  #
  # What a person can come back to. Two objects per user, and neither is the
  # agent's memory:
  #
  #   agent-chat/{userKey}/{threadId}   the conversation as it was had
  #   agent-threads/{userKey}           one row per conversation, for the list
  #
  # The index exists because core.KV has get, set and delete but no list — the
  # same reason facts live in one object — and because a listing could not carry
  # a title even if it did. Its rows are what the panel renders before anyone
  # opens anything.
  #
  # Both keys are built from the userKey the chat route authenticated, so a
  # guessed thread id names a conversation that does not exist. The queue message
  # carries that key rather than re-deriving it, and nothing outside this
  # deployment can put a message on the subject.
  - name: record-conversation
    source:
      type: queue                        # implicit connector — no instance needed
      settings:
        subject: conversation-log
        # One listener, deliberately. Reading the record and writing it back are
        # separate blocks, so two exchanges of one conversation handled at the same
        # moment would both read the same turns and the later write would win — the
        # same read-modify-write the facts tools carry and for the same reason.
        # Serialising this replica's recording closes it here; a second replica
        # could still race one, and the cost is a lost turn in a transcript rather
        # than a lost answer.
        #
        # It costs nothing worth having. There is one record write per exchange and
        # nobody is waiting on it, so the only thing a second listener would buy is
        # the chance to lose a turn.
        listeners: 1
    process:
      # The body is about to be replaced by the title call, so what the keys are
      # built from is taken out of it first.
      - type: set-variable
        name: hold-user
        settings:
          name: userKey
          value: body.userKey
      - type: set-variable
        name: hold-thread
        settings:
          name: threadId
          value: body.threadId
      - type: set-variable
        name: hold-exchange
        settings:
          name: exchange
          value: '{"question": body.question, "answer": body.answer}'

      - type: object-read
        name: read-record
        settings:
          key: '"agent-chat/" + vars.userKey + "/" + vars.threadId'
          as: record
          # Whether the object was there is what "this conversation is new" means,
          # and it is the only thing that decides whether a model is asked for a
          # title. Everything after the first exchange keeps the one it has.
          existsVar: recordExists
          default: '{"title": "", "turns": []}'

      - type: set-variable
        name: append-turns
        settings:
          name: turns
          value: >-
            vars.record.turns
              + [{"role": "user", "text": vars.exchange.question},
                 {"role": "agent", "text": vars.exchange.answer}]

      # Capped oldest-first, like facts and for the same reason: nothing else
      # bounds this, it is read back in full on every exchange, and a value that
      # grows without limit eventually will not write. Two hundred turns is a very
      # long conversation and a very small object.
      - type: set-variable
        name: cap-turns
        settings:
          name: turns
          value: >-
            size(vars.turns) > 200
              ? vars.turns.slice(size(vars.turns) - 200, size(vars.turns))
              : vars.turns

      - type: if
        name: name-it
        condition: '!vars.recordExists'
        then:
          process:
            # A name a person recognises in a list, which is worth one small model
            # call at the start of a conversation and nothing thereafter. It runs
            # here rather than in the chat flow precisely because it is a model
            # call: nobody is waiting on this worker.
            #
            # And it is the one thing here that can fail on its own — a provider
            # having a bad minute, a model that answers something the schema
            # refuses. The name is the nice half of this flow and the record is the
            # point, so a failure falls back to the question itself rather than
            # taking the exchange down with it. A conversation named after what was
            # asked is a worse name, not a worse record.
            - type: handle-errors
              name: name-or-fall-back
              process:
                - type: set-payload
                  name: title-input
                  settings:
                    value: '{"question": vars.exchange.question, "answer": vars.exchange.answer}'
                - type: ai-mapping
                  name: write-title
                  settings:
                    connector: llm
                    prompt: >
                      Name this conversation the way a person would name it in a list
                      of their past conversations. Five words at most, no quotes, no
                      trailing period, no "conversation about". Describe what was
                      asked, not what was answered. Use the question's own language.
                    outputExample: '{"title": "Deploying the orders integration"}'
                    outputSchema: |
                      {"type": "object", "required": ["title"],
                       "properties": {"title": {"type": "string", "maxLength": 80}}}
                    maxTokens: 100
                - type: set-variable
                  settings:
                    name: title
                    value: body.title
              error:
                - type: log
                  name: title-failed
                  settings:
                    level: warn
                    message: '"could not name a conversation: " + vars.error.message'
                - type: set-variable
                  settings:
                    name: title
                    value: >-
                      size(vars.exchange.question) > 60
                        ? vars.exchange.question.substring(0, 60) + "…"
                        : vars.exchange.question
        else:
          process:
            - type: set-variable
              settings:
                name: title
                value: vars.record.title

      - type: object-write
        name: write-record
        settings:
          key: '"agent-chat/" + vars.userKey + "/" + vars.threadId'
          value: '{"title": vars.title, "turns": vars.turns}'

      # The index carries the moment as well as the name. The object store records
      # when a value was last written, but only the route that lists every key in
      # the namespace can read it, and that route cannot return a title — so the
      # row that has the title carries the timestamp too.
      - type: object-read
        name: read-index
        settings:
          key: '"agent-threads/" + vars.userKey'
          as: index
          default: '{"items": []}'
      # Filter-then-append is what makes this an upsert: a conversation already in
      # the list moves to the end with a fresh timestamp rather than appearing
      # twice.
      - type: set-variable
        name: merge-index
        settings:
          name: rows
          value: >-
            vars.index.items.filter(i, i.id != vars.threadId)
              + [{"id": vars.threadId, "title": vars.title, "updatedAt": string(now)}]
      - type: object-write
        name: write-index
        settings:
          key: '"agent-threads/" + vars.userKey'
          value: >-
            {"items": size(vars.rows) > 200
              ? vars.rows.slice(size(vars.rows) - 200, size(vars.rows))
              : vars.rows}

  # A user's past conversations, most recently written last — the panel sorts. The
  # user block is written server-side by the chat route, exactly as it is for /chat,
  # so this reads one person's list and cannot be asked for anyone else's.
  - name: list-conversations
    source:
      connector: api
      type: http
      settings:
        path: /conversations
        methods: [POST]
        timeout: 10s
    process:
      - type: set-variable
        name: user-key
        settings:
          name: userKey
          value: >-
            has(body.user) && has(body.user.id) && body.user.id != ""
              ? body.user.id : "anonymous"
      - type: object-read
        name: read-index
        settings:
          key: '"agent-threads/" + vars.userKey'
          as: index
          default: '{"items": []}'
      - type: set-payload
        settings:
          value: '{"items": vars.index.items}'

  # One past conversation, as it was had. Not the agent's memory: that is
  # compacted, so its early turns have been replaced by a summary of them.
  - name: read-conversation
    source:
      connector: api
      type: http
      settings:
        path: /conversations/{threadId}
        methods: [POST]
        timeout: 10s
    process:
      - type: set-variable
        name: user-key
        settings:
          name: userKey
          value: >-
            has(body.user) && has(body.user.id) && body.user.id != ""
              ? body.user.id : "anonymous"
      - type: object-read
        name: read-record
        settings:
          key: '"agent-chat/" + vars.userKey + "/" + vars.threadId'
          as: record
          default: '{"title": "", "turns": []}'
      - type: set-payload
        settings:
          value: '{"threadId": vars.threadId, "title": vars.record.title, "turns": vars.record.turns}'
