# Baked into the code signature and the app's identity to macOS and to the updater:
# changing it after a release makes every existing install look like a different app.
appId: dev.octopaas.octo
productName: Octo
copyright: © Juan Cavallotti

directories:
  output: dist/release
  buildResources: build

# Only the esbuild bundle: this app declares no runtime dependencies, so there is no
# production dependency tree to resolve.
files:
  - dist/main/**
  - dist/preload/**
  - package.json

asar: true

# Version-free, so a published link keeps working across releases: gives
# Octo_mac_arm64.dmg / Octo_mac_x64.dmg.
artifactName: ${productName}_${os}_${arch}.${ext}

# The Next standalone server is copied in by build/after-pack.cjs rather than listed
# here: extraResources excludes node_modules and no filter re-includes it. It stays
# outside the asar archive either way — the server resolves require() and readFile
# paths at runtime, which asar's fs shim only mostly covers.
afterPack: build/after-pack.cjs

extraResources:
  # Per-architecture Go binaries, under electron-builder's spelling of ${arch}
  # (arm64 or x64) rather than GOARCH's.
  - from: build/bin/${arch}
    to: bin

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    # electron-updater needs the zip; the dmg alone cannot deliver an update.
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Mach-O executables the notary service will find in Resources/bin: unsigned,
  # they fail notarization.
  binaries:
    - Contents/Resources/bin/octo
    - Contents/Resources/bin/dolphin

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

publish:
  provider: github
  owner: juancavallotti
  repo: octo
