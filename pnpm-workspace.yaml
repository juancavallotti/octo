packages:
  - "apps/*"
  - "packages/*"

# pnpm 10 does not run dependency install scripts unless they are named here.
# Electron's postinstall is the one that downloads the actual Electron binary for
# this platform, so apps/desktop cannot start without it. Deliberately the only
# entry: electron-winstaller also wants a script, and it is only needed to build
# Windows installers, which we do not yet do. node-pty's is left out too: it only
# checks for the prebuilds the package already ships, and falls back to node-gyp.
onlyBuiltDependencies:
  - electron

# mcp-handler 1.x pins its MCP SDK peer to exactly 1.26.0, which carries open
# security advisories. 1.32.2 is API-compatible with what it uses; the allowance
# goes away with the move to mcp-handler 2 and SDK v2.
peerDependencyRules:
  allowedVersions:
    mcp-handler>@modelcontextprotocol/sdk: 1.32.2
