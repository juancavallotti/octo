version: v2beta1
name: octo

# Local dev for the Octo stack on the k3d (k3s) cluster created by `task cluster:dev`.
#
# Deployment goes through the same Helm chart every other target uses, with
# helm/values-k3d.yaml supplying the local shape (no registry, :dev images,
# NodePorts instead of an Ingress). Local dev previously applied a parallel set
# of raw manifests under deploy/k8s/, which duplicated the chart and drifted
# from it; the chart is now the single definition.
#
# Image building is intentionally NOT done by DevSpace: with k3d, DevSpace's
# local-registry push (localhost:5000) is unreliable. Instead `task cluster:dev`
# builds the images with Docker and loads them into the cluster with `k3d image
# import` (see the cluster:images task). values-k3d.yaml references those fixed
# :dev tags with imagePullPolicy: IfNotPresent, so DevSpace only has to install
# the chart.

deployments:
  octo:
    helm:
      # Release name "octo" matters: octo-common.fullname collapses the release
      # and chart name when one contains the other, so resources are named
      # octo-platform / octo-orchestrator rather than octo-octo-platform. The
      # dev selectors and the Taskfile's rollout restart both rely on that.
      releaseName: octo
      # Explicit, and it must match: `task cluster:deploy` passes
      # --namespace octo-dev and every dev selector below is scoped to it, so a
      # release landing in `default` would leave those selectors matching nothing.
      namespace: octo-dev
      chart:
        name: ./helm
      valuesFiles:
        - ./helm/values-k3d.yaml

# `devspace dev` mode (task cluster:dev): swaps the editor/orchestrator/logs pods
# for their dev images, live-syncs source for hot reload, and tails all three
# pods' logs to the terminal. No port forwards here — the k3d loadbalancer
# already exposes the apps on localhost:3000 / :8090 (deploy/k3d/cluster.yaml),
# and the replacement pods keep their chart labels so the NodePort services
# still route to them.
dev:
  platform:
    labelSelector:
      app.kubernetes.io/name: octo
      app.kubernetes.io/instance: octo
      app.kubernetes.io/component: platform
    namespace: octo-dev
    # Hot-reload image (next dev). Build+import with `task cluster:images:dev`.
    devImage: octo-platform-dev:dev
    command: ["pnpm", "run", "dev"]
    workingDir: /app/apps/platform
    sync:
      - path: ./apps/platform:/app/apps/platform
        # These live only in the container, not the local tree; excluding them
        # keeps DevSpace's initial mirror from deleting them. (The octo runtime
        # lives at /usr/local/bin/octo, outside /app, so it's never synced; pnpm
        # hoists deps to /app/node_modules, also outside the synced path.)
        excludePaths:
          - node_modules/
          - .next/
          - .octo-run/
          - .git/
    # Stream this pod's logs to the terminal.
    logs: {}
  orchestrator:
    labelSelector:
      app.kubernetes.io/name: octo
      app.kubernetes.io/instance: octo
      app.kubernetes.io/component: orchestrator
    namespace: octo-dev
    devImage: octo-orchestrator-dev:dev
    command: ["go", "run", "."]
    workingDir: /src
    sync:
      - path: ./orchestrator:/src
        excludePaths:
          - .git/
          - orchestrator
        # Restart the container after each upload so `go run` recompiles.
        onUpload:
          restartContainer: true
    logs: {}
  logs:
    labelSelector:
      app.kubernetes.io/name: octo
      app.kubernetes.io/instance: octo
      app.kubernetes.io/component: logs
    namespace: octo-dev
    devImage: octo-logs-dev:dev
    command: ["go", "run", "."]
    workingDir: /src
    sync:
      - path: ./logs:/src
        excludePaths:
          - .git/
          - logs
        # Restart the container after each upload so `go run` recompiles.
        onUpload:
          restartContainer: true
    logs: {}
  # Postgres is not hot-reloaded; this entry only forwards its logs to the terminal.
  postgres:
    labelSelector:
      app.kubernetes.io/name: octo
      app.kubernetes.io/instance: octo
      app.kubernetes.io/component: postgres
    namespace: octo-dev
    logs: {}
  # NATS is not hot-reloaded; this entry only forwards its logs to the terminal.
  nats:
    labelSelector:
      app.kubernetes.io/name: octo
      app.kubernetes.io/instance: octo
      app.kubernetes.io/component: nats
    namespace: octo-dev
    logs: {}
