version: v2beta1
name: octo

# Local dev for the Octo stack on the k3d (k3s) cluster created by `task cluster:dev`.
#
# Deployment goes through the same Helm chart every other target uses, with
# helm/values-k3d.yaml supplying the local shape (no registry, :dev images,
# NodePorts instead of an Ingress). Local dev previously applied a parallel set
# of raw manifests under deploy/k8s/, which duplicated the chart and drifted
# from it; the chart is now the single definition.
#
# Image building is intentionally NOT done by DevSpace: with k3d, DevSpace's
# local-registry push (localhost:5000) is unreliable. Instead `task cluster:dev`
# builds the images with Docker and loads them into the cluster with `k3d image
# import` (see the cluster:images task). values-k3d.yaml references those fixed
# :dev tags with imagePullPolicy: IfNotPresent, so DevSpace only has to install
# the chart.

# The one local setting that cannot live in a committed values file, because it
# is a credential.
#
# Set EMBEDDINGS_API_KEY in your shell and the embedding server comes up with the
# cluster, so searching agent memory ranks by meaning. Leave it unset and there is
# no embedding server and search matches text — a supported way to run locally,
# and the default precisely because there is no sensible default for somebody
# else's API key.
#
# A devspace var rather than another values file: an optional values file that is
# gitignored is one DevSpace refuses to deploy without, and a committed one is a
# key in the repository.
vars:
  EMBEDDINGS_API_KEY:
    source: env
    default: ""
  # The provider and model travel the same way as the key, and they have to: the
  # key alone is not enough to reach anything. An OpenRouter key (sk-or-v1-…)
  # against the llm-openai default authenticates nowhere, and the failure arrives
  # as a 401 from a provider you did not choose rather than as a configuration
  # mistake. One place to set all three, or none of them is honest.
  #
  # The defaults match helm/values.yaml, so a .env that sets only the key still
  # gets a coherent OpenAI setup.
  EMBEDDINGS_CONNECTOR_TYPE:
    source: env
    default: llm-openai
  EMBEDDINGS_MODEL:
    source: env
    default: text-embedding-3-small
  EMBEDDINGS_DIMENSIONS:
    source: env
    default: "1536"
  # Derived from the key rather than set on its own, so there is one knob and no
  # way to hold it wrong — "enabled with no key" renders a chart the secret
  # template refuses, and "a key that does nothing" is worse than either.
  EMBEDDINGS_ENABLED:
    command: sh
    args: ["-c", 'test -n "$EMBEDDINGS_API_KEY" && echo true || echo false']

deployments:
  octo:
    # Explicit, and it must match: `task cluster:deploy` passes
    # --namespace octo-dev and every dev selector below is scoped to it, so a
    # release landing in `default` would leave those selectors matching nothing.
    # It belongs on the deployment, not inside helm: — DevSpace v6's HelmConfig
    # has no namespace field and rejects the config outright if it finds one.
    namespace: octo-dev
    helm:
      # Release name "octo" matters: octo-common.fullname collapses the release
      # and chart name when one contains the other, so resources are named
      # octo-platform / octo-orchestrator rather than octo-octo-platform. The
      # dev selectors and the Taskfile's rollout restart both rely on that.
      releaseName: octo
      chart:
        name: ./helm
      valuesFiles:
        - ./helm/values-k3d.yaml
      # Layered over the file above, so the key never has to be written into it.
      # An empty key leaves embeddings.enabled false and the chart renders no
      # embedding server at all.
      values:
        embeddings:
          enabled: ${EMBEDDINGS_ENABLED}
          apiKey: "${EMBEDDINGS_API_KEY}"
          connectorType: "${EMBEDDINGS_CONNECTOR_TYPE}"
          model: "${EMBEDDINGS_MODEL}"
          dimensions: ${EMBEDDINGS_DIMENSIONS}

# `devspace dev` mode (task cluster:dev): swaps the editor/orchestrator/observability pods
# for their dev images, live-syncs source for hot reload, and tails all three
# pods' logs to the terminal. No port forwards here — the k3d loadbalancer
# already exposes the apps on localhost:3000 / :8090 (deploy/k3d/cluster.yaml),
# and the replacement pods keep their chart labels so the NodePort services
# still route to them.
dev:
  platform:
    labelSelector:
      app.kubernetes.io/name: octo
      app.kubernetes.io/instance: octo
      app.kubernetes.io/component: platform
    namespace: octo-dev
    # Hot-reload image (next dev). Build+import with `task cluster:images:dev`.
    devImage: octo-platform-dev:dev
    command: ["pnpm", "run", "dev"]
    workingDir: /app/apps/platform
    sync:
      - path: ./apps/platform:/app/apps/platform
        # These live only in the container, not the local tree; excluding them
        # keeps DevSpace's initial mirror from deleting them. (The octo runtime
        # lives at /usr/local/bin/octo, outside /app, so it's never synced; pnpm
        # hoists deps to /app/node_modules, also outside the synced path.)
        excludePaths:
          - node_modules/
          - .next/
          - .octo-run/
          - .git/
    # Stream this pod's logs to the terminal.
    logs: {}
  orchestrator:
    labelSelector:
      app.kubernetes.io/name: octo
      app.kubernetes.io/instance: octo
      app.kubernetes.io/component: orchestrator
    namespace: octo-dev
    devImage: octo-orchestrator-dev:dev
    command: ["go", "run", "."]
    workingDir: /src
    sync:
      - path: ./orchestrator:/src
        excludePaths:
          - .git/
          - orchestrator
        # Restart the container after each upload so `go run` recompiles.
        onUpload:
          restartContainer: true
    logs: {}
  observability:
    labelSelector:
      app.kubernetes.io/name: octo
      app.kubernetes.io/instance: octo
      app.kubernetes.io/component: observability
    namespace: octo-dev
    devImage: octo-observability-dev:dev
    command: ["go", "run", "."]
    workingDir: /src
    sync:
      - path: ./observability:/src
        excludePaths:
          - .git/
          - observability
        # Restart the container after each upload so `go run` recompiles.
        onUpload:
          restartContainer: true
    logs: {}
  # Postgres is not hot-reloaded; this entry only forwards its logs to the terminal.
  postgres:
    labelSelector:
      app.kubernetes.io/name: octo
      app.kubernetes.io/instance: octo
      app.kubernetes.io/component: postgres
    namespace: octo-dev
    logs: {}
  # NATS is not hot-reloaded; this entry only forwards its logs to the terminal.
  nats:
    labelSelector:
      app.kubernetes.io/name: octo
      app.kubernetes.io/instance: octo
      app.kubernetes.io/component: nats
    namespace: octo-dev
    logs: {}
  # Redis, on the same terms as the two above: not hot-reloaded, here only to put
  # its logs in the terminal beside everything else's.
  #
  # It needs no entry to be *deployed* — it comes from the chart like every other
  # component — but leaving it out of this list is how a dependency ends up being
  # the one thing you have to go and find with kubectl when a local run misbehaves.
  redis:
    labelSelector:
      app.kubernetes.io/name: octo
      app.kubernetes.io/instance: octo
      app.kubernetes.io/component: redis
    namespace: octo-dev
    logs: {}
