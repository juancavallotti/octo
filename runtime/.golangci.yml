version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    # Correctness
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - bodyclose
    - nilerr
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - copyloopvar
    - usestdlibvars
    # Error handling discipline
    - errorlint
    - wrapcheck
    # Style / clarity
    - revive
    - gocritic
    - unconvert
    - unparam
    - misspell
    - whitespace
    - predeclared
    - nakedret
    - prealloc
    # Coding-standards enforcement (docs/coding-standards.md)
    - mnd            # no magic numbers
    - goconst        # repeated literals -> constants
    - funlen         # small functions
    - gocyclo        # cyclomatic complexity
    - gocognit       # cognitive complexity
    - cyclop         # per-package + per-func complexity
    - nestif         # shallow nesting
    - lll            # line length
    - ireturn        # don't return interfaces (avoid interface pollution)
    - interfacebloat # keep interfaces small
    - gochecknoinits # one init() per loadable module — see the allowlist below
    # Security
    - gosec

  settings:
    funlen:
      lines: 60
      statements: 45
      ignore-comments: true
    gocyclo:
      min-complexity: 12
    cyclop:
      max-complexity: 12
    gocognit:
      min-complexity: 20
    nestif:
      min-complexity: 4
    lll:
      line-length: 120
    interfacebloat:
      max: 5
    goconst:
      min-len: 3
      min-occurrences: 3
      # Tests are already excluded from goconst issues below; don't let
      # repeated literals in table-driven test cases push production strings
      # over the threshold either.
      ignore-tests: true
    wrapcheck:
      # Wrap errors that cross into our code from stdlib / third parties.
      # Internal propagation between our own packages does not need wrapping.
      ignore-package-globs:
        - github.com/juancavallotti/octo/*
    mnd:
      ignored-numbers:
        - "0"
        - "1"
        - "2"
    nakedret:
      max-func-lines: 0
    revive:
      rules:
        - name: exported
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: if-return
        - name: var-declaration
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: errorf
        - name: unreachable-code
        - name: redefines-builtin-id

  exclusions:
    rules:
      # Tests get latitude: fixtures, long table-driven cases, repeated literals.
      - path: _test\.go
        linters:
          - funlen
          - mnd
          - goconst
          - gocyclo
          - gocognit
          - cyclop
          - wrapcheck
          - lll
          - dupl
          # Test fixtures register throwaway blocks for the test binary only; they
          # ship in nothing and are not part of any module's surface.
          - gochecknoinits

      # gosec's G101 reads "mongodb://user:pass@host" as a leaked credential.
      # Producing exactly that string is what withPassword does, so its fixtures
      # cannot avoid the pattern. Every credential in that file is fake.
      #
      # Scoped to G101 by text, not to gosec wholesale: whatever else that file
      # grows later should still be checked.
      - path: ^connectors/mongodb/uri_test\.go$
        linters: [gosec]
        text: G101

      # gochecknoinits allowlist — the enumeration of loadable modules.
      #
      # init() earns its place here for exactly one reason (docs/extension-points.md):
      # a module registers itself so a blank import in runtime/octo/main.go, or a
      # build tag, decides what the binary ships. That contract is per *module*, so
      # exactly one file per module — its root file — may carry an init(), and that
      # init() is the module's manifest: what importing this package puts into the
      # runtime, in a deterministic order. Per-block registration bodies stay beside
      # their blocks as ordinary registerX functions called from the manifest.
      #
      # Adding an entry below is how a new loadable module is declared, reviewed in
      # one place. A second init() anywhere inside a module fails CI.
      - path: ^connectors/cron/cron\.go$
        linters: [gochecknoinits]
      - path: ^connectors/database/database\.go$
        linters: [gochecknoinits]
      - path: ^connectors/events/events\.go$
        linters: [gochecknoinits]
      - path: ^connectors/http/http\.go$
        linters: [gochecknoinits]
      - path: ^connectors/httpclient/httpclient\.go$
        linters: [gochecknoinits]
      - path: ^connectors/llm/anthropic/anthropic\.go$
        linters: [gochecknoinits]
      - path: ^connectors/llm/gemini/gemini\.go$
        linters: [gochecknoinits]
      - path: ^connectors/llm/openai/openai\.go$
        linters: [gochecknoinits]
      - path: ^connectors/logger/logger\.go$
        linters: [gochecknoinits]
      - path: ^connectors/mongodb/mongodb\.go$
        linters: [gochecknoinits]
      - path: ^connectors/notion/notion\.go$
        linters: [gochecknoinits]
      - path: ^connectors/pinecone/pinecone\.go$
        linters: [gochecknoinits]
      - path: ^connectors/queue/queue\.go$
        linters: [gochecknoinits]
      - path: ^connectors/slack/slack\.go$
        linters: [gochecknoinits]
      - path: ^services/k8s/k8s\.go$
        linters: [gochecknoinits]
      - path: ^services/observability/observability\.go$
        linters: [gochecknoinits]
      - path: ^services/standalone/standalone\.go$
        linters: [gochecknoinits]
      - path: ^core/expr/expr\.go$
        linters: [gochecknoinits]
      - path: ^core/internal/engine/flow\.go$
        linters: [gochecknoinits]
      # Not a loadable module: package main stamps the build info into the hosted
      # observability service, which cannot import package main back.
      - path: ^octo/hosted_observability\.go$
        linters: [gochecknoinits]

formatters:
  enable:
    - gofmt
    - goimports
