version: '3'

# Tasks for the Go runtime (types, core, connectors, services, octo, dolphin).
# Included from the root Taskfile under the `runtime:` namespace, with the
# working directory set to runtime/, so all paths here are relative to it.
#
# The Go module is rooted at the repo root (github.com/juancavallotti/octo) so
# the CLIs are `go install`-able; `./...` from here therefore covers exactly the
# runtime packages, and nothing else in the module.

vars:
  GO: go

tasks:
  fmt:
    desc: Format the Go sources
    cmds:
      - '{{.GO}} fmt ./...'

  test:
    desc: Run the runtime tests
    cmds:
      - '{{.GO}} test ./...'

  # Diagnostics, not assertions — deliberately not wired into `test`, because
  # benchmark numbers on shared CI hardware are noise. Run it by hand when
  # changing something whose cost scales with the payload: message copying, the
  # composite blocks that copy per element or per branch.
  bench:
    desc: Run the runtime benchmarks
    cmds:
      - '{{.GO}} test -run "^$" -bench . -benchmem ./...'

  # The samples are the runtime's end-to-end tests, and dolphin is how they are run: a
  # sample that no longer does what its comments claim now fails CI instead of misleading
  # the next person who copies it. It is also the only test of octo's own debug seam from
  # the outside — mocks, spies and the invoke envelope are exercised as a user meets them,
  # through the CLI, rather than through the engine's Go API.
  #
  # The suites are named directly rather than by directory: samples/ is a folder of
  # INDEPENDENT configs (three of them declare a flow called `order`), not one config, so
  # loading it as a whole is a name collision, not a test run.
  # The env file supplies the variables the configs declare — an LLM key, a Slack token —
  # because a config's env is resolved when it is LOADED, before any block runs: a flow
  # whose connector reads ${ANTHROPIC_API_KEY} cannot be built without one, and mocking the
  # block that would use it does not help. Every value in it is fake, and every block that
  # would reach for a real service is mocked, so nothing here calls anything.
  test:samples:
    desc: Run the dolphin test suites over samples/
    deps: [build]
    cmds:
      - ../bin/dolphin test ../samples/*_test.yaml ../samples/*/*_test.yaml --env-file ../samples/.env.test

  # Both CLIs. Kept as an aggregator rather than one task that builds both, so that
  # `bin/octo` — which the docs drift check shells out to — is still produced by a
  # task of its own.
  build:
    desc: Build the CLI binaries (octo + dolphin)
    cmds:
      - task: build:octo
      - task: build:dolphin

  build:octo:
    desc: Build the octo CLI binary
    cmds:
      - mkdir -p ../bin
      # Stamp the build date into the binary so `octo --version` can report it.
      - '{{.GO}} build -ldflags "-X main.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o ../bin/octo ./octo'

  build:dolphin:
    desc: Build the dolphin test-runner binary
    cmds:
      - mkdir -p ../bin
      - '{{.GO}} build -ldflags "-X main.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o ../bin/dolphin ./dolphin'

  tidy:
    desc: Tidy the module
    cmds:
      - cd .. && {{.GO}} mod tidy

  lint:
    desc: Run golangci-lint over the runtime packages
    cmds:
      - golangci-lint run ./...

  run:
    desc: Run the CLI with a config file
    cmds:
      - cd octo && {{.GO}} run . {{.CLI_ARGS}}

  run:sample:
    desc: 'Run a config from samples/ (e.g. task runtime:run:sample -- heartbeat.yaml)'
    cmds:
      - cd octo && {{.GO}} run . -config ../../samples/{{.CLI_ARGS}}

  schema:
    desc: Print the generated editor capability schema (JSON) to stdout
    cmds:
      - cd octo && {{.GO}} run . schema

  dolphin:
    desc: 'Run dolphin (e.g. task runtime:dolphin -- run --config dolphin.yaml)'
    cmds:
      - cd dolphin && {{.GO}} run . {{.CLI_ARGS}}
