# k3d cluster config for local dev (real k3s inside Docker).
#
# The host ./data volume mount is passed on the CLI by `task cluster:deploy`
# (--volume "$(pwd)/data:/var/lib/octo-data@server:0") because the host path is
# dynamic. /var/lib/octo-data is the fixed node path the chart's static
# PersistentVolume binds (postgres.storage.hostPath in helm/values-k3d.yaml), so
# the database lives at ./data/pgdata and outlives the cluster — this file's
# cluster is deleted and recreated by `task cluster:stop` / `cluster:deploy`,
# which would strand a dynamically provisioned volume.
#
# Port mappings route localhost -> the k3d loadbalancer -> NodePort services
# (helm/values-k3d.yaml pins them to 30030/30090), so the editor and
# orchestrator are reachable without a long-running port-forward.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: octo
servers: 1
agents: 0
ports:
  # localhost:3000 -> platform NodePort (30030)
  - port: 3000:30030
    nodeFilters:
      - loadbalancer
  # localhost:8090 -> orchestrator NodePort (30090)
  - port: 8090:30090
    nodeFilters:
      - loadbalancer
options:
  k3d:
    wait: true
