# Local k3d cluster — `task cluster:deploy`.
#
#   helm upgrade --install octo ./helm -n octo-dev --create-namespace -f helm/values-k3d.yaml
#
# Images are built locally and side-loaded with `k3d image import`, so there is
# no registry and nothing is ever pulled. The editor and orchestrator are
# reached through fixed NodePorts that deploy/k3d/cluster.yaml maps to
# localhost:3000 and localhost:8090.

image:
  # No registry: side-loaded images are addressed by bare name.
  registry: ""
  tag: dev
  # Fixed :dev tags never change, so IfNotPresent must not be Always or the
  # kubelet would try to reach a registry that has no such image.
  pullPolicy: IfNotPresent

# Local builds use the short names (Taskfile `cluster:images`), not the
# published -paas repositories.
platform:
  repository: octo-platform
  service:
    type: NodePort
    nodePorts:
      http: 30030
  extraEnv:
    # Auth.js callback/cookie origin. SSO is off locally, but the editor still
    # reads this to build absolute URLs.
    - name: AUTH_URL
      value: http://localhost:3000

orchestrator:
  repository: octo-orchestrator
  service:
    type: NodePort
    nodePorts:
      http: 30090
  # No ingress controller is wired up locally, so per-integration external
  # endpoints are off; integrations are reachable at their in-cluster Service.
  baseDomain: ""
  ingressClass: ""
  # Dev runs on, because this is where the feature is developed and the only cluster
  # this repo can bring up on demand. The images are side-loaded like the rest.
  #
  # With baseDomain empty above, a run still starts, reloads, streams logs and reaps —
  # it just publishes no public hostname, so a networked integration has no external
  # test URL and is reachable only at its in-cluster Service. Exercising the public
  # host locally needs a baseDomain plus an ingress path into the cluster, which
  # deploy/k3d/cluster.yaml does not map (only :3000 and :8090).
  devRuns:
    enabled: true
    # A throwaway, written down for the same reason postgres.auth.password below is: a
    # laptop cluster reachable only through k3d's port mappings is the one place that is
    # fine. Nothing a cloud profile can inherit — values.yaml ships it empty and the
    # chart refuses to render without one.
    hashSecret: local-dev-not-a-secret
    # Short enough to watch the reaper work without leaving a tab open for an hour.
    idleTimeout: 10m

  # On locally, unlike everywhere else. The sidecar is off by default because it
  # is a container in every pod and a claim on Redis that an installation should
  # opt into deliberately. A laptop cluster is where the feature is developed and
  # where the platform's metrics views have nothing to draw without it.
  #
  # Turning it on rolls every deployment in the namespace once, because the
  # runtime container gains OCTO_METRICS=true.
  podStats:
    enabled: true
    # An hour is the shipped default, and it makes the history tier invisible for
    # a whole working session: no bucket closes, so the platform's 24h and 7d
    # views are empty and there is no way to tell that from a bug.
    #
    # Ten minutes rather than something shorter, because the live tier holds
    # exactly one bucket: its reach is rollupInterval / sampleInterval seconds,
    # so a two-minute bucket gives a two-minute live tier and every view from
    # five minutes up falls back to collapsed rows. Ten minutes leaves 600 live
    # samples — enough for the short views to be answered at full resolution —
    # while still closing a bucket inside a session.
    rollupInterval: 10m
    # A day of ten-minute buckets is 144 rows per pod. The cost of history here
    # is nothing; the reason to keep it short is that a laptop cluster is rebuilt
    # often enough that a week of it would never fill.
    retention: 24h

observability:
  repository: octo-observability

schema:
  repository: octo-schema

runtime:
  repository: octo-runtime

devsidecar:
  repository: octo-devsidecar

statssidecar:
  repository: octo-statssidecar

devruntime:
  repository: octo-devruntime

agenticrunner:
  repository: octo-agenticrunner

# The embedding server. Still off by default, here as everywhere: it needs a
# provider key, and there is no sensible local default for one. Turn it on with
#   --set embeddings.enabled=true --set embeddings.apiKey=sk-...
# Left off, searching agent memory matches text instead of ranking by meaning,
# which is a supported way to run rather than a degraded one.
embeddings:
  repository: octo-embeddings

# The editor is on a NodePort, not behind an Ingress. k3s ships Traefik, but
# there is no DNS name or certificate to attach locally.
ingress:
  enabled: false

auth:
  oidc:
    enabled: false

kv:
  # Fixed, deliberately non-secret development key so KV secret namespaces work
  # locally without generating one per developer. It is committed on purpose and
  # must never be used anywhere real.
  encryptionKey: "RwbauJ1U7IvkOl8IZsNCQNShHGA/sqP+TQymYAkOFQ8="

postgres:
  auth:
    # The chart has no default password — it is published, and a default
    # credential in a published chart is a credential everyone has. A laptop
    # cluster reachable only through k3d's port mappings is the one place a
    # throwaway is fine, so it is written down here instead: explicit, local, and
    # not something a cloud profile can inherit by accident.
    password: octo
  storage:
    # Fixed node path rather than the local-path provisioner. `task cluster:deploy`
    # mounts the repo's ./data onto /var/lib/octo-data in the k3d node, so the
    # database lives at ./data/pgdata and survives `task cluster:stop` — which
    # deletes the whole cluster, and with it any dynamically provisioned claim.
    # `task cluster:db:reset` is what wipes it.
    hostPath: /var/lib/octo-data
    size: 5Gi
