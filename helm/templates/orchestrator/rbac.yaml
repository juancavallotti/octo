{{- /* RBAC for the orchestrator: it creates one ConfigMap + Deployment + Service
       per integration deployment and reads pod/deployment status. Scoped to the
       release namespace (namespaced Role, not Cluster). */}}
{{- define "octo.orchestrator.rules" -}}
- apiGroups: [""]
  resources: ["configmaps", "services", "pods"]
  verbs: ["get", "list", "watch", "create", "update", "delete"]
# Per-pod log streaming (the deployment detail's live tail). pods/log is a
# subresource, so it needs its own rule; only get is required to open a stream.
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
# Secrets, for two jobs. The single octo-secrets Secret holding the cluster's
# shared values (get to read, create on first write, update to add and remove
# keys), and one Secret per deployment holding the platform token its pods
# present — created with the deployment, replaced on a rollout, and deleted with
# it, because a machine token renews at any age and one left behind would go on
# working after the deployment it belonged to was gone.
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "create", "update", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  # patch is required to scale an existing deployment (merge-patch on spec.replicas).
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
{{- if eq (include "octo.networking.mode" .) "gateway" }}
# Per-integration external endpoints, Gateway API mode: one HTTPRoute per
# externally-exposed deployment, attached to a Gateway this Role deliberately
# grants nothing on. That is the permission split the mode exists for — the
# Gateway belongs to whoever runs the cluster's ingress, and octo only creates
# routes in its own namespace.
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["httproutes"]
  verbs: ["get", "list", "watch", "create", "update", "delete"]
{{- else }}
# Per-integration external endpoints (Stage 2): the orchestrator creates an
# Ingress per externally-exposed deployment.
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list", "watch", "create", "update", "delete"]
{{- end }}
{{- end }}
{{- include "octo-common.rbac" (dict
      "root" $
      "component" "orchestrator"
      "rules" (include "octo.orchestrator.rules" .)) }}
