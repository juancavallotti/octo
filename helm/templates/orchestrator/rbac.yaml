{{- /* RBAC for the orchestrator: it creates one ConfigMap + Deployment + Service
       per integration deployment and reads pod/deployment status. Scoped to the
       release namespace (namespaced Role, not Cluster). */}}
{{- define "octo.orchestrator.rules" -}}
- apiGroups: [""]
  resources: ["configmaps", "services", "pods"]
  verbs: ["get", "list", "watch", "create", "update", "delete"]
# Per-pod log streaming (the deployment detail's live tail). pods/log is a
# subresource, so it needs its own rule; only get is required to open a stream.
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
# Secrets, for two jobs. The single octo-secrets Secret holding the cluster's
# shared values (get to read, create on first write, update to add and remove
# keys), and one Secret per deployment holding the platform token its pods
# present — created with the deployment, replaced on a rollout, and deleted with
# it, because a machine token renews at any age and one left behind would go on
# working after the deployment it belonged to was gone.
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "create", "update", "delete"]
# Test runs: one Job per run of a deployment's suites, read back for its verdict
# and deleted when the run is abandoned.
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "create", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  # patch is required to scale an existing deployment (merge-patch on spec.replicas).
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
{{- if eq (include "octo.networking.mode" .) "gateway" }}
# Per-integration external endpoints, Gateway API mode: one HTTPRoute per
# externally-exposed deployment, attached to a Gateway this Role deliberately
# grants nothing on. That is the permission split the mode exists for — the
# Gateway belongs to whoever runs the cluster's ingress, and octo only creates
# routes in its own namespace.
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["httproutes"]
  verbs: ["get", "list", "watch", "create", "update", "delete"]
{{- else }}
# Per-integration external endpoints (Stage 2): the orchestrator creates an
# Ingress per externally-exposed deployment.
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list", "watch", "create", "update", "delete"]
{{- end }}
{{- if .Values.internalTLS.enabled }}
# In-cluster HTTPS: one Certificate per deployment that asks for it, and the
# object that tells the external endpoint to re-encrypt to the pod — a Traefik
# ServersTransport under Ingress, a BackendTLSPolicy under Gateway API.
- apiGroups: ["cert-manager.io"]
  resources: ["certificates"]
  verbs: ["get", "create", "update", "delete"]
{{- if eq (include "octo.networking.mode" .) "gateway" }}
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["backendtlspolicies"]
  verbs: ["get", "create", "update", "delete"]
{{- else }}
- apiGroups: ["traefik.io"]
  resources: ["serverstransports"]
  verbs: ["get", "create", "update", "delete"]
# Traefik reads the backend scheme and the transport from annotations on the
# deployment's Service, which the orchestrator adds once the transport exists.
- apiGroups: [""]
  resources: ["services"]
  verbs: ["patch"]
{{- end }}
{{- end }}
{{- end }}
{{- include "octo-common.rbac" (dict
      "root" $
      "component" "orchestrator"
      "rules" (include "octo.orchestrator.rules" .)) }}
{{- /* Re-encrypting through an Ingress reads the IngressClass the Ingress is
       claimed by — the configured one, or the cluster default — for the
       controller behind it. IngressClasses are cluster-scoped, so the Role above
       cannot grant them. */}}
{{- $cfg := fromYaml (include "octo-common.componentConfig" (dict "root" . "component" "orchestrator")) -}}
{{- $rbac := $cfg.rbac | default dict -}}
{{- if and .Values.internalTLS.enabled (ne (include "octo.networking.mode" .) "gateway") (ne (toString $rbac.create) "false") }}
{{- $name := include "octo.orchestrator.clusterScopedName" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}-ingressclasses
  labels:
    {{- include "octo-common.componentLabels" (dict "root" . "component" "orchestrator") | nindent 4 }}
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingressclasses"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}-ingressclasses
  labels:
    {{- include "octo-common.componentLabels" (dict "root" . "component" "orchestrator") | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "octo-common.serviceAccountName" (dict "root" . "component" "orchestrator") }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ $name }}-ingressclasses
  apiGroup: rbac.authorization.k8s.io
{{- end }}
