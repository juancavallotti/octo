{{- include "octo-common.deployment" (dict
      "root" $
      "component" "orchestrator"
      "replicas" .Values.orchestrator.replicas
      "volumes" (include "octo.platformTLS.volumes" (dict "root" $ "component" "orchestrator") | fromYamlArray)
      "serviceAccountName" (include "octo-common.serviceAccountName" (dict "root" $ "component" "orchestrator"))
      "containers" (include "octo-common.container" (dict
        "root" $
        "component" "orchestrator"
        "name" "orchestrator"
        "image" (include "octo-common.image" (dict "root" $ "component" "orchestrator"))
        "pullPolicy" (include "octo-common.imagePullPolicy" (dict "root" $ "component" "orchestrator"))
        "ports" (concat (list (dict "containerPort" .Values.orchestrator.service.port))
                   (include "octo.platformTLS.containerPorts" . | fromYamlArray))
        "env" (print (include "octo.orchestrator.env" .) (include "octo.platformTLS.env" .))
        "volumeMounts" (include "octo.platformTLS.volumeMounts" . | fromYamlArray)
        "readinessProbe" (dict
          "httpGet" (dict "path" "/healthz" "port" .Values.orchestrator.service.port)
          "initialDelaySeconds" 3
          "periodSeconds" 10)))) }}
