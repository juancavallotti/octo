{{- /* ClusterIP: the orchestrator stays internal; the editor's BFF proxy fronts it. */}}
{{- include "octo-common.service" (dict
      "root" $
      "component" "orchestrator"
      "type" "ClusterIP"
      "ports" (list (dict "name" "http" "port" .Values.orchestrator.service.port "targetPort" .Values.orchestrator.service.port))) }}
