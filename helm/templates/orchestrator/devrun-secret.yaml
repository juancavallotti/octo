{{- /* HMAC key for deriving a dev run's identity and its public hostname from
       (user, integration). Held in a Secret rather than passed as a plain env value,
       for the same reason the KV encryption key is: it is the only thing making a
       publicly reachable dev run's hostname unguessable.

       `required` rather than generated, and that is the whole design of this file.
       The orchestrator refuses to start without the key, so the choice is between
       failing at `helm install` with a message naming the value and failing later
       with a CrashLoopBackOff. And a chart that generated one would rotate it on
       every render that cannot read the cluster (`helm template`, `--dry-run`, a
       GitOps pipeline) — silently re-labelling every exposed dev run and breaking
       every webhook registered against the old hostname, with no error to connect
       to the upgrade. Loud and immediate beats silent and severe.

       Labelled as the orchestrator's own component (its only consumer) but named
       separately, like the KV secret, so the name is passed explicitly. Consumed
       via secretKeyRef in orchestrator/_env.tpl. */}}
{{- define "octo.devRuns.secretData" -}}
dev-run-hash-secret: {{ required (printf "orchestrator.devRuns.hashSecret is required when orchestrator.devRuns.enabled is true: it keys the derivation of every dev run's identity and public hostname. Generate it ONCE and keep it — rotating it breaks every webhook registered against an existing dev-run hostname. Hold it wherever kv.encryptionKey is held.") .Values.orchestrator.devRuns.hashSecret | quote }}
{{- end }}
{{- if .Values.orchestrator.devRuns.enabled }}
{{- include "octo-common.secret" (dict
      "root" $
      "component" "orchestrator"
      "name" (include "octo.devRuns.secretName" .)
      "stringData" (include "octo.devRuns.secretData" .)) }}
{{- end }}
