{{- /* The provider key, held in exactly one pod on the installation.

       That concentration is the whole reason this component exists: the
       alternative — every integration's pod carrying an embeddings key — is
       what the embedding server was introduced to avoid. */}}
{{- if and .Values.embeddings.enabled (not .Values.embeddings.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "octo.embeddings.secretName" . }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  apiKey: {{ required "embeddings.apiKey is required when embeddings.enabled is true (or set embeddings.existingSecret)" .Values.embeddings.apiKey | quote }}
{{- end }}
