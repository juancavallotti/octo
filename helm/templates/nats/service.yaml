{{- if .Values.nats.enabled }}
{{- /* Plain ClusterIP: NATS is a multi-consumer broker, so unlike the headless
       Postgres Service it needs a single stable virtual IP that fans out to
       clients. No explicit type, so the cluster default (ClusterIP) applies. */}}
{{- include "octo-common.service" (dict
      "root" $
      "component" "nats"
      "ports" (list
        (dict "name" "client" "port" .Values.nats.service.port "targetPort" 4222)
        (dict "name" "monitor" "port" .Values.nats.service.monitorPort "targetPort" 8222))) }}
{{- end }}
