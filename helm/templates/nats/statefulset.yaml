{{- if .Values.nats.enabled }}
{{- /* Core NATS only (no JetStream): ephemeral pub/sub, so no volume. It is still
       a StatefulSet so each replica gets a stable identity (nats-0.<headless>)
       that cluster routes rely on when scaling to multi-node, per the official
       chart's guidance. -m exposes the HTTP monitoring endpoint the readiness
       probe uses. */}}
{{- include "octo-common.statefulset" (dict
      "root" $
      "component" "nats"
      "replicas" 1
      "serviceName" (include "octo.nats.headlessServiceName" .)
      "containers" (include "octo-common.container" (dict
        "root" $
        "component" "nats"
        "name" "nats"
        "image" (include "octo-common.image" (dict "root" $ "component" "nats" "thirdParty" true))
        "pullPolicy" (include "octo-common.imagePullPolicy" (dict "root" $ "component" "nats"))
        "args" (list "-m" "8222")
        "ports" (list
          (dict "name" "client" "containerPort" 4222)
          (dict "name" "monitor" "containerPort" 8222))
        "readinessProbe" (dict
          "httpGet" (dict "path" "/healthz" "port" 8222)
          "initialDelaySeconds" 3
          "periodSeconds" 10)))) }}
{{- end }}
