{{- if .Values.nats.enabled }}
{{- /* Headless: governs the StatefulSet so each replica gets stable per-pod DNS
       for cluster-route discovery. Clients use the regular ClusterIP service
       instead. publishNotReadyAddresses surfaces pods before Ready so routes can
       form during rollout. */}}
{{- include "octo-common.service" (dict
      "root" $
      "component" "nats"
      "name" (include "octo.nats.headlessServiceName" .)
      "headless" true
      "publishNotReadyAddresses" true
      "ports" (list (dict "name" "client" "port" .Values.nats.service.port "targetPort" 4222))) }}
{{- end }}
