{{- include "octo-common.deployment" (dict
      "root" $
      "component" "iam"
      "replicas" .Values.iam.replicas
      "volumes" (include "octo.platformTLS.volumes" (dict "root" $ "component" "iam") | fromYamlArray)
      "containers" (include "octo-common.container" (dict
        "root" $
        "component" "iam"
        "name" "iam"
        "image" (include "octo-common.image" (dict "root" $ "component" "iam"))
        "pullPolicy" (include "octo-common.imagePullPolicy" (dict "root" $ "component" "iam"))
        "ports" (concat (list (dict "containerPort" .Values.iam.service.port))
                   (include "octo.platformTLS.containerPorts" . | fromYamlArray))
        "env" (print (include "octo.iam.env" .) (include "octo.platformTLS.env" .))
        "volumeMounts" (include "octo.platformTLS.volumeMounts" . | fromYamlArray)
        "readinessProbe" (dict
          "httpGet" (dict "path" "/healthz" "port" .Values.iam.service.port)
          "initialDelaySeconds" 3
          "periodSeconds" 10)))) }}
