{{- include "octo-common.deployment" (dict
      "root" $
      "component" "logs"
      "replicas" .Values.logs.replicas
      "containers" (include "octo-common.container" (dict
        "root" $
        "component" "logs"
        "name" "logs"
        "image" (include "octo-common.image" (dict "root" $ "repo" .Values.logs.repository))
        "pullPolicy" .Values.image.pullPolicy
        "ports" (list (dict "containerPort" .Values.logs.service.port))
        "env" (include "octo.logs.env" .)
        "readinessProbe" (dict
          "httpGet" (dict "path" "/healthz" "port" .Values.logs.service.port)
          "initialDelaySeconds" 3
          "periodSeconds" 10)))) }}
