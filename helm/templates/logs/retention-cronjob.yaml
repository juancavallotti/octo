{{- /* Asks the aggregator to enforce the stored data-retention policy, nightly.

       Two switches govern this feature and they answer different questions.
       retention.enabled decides whether this CronJob exists; the policy in the
       database decides whether a run deletes anything. So the job is a no-op on
       a fresh install and turning retention on later is a change in the admin
       section rather than a redeploy — which is the point, since how long to
       keep telemetry is an operational decision and not a deployment one.

       Not a Helm hook, unlike the schema Job beside it: a hook would run once
       per install and be deleted, and this needs to persist and recur.

       The policy lives in the aggregator rather than here for the same reason
       the platform queries logs and traces there directly — it owns the tables a
       sweep deletes from. Passing days as a flag on this job would put the
       policy in two places and let them disagree.

       curl, because the octo images are distroless: no shell, no HTTP client.
       -f turns a 4xx/5xx into a non-zero exit, so a sweep the aggregator refused
       fails the Job and is visible in `kubectl get jobs` rather than being a
       silent success that deleted nothing. */}}
{{- if .Values.retention.enabled }}
{{- $ctx := dict "root" $ "component" "retention" }}
{{- $url := printf "%s/retention/run" (include "octo.logs.url" .) }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "octo-common.componentName" $ctx }}
  labels:
    {{- include "octo-common.componentLabels" $ctx | nindent 4 }}
spec:
  schedule: {{ .Values.retention.schedule | quote }}
  concurrencyPolicy: {{ .Values.retention.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.retention.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.retention.failedJobsHistoryLimit }}
  jobTemplate:
    metadata:
      labels:
        {{- include "octo-common.componentLabels" $ctx | nindent 8 }}
    spec:
      backoffLimit: {{ .Values.retention.backoffLimit }}
      template:
        metadata:
          labels:
            {{- include "octo-common.componentSelectorLabels" $ctx | nindent 12 }}
        spec:
          {{- include "octo-common.podSpec" (dict
                "root" $
                "component" "retention"
                "restartPolicy" "OnFailure"
                "containers" (include "octo-common.container" (dict
                  "root" $
                  "component" "retention"
                  "name" "sweep"
                  "image" (include "octo-common.image" (dict "root" $ "component" "retention" "thirdParty" true))
                  "pullPolicy" (include "octo-common.imagePullPolicy" (dict "root" $ "component" "retention"))
                  "command" (list "curl" "-fsS" "--max-time" (toString (.Values.retention.timeoutSeconds | int)) "-X" "POST" $url))))
              | nindent 10 }}
{{- end }}
