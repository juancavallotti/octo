{{- /* An empty clusterIssuer means the Secret already exists and this chart
       should reference it without issuing anything — the same distinction
       ingress.tls draws between its cert-manager and secret modes, and the same
       one postgres.auth draws with existingSecret. It matters most under
       networking.mode=gateway, where a pre-issued wildcard on a listener is the
       ordinary arrangement rather than the exception: the Gateway is usually
       somebody else's, and so is the certificate it terminates with.

       The default is a non-empty issuer, so nothing changes for an install that
       has not asked for this. */}}
{{- if and .Values.wildcardTLS.enabled .Values.orchestrator.baseDomain .Values.wildcardTLS.clusterIssuer -}}
# One cert-manager Certificate covering orchestrator.baseDomain and every
# subdomain under it, issued via the DNS-01 ClusterIssuer. The resulting Secret is
# referenced by the per-integration ingresses the orchestrator creates, so every
# {slug}.{baseDomain} validates against this shared wildcard cert. baseDomain may
# differ from ingress.host — the editor's own host always gets its own per-host
# cert instead (see platform/ingress.yaml), so it is not part of this cert's SANs.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "octo-common.componentName" (dict "root" $ "component" "wildcard") }}
  labels:
    {{- include "octo-common.componentLabels" (dict "root" $ "component" "wildcard") | nindent 4 }}
spec:
  secretName: {{ .Values.wildcardTLS.secretName | quote }}
  dnsNames:
    - {{ .Values.orchestrator.baseDomain | quote }}
    - {{ printf "*.%s" .Values.orchestrator.baseDomain | quote }}
  issuerRef:
    name: {{ .Values.wildcardTLS.clusterIssuer | quote }}
    kind: ClusterIssuer
    group: cert-manager.io
{{- end }}
