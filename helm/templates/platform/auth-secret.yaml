{{- /* OIDC SSO credentials for the editor (Auth.js). Created only when SSO is
       enabled AND the credentials were supplied as values; with
       auth.existingSecret naming a Secret that already holds them, the chart
       creates nothing and there is no value for it to keep. The platform app
       mounts both by reference either way (see platform/_env.tpl).

       `required` on both, for the reason devrun-secret.yaml gives: the
       alternative to failing here, by name, is a Secret whose keys are the empty
       string. Auth.js then throws MissingSecret on the first sign-in and the
       editor is unreachable, a long way from the values file that caused it. */}}
{{- define "octo.auth.secretData" -}}
# Only the genuinely sensitive values; the issuer and client id are non-secret and
# set as plain env values in the editor deployment.
oidc-client-secret: {{ required "auth.oidc.clientSecret is required when auth.oidc.enabled is true — it is the credential the editor authenticates to your identity provider with. Set it, or point auth.existingSecret at a Secret that holds it." .Values.auth.oidc.clientSecret | quote }}
auth-secret: {{ required "auth.secret is required when auth.oidc.enabled is true — Auth.js signs session cookies with it and refuses to start without one. Generate it with `openssl rand -base64 32`, or point auth.existingSecret at a Secret that holds it." .Values.auth.secret | quote }}
{{- end }}
{{- if and .Values.auth.oidc.enabled (not .Values.auth.existingSecret) }}
{{- include "octo-common.secret" (dict
      "root" $
      "component" "auth"
      "stringData" (include "octo.auth.secretData" .)) }}
{{- end }}
