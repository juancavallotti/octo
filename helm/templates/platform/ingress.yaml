{{- /* The editor's own host always gets its own certificate, independent of
       wildcardTLS: that cert covers ingress.host, while the separate wildcard
       certificate covers orchestrator.baseDomain and *.orchestrator.baseDomain,
       which may be a different domain entirely (e.g. a delegated subdomain used
       only for per-integration wildcards while the editor stays on the
       registrar-locked apex). */}}
{{- if and .Values.ingress.enabled (eq (include "octo.networking.mode" .) "ingress") }}
{{- include "octo-common.ingress" (dict
      "root" $
      "component" "platform"
      "ingress" .Values.ingress
      "managedCertificateName" .Values.ingress.tls.managedCertificateName
      "backendPort" .Values.platform.service.port) }}
{{- end }}
