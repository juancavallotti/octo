{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "octo-common.componentName" (dict "root" $ "component" "platform") }}
  labels:
    {{- include "octo-common.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform
  {{- $ann := .Values.ingress.annotations | default dict }}
  {{- $tls := .Values.ingress.tls | default dict }}
  {{- /* The editor's own host always gets its own per-host cert (HTTP-01 via
         ingress-shim), independent of wildcardTLS: that cert covers
         ingress.host. The separate wildcard certificate covers
         orchestrator.baseDomain and *.orchestrator.baseDomain, which may be
         different from ingress.host (e.g. a delegated subdomain used only for
         per-integration wildcards while the editor stays on the
         registrar-locked apex). */}}
  {{- if and $tls.enabled $tls.clusterIssuer }}
  {{- $ann = merge (dict "cert-manager.io/cluster-issuer" $tls.clusterIssuer) $ann }}
  {{- end }}
  {{- if $ann }}
  annotations:
    {{- range $k, $v := $ann }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- end }}
  {{- if $tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ $tls.secretName | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "octo.platform.serviceName" . }}
                port:
                  number: {{ .Values.platform.service.port }}
{{- end }}
