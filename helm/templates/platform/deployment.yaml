{{- include "octo-common.deployment" (dict
      "root" $
      "component" "platform"
      "replicas" .Values.platform.replicas
      "containers" (include "octo-common.container" (dict
        "name" "platform"
        "image" (include "octo-common.image" (dict "root" $ "repo" .Values.platform.repository))
        "pullPolicy" .Values.image.pullPolicy
        "ports" (list (dict "containerPort" .Values.platform.service.port))
        "env" (include "octo.platform.env" .)
        "readinessProbe" (dict
          "httpGet" (dict "path" "/" "port" .Values.platform.service.port)
          "initialDelaySeconds" 5
          "periodSeconds" 10)
        "volumeMounts" (list (dict "name" "octo-run" "mountPath" "/app/.octo-run"))))
      "volumes" (list (dict "name" "octo-run" "emptyDir" dict))) }}
