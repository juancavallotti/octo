{{- /* The public API's external endpoint, on its own host and certificate,
       through whichever of Ingress or Gateway API this release uses — the same
       choice the editor's endpoint makes, so the two are never published two
       different ways. */}}
{{- if .Values.api.enabled }}
{{- $ingress := fromYaml (include "octo.api.ingress" .) }}
{{- if eq (include "octo.networking.mode" .) "ingress" }}
{{- include "octo-common.ingress" (dict
      "root" $
      "component" "api"
      "ingress" $ingress
      "backendPort" .Values.api.service.port) }}
{{- else }}
{{- include "octo-common.httproute" (dict
      "root" $
      "component" "api"
      "ingress" $ingress
      "gateway" .Values.networking.gateway
      "backendPort" .Values.api.service.port) }}
{{- end }}
{{- end }}
