{{- define "octo.postgres.secretData" -}}
postgres-username: {{ .Values.postgres.auth.username | quote }}
postgres-database: {{ .Values.postgres.auth.database | quote }}
{{- /* The password is the one key that may live somewhere else: with
       auth.existingSecret the caller owns it, and this Secret carries only the
       two values that are not credentials. Otherwise it is required — the chart
       is published, so there is no password to fall back on. */ -}}
{{- if not .Values.postgres.auth.existingSecret }}
postgres-password: {{ required "postgres.auth.password is required — set it, or point postgres.auth.existingSecret at a Secret that holds one" .Values.postgres.auth.password | quote }}
{{- end }}
{{- end }}
{{- if .Values.postgres.enabled }}
{{- include "octo-common.secret" (dict
      "root" $
      "component" "postgres"
      "stringData" (include "octo.postgres.secretData" .)) }}
{{- end }}
