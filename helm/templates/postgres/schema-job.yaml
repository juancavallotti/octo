{{- /* Applies sql/schema.sql via the octo-schema image. Run as a Helm hook on every
       install/upgrade — the schema is idempotent (IF NOT EXISTS / ON CONFLICT), and
       Jobs are immutable, so the before-hook-creation delete policy replaces the
       previous run instead of failing. */}}
{{- $ctx := dict "root" $ "component" "schema" }}
{{- $pg := include "octo.postgres.serviceName" . }}
{{- $psqlArgs := printf "-h %s -p %v -U %s -d %s" $pg .Values.postgres.service.port .Values.postgres.auth.username .Values.postgres.auth.database }}
{{- $pgPassword := list (dict "name" "PGPASSWORD" "valueFrom" (dict "secretKeyRef" (dict "name" $pg "key" "postgres-password"))) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "octo-common.componentName" $ctx }}
  labels:
    {{- include "octo-common.componentLabels" $ctx | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        {{- include "octo-common.componentSelectorLabels" $ctx | nindent 8 }}
    spec:
      {{- include "octo-common.podSpec" (dict
            "restartPolicy" "OnFailure"
            "initContainers" (include "octo-common.container" (dict
              "name" "wait-for-postgres"
              "image" (printf "%s:%s" .Values.postgres.image.repository .Values.postgres.image.tag)
              "env" (toYaml $pgPassword)
              "command" (list "sh" "-c" (printf "until pg_isready %s; do\n  echo \"waiting for postgres...\"\n  sleep 2\ndone\n" $psqlArgs))))
            "containers" (include "octo-common.container" (dict
              "name" "apply-schema"
              "image" (include "octo-common.image" (dict "root" $ "repo" .Values.schema.repository))
              "pullPolicy" .Values.image.pullPolicy
              "env" (toYaml $pgPassword)
              "command" (list "sh" "-c" (printf "psql %s -v ON_ERROR_STOP=1 -f /schema/schema.sql" $psqlArgs)))))
          | nindent 6 }}
