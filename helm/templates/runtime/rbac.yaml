{{- /* RBAC for deployed runtime pods. The orchestrator runs each integration as
       its own Deployment and sets the pod's serviceAccountName to this account;
       the runtime's k8s services module uses it to run Lease-based leader
       election so a connector (e.g. a cron schedule) fires on exactly one
       replica. Scoped to the release namespace (namespaced Role), where the
       orchestrator creates the Leases alongside the runtime pods. */}}
{{- define "octo.runtime.rules" -}}
# Leader election: each replica creates/renews a coordination Lease and watches
# the holder, so only the current holder acts.
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
{{- end }}
{{- include "octo-common.rbac" (dict
      "root" $
      "component" "runtime"
      "rules" (include "octo.runtime.rules" .)) }}
