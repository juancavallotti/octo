{{- /* Password for a managed database (Cloud SQL, RDS) when one was passed
       inline rather than referenced. Prefer externalDatabase.existingSecret:
       a managed instance's password is issued by the cloud provider, so it
       belongs in a Secret that Terraform or an external-secrets operator owns,
       not in Helm values that end up in release history. */}}
{{- define "octo.externalDatabase.secretData" -}}
{{- /* Required, not defaulted. This branch runs only when postgres.enabled is
       false and no existingSecret was named, so an empty value here is not a
       "use the default" — there is no default. It would render a Secret whose
       password key is the empty string, and every pod would fail authentication
       against the managed instance at runtime, which is a long way from the
       values file that caused it. Same fail-fast treatment externalDatabase.host
       already gets. */ -}}
password: {{ required "externalDatabase.password is required when postgres.enabled is false and externalDatabase.existingSecret is not set" .Values.externalDatabase.password | quote }}
{{- end }}
{{- if and (not .Values.postgres.enabled) (not .Values.externalDatabase.existingSecret) }}
{{- include "octo-common.secret" (dict
      "root" $
      "component" "externaldb"
      "stringData" (include "octo.externalDatabase.secretData" .)) }}
{{- end }}
