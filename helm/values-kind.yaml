# Local kind cluster — the alternative to k3d for anyone who already runs kind.
#
#   kind create cluster --config deploy/kind/cluster.yaml
#   task cluster:images:kind     # build + `kind load docker-image`
#   helm upgrade --install octo ./helm -n octo-dev --create-namespace -f helm/values-kind.yaml
#
# Identical to values-k3d.yaml except for two things kind does differently:
# it has no bundled Traefik or servicelb, and its local-path provisioner stores
# volumes under /var/local-path-provisioner rather than k3s's path.

image:
  registry: ""
  tag: dev
  pullPolicy: IfNotPresent

platform:
  repository: octo-platform
  service:
    type: NodePort
    nodePorts:
      http: 30030
  extraEnv:
    - name: AUTH_URL
      value: http://localhost:3000

orchestrator:
  repository: octo-orchestrator
  service:
    type: NodePort
    nodePorts:
      http: 30090
  baseDomain: ""
  ingressClass: ""
  # Dev runs on, mirroring values-k3d.yaml — kind is otherwise identical to it. With
  # baseDomain empty above a run still starts, reloads and streams logs; it just
  # publishes no public hostname, so a networked integration is reachable only at its
  # in-cluster Service (the same limitation k3d has locally).
  devRuns:
    enabled: true
    # A throwaway for a laptop cluster, the same value k3d uses and for the same reason
    # postgres.auth.password below is written down. Never for real use; values.yaml ships
    # this empty and the chart refuses to render without one.
    hashSecret: local-dev-not-a-secret

observability:
  repository: octo-observability

schema:
  repository: octo-schema

runtime:
  repository: octo-runtime

devsidecar:
  repository: octo-devsidecar

statssidecar:
  repository: octo-statssidecar

devruntime:
  repository: octo-devruntime

agenticrunner:
  repository: octo-agenticrunner

# The embedding server. Still off by default, here as everywhere: it needs a
# provider key, and there is no sensible local default for one. Turn it on with
#   --set embeddings.enabled=true --set embeddings.apiKey=sk-...
# Left off, searching agent memory matches text instead of ranking by meaning,
# which is a supported way to run rather than a degraded one.
embeddings:
  repository: octo-embeddings

# kind ships no ingress controller at all. The NodePorts above are mapped to the
# host by deploy/kind/cluster.yaml's extraPortMappings.
ingress:
  enabled: false

auth:
  oidc:
    enabled: false

kv:
  # Same fixed development key as values-k3d.yaml — non-secret, never for real use.
  encryptionKey: "RwbauJ1U7IvkOl8IZsNCQNShHGA/sqP+TQymYAkOFQ8="

postgres:
  auth:
    # A throwaway for a laptop cluster; see the same note in values-k3d.yaml.
    # The chart itself has no default password.
    password: octo
  storage:
    # Fixed node path rather than kind's "standard" (local-path) StorageClass, so
    # the database survives `kind delete cluster`. deploy/kind/cluster.yaml mounts
    # the repo's ./data onto /var/lib/octo-data in the node.
    hostPath: /var/lib/octo-data
    size: 5Gi
