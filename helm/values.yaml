# Default values for the octo chart. The k3s Terraform renders an override
# values.yaml on the VM (image registry/tag, domain, postgres password); these
# defaults keep `helm template`/`helm lint` working and document every knob.

nameOverride: ""
fullnameOverride: ""

# Pod- and container-level settings applied to EVERY octo workload (platform,
# orchestrator, logs, postgres, nats, schema). Anything set here can be
# overridden per component by setting the same key under that component — e.g.
# `defaults.resources` for the common case, `postgres.resources` where Postgres
# needs more.
#
# This block exists because every deployment target wants the same settings on
# all five workloads at once: GKE Autopilot requires resources and a restricted
# securityContext everywhere, EKS wants the same scheduling constraints
# everywhere. Without it each profile would repeat itself five times, which is
# how values files drift. Empty here so the stock install is unopinionated; the
# values-*.yaml profiles fill it in per target.
defaults:
  # CPU/memory requests and limits. REQUIRED on GKE Autopilot — it injects
  # defaults when they are missing, so set them explicitly to control cost.
  resources: {}
  # Pod-level securityContext (fsGroup, runAsUser, seccompProfile, ...).
  podSecurityContext: {}
  # Container-level securityContext. The cloud profiles set the restricted
  # baseline: runAsNonRoot, drop ALL capabilities, no privilege escalation.
  securityContext: {}
  # Pulling from a private registry (ECR, a mirrored Artifact Registry).
  imagePullSecrets: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  # Extra pod metadata. podAnnotations is also where a checksum annotation goes
  # if you want a config change to force a rollout.
  podAnnotations: {}
  podLabels: {}
  # Extra env / mounts appended to the container the chart builds.
  extraEnv: []
  envFrom: []
  extraVolumes: []
  extraVolumeMounts: []
  # Probes beyond the readiness probe each component already defines.
  livenessProbe: {}
  startupProbe: {}
  revisionHistoryLimit: null
  strategy: {}

# Shared image coordinates. Defaults to the public images on Docker Hub (see
# #199) so `helm install` works with no --set for anyone standing up their own
# cluster; the Terraform release root overrides both to Artifact Registry +
# the deployed version tag for this project's own production deployment.
# Per-component repository names are appended to registry.
image:
  registry: "docker.io/juancavallotti"
  tag: latest
  pullPolicy: IfNotPresent

platform:
  repository: octo-platform-paas
  replicas: 1
  service:
    port: 3000

orchestrator:
  repository: octo-orchestrator-paas
  replicas: 1
  service:
    port: 8090
  # Stage 2 (per-integration external endpoints). When baseDomain is set the
  # orchestrator creates an Ingress per externally-exposed deployment at
  # {subdomain}.{baseDomain}. clusterIssuer empty = no TLS annotation and no
  # per-host cert (wildcardTLS or an externally-terminated cluster still work);
  # set it only to a ClusterIssuer that actually exists on the target cluster —
  # it is not assumed, unlike the k3s bootstrap's own letsencrypt-prod.
  baseDomain: ""
  clusterIssuer: ""
  # IngressClassName on every per-integration Ingress. Empty omits the field,
  # letting the cluster's default IngressClass (if any) claim it — the safe
  # choice on a cluster that isn't this project's own k3s bootstrap.
  ingressClass: traefik
  # Extra annotations merged onto every per-integration Ingress — e.g.
  # controller-specific body-size or timeout annotations. The cert-manager
  # cluster-issuer annotation (when clusterIssuer is set) always wins on
  # key collision.
  ingressAnnotations: {}
  # The orchestrator talks to the Kubernetes API, so it runs as its own account
  # with a namespaced Role. Set create=false and supply a name when the account
  # must carry a cloud identity the chart shouldn't own — a GKE Workload Identity
  # or EKS IRSA account created by Terraform. annotations is the lighter-weight
  # alternative: keep the chart's account and just bind an identity to it, e.g.
  #   iam.gke.io/gcp-service-account: octo@PROJECT.iam.gserviceaccount.com
  #   eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT:role/octo
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  rbac:
    create: true

# Log-aggregator service: consumes the NATS internal.logs subject (competing
# consumer) and persists events to Postgres; serves the read query API the
# platform's /logs view calls. Replicas scale safely (NATS queue group).
logs:
  repository: octo-logs-paas
  replicas: 1
  service:
    port: 8091

# Generic runtime image the orchestrator deploys per integration. Passed to the
# orchestrator as RUNTIME_IMAGE; pre-pulled into containerd at provision so
# integration pods (imagePullPolicy IfNotPresent) never hit the registry later.
runtime:
  repository: octo-runtime-paas
  # Runtime-services backend the orchestrator injects into each deployed runtime
  # pod (RUNTIME_SERVICES_MODULE). "k8s" = Lease-based leader election (so a cron
  # connector fires on one replica) + the orchestrator-backed KV store; "standalone"
  # = in-process noop. Cluster deploys want "k8s".
  servicesModule: k8s
  # Account the orchestrator sets on every runtime pod it deploys. It only grants
  # coordination.k8s.io Leases (leader election). Same create/name/annotations
  # contract as the orchestrator's own account above — annotate it when deployed
  # integrations need a cloud identity of their own.
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  rbac:
    create: true

# Deployment-scoped KV store the orchestrator serves for the runtime. encryptionKey
# is a base64-encoded 32-byte (AES-256) key used to encrypt values in secret
# namespaces (*_secrets) at rest; plain namespaces are stored as-is (no crypto cost).
# Empty disables encryption: secret-namespace writes are rejected, plain KV still
# works. Terraform generates and supplies it on the platform (held in release state).
kv:
  encryptionKey: ""

# Schema applier image (built from sql/Dockerfile); run as a post-install/upgrade
# hook job to apply sql/schema.sql idempotently.
schema:
  repository: octo-schema-paas

postgres:
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  auth:
    username: octo
    password: octo
    database: octo
  storage:
    size: 5Gi
    # Empty -> cluster default StorageClass (k3s ships local-path).
    storageClassName: ""
  service:
    port: 5432
  resources: {}

# NATS message broker for cross-process pub-sub. Core NATS only (no JetStream):
# ephemeral fan-out, so no volume — but still a StatefulSet (+ headless service)
# for the stable per-pod identity cluster routes need when scaling out, per the
# official NATS chart. Its in-cluster URL is injected into the orchestrator as
# NATS_URL. Set enabled=false to omit it entirely. Uses the public nats image
# (pulled on demand by k3s).
nats:
  enabled: true
  image:
    repository: nats
    tag: "2.10-alpine"
    pullPolicy: IfNotPresent
  service:
    port: 4222
    monitorPort: 8222
  resources: {}

# OIDC single sign-on for the editor (Auth.js). Disabled by default so local and
# bare deploys stay open; enable on the platform. When enabled the chart creates
# an auth Secret and the editor mounts these as env vars (AUTH_EETR_*, AUTH_SECRET).
# Terraform supplies the sensitive values from Secret Manager (see deploy/terraform).
auth:
  oidc:
    enabled: false
    issuer: "https://auth.eetr.app"
    clientId: ""
    clientSecret: ""
  # Auth.js session secret (AUTH_SECRET); generated by Terraform.
  secret: ""
  # Optional: restrict write/mutating operations to these comma-separated roles.
  # Empty = any signed-in user.
  writeRoles: ""
  # Optional: id-token claim carrying roles (Auth.js default is "roles").
  rolesClaim: ""

ingress:
  enabled: true
  className: traefik
  # Editor host. Always gets its own per-host HTTP-01 cert (see ingress.tls
  # below), independent of wildcardTLS — it does not need to be the same domain
  # as orchestrator.baseDomain.
  host: octo.juancavallotti.com
  annotations: {}
  tls:
    enabled: true
    secretName: octo-tls
    clusterIssuer: letsencrypt-prod

# Shared wildcard TLS cert for orchestrator.baseDomain (below) and every
# {slug}.{baseDomain} per-integration subdomain, issued once by cert-manager via
# DNS-01 (the only ACME method that can mint a wildcard). baseDomain may be the
# same domain as ingress.host (a single-domain setup) or a different,
# Cloud-DNS-delegated domain — e.g. when ingress.host's registrar won't allow
# delegating the whole zone but a subdomain of it can still be delegated.
# Requires the DNS-01 ClusterIssuer (provisioned by the VM bootstrap) and DNS
# admin on baseDomain's zone.
wildcardTLS:
  enabled: false
  secretName: octo-wildcard-tls
  clusterIssuer: letsencrypt-dns
