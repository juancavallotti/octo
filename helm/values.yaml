# Default values for the octo chart. The k3s Terraform renders an override
# values.yaml on the VM (image registry/tag, domain, postgres password); these
# defaults keep `helm template`/`helm lint` working and document every knob.

nameOverride: ""
fullnameOverride: ""

# Pod- and container-level settings applied to EVERY octo workload (platform,
# orchestrator, logs, postgres, nats, schema). Anything set here can be
# overridden per component by setting the same key under that component — e.g.
# `defaults.resources` for the common case, `postgres.resources` where Postgres
# needs more.
#
# This block exists because every deployment target wants the same settings on
# all five workloads at once: GKE Autopilot requires resources and a restricted
# securityContext everywhere, EKS wants the same scheduling constraints
# everywhere. Without it each profile would repeat itself five times, which is
# how values files drift. Empty here so the stock install is unopinionated; the
# values-*.yaml profiles fill it in per target.
defaults:
  # CPU/memory requests and limits. REQUIRED on GKE Autopilot — it injects
  # defaults when they are missing, so set them explicitly to control cost.
  resources: {}
  # Pod-level securityContext (fsGroup, runAsUser, seccompProfile, ...).
  podSecurityContext: {}
  # Container-level securityContext. The cloud profiles set the restricted
  # baseline: runAsNonRoot, drop ALL capabilities, no privilege escalation.
  securityContext: {}
  # Pulling from a private registry (ECR, a mirrored Artifact Registry). A list
  # of {name: secret-name}, as in a pod spec. Set here it covers all five chart
  # workloads AND the integration pods the orchestrator creates at runtime, which
  # pull the same runtime image from the same place — see runtime.imagePullSecrets
  # for why those need saying separately.
  imagePullSecrets: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  # Extra pod metadata. podAnnotations is also where a checksum annotation goes
  # if you want a config change to force a rollout.
  podAnnotations: {}
  podLabels: {}
  # Extra env / mounts appended to the container the chart builds.
  extraEnv: []
  envFrom: []
  extraVolumes: []
  extraVolumeMounts: []
  # Probes beyond the readiness probe each component already defines.
  livenessProbe: {}
  startupProbe: {}
  revisionHistoryLimit: null
  strategy: {}

# Not in this file, deliberately: PodDisruptionBudget, HorizontalPodAutoscaler
# and NetworkPolicy. A PDB over a single replica either permits the eviction it
# exists to prevent or blocks node drains; an HPA on these workloads scales the
# wrong thing, since throughput lives in the integration pods the orchestrator
# creates rather than in the chart's own; and a NetworkPolicy depends on what
# else shares the namespace and on a CNI that enforces it — one silently
# unenforced is worse than none, because it reads as protection. Write your own
# against the app.kubernetes.io/component labels every workload carries.
# Documented at /deploy/helm#what-the-chart-does-not-create.

# Shared image coordinates for the octo-* images. Defaults to the public images
# on Docker Hub (see #199) so `helm install` works with no --set for anyone
# standing up their own cluster; the Terraform release root overrides these to
# Artifact Registry for this project's own production deployment.
# Per-component repository names are appended to registry.
#
# Every component also accepts an `image` block overriding any of these
# individually, plus a digest:
#   platform:
#     image:
#       registry: ""       # override the shared registry for this image only
#       repository: ""     # override the component's repository name
#       tag: ""            # override the shared tag
#       digest: ""         # sha256:... -- wins over any tag
#       pullPolicy: ""     # override the shared pull policy
# CI renders exactly that shape (a digest per component) after pushing, so a
# release deploys the precise images that build produced rather than whatever a
# mutable tag points at later.
image:
  registry: "docker.io/juancavallotti"
  # Empty falls back to the chart's appVersion, which release-please keeps equal
  # to the release version. That is what makes `helm install oci://.../octo
  # --version X` pull the images of release X instead of drifting onto :latest.
  tag: ""
  pullPolicy: IfNotPresent

platform:
  repository: octo-platform-paas
  image: {}
  replicas: 1
  service:
    port: 3000
    # Service type. ClusterIP by default — the editor is reached through the
    # Ingress. NodePort for local clusters (k3d/kind) that map a host port;
    # LoadBalancer where a cloud LB fronts it directly.
    type: ClusterIP
    # Annotations on the Service — e.g. cloud.google.com/neg on GKE for
    # container-native load balancing, or service.beta.kubernetes.io/aws-* on
    # EKS to shape the NLB.
    annotations: {}
    # Fixed NodePorts keyed by port name, for local clusters that map host
    # ports. Empty lets Kubernetes allocate one.
    nodePorts: {}
    externalTrafficPolicy: ""

orchestrator:
  repository: octo-orchestrator-paas
  image: {}
  replicas: 1
  service:
    port: 8090
    # Service type. ClusterIP by default — the orchestrator stays internal
    # behind the platform's BFF proxy. NodePort for local clusters (k3d/kind) that map a host port;
    # LoadBalancer where a cloud LB fronts it directly.
    type: ClusterIP
    # Annotations on the Service — e.g. cloud.google.com/neg on GKE for
    # container-native load balancing, or service.beta.kubernetes.io/aws-* on
    # EKS to shape the NLB.
    annotations: {}
    # Fixed NodePorts keyed by port name, for local clusters that map host
    # ports. Empty lets Kubernetes allocate one.
    nodePorts: {}
    externalTrafficPolicy: ""
  # Stage 2 (per-integration external endpoints). When baseDomain is set the
  # orchestrator creates an Ingress per externally-exposed deployment at
  # {subdomain}.{baseDomain}. clusterIssuer empty = no TLS annotation and no
  # per-host cert (wildcardTLS or an externally-terminated cluster still work);
  # set it only to a ClusterIssuer that actually exists on the target cluster —
  # it is not assumed, unlike the k3s bootstrap's own letsencrypt-prod.
  baseDomain: ""
  clusterIssuer: ""
  # IngressClassName on every per-integration Ingress. Empty — the default —
  # omits the field, letting the cluster's default IngressClass (if any) claim
  # it. Set it to match ingress.className below wherever the cluster has no
  # default IngressClass, or has one that is not the controller you want these
  # endpoints on: an Ingress no controller claims never gets an address, and
  # nothing reports that as an error.
  ingressClass: ""
  # Extra annotations merged onto every per-integration Ingress — e.g.
  # controller-specific body-size or timeout annotations. The cert-manager
  # cluster-issuer annotation (when clusterIssuer is set) always wins on
  # key collision.
  ingressAnnotations: {}
  # The orchestrator talks to the Kubernetes API, so it runs as its own account
  # with a namespaced Role. Set create=false and supply a name when the account
  # must carry a cloud identity the chart shouldn't own — a GKE Workload Identity
  # or EKS IRSA account created by Terraform. annotations is the lighter-weight
  # alternative: keep the chart's account and just bind an identity to it, e.g.
  #   iam.gke.io/gcp-service-account: octo@PROJECT.iam.gserviceaccount.com
  #   eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT:role/octo
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  rbac:
    create: true
  # Dev runs: the editor's Run, executed as a pod the orchestrator creates instead of a
  # child process of whichever platform replica answered the request. That is the point —
  # the platform runs several replicas with no session affinity, so a run living in one
  # replica's memory is invisible to the others.
  #
  # A dev run needs no RBAC and no ServiceAccount of its own (see devruntime above: it is
  # the standalone build, so it holds no cluster credential), which is why nothing here
  # grants anything. It does need the two images and this orchestrator's own in-cluster
  # URL, all of which the chart already knows.
  devRuns:
    # On by default: this is the PaaS chart, and running each editor Run as a pod of its
    # own — rather than inside whichever replica answered the request — is what lets the
    # platform scale past a single replica at all. Requires a hashSecret below; the chart
    # refuses to render without one, deliberately (see that field and devrun-secret.yaml).
    #
    # Turn it off for an install that does not want the editor's Run — a single-replica
    # deployment where nobody needs it. Note that with baseDomain unset a networked run
    # still starts, reloads and streams logs; it simply publishes no public endpoint, so
    # there is no external test URL to reach it by.
    enabled: true
    # How long a run survives with nobody touching it before the orchestrator reaps it.
    # The only bound on how many pods an editing session can leave behind; there is no
    # per-user cap yet.
    idleTimeout: 60m
    # The port a dev run's sidecar serves its reload and status API on, inside the pod.
    # Never reached from outside it.
    sidecarPort: 8099
    # HMAC key for deriving each dev run's identity AND its public hostname from
    # (user, integration). Required when enabled — the orchestrator refuses to start
    # without it, and the chart refuses to render, both deliberately. Unkeyed, the
    # hostname would be a pure function of two ids an outsider can often guess, and that
    # hostname is the only thing guarding a publicly reachable dev run.
    #
    # Supplied, never generated by the chart, for one reason: this value must NOT change.
    # Rotating it re-labels every exposed dev run, so a webhook registered with Stripe or
    # GitHub against the old hostname silently stops being delivered — with no error
    # anywhere. A chart that generated one would rotate it on any render that could not
    # read the cluster (`helm template`, `--dry-run`, a GitOps pipeline), which is exactly
    # the kind of breakage nobody would connect to an upgrade. Generate it once and hold
    # it wherever the KV encryption key is held.
    #
    # Any string; its bytes are used as an HMAC key, so there is no length or encoding
    # requirement. 48+ random characters is a sensible choice.
    hashSecret: ""
    # Or name a Secret you already hold, and the chart creates none and requires no
    # hashSecret. The same reasoning as kv.existingSecret applies, and harder: this
    # key must not change, so it must not be somewhere that copies it around.
    # Clear hashSecret above when you set this — both together is refused, for the
    # reason given there. And note what neither can undo: revisions written before
    # the change still hold whatever value they were given.
    existingSecret: ""
    existingSecretKey: dev-run-hash-secret

  # Pod stats: a sidecar in every deployed integration pod that samples that
  # pod's own runtime metrics and writes a rolling week of them to Redis.
  #
  # What it is for. A deployed pod is observable only while somebody is
  # watching it — the runtime can serve metrics, nothing scrapes them, and when
  # a deployment misbehaved an hour ago there is no record of what it was
  # doing. This is that record.
  #
  # OFF BY DEFAULT, and off changes nothing: with `enabled: false` no pod gains
  # a container and no pod spec changes, so turning it on later is the only
  # thing that rolls a deployment. Turning it ON does roll every deployment in
  # the namespace once, because the runtime container gains OCTO_METRICS — the
  # runtime does not serve /metrics unless asked, so there would otherwise be
  # nothing to scrape.
  #
  # It needs a Redis. With neither redis.enabled nor externalRedis the
  # orchestrator treats the feature as off rather than injecting a container
  # that fails every write and logs about it forever.
  #
  # WHAT IT COSTS THE CACHE. The stats go to the same Redis the trace folds and
  # the volatile KV tier use, so it is worth knowing the number rather than
  # guessing at it. Measured against a real runtime exposing 95 series (the go
  # and process collectors plus one flow's own), at the defaults below:
  #
  #   one live sample      534 bytes      live tier   3600 rows =  1.83 MiB
  #   one rollup bucket   2171 bytes      rollup tier  168 rows =  0.35 MiB
  #                                       TOTAL PER POD         =  2.19 MiB
  #
  # So ten pods is about 22 MiB of the 256 MiB below, which is why that number
  # is unchanged. Series count is what moves it — a busy integration with
  # metricsBlocks on has more — so re-measure before assuming it still holds at
  # a much larger installation.
  #
  # Rows are dictionary-encoded: each series identity is written once and a
  # sample is a flat array of numbers. Self-describing JSON would be six to ten
  # times larger, and capturing every series would not fit. Every key is capped
  # and carries a TTL, so a deleted pod's data ages out on its own with nothing
  # to sweep it.
  podStats:
    enabled: false
    # The port the sidecar serves its probes and status page on, inside the pod.
    # Never reached from outside it. /status is a useful first stop when a
    # deployment's stats look wrong: kubectl port-forward and read the counters.
    port: 8098
    # How often the sidecar samples the runtime's metrics. This is the live
    # tier's resolution.
    sampleInterval: 1s
    # How wide a history bucket is. When one closes, its samples collapse to a
    # single row: counters to how much they grew, gauges to their mean with min,
    # max and last alongside.
    #
    # WORTH EXPERIMENTING WITH. A week of hourly rows is 168 per pod, so there is
    # a lot of room to go finer — 15m is 672, still nothing, and four times the
    # resolution when you go looking for when something started. The live tier
    # shrinks to match, since it holds exactly one bucket's worth of samples.
    rollupInterval: 1h
    # How far back the history tier reaches. Beyond this the oldest rows are
    # trimmed and the keys expire.
    retention: 168h

# The embedding server: text in, vectors out, for anything on this installation
# that needs them — today, ranking a search of agent memory by meaning instead of
# by words.
#
# OFF BY DEFAULT, and off is a supported way to run. With no key there is no
# component and no EMBEDDINGS_URL, and searching agent memory falls back to
# matching text. Nothing else changes: the same query, the same shape of results.
#
# WHY THIS IS A CHART VALUE AND NOT AN ADMIN SETTING. The model cannot be changed
# once anything has been embedded. Vectors carry no record of which model made
# them, so a store holding two models' vectors cannot be ranked coherently —
# keeping one embedding space at a time is what makes that simplification safe.
# Changing `model` below means re-embedding everything already stored, which the
# backfill will do, at whatever your provider charges for the whole store again.
# A control with that consequence does not belong behind a Save button.
#
# WHY IT IS A SERVICE AND NOT A LIBRARY. It holds the provider key so that no
# integration pod has to. Every pod is given the URL — an embedding is cheap and
# grants access to nothing — but the key stays here.
embeddings:
  enabled: false
  repository: octo-embeddings-paas
  image: {}
  # It holds no state, so replicas are purely throughput. Raise it if a large
  # backfill is the thing you are waiting on.
  replicas: 1

  # Which provider connector the server builds: llm-openai, llm-gemini or
  # llm-openrouter.
  #
  # llm-anthropic is not a valid value and cannot be made one — Anthropic has no
  # embeddings API, so the connector does not implement the capability and the
  # flow is refused when it is BUILT. That is a clear startup failure rather than
  # a surprise on the first embed.
  connectorType: llm-openai

  # The embedding model, provider-specific. Read the note above before changing
  # it on an installation that has already embedded anything.
  model: text-embedding-3-small

  # The stored vector width. It MUST match the `vector(N)` columns in
  # sql/schema.sql, which are indexed and therefore fixed at schema time. It is
  # requested of the provider (most embeddings APIs take a desired-dimensions
  # parameter); a model that cannot produce this width fails the call and says so.
  dimensions: 1536

  # The provider API key. Required when enabled, unless existingSecret names one
  # you manage yourself.
  apiKey: ""
  # A Secret you already hold carrying the key instead, and the chart creates
  # none. Preferred, for the reason kv.existingSecret gives: every value handed
  # to Helm is kept in the release history. Clear apiKey when you set this —
  # both together is refused.
  existingSecret: ""
  existingSecretKey: apiKey

  service:
    port: 8092
    annotations: {}

# The observability service. It consumes internal.logs and internal.traces into
# Postgres, serves the query API over both, the pod stats the stats sidecar
# writes to Redis, the retention policy, and the storage report.
observability:
  repository: octo-observability-paas
  image: {}
  # Both consumers join queue groups, so extra replicas share each stream rather
  # than each storing every record. A trace's records may be split across
  # replicas: every summary column is an order-independent aggregate and the
  # upserts are issued in trace-id order, so the halves merge to the same answer
  # and concurrent writers cannot deadlock on each other.
  replicas: 1

  # Where the prices for traced model calls come from. A model call is priced
  # once, at ingest, and the cost is stored frozen: refreshing a rate must never
  # restate what last month already cost.
  prices:
    # Which catalogues to price against, most preferred first. Empty uses
    # "openrouter,helicone": OpenRouter's card is priced per model by the
    # platform that sells them and turns over daily, and Helicone's carries the
    # patterns OpenRouter never publishes (Bedrock, Azure, vendor-hosted ids), so
    # a model either one knows is priced. Name a single source to use only it.
    sources: ""
    # Empty uses the service's own default, Helicone's public catalogue. Set it
    # to a mirror for a cluster without egress. A cluster that can reach neither
    # still serves whatever rates are already in llm_prices, and records what it
    # could not fetch in llm_price_syncs.
    url: ""
    # The same, for OpenRouter's public model list. It needs no API key -- the
    # list is what a caller consults before deciding to buy anything.
    openrouterUrl: ""
    # How often the catalogues are re-read, as a Go duration. Empty uses the
    # service's default of 12h; published prices move on the order of months, so
    # this is about not drifting indefinitely rather than being current.
    refreshInterval: ""

  service:
    port: 8091
    # Service type. ClusterIP by default — the query API stays internal
    # behind the platform's BFF proxy. NodePort for local clusters (k3d/kind) that map a host port;
    # LoadBalancer where a cloud LB fronts it directly.
    type: ClusterIP
    # Annotations on the Service — e.g. cloud.google.com/neg on GKE for
    # container-native load balancing, or service.beta.kubernetes.io/aws-* on
    # EKS to shape the NLB.
    annotations: {}
    # Fixed NodePorts keyed by port name, for local clusters that map host
    # ports. Empty lets Kubernetes allocate one.
    nodePorts: {}
    externalTrafficPolicy: ""

# Data retention: the nightly job that asks the observability service to enforce whatever
# retention policy the admin section has stored.
#
# There are two switches and they answer different questions. This one decides
# whether the CronJob exists at all. The policy itself — how many days of logs,
# how many days of traces — lives in the database and is edited at
# /platform/admin/retention, because it is an operational decision rather than a
# deployment one.
#
# Enabled by default is safe because the policy defaults to keeping everything: a
# fresh install runs a nightly no-op until somebody sets a window, and turning
# retention on later needs no chart change. Set enabled=false to remove the
# CronJob outright — the endpoint it calls stays served either way, so Run now on
# the admin page still works.
retention:
  enabled: true
  # When the sweep runs, in the cluster's timezone. Deliberately in the small
  # hours: a first sweep after a policy is switched on can be the whole of both
  # tables, and it competes with ingest while it runs.
  schedule: "0 3 * * *"
  # The job is one HTTP POST, and the octo images are distroless with no shell
  # and no client to make it with. So it borrows a third-party curl image, under
  # the same registry rules as postgres and nats above: empty registry means
  # Docker Hub, and it deliberately does NOT inherit the shared image.registry,
  # which holds the octo-* images only.
  image:
    registry: ""
    repository: curlimages/curl
    tag: "8.11.1"
    pullPolicy: IfNotPresent
  # How long curl waits for the sweep, in seconds. It matches the aggregator's
  # own limit on a sweep, so neither side gives up while the other is still
  # working — a client that timed out first would abandon a purge that was making
  # progress, every night, and never converge.
  timeoutSeconds: 900
  # Retries within a single scheduled run. Low on purpose: a sweep that fails
  # twice is not going to succeed on the third try, and the next night's run
  # picks up wherever this one stopped — each batch commits on its own, so a
  # partial sweep is simply less deleted, never inconsistent.
  backoffLimit: 2
  # Skip a run entirely if the previous one is still going, rather than stacking
  # sweeps that would only refuse each other with a 409.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

# Generic runtime image the orchestrator deploys per integration. Passed to the
# orchestrator as RUNTIME_IMAGE; pre-pulled into containerd at provision so
# integration pods (imagePullPolicy IfNotPresent) never hit the registry later.
runtime:
  repository: octo-runtime-paas
  image: {}
  # Pull secrets for the integration pods, which are created by the orchestrator
  # and not by this chart — so they are passed to it as RUNTIME_IMAGE_PULL_SECRETS
  # rather than rendered into a pod spec here.
  #
  # Empty inherits defaults.imagePullSecrets, which is what you want: a mirrored
  # registry holds every octo image, so one setting covers the chart's own
  # workloads and the integrations alike. Set it here only when the runtime image
  # lives somewhere the rest do not.
  imagePullSecrets: []
  # Runtime-services backend the orchestrator injects into each deployed runtime
  # pod (RUNTIME_SERVICES_MODULE). "k8s" = Lease-based leader election (so a cron
  # connector fires on one replica) + the orchestrator-backed KV store; "standalone"
  # = in-process noop. Cluster deploys want "k8s".
  servicesModule: k8s
  # Account the orchestrator sets on every runtime pod it deploys. It only grants
  # coordination.k8s.io Leases (leader election). Same create/name/annotations
  # contract as the orchestrator's own account above — annotate it when deployed
  # integrations need a cloud identity of their own.
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  rbac:
    create: true

# Images for a *dev run* — the editor's Run, executed as a pod of its own rather than as a
# child of a platform replica. See orchestrator.devRuns below for the feature itself.
#
# Two containers, two images. Both are built from Dockerfiles already in this repo and
# published alongside the rest, so they follow the same registry/tag/digest layering as
# every other component.
devsidecar:
  repository: octo-devsidecar-paas
  image: {}
# The pod stats sidecar, which runs beside a DEPLOYED integration rather than a
# dev run — see orchestrator.podStats for the feature. It is here with the other
# orchestrator-injected images because it is injected the same way and follows
# the same registry/tag/digest layering; nothing about it is dev-run specific.
statssidecar:
  repository: octo-statssidecar-paas
  image: {}
# The runtime a dev run executes, which is deliberately NOT runtime.repository above.
# That image is the `k8s` build: it carries Lease-based leader election, the
# orchestrator-backed KV store, NATS queues and log shipping, and it *exits* without a
# runtime-services module configured. A dev run wants none of that — it is one process
# running one integration for one editor — so it runs the standalone build, the same one
# `octo run` gives you locally. The two are mutually exclusive Go build tags, which is why
# this is a second image and not a second tag.
devruntime:
  repository: octo-devruntime-paas
  image: {}

# The agentic runner: the image a deployment runs when it asks for
# `runner: agentic`, instead of runtime.repository above.
#
# It carries the same k8s runtime as that image, plus the things a flow needs when it
# runs local programs rather than serving requests: a shell, curl, jq, the STANDALONE
# octo CLI and dolphin, and a scratch workspace at /workspace. The standard runtime
# image is distroless — one static binary, no shell, nothing writable — which is right
# for the integrations that serve a webhook and leaves a `cli-run` block with nothing
# to run. Dr. Octo is the first deployment to ask for this one; it is what lets him
# write a definition, invoke it, and run its test suite in his own pod.
#
# Leaving this unset does not degrade the runner, it removes it: the orchestrator
# refuses an agentic deploy naming this value, rather than serving the distroless image
# and leaving every command to fail with "not found".
#
# TREAT IT AS PRIVILEGED, not merely larger. A pod holding a shell and a runtime it can
# point at a definition it just wrote is a general execution environment, so the
# boundary it offers is the pod — not the `cli-run` allow list inside it. What that pod
# holds (its own env, including any secret bound to it) and what it can reach on the
# network are reachable by anything it runs. Do not grant it to an integration whose
# definition comes from somewhere you do not trust.
agenticrunner:
  repository: octo-agenticrunner-paas
  image: {}
  # Cap on the /workspace emptyDir. A cap, not an allocation: the volume costs nothing
  # until it is written to. Without one the workspace is bounded only by the node's
  # disk, so a runaway command evicts every pod on the node rather than only this one.
  workspaceSize: 100Mi
  # CPU/memory requests and limits for the agentic runner's container, passed to the
  # orchestrator as JSON. Unlike defaults.resources above this cannot go through the
  # chart's own layering: integration pods are created by the orchestrator at deploy
  # time and not rendered here — the same reason runtime.imagePullSecrets needs saying
  # separately.
  #
  # Empty means none, which is what every integration pod carries today. Set them on a
  # cluster that requires resources (GKE Autopilot does) or where this pod's appetite
  # for CPU should not be the node's problem — it is the one workload whose purpose is
  # running other programs.
  resources: {}
    # requests:
    #   cpu: 200m
    #   memory: 256Mi
    # limits:
    #   cpu: "1"
    #   memory: 1Gi

# Deployment-scoped KV store the orchestrator serves for the runtime. encryptionKey
# is a base64-encoded 32-byte (AES-256) key used to encrypt values in secret
# namespaces (*_secrets) at rest; plain namespaces are stored as-is (no crypto cost).
# Empty disables encryption: secret-namespace writes are rejected, plain KV still
# works. Terraform generates and supplies it on the platform (held in release state).
kv:
  encryptionKey: ""
  # Name an existing Secret holding the key instead, and the chart creates none.
  # Clear encryptionKey above when you do — setting both is refused, because Helm
  # keeps every value it is given in the release history whether a template
  # renders it or not, so leaving it there keeps the copy this exists to avoid.
  # Prefer this: Helm keeps every value it is given in the release history, so an
  # inline key outlives the revision that introduced it, and it also lives in
  # whatever wrote the values — a GitOps repository, a pipeline variable, a
  # deployment record in a panel. This key cannot be rotated to recover from that:
  # a new one makes every value already written to a secret namespace unreadable.
  existingSecret: ""
  existingSecretKey: kv-encryption-key

# Schema applier image (built from sql/Dockerfile); run as a post-install/upgrade
# hook job to apply sql/schema.sql idempotently.
schema:
  repository: octo-schema-paas
  image: {}

# In-cluster Postgres. Set enabled=false to point the platform at a managed
# instance instead (Cloud SQL on GKE, RDS on EKS) — see externalDatabase below.
# When disabled the StatefulSet, its Service and its Secret are all skipped; the
# schema hook Job still runs, against the external host.
postgres:
  enabled: true
  # sslmode for the in-cluster connection. Traffic never leaves the cluster
  # network, so disable is the default; a service mesh or a stricter policy may
  # want require.
  sslmode: disable
  image:
    # Third-party image: it deliberately does NOT inherit the shared
    # image.registry, which holds the octo-* images only. Empty means Docker
    # Hub; point it at a mirror for clusters that can't reach Docker Hub.
    #
    # pgvector's own image rather than plain postgres, because agent memory
    # stores embeddings and `CREATE EXTENSION vector` needs the extension
    # present in the server image. It is Debian-based and so larger than the
    # alpine tag it replaces (~150MB vs ~80MB) — which is a StatefulSet pulled
    # once, so the trade is not close.
    #
    # Staying on alpine was checked, not assumed. Alpine's postgresql-pgvector
    # package builds against Alpine's OWN postgresql18 and installs to
    # /usr/lib/postgresql18/, while postgres:16-alpine ships its own PG16 under
    # /usr/local/: installing it pulls in a second PostgreSQL, makes 18 the
    # default, and puts vector.so where PG16 never looks. The only alpine route
    # is compiling pgvector in a builder stage, which would make this project
    # the publisher and CVE-owner of a Postgres SERVER image to save ~70MB.
    #
    # Major version stays at 16: pg18 exists, but a major bump will not start
    # against an existing PGDATA volume without pg_upgrade or dump/restore, and
    # deploy/terraform/modules/cloudsql pins POSTGRES_16. That is its own change
    # with its own upgrade path, and it has nothing to do with agent memory.
    registry: ""
    repository: pgvector/pgvector
    tag: "pg16"
    pullPolicy: IfNotPresent
  auth:
    username: octo
    database: octo
    # REQUIRED, and deliberately empty rather than defaulted.
    #
    # This used to ship as `octo`, which was defensible while the only installs
    # were Terraform's — it always passed one — and stopped being defensible the
    # moment the chart went to a public registry. A default password is not a
    # default: it is a credential published in this file, and the install that
    # takes it says nothing about having done so.
    #
    # Rendering fails without this or existingSecret below. Generating one
    # instead was the alternative, and it is worse here: a generated password
    # has to be recovered from the cluster to be used, and `helm upgrade`
    # regenerates it unless the chart reads back its own Secret, which turns
    # every dry run and every `helm template` into a different password.
    password: ""
    # Alternative to password: the name of a Secret you already own that holds
    # it. This is the better answer wherever something else — Terraform,
    # external-secrets, a sealed secret — is the source of truth, because every
    # value handed to Helm is kept in the release history, and a password there
    # outlives the database it belonged to.
    #
    # The chart still creates its own Secret for the username and database name;
    # only the password comes from yours.
    existingSecret: ""
    existingSecretPasswordKey: postgres-password
  storage:
    size: 5Gi
    # Empty -> cluster default StorageClass (k3s ships local-path).
    storageClassName: ""
    # Single-node clusters only (k3d, kind, a single-node k3s VM). Set this to a
    # node path and the chart creates a static PersistentVolume bound to it
    # instead of provisioning one dynamically, so the database lives at a fixed,
    # predictable location that survives the cluster being deleted and recreated.
    #
    # Without it, a local-path-style provisioner names each volume's directory
    # after the claim's UID, so recreating the cluster silently starts from an
    # empty database while the old directory lingers on disk.
    #
    # Leave empty on any managed cluster: hostPath is node-local (wrong the
    # moment there is more than one node) and GKE Autopilot rejects it outright.
    hostPath: ""
    # PersistentVolume hostPath type, when hostPath is set.
    #
    # DirectoryOrCreate suits a laptop cluster, where the path is a bind mount
    # that may not exist yet. It is the wrong choice wherever the path is meant
    # to be a mount point on a separate disk: if that disk failed to mount,
    # kubelet cheerfully creates the directory on the root filesystem instead
    # and Postgres initialises an empty database there, with nothing to
    # distinguish it from a healthy install until the disk is needed.
    #
    # Directory refuses to mount a path that does not exist, so the same failure
    # surfaces as a Pending pod naming the missing path.
    hostPathType: DirectoryOrCreate
  service:
    port: 5432
  resources: {}

# Managed database used when postgres.enabled is false — Cloud SQL on GKE, RDS
# on EKS, or any reachable Postgres.
#
# Prefer existingSecret over password: a managed instance's credential is issued
# by the cloud provider, so it belongs in a Secret owned by Terraform or an
# external-secrets operator rather than in Helm values, which persist in release
# history. Supplying `password` makes the chart create the Secret itself, which
# is convenient for a trial and wrong for production.
externalDatabase:
  host: ""
  port: 5432
  user: octo
  database: octo
  sslmode: require
  # Name of an existing Secret holding the password, and the key within it.
  existingSecret: ""
  existingSecretPasswordKey: password
  # Only used when existingSecret is empty.
  password: ""

# NATS message broker for cross-process pub-sub. Core NATS only (no JetStream):
# ephemeral fan-out, so no volume — but still a StatefulSet (+ headless service)
# for the stable per-pod identity cluster routes need when scaling out, per the
# official NATS chart. Its in-cluster URL is injected into the orchestrator as
# NATS_URL. Set enabled=false to omit it entirely. Uses the public nats image
# (pulled on demand by k3s).
nats:
  enabled: true
  image:
    # Third-party image; same registry rules as postgres above.
    registry: ""
    repository: nats
    tag: "2.10-alpine"
    pullPolicy: IfNotPresent
  service:
    port: 4222
    monitorPort: 8222
  resources: {}

# Redis, for state that has to be shared between replicas of a component rather
# than held in one process. It is bundled the same way NATS is — a StatefulSet, a
# ClusterIP Service, the public image, no authentication — because it sits behind
# the same boundary: reachable only from inside the namespace, and holding nothing
# that outlives a few seconds.
#
# Its first consumer is the telemetry aggregator, which folds the run of trace
# records a streaming block emits into one row. The consumers are a NATS queue
# group, so one trace's records are already spread across whichever replicas are
# running, and a fold held in one process would quietly stop working the moment
# `observability.replicas` went above 1.
#
# Unlike nats.enabled, turning this off is not simply "omit the component": the
# aggregator refuses to start without a Redis to fold in, so an install with
# neither this nor externalRedis.url fails while rendering, with a message saying
# so. That is deliberate — the alternative is a component that comes up healthy
# and silently stops doing the thing it was changed to do.
#
# There is no persistence and there is no volume. What lives here is regenerated
# within seconds of being lost: the trace records in the folds that were open — the
# same at-most-once contract the rest of the trace pipeline ships with — and the
# volatile half of the object store, whose entire contract is that losing it costs
# a recompute. Anything that must survive a restart is in Postgres instead.
#
# Integration pods reach this directly, the way they reach NATS, so it has to be
# reachable from them and not only from the orchestrator. With redis.enabled=false
# and no externalRedis, volatile objects fall back to the database — slower and
# more expensive, but not broken.
redis:
  enabled: true
  image:
    # Third-party image; same registry rules as postgres and nats above. Empty
    # registry means Docker Hub, and it deliberately does NOT inherit the shared
    # image.registry, which holds the octo-* images only.
    registry: ""
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  service:
    port: 6379
  # The ceiling the server holds itself to, and what it does on reaching it.
  #
  # Bounded on purpose. Unbounded, one fold that never closes grows until the pod
  # is OOM-killed and every other fold dies with it; bounded, Redis drops the
  # coldest keys and everything else carries on. 256Mi is generous for the fold
  # traffic a single installation produces — a fold is a few hundred bytes and
  # lives for seconds — so reaching it means something is wrong rather than busy.
  #
  # Set this BELOW the container memory limit if you set one, or the kernel gets
  # there before Redis does and the policy never runs.
  maxmemory: 256mb
  maxmemoryPolicy: allkeys-lru
  resources: {}

# A Redis this chart does not run — a managed one (Memorystore, ElastiCache), or
# one shared with something else in the cluster. Set one of these and
# redis.enabled=false.
#
# The whole connection is one string, because unlike the database none of it is
# resolved from separate values: a redis:// or rediss:// URL. Which of the two
# keys below it goes in depends on one thing — whether it contains a password.
# What answers a request that never reaches an integration: a hostname nothing is
# deployed at, or a deployment that is down.
#
# Without this the answer comes from the ingress controller itself — a white page
# with "404 page not found" on it — because such a request never reaches anything
# octo wrote. With it, those requests go to the platform, which serves a page that
# says which of the two happened and shows the hostname that was asked for.
#
# It costs no extra workload: the page is a route in the platform the chart already
# deploys. It does add one catch-all route for `*.{orchestrator.baseDomain}`, which
# is written to lose to every real deployment — see the header comment in
# templates/errorpages/catchall.yaml for how that is guaranteed per controller.
#
# Needs orchestrator.baseDomain; without one there is no wildcard to catch.
errorPages:
  enabled: true

  # Which ingress controller serves the wildcard: nginx, traefik or alb.
  #
  # Empty reads it off orchestrator.ingressClass, which covers the ordinary names.
  # The class is matched a segment at a time, so "traefik-public" and
  # "nginx-internal" are recognised while "notraefik" is not. Set this explicitly
  # when yours is named something the fallback cannot place: a class name is
  # free-form, and the controller is what decides how the catch-all is pinned below
  # your deployments' own routes.
  #
  # When no controller can be identified the catch-all is SKIPPED and the install
  # proceeds — you get your controller's own 404, which is where you started, and
  # NOTES.txt says so. Skipping rather than guessing because the failure being
  # avoided is not a missing error page, it is a wildcard route that outranks the
  # endpoints it was meant to sit behind. A value set here explicitly and not
  # recognised does fail the render: that one was typed on purpose.
  #
  # Gateway API mode does not use this for routing — the spec orders by hostname
  # specificity, so there is nothing to pin — but a value set here is still
  # validated, and an unrecognised one fails the render in either mode.
  controller: ""

  # Brand the backend-down cases too (502/503/504), not just the unmatched
  # hostname. This is off by default because it is the half that touches every
  # deployment's own Ingress rather than adding one beside them: it works by
  # telling the controller to fetch its error pages from the platform, via
  # orchestrator.ingressAnnotations, and a wrong annotation there affects live
  # endpoints. Turn it on once the 404 page is confirmed working.
  #
  # ingress-nginx only. Traefik expresses the same thing as an errors Middleware
  # and ALB does not express it at all, so on those classes this does nothing.
  backendErrors: false

  # ALB only. Rules within an ALB group are evaluated in ascending group.order, so
  # the catch-all is given a high one and lands after every deployment's rule.
  # Raise it if you run other Ingresses in the "octo" group at a higher order.
  albGroupOrder: 900

externalRedis:
  # A URL with NO credential in it. It is rendered into the workload as a literal
  # environment value, which is right for an address and wrong for a secret: a
  # rendered Deployment is readable by anyone who can read workloads, and that is
  # a wider audience than anyone who can read Secrets.
  url: ""
  # A Secret you created holding the whole URL, for the usual case where the
  # server wants a password. It wins over `url` when both are set, and the
  # variable is bound to it by reference so the credential never enters a
  # workload template. Create it yourself — the chart will not put a password of
  # yours into a manifest:
  #
  #   kubectl create secret generic octo-redis \
  #     --from-literal=redis-url='rediss://default:pw@cache.example:6380'
  existingSecret: ""
  existingSecretKey: redis-url

# OIDC single sign-on for the editor (Auth.js). Disabled by default so local and
# bare deploys stay open; enable on the platform. When enabled the chart creates
# an auth Secret and the editor mounts these as env vars (OIDC_*, AUTH_SECRET).
# Terraform supplies the sensitive values and holds them in its own (bucket-backed)
# release state — this setup uses no Secret Manager. See deploy/terraform.
#
# Any OIDC provider that speaks the authorization-code flow works — Octo ships
# none and privileges none. Register {auth.url}/api/auth/callback/oidc as the
# redirect URI on whichever one you bring. Note that MCP clients additionally
# need the provider to support Dynamic Client Registration; without it, users
# authenticate to /mcp with an Octo API key instead.
auth:
  oidc:
    enabled: false
    # Issuer URL — the base its .well-known/openid-configuration hangs off.
    issuer: ""
    clientId: ""
    # The client secret your identity provider issued. Required when SSO is on,
    # unless existingSecret below names a Secret that already holds it.
    clientSecret: ""
    # Optional: how the sign-in button names the provider ("Sign in with …").
    # Empty renders the app default, "OIDC".
    providerName: ""
    # Optional: absolute URL of a logo for that button. Empty tries the issuer's
    # favicon and falls back to no logo at all.
    providerLogo: ""
    # Optional: space-separated scopes. Empty requests "openid profile email".
    scopes: ""
    # Optional endpoint overrides, for providers whose discovery document is
    # unusable. Leave every one empty against a compliant provider — discovery
    # is the path that keeps working when the provider moves an endpoint.
    endpoints:
      authorization: ""
      token: ""
      userinfo: ""
      jwks: ""
  # Auth.js session secret (AUTH_SECRET). Required when SSO is on, unless
  # existingSecret below names a Secret that already holds it. Any random string
  # of reasonable length; `openssl rand -base64 32` is the usual way to mint one.
  secret: ""
  # Or name a Secret you already hold carrying BOTH of the values above, and the
  # chart creates none and requires neither.
  #
  # This is the preferred path, for the reason kv.existingSecret gives: every
  # value handed to Helm is kept in the release history, so an inline client
  # secret and session secret sit in a Secret in this namespace for as long as
  # the revision that carried them is retained — and also in whatever supplied
  # them, a GitOps repository or a pipeline variable. Both of these ARE
  # rotatable (re-issue the client secret at the provider; a new session secret
  # signs everyone out), which is the only reason this is a preference rather
  # than the sole option.
  #
  # Clear clientSecret and secret above when you set this — both together is
  # refused, for the same reason kv refuses it: suppressing the chart's Secret
  # does not unsay a value Helm has already recorded.
  #
  #   kubectl create secret generic octo-auth \
  #     --from-literal=oidc-client-secret=... \
  #     --from-literal=auth-secret="$(openssl rand -base64 32)"
  existingSecret: ""
  # Keys within it. Defaults match the names the chart's own Secret uses, so a
  # Secret created as above needs neither line.
  existingSecretClientSecretKey: oidc-client-secret
  existingSecretAuthSecretKey: auth-secret
  # Absolute origin the browser reaches the editor at (AUTH_URL) — the OIDC
  # callback origin, which must match a redirect URI registered with the
  # identity provider exactly, scheme and all.
  #
  # Empty derives https://{ingress.host}, which is right wherever the endpoint
  # terminates TLS. Set it explicitly where the chart cannot know the scheme:
  # with networking.mode=gateway the certificate belongs to a Gateway listener
  # this chart may not own, and a local install may be plain HTTP. Getting it
  # wrong is invisible until the first sign-in, which then fails at the identity
  # provider rather than here.
  url: ""
  # Optional: restrict write/mutating operations to these comma-separated roles.
  # Empty = any signed-in user.
  writeRoles: ""
  # Optional: id-token claim carrying roles (Auth.js default is "roles").
  rolesClaim: ""

# How external traffic reaches the editor and the per-integration endpoints.
#
#   ingress   networking.k8s.io Ingress objects. Built into every cluster, and
#             the default.
#   gateway   gateway.networking.k8s.io HTTPRoutes attached to a Gateway —
#             kgateway, Envoy Gateway, Istio, Cilium, and the Gateway API modes
#             of ingress-nginx and Traefik. Needs the Gateway API CRDs, which
#             are not built in.
#
# The mode applies to both the editor's endpoint and the ones the orchestrator
# creates per deployed integration; they are served by the same proxy, and
# splitting them would mean maintaining two answers to the same question.
#
# The `ingress` block below still supplies the editor's host, path and pathType
# in either mode — where the editor is published is not a question the routing
# API changes. Its className, annotations and tls keys are Ingress-only: under
# gateway they belong to the Gateway's listener instead.
networking:
  mode: ingress

  # Gateway API mode only. The Gateway that HTTPRoutes attach to.
  #
  # Attaching to an existing one is the default and the point of the mode: a
  # Gateway is cluster infrastructure with its own owner and its own lifecycle,
  # and the split — they own the Gateway, octo owns the routes in its namespace
  # — is a far easier permission conversation than "the orchestrator creates
  # Ingresses".
  gateway:
    # Have the chart create the Gateway instead of attaching to one. For an
    # install where octo is the only thing behind the proxy; the listeners are
    # derived from ingress.host and orchestrator.baseDomain. Anything more
    # elaborate wants a Gateway you own, with create left false.
    create: false
    # Name of the Gateway. REQUIRED unless create is true, which derives it from
    # the release name. There is no default worth guessing: a route naming a
    # Gateway that does not exist attaches to nothing, and reports it only on
    # its own status.
    name: ""
    # Namespace holding it. Empty means this release's namespace. A Gateway
    # elsewhere — the usual case — must permit attachment from here through its
    # listener's allowedRoutes; nothing set on this side can grant that.
    namespace: ""
    # One listener on that Gateway, by name. Usually unnecessary: a route
    # attaches to whichever listener matches its hostname. Set it where the
    # Gateway serves the same hostname on both an HTTP and an HTTPS listener,
    # since otherwise the route attaches to both and the endpoint is also served
    # in plaintext.
    sectionName: ""
    # create=true only: the GatewayClass naming the controller that serves it —
    # kgateway, envoy-gateway, istio, cilium, nginx. REQUIRED when create is
    # true, for the same reason ingress.className has no default.
    className: ""
    # create=true only. Extra annotations on the Gateway.
    #
    # cert-manager's Gateway support (`cert-manager.io/cluster-issuer` here)
    # would go in this block, and the chart deliberately does not put it there
    # itself: it works only on a cert-manager installed with
    # config.gatewayAPI.enabled=true, and it creates one Certificate per Secret
    # a listener references — including the wildcard Secret that already has a
    # Certificate of its own, which the two would then fight over. The chart
    # writes the Certificates explicitly instead.
    annotations: {}

ingress:
  enabled: true
  # IngressClass of the controller that should claim this Ingress: traefik (k3s),
  # nginx, gce (GKE), alb (EKS with the AWS Load Balancer Controller).
  #
  # Empty — the default — omits the field, letting the cluster's default
  # IngressClass claim it. That is the only portable default a published chart
  # can have: naming a controller here would mint an Ingress that a cluster
  # running something else never serves. Every environment profile sets it
  # explicitly (nginx on GKE, alb on EKS), and so does the k3s Terraform, which
  # is where `traefik` moved to.
  className: ""
  # Editor host. Always gets its own certificate (see ingress.tls below),
  # independent of wildcardTLS — it does not need to be the same domain as
  # orchestrator.baseDomain.
  #
  # REQUIRED when ingress.enabled is true, and deliberately empty rather than
  # defaulted: this chart is published to a public registry, and a default host
  # is a domain somebody else owns. Installing without overriding it would mint
  # an Ingress claiming that name — which on a shared ingress controller also
  # takes routing for it.
  host: ""
  # Additional hosts served by the same backend (aliases, apex + www).
  extraHosts: []
  path: /
  pathType: Prefix
  # Controller-specific behaviour: nginx proxy-body-size, ALB scheme/target-type,
  # GCE static IP, ... The mode-specific certificate annotation below always wins
  # on key collision.
  annotations: {}
  tls:
    enabled: true
    # Where the certificate comes from. This is the biggest single difference
    # between deployment targets:
    #   cert-manager      annotate with a ClusterIssuer; cert-manager issues
    #                     per-host via HTTP-01. What the k3s bootstrap provides.
    #   secret            reference a TLS Secret that already exists — a
    #                     pre-issued wildcard, or one Terraform put there.
    #   gke-managed-cert  Google-managed cert via the ManagedCertificate CRD
    #                     (GCE ingress); the chart creates it for you.
    #   acm               AWS ACM certificate by ARN, terminated at the ALB.
    #   none              terminated upstream; no TLS on the Ingress.
    # Empty auto-selects cert-manager when clusterIssuer is set, else secret,
    # which is the behaviour this chart has always had.
    mode: ""
    secretName: octo-tls
    clusterIssuer: letsencrypt-prod
    # acm mode: arn:aws:acm:REGION:ACCOUNT:certificate/ID
    certificateArn: ""
    # gke-managed-cert mode: name of the ManagedCertificate to create. Empty
    # derives it from the release name.
    managedCertificateName: ""

# GKE-only extras for clusters fronted by the GCE ingress controller. Both need
# cloud.google.com / networking.gke.io CRDs that exist only on GKE, so both stay
# off unless a profile enables them. Attach the BackendConfig to the editor
# Service with:
#   platform.service.annotations:
#     cloud.google.com/backend-config: '{"default":"RELEASE-platform"}'
gke:
  backendConfig:
    enabled: false
    # The GCE load balancer health-checks "/" on the node port by default and
    # marks the backend unhealthy if the app answers otherwise.
    healthCheckPath: /
    timeoutSec: null
  frontendConfig:
    enabled: false
    redirectToHttps: false

# Shared wildcard TLS cert for orchestrator.baseDomain (below) and every
# {slug}.{baseDomain} per-integration subdomain, issued once by cert-manager via
# DNS-01 (the only ACME method that can mint a wildcard). baseDomain may be the
# same domain as ingress.host (a single-domain setup) or a different,
# Cloud-DNS-delegated domain — e.g. when ingress.host's registrar won't allow
# delegating the whole zone but a subdomain of it can still be delegated.
# Requires the DNS-01 ClusterIssuer (provisioned by the VM bootstrap) and DNS
# admin on baseDomain's zone.
wildcardTLS:
  enabled: false
  secretName: octo-wildcard-tls
  # Issuer for the wildcard, or empty to say the Secret already exists.
  #
  # Empty means this chart references secretName and creates no Certificate —
  # the same distinction ingress.tls.mode draws between cert-manager and secret,
  # for wherever the wildcard is issued by something else: another cluster's
  # cert-manager, external-secrets, or a certificate bought outright. Under
  # networking.mode=gateway that is the ordinary case rather than the exception,
  # since the listener terminating it usually belongs to a Gateway this release
  # does not own.
  clusterIssuer: letsencrypt-dns
