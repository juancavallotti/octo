service:
  name: rag-pipeline

# A RAG (retrieval-augmented generation) pipeline, end to end: embed text with
# Gemini, store and search it in Pinecone, and let an agent answer questions out
# of what it retrieves. Three flows, and the middle one is the hinge:
#
#   ingest — POST /documents: embed a document and upsert it into the index
#   search — retrieval on its own: embed a phrase, return the closest documents
#   ask    — POST /ask: an ai-agent that calls `search` as a TOOL, then answers
#
# `search` has no source of its own. It is not an endpoint — it is the retrieval
# step, named once so the agent's tool is a single flow-ref to it rather than a
# second copy of the same two blocks. Reuse is the point: change how retrieval
# works (a metadata filter, a different topK) and the agent changes with it.
#
# Nothing between pinecone-query and the model reshapes anything, and that is
# deliberate: with no resultVar, the matches ARE the tool's output body, which is
# exactly what gets handed back to the model as the tool result.
#
# octo.yaml (this file) holds the service, env and connectors the flows share;
# indexing.yaml holds ingest, and retrieval.yaml holds search and ask. Suites are
# named after flows, so dolphin runs each against the whole folder.
#
# ai-embed rejects an llm-anthropic connector (Anthropic has no embeddings API) —
# it takes an OpenAI- or Gemini-backed one. This sample uses Gemini for both
# halves: gemini-embedding-001 at 768 dimensions (one of Google's three
# recommended sizes — smaller than the 3072 default, plenty for a demo index),
# and the connector's default chat model for the agent.
#
# Setup:
#   1. Get a Gemini API key: https://aistudio.google.com/apikey
#   2. Create a Pinecone account and an index (https://app.pinecone.io):
#        - Dimension: 768   (must match the ai-embed "dimensions" setting)
#        - Metric: cosine
#      Copy its name and an API key.
#   3. Export the credentials and run:
#        export GEMINI_API_KEY=...
#        export PINECONE_API_KEY=...
#        export PINECONE_INDEX=...        # the index name from step 2
#        octo run --config samples/rag-pipeline
#   4. Ingest a couple of documents, then ask about them:
#        curl -s localhost:8080/documents -d '{
#          "id": "plateau",
#          "text": "Plateaus in bouldering are usually a training-variety problem, not a strength problem."
#        }'
#        curl -s localhost:8080/documents -d '{
#          "id": "rest",
#          "text": "Two rest days between hard sessions is what most climbers under-do."
#        }'
#        curl -s localhost:8080/ask -d '{"question": "I stopped improving. What should I change?"}'
#      The agent searches for itself, and answers out of what came back — citing
#      the ids it used, so you can tell retrieval from invention.
#
#   You can also run retrieval alone, without the model deciding anything:
#        octo invoke --config samples/rag-pipeline --flow search \
#          --data '{"query": "training plateau"}'

env:
  - name: HTTP_HOST
    default: 0.0.0.0
  - name: HTTP_PORT
    default: "8080"
  - name: GEMINI_API_KEY
    required: true
  - name: PINECONE_API_KEY
    required: true
  - name: PINECONE_INDEX
    required: true
  # The index host, from the Pinecone console. Leave it empty and the connector
  # looks the index up at startup, which is also what checks the dimension below
  # — the right default for a real run. Set it and startup makes no network call
  # at all, which is what the suites beside this file need.
  - name: PINECONE_HOST
    default: ""

connectors:
  - name: api
    type: http
    settings:
      host: ${HTTP_HOST}
      port: ${HTTP_PORT}
      requestTimeout: 60s
  - name: gemini
    type: llm-gemini
    settings:
      apiKey: ${GEMINI_API_KEY}
  - name: pinecone
    type: pinecone
    settings:
      apiKey: ${PINECONE_API_KEY}
      index: ${PINECONE_INDEX}
      host: ${PINECONE_HOST}
      dimension: 768
