# Tests the autoreply flow: a person gets one threaded reply, and an
# auto-generated message gets none.
#
# Sources do not run under invoke, so each case seeds the body the imap source
# would have produced from a received message. `reply` is mocked: it is the one
# block that reaches the mail server.
flow: autoreply

mocks:
  autoreply.from-a-person[then].reply:
    default:
      body: {}
  # Invoke mode starts no connector that a flow uses as its source, so the
  # inbox connector is absent and the digest flow's imap-fetch could not be
  # built. Mocking it lets the whole config build; this suite never runs it.
  digest.last-day:
    default:
      body: []

inputs:
  from-ann:
    data:
      uid: 7
      mailbox: INBOX
      messageId: m1@example.com
      subject: Order 42
      from: { name: Ann, address: ann@example.com }
      to: [{ name: "", address: support@example.com }]
      headers: { Subject: [Order 42] }
      text: Where is my order?
      html: ""
      attachments: []

cases:
  - name: a person gets a threaded reply addressed to them
    input: from-ann
    spies:
      autoreply.from-a-person[then].reply:
        count: 1
        records:
          - input:
              # what the reply's to, subject and inReplyTo render from
              that: ['body.from.address == "ann@example.com"', 'body.subject == "Order 42"', 'body.messageId == "m1@example.com"']

  - name: an auto-reply is never answered
    input:
      data:
        uid: 8
        messageId: m2@example.com
        subject: Out of office
        from: { name: Bob, address: bob@example.com }
        headers: { Auto-Submitted: [auto-replied] }
        attachments: []
    spies:
      autoreply.from-a-person[then].reply: { count: 0 }

  - name: a bounce with no sender is never answered
    input:
      data:
        uid: 9
        messageId: m3@example.com
        subject: Undeliverable
        from: null
        headers: {}
        attachments: []
    spies:
      autoreply.from-a-person[then].reply: { count: 0 }
