service:
  name: validate-orders

# Demonstrates the "validate" filter block: every CEL rule must hold or the block
# rejects the message — it stops the flow (the rest of the chain never runs) and
# returns a response it configures. With no onReject sub-flow it emits a built-in
# body {error, messages} with rejectStatus (default 422); the failing rules'
# messages are also exposed as vars.validationErrors. Over an HTTP source the
# status becomes the response code; here (invoke) it rides in vars.httpStatus.
#
# Run it (standalone services module, in-process):
#   octo invoke --config samples/validate.yaml --flow order \
#     --data '{"id":"A-1","amount":30.0}'
#   # -> passes: returns {"orderId":"A-1","amount":30,"status":"accepted"}
#   octo invoke --config samples/validate.yaml --flow order \
#     --data '{"amount":0}'
#   # -> rejected: returns {"error":"validation_failed","messages":[...]} and the
#   #    accept step never runs.

connectors:
  - name: out
    type: logger
    settings:
      format: json
      level: info

flows:
  - name: order
    process:
      - type: validate
        name: check-order
        rejectStatus: 422
        rules:
          - expr: 'has(body.id)'
            message: "order id is required"
          - expr: 'body.amount > 0'
            message: "amount must be positive"
        # onReject (optional) shapes the response yourself instead of the built-in
        # body; it can read vars.validationErrors. Omit for the default response.
        # onReject:
        #   process:
        #     - type: set-payload
        #       settings:
        #         value: '{"error": "bad_request", "details": vars.validationErrors}'
        #     - type: set-variable
        #       settings: { name: httpStatus, value: 400 }

      # Only reached when every rule held (a rejected request stopped above).
      - type: set-payload
        name: accept
        settings:
          value: '{"orderId": body.id, "amount": body.amount, "status": "accepted"}'
