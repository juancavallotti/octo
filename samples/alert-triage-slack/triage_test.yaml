# The agent flow, driven the way on-alert and on-slack-event drive it: with the
# facts in variables and the opening turn in vars.turn.
#
# What the model concludes is the model's; a mock has no opinion. What is proved
# here is the handoff: the answer reaches report-finding with the incident's
# facts still attached. What the report does with it is report-finding_test.yaml's.
flow: triage

inputs:
  an opening turn:
    data: {}
    vars:
      incidentId: i_1
      watchName: checkout errors
      reportTo: ["ada@example.com"]
      turn: "An alert has fired. Here it is, verbatim: {...}"

mocks:
  triage.triage-agent:
    default:
      body: "checkout fails every request on a missing field."
  # The report's two calls that leave the process.
  report-finding.post-finding:
    default:
      body: { ok: true }
      vars: { slackTs: "1700000000.000100", slackChannel: C0TESTCHANNEL }
  report-finding.send-email:
    default:
      body: { messageId: msg_1 }

cases:
  - name: the answer is reported with the incident's facts
    input: an opening turn
    spies:
      triage.report:
        count: 1
        records:
          - input:
              that:
                - 'body.contains("missing field")'
                - 'vars.incidentId == "i_1"'
                - 'vars.reportTo == ["ada@example.com"]'
      report-finding.send-email:
        count: 1
