service:
  name: alert-triage-slack

# Agentic self-healing with a person in the loop, over Slack.
#
# The loop: a platform alert arrives on this deployment's topic, an agent reads
# the stored logs and traces and posts a finding to a Slack channel (and emails
# it). A person replies in that thread: they can push back, ask for more, or
# tell the agent to go ahead. Every reply is another turn of the same
# conversation, so the agent refines its finding or moves on to the fix. Any
# change to the installation parks the run and asks in the thread first; the
# person answers "approve" or "deny". After every turn the finding is emailed
# to whoever the watch named.
#
# Setup:
#   1. Deploy this integration on the platform with both platform-access grants
#      ticked. ORCHESTRATOR_URL and OBSERVABILITY_URL are already in every pod;
#      the grants are what its own token opens at those addresses. Alerts wake
#      this flow, so there is no user credential to borrow: it presents
#      env.PLATFORM_TOKEN, which the runtime keeps valid.
#   2. Create a Slack app with the chat:write scope, subscribe it to the
#      message.channels event, invite the bot to a channel, and put the
#      channel id in SLACK_CHANNEL. Point the Events API request URL at this
#      deployment's /slack/events route.
#   3. Create a watch (Metrics -> Alerts) with a topic action whose
#      deploymentId is THIS deployment and whose subject is "triage". Put the
#      addresses that should get the email in the action's reportTo.
#
# Layout: octo.yaml (this file) holds the service, env and connectors every flow
# shares; alerts.yaml, slack.yaml and agent.yaml hold the flows. Each suite is
# named after the flow it tests, so dolphin runs it against the whole folder.
#
# Guide: /guides/agentic-self-healing

env:
  - name: HTTP_PORT
    default: "8080"
  - name: ANTHROPIC_API_KEY
    required: true
  - name: SLACK_BOT_TOKEN
    required: true
  - name: SLACK_SIGNING_SECRET
    required: true
  # The channel the agent posts to. One channel per installation keeps every
  # incident thread in the place people already watch.
  - name: SLACK_CHANNEL
    required: true
  # Injected by the platform when the deployment holds the matching grant.
  - name: ORCHESTRATOR_URL
    required: true
  - name: OBSERVABILITY_URL
    required: true
  # The subject the watch's topic action publishes to. Relative: the platform
  # expands it to this deployment's own subject.
  - name: ALERT_SUBJECT
    default: triage
  # How long a parked fix waits for a reply in Slack before it is denied. The
  # block's default of five minutes suits a person watching a panel, not one
  # who will see the thread when they see it.
  - name: AUTHORIZE_TIMEOUT
    default: 30m

connectors:
  - name: api
    type: http
    settings:
      port: ${HTTP_PORT}

  - name: slack
    type: slack
    settings:
      botToken: ${SLACK_BOT_TOKEN}
      signingSecret: ${SLACK_SIGNING_SECRET}

  - name: claude
    type: llm-anthropic
    settings:
      apiKey: ${ANTHROPIC_API_KEY}

  # The orchestrator's API. baseURL is the boundary: a dynamic path resolves
  # under it and nowhere else.
  - name: octo
    type: http-client
    settings:
      baseURL: ${ORCHESTRATOR_URL}
      timeout: 60s

  # Stored logs, traces and pod stats for every deployment on the install.
  - name: observability
    type: http-client
    settings:
      baseURL: ${OBSERVABILITY_URL}
      timeout: 20s
