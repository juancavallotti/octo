# Tests opportunity-outcome's claim: the event is routed to the subflow for its
# outcome, the event is still the body when the opportunity is read back, and
# anything else is refused without touching Odoo.
#
# What each subflow does in Odoo is close-won_test.yaml's and
# close-lost_test.yaml's to prove. Here the flow-refs are mocked: the enrich
# around each one keeps whatever they answer inside its scope.
flow: opportunity-outcome

mocks:
  opportunity-outcome.by-outcome[0].close-won[body].call-close-won: &closed
    default: { body: { closed: true } }
  opportunity-outcome.by-outcome[1].close-lost[body].call-close-lost: *closed
  opportunity-outcome.closed[then].read-opportunity:
    default:
      body: [{ id: 7, name: Engines, stage_id: [4, Won], probability: 100 }]

cases:
  - name: a won event closes the deal as won and answers with it
    input:
      data: { opportunityId: 7, outcome: won, amount: 12000 }
    spies:
      opportunity-outcome.by-outcome[0].close-won[body].call-close-won:
        count: 1
        records:
          - input:
              body: { opportunityId: 7, outcome: won, amount: 12000 }
      opportunity-outcome.by-outcome[1].close-lost[body].call-close-lost:
        count: 0
      opportunity-outcome.closed[then].read-opportunity:
        count: 1
        records:
          # The subflow's answer stayed inside the enrich: the event is still
          # the body when the read takes its id.
          - input:
              body: { opportunityId: 7, outcome: won, amount: 12000 }
    expect:
      body: [{ id: 7, name: Engines, stage_id: [4, Won], probability: 100 }]

  - name: a lost event closes the deal as lost
    input:
      data: { opportunityId: 7, outcome: lost, reason: too expensive }
    spies:
      opportunity-outcome.by-outcome[1].close-lost[body].call-close-lost:
        count: 1
      opportunity-outcome.by-outcome[0].close-won[body].call-close-won:
        count: 0

  - name: an unknown outcome is refused without touching Odoo
    input:
      data: { opportunityId: 7, outcome: maybe }
    spies:
      opportunity-outcome.by-outcome[0].close-won[body].call-close-won:
        count: 0
      opportunity-outcome.by-outcome[1].close-lost[body].call-close-lost:
        count: 0
      opportunity-outcome.closed[then].read-opportunity:
        count: 0
    expect:
      body: { error: outcome must be won or lost }
