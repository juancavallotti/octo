version: '3'

# Tasks for the log-aggregator module. Included from the root Taskfile under the
# `logs:` namespace, with the working directory set to logs/, so all paths here
# are relative to it.

vars:
  GO: go

  # Pinned so every machine and CI generate byte-identical output — the diff check
  # in the validate workflow is only a guarantee if the generator does not move. An
  # upgrade is expected to move internal/openapi/swagger.json; commit both together.
  #
  # v2 is what emits OpenAPI 3.1, and rc5 is the newest published tag — the binary
  # self-reports "v2.0.0" but no such module version exists. Depending on a release
  # candidate is tolerable here precisely because the output is committed: the
  # generator runs in CI and on developer machines, never in the running service, so
  # the worst a bad release does is fail this task rather than the aggregator.
  #
  # Keep this in step with orchestrator/Taskfile.yml: two services generating with
  # two generators would describe themselves in two dialects.
  SWAG_VERSION: v2.0.0-rc5

tasks:
  openapi:
    desc: Regenerate the embedded OpenAPI description from the handler annotations
    # JSON only, on purpose. swag can also emit a Go package, but importing it would
    # put the generator in the module's dependency graph and give the binary a second
    # copy of the spec that could disagree with the committed one. Generating the
    # artifact and embedding it keeps swaggo a tool, not a dependency.
    cmds:
      - '{{.GO}} run github.com/swaggo/swag/v2/cmd/swag@{{.SWAG_VERSION}} init --v3.1 --quiet --generalInfo internal/openapi/doc.go --dir ./ --parseInternal --outputTypes json --output internal/openapi'

  fmt:
    desc: Format the logs module
    cmds:
      - '{{.GO}} fmt ./...'

  build:
    desc: Build the logs binary
    cmds:
      - mkdir -p ../bin
      - '{{.GO}} build -trimpath -o ../bin/logs .'

  test:
    desc: 'Run the logs tests (pass go test flags after --, e.g. task logs:test -- -race)'
    # The trace fold's store is two Lua scripts, and what they are for is
    # atomicity — so they are tested against a real server or not at all. A fake
    # would prove the Go around them compiles.
    #
    # Set REDIS_TEST_URL to run them; without it they skip, the same way the
    # orchestrator's repository tests skip without TEST_DATABASE_URL. Spin one up
    # with:
    #
    #   docker run --rm -d -p 63799:6379 redis:7-alpine
    #   REDIS_TEST_URL=redis://127.0.0.1:63799 task logs:test
    #
    # The database is FLUSHED at the start of each case, so point it at a
    # throwaway server and never at one holding anything.
    cmds:
      # CLI_ARGS lands before the package list so `-race` and friends are flags
      # rather than package names. CI passes -race; a local run defaults to plain.
      - '{{.GO}} test {{.CLI_ARGS}} ./...'

  lint:
    desc: Run golangci-lint over the logs module
    cmds:
      - golangci-lint run ./...

  tidy:
    desc: Tidy the logs module
    cmds:
      - '{{.GO}} mod tidy'

  run:
    desc: Run the log aggregator locally (set DATABASE_URL/NATS_URL/PORT as needed)
    cmds:
      - '{{.GO}} run . {{.CLI_ARGS}}'
