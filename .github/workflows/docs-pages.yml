name: docs-pages

# Builds apps/docs (Fumadocs static export) and publishes it to GitHub Pages.
#
# Replaces the legacy "Deploy from a branch" (main /docs) Pages source. That
# setup auto-triggered a Pages deployment on *every* push to main, so a release
# (feature merge + release-please merge landing seconds apart) fired two
# deployments that raced for the single github-pages environment — the loser
# failed with "Deployment failed, try again later." The concurrency group below
# serializes deployments, and the paths filter means non-docs pushes don't
# deploy at all.
on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "samples/**"
      - "scripts/check-docs-drift.mjs"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Queue rather than cancel so a release that does
# touch docs still publishes the final state instead of dropping a deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter docs build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/out
      - id: deployment
        uses: actions/deploy-pages@v4
