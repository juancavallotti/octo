name: validate

# Pull requests, and main. Deliberately nothing else: an unfiltered `on: push`
# alongside `on: pull_request` validated every branch with an open PR twice —
# same jobs, same commit, same answer, two sets of runner minutes and two
# status entries on the PR. The pull request is the gate; main is validated on
# merge so every commit there has a result to bisect against.
#
# The cost is that a branch with no PR open is not validated. Open the PR —
# draft counts — which is the point at which the result is worth having.
on:
  push:
    branches: [main]
  pull_request:

# One live run per pull request. Pushing again while a run is in flight — a
# fixup, or rebasing onto the branch below in a stack — otherwise leaves the
# earlier run grinding through a commit nobody will merge. It also collapses the
# duplicate `synchronize` GitHub emits when a stack's base branch moves. Main is
# exempt: its commits are release candidates, and each keeps its own result
# rather than being cancelled by the next merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Decides which of the jobs below a pull request needs. Every area's filter
  # names the files whose change could fail that area's checks — its own tree,
  # and every file elsewhere that one of its tests reads. A test that reads
  # another module's file and is not listed here stops running on the pull
  # requests that could break it; main still runs everything, so it fails there
  # instead, one merge late.
  #
  # On main every area runs: each merge keeps a full result to bisect against,
  # and it is the run that refreshes the caches pull requests restore.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      runtime: ${{ github.event_name != 'pull_request' || steps.filter.outputs.runtime == 'true' }}
      web: ${{ github.event_name != 'pull_request' || steps.filter.outputs.web == 'true' }}
      docs: ${{ github.event_name != 'pull_request' || steps.filter.outputs.docs == 'true' }}
      helm: ${{ github.event_name != 'pull_request' || steps.filter.outputs.helm == 'true' }}
      terraform: ${{ github.event_name != 'pull_request' || steps.filter.outputs.terraform == 'true' }}
      go-modules: ${{ steps.modules.outputs.list }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            # The workflow, its action and the root Taskfile can break any job.
            ci: &ci
              - '.github/workflows/validate.yml'
              - '.github/actions/**'
              - 'Taskfile.yml'
            # The root go.mod's toolchain line is the Go every Go job installs.
            go-toolchain: &go-toolchain
              - *ci
              - 'go.mod'
            # The dolphin suites cover the samples and the three octo apps
            # (the platform agent, the embedding server, the public API).
            runtime: &runtime
              - *go-toolchain
              - 'go.sum'
              - 'runtime/**'
              - 'samples/**'
              - 'orchestrator/agent/**'
              - 'embeddings/**'
              - 'api/**'
              - 'orchestrator/internal/kv/redisrepo.go'
              - '.goreleaser.yaml'
              # runtime-lint runs policy-check, which requires these to exist.
              - 'AGENTS.md'
              - 'docs/*.md'
            orchestrator:
              - *go-toolchain
              - 'orchestrator/**'
            observability:
              - *go-toolchain
              - 'observability/**'
              - 'runtime/services/k8s/topics.go'
              - 'sidecars/stats/internal/**'
            iam:
              - *go-toolchain
              - 'iam/**'
            sidecars:
              - *go-toolchain
              - 'sidecars/**'
            octopaas:
              - *go-toolchain
              - 'octopaas/**'
              - 'api/static/openapi.yaml'
              - 'apps/docs/content/docs/reference/octopaas/**'
            # blockClasses.test.ts reads the runtime's Go tree and the editor's
            # suite test parses samples/.
            web:
              - *ci
              - 'apps/platform/**'
              - 'apps/standalone/**'
              - 'apps/desktop/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'runtime/**/*.go'
              - 'samples/**'
            # The checks compare the docs, the MCP package and the editor against
            # what the built octo reports.
            docs:
              - *runtime
              - 'apps/docs/**'
              - 'scripts/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            helm:
              - *ci
              - 'helm/**'
            terraform:
              - *ci
              - 'deploy/terraform/**'
      # The Go service modules, as the list the go-modules matrix runs. `all` is
      # the registration: a module missing from it is a module nothing checks.
      - id: modules
        env:
          EVENT: ${{ github.event_name }}
          CHANGED: ${{ steps.filter.outputs.changes || '[]' }}
        run: |
          all='["orchestrator","observability","iam","sidecars","octopaas"]'
          if [ "$EVENT" = pull_request ]; then
            list="$(jq -c --argjson all "$all" '[.[] | select(IN($all[]))]' <<<"$CHANGED")"
          else
            list="$all"
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "go modules: $list"

  # The runtime's lint runs apart from its tests because each is a couple of
  # minutes and neither needs the other.
  runtime-lint:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
        with:
          cache-key: runtime-lint
          golangci-lint: 'true'
      - run: task policy-check
      - run: task runtime:tidy
      - run: task runtime:fmt
      - run: task runtime:lint
      - if: github.event_name == 'push'
        uses: ./.github/actions/setup-go
        with:
          cache-key: runtime-lint
          save: 'true'

  runtime-test:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
        with:
          cache-key: runtime-test
      - run: task runtime:test
      - run: task runtime:build
      # The sample flows, run through dolphin against the octo just built. These are the
      # runtime's end-to-end tests, and the only ones that exercise the debug seam the way
      # a user meets it — through the CLI, with real mocks and spies.
      - run: task runtime:test:samples
      # The platform agent is an octo app like any other, so it is tested like one.
      # Separate from the samples because it lives under orchestrator/ — inside the
      # binary's embed root, not the samples tree.
      - run: task runtime:test:agent
      # The embedding server, on the same terms: an octo app that ships as an
      # image, living at the repo root rather than in the samples tree.
      - run: task runtime:test:embeddings
      # And the public API, the third app at the repo root.
      - run: task runtime:test:api
      # The release builds the CLI archives from .goreleaser.yaml. Validate it here so
      # a broken config surfaces on the PR that broke it, not on the release that
      # needed it.
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check
      - if: github.event_name == 'push'
        uses: ./.github/actions/setup-go
        with:
          cache-key: runtime-test
          save: 'true'

  # The service modules, one matrix job each. What a module checks is its own
  # `ci` task, so `task <module>:ci` reproduces a failure locally.
  #
  # They run golangci's default linter set, not runtime/.golangci.yml. That is
  # deliberate and recorded in docs/linting-policy.md: adopting the strict set
  # in the service modules is its own project.
  #
  # No database is stood up for any of these, and that is the policy rather
  # than an omission: a test whose failure could only mean Postgres or pgx is
  # broken does not earn its place in a run everyone waits on. See the testing
  # section of docs/coding-standards.md.
  go-modules:
    needs: changes
    if: needs.changes.outputs.go-modules != '[]'
    name: go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.go-modules) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
        with:
          cache-key: go-${{ matrix.module }}
          golangci-lint: 'true'
      - run: task ${{ matrix.module }}:ci
      - if: github.event_name == 'push'
        uses: ./.github/actions/setup-go
        with:
          cache-key: go-${{ matrix.module }}
          save: 'true'

  # Both Next apps, plus the desktop shell. This job enumerates what it runs,
  # and what it enumerates is the whole guarantee.
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    env:
      # apps/desktop devDepends on electron, whose postinstall downloads a ~150MB
      # platform binary. Nothing in CI launches the app — typecheck reads the
      # package's .d.ts, the tests cover main-process logic that imports no
      # electron, and the build externalizes it — so every job that installs the
      # workspace can skip the download. Packaging in release.yml does not, and
      # sets this to 0.
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/platform/.nvmrc
          cache: pnpm
      # Next's incremental build cache. Keyed by commit so each run saves its
      # own, and restored by prefix so a build starts from the newest one.
      - uses: actions/cache@v5
        with:
          path: |
            apps/platform/.next/cache
            apps/standalone/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            next-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter platform lint
      - run: pnpm --filter platform test
      - run: pnpm --filter platform build
      - run: pnpm --filter standalone lint
      - run: pnpm --filter standalone test
      - run: pnpm --filter standalone build
      # The desktop shell carries no eslint config (the repo lints only the two
      # Next apps, which get one from eslint-config-next); for a bundled TS app
      # tsc is the check that actually catches things. Two projects, because
      # main and preload have different libs — preload touches the DOM, main
      # must not.
      - run: pnpm --filter desktop typecheck
      - run: pnpm --filter desktop test
      - run: pnpm --filter desktop build

  # The Helm chart targets clusters CI cannot spin up on demand — GKE Autopilot,
  # EKS — so rendering every environment profile and validating the output
  # against the real Kubernetes schemas is the automated gate. Without it, a
  # change to the octo-common library that renders fine under the defaults could
  # only be caught by deploying to the cluster it broke.
  helm:
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Pinned, not floating. Chart packaging and template resolution are exactly
      # the behaviour that must not change under us between runs — the chart
      # vendors a library chart under charts/, and how Helm treats that is the
      # thing being tested.
      - uses: azure/setup-helm@v4
        with:
          # renovate: datasource=github-releases depName=helm/helm
          version: v3.22.1
      - name: Install kubeconform and Task
        env:
          # renovate: datasource=github-releases depName=yannh/kubeconform
          KUBECONFORM_VERSION: v0.8.0
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C "$HOME/bin" kubeconform
          sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - run: task helm:test

  terraform:
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    steps:
      # The checkout token is not left in .git/config: this job runs
      # `terraform init`, which downloads and executes provider binaries, so it
      # should hold nothing worth stealing.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Pinned to a version that satisfies the strictest root: the eks root needs
      # >= 1.10 for the S3 backend's native locking.
      - uses: hashicorp/setup-terraform@v3
        with:
          # renovate: datasource=github-releases depName=hashicorp/terraform extractVersion=^v(?<version>.*)$
          terraform_version: 1.17.2
          terraform_wrapper: false
      - name: Install Task
        run: |
          mkdir -p "$HOME/bin"
          sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      # fmt + validate across every root and module. `validate` needs providers, so
      # it needs an init — but the task passes -backend=false, so this runs with no
      # cloud credentials, no state bucket and nothing to clean up. The committed
      # .terraform.lock.hcl files carry linux_amd64 hashes precisely so this step
      # resolves the same providers a laptop does.
      - run: task tf:check

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    env:
      # Nothing here needs the Electron binary; see the web job above.
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      # runtime-test's cache, restored and never saved: it compiled every package
      # octo is built from, so the two builds below are a link rather than a
      # compile. Sharing the cache rather than runtime-test's binary keeps this
      # job from waiting on that one.
      - uses: ./.github/actions/setup-go
        with:
          cache-key: runtime-test
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/platform/.nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: task runtime:build
      # Fails when a registered connector/block type has no docs page (or a
      # docs page claims a type that no longer exists). See AGENTS.md
      # "Documentation policy".
      - run: node scripts/check-docs-drift.mjs
      # Fails when a sample, Dr. Octo or an MCP example chains setters or leaves a
      # block unnamed, or when the MCP prompt and Dr. Octo's skill stop teaching
      # a rule the Flow Best Practices page states.
      - run: node scripts/check-flow-practices.mjs
      # Fails when the public API serves a route its hand-written OpenAPI
      # description leaves out, or describes one it no longer serves.
      - run: node scripts/check-api-spec.mjs
      # Fails when a block arrives declaring a variable the editor's CEL scope
      # model has not been told about — which would otherwise show up as a
      # completion menu quietly missing names the flow actually has.
      - run: node scripts/check-scope-contributions.mjs
      # Fails when a block the editor is willing to run BY ITSELF (to learn what a
      # flow's messages look like) disappears or grows a connector — the cost of
      # being wrong there is a real call the user never asked to make.
      - run: node scripts/check-pure-blocks.mjs
      # The downloadable platform API contract is a COPY of the one embedded in
      # the binary, so unlike the drift tests beside it in Go, only a diff can
      # tell whether it is current.
      - run: task docs:openapi
      - run: git diff --exit-code -- apps/docs/public/octo-platform-api.yaml
      # Static-export build doubles as an MDX/broken-link check.
      - run: pnpm --filter docs build

  # The one check that answers "did validate pass". Jobs a pull request did not
  # need are skipped, and a skipped job is not a failure; a failed or cancelled
  # one is. Require this job, not the ones above, so a skipped area never blocks
  # a merge.
  validate:
    needs: [changes, runtime-lint, runtime-test, go-modules, web, helm, terraform, docs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if jq -e 'any(.[]; . == "failure" or . == "cancelled")' <<<"$RESULTS" >/dev/null; then
            exit 1
          fi
