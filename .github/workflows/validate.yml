name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Task
        run: |
          sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b "$(go env GOPATH)/bin"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: task policy-check
      - run: task runtime:tidy
      - run: task runtime:fmt
      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: task runtime:lint
      - run: task runtime:test
      - run: task runtime:build
      # The sample flows, run through dolphin against the octo just built. These are the
      # runtime's end-to-end tests, and the only ones that exercise the debug seam the way
      # a user meets it — through the CLI, with real mocks and spies.
      - run: task runtime:test:samples
      # The release builds the CLI archives from .goreleaser.yaml. Validate it here so
      # a broken config surfaces on the PR that broke it, not on the release that
      # needed it.
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check

  platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/platform/.nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter platform lint
      - run: pnpm --filter platform test
      - run: pnpm --filter platform build

  # The Helm chart targets clusters CI cannot spin up on demand — GKE Autopilot,
  # EKS — so rendering every environment profile and validating the output
  # against the real Kubernetes schemas is the automated gate. Without it, a
  # change to the octo-common library that renders fine under the defaults could
  # only be caught by deploying to the cluster it broke.
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned, not floating. Chart packaging and template resolution are exactly
      # the behaviour that must not change under us between runs — the chart
      # vendors a library chart under charts/, and how Helm treats that is the
      # thing being tested.
      - uses: azure/setup-helm@v4
        with:
          version: v3.21.3
      - name: Install kubeconform and Task
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C "$HOME/bin" kubeconform
          sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - run: task helm:test

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Task
        run: |
          sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b "$(go env GOPATH)/bin"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/platform/.nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: task runtime:build
      # Fails when a registered connector/block type has no docs page (or a
      # docs page claims a type that no longer exists). See AGENTS.md
      # "Documentation policy".
      - run: node scripts/check-docs-drift.mjs
      # Static-export build doubles as an MDX/broken-link check.
      - run: pnpm --filter docs build
