name: validate

# Pull requests, and main. Deliberately nothing else: an unfiltered `on: push`
# alongside `on: pull_request` validated every branch with an open PR twice —
# same jobs, same commit, same answer, two sets of runner minutes and two
# status entries on the PR. The pull request is the gate; main is validated on
# merge so every commit there has a result to bisect against.
#
# The cost is that a branch with no PR open is not validated. Open the PR —
# draft counts — which is the point at which the result is worth having.
on:
  push:
    branches: [main]
  pull_request:

# One live run per pull request. Pushing again while a run is in flight — a
# fixup, or rebasing onto the branch below in a stack — otherwise leaves the
# earlier run grinding five jobs through a commit nobody will merge. It also
# collapses the duplicate `synchronize` GitHub emits when a stack's base branch
# moves. Main is exempt: its commits are release candidates, and each keeps its
# own result rather than being cancelled by the next merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    # A throwaway Postgres for the repository-layer tests that would otherwise
    # skip. Only `iam` uses it today, and deliberately so — see the note beside
    # its test step. pgvector's image rather than stock postgres because
    # sql/schema.sql creates the vector extension, and applying the real schema
    # is half of what makes these tests worth running.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: octo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Task
        run: |
          sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b "$(go env GOPATH)/bin"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: task policy-check
      - run: task runtime:tidy
      - run: task runtime:fmt
      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: task runtime:lint
      - run: task runtime:test
      - run: task runtime:build
      # The sample flows, run through dolphin against the octo just built. These are the
      # runtime's end-to-end tests, and the only ones that exercise the debug seam the way
      # a user meets it — through the CLI, with real mocks and spies.
      - run: task runtime:test:samples
      # The platform agent is an octo app like any other, so it is tested like one.
      # Separate from the samples because it lives under orchestrator/ — inside the
      # binary's embed root, not the samples tree.
      - run: task runtime:test:agent
      # The embedding server, on the same terms: an octo app that ships as an
      # image, living at the repo root rather than in the samples tree.
      - run: task runtime:test:embeddings
      # The service modules. Each gets its own steps rather than an entry in a
      # list, because this job enumerates what it runs — and what it enumerates is
      # the whole guarantee. `orchestrator` and `observability` were missing here until
      # they were added below, which is why `orchestrator` had accumulated 18 lint
      # findings nothing was failing on.
      #
      # They run golangci's default linter set, not runtime/.golangci.yml. That is
      # deliberate and recorded in docs/linting-policy.md: adopting the strict set
      # in the service modules is its own project, and pointing them at it here
      # would trade one silent backlog for a louder one.
      - run: task orchestrator:tidy
      - run: task orchestrator:fmt
      - run: task observability:tidy
      - run: task observability:fmt
      - run: task iam:tidy
      - run: task iam:fmt
      # The committed OpenAPI descriptions are generated from the handler annotations,
      # so they can go stale the moment a route or a request type changes. Regenerating
      # them here folds them into the same diff check below: an annotation edited
      # without regenerating, or a route added without annotating, fails exactly as
      # unformatted Go does. Two of the three services describe themselves, so those two
      # regenerate — `iam` publishes no description by design and has no such task.
      - run: task orchestrator:openapi
      - run: task observability:openapi
      # tidy, fmt and openapi repair go.*, Go sources and the spec and still exit 0,
      # so a PR that needed any of them would otherwise merge with the drift unmade.
      - name: Verify orchestrator, observability and iam are tidy, formatted and describe their API
        run: git diff --exit-code -- orchestrator observability iam
      - run: task orchestrator:lint
      - run: task observability:lint
      - run: task iam:lint
      # -race for all three: the orchestrator serialises concurrent deployment writes,
      # the observability service runs a worker pool behind a NATS subscription, and iam
      # rotates its signing key from whichever request first notices it is due — so in
      # each the bug worth catching is the one that passes without it.
      #
      # NOTE: the repo-layer tests in `orchestrator` and `observability` skip unless
      # TEST_DATABASE_URL is set, and nothing sets it for them — so e.g. the
      # keyset-paging tests do not run here. Tracked separately; do not read a green
      # run as covering them.
      - run: task orchestrator:test -- -race
      - run: task observability:test -- -race
      # `iam` is the exception, and it is one on purpose rather than by favouritism:
      # its two load-bearing invariants — that only the first user ever to sign in
      # becomes an admin, and that racing replicas install one signing key rather
      # than one each — are enforced by an upsert's `xmax` and by Postgres advisory
      # locks. Neither exists in a fake, so a green run without a database would say
      # nothing at all about the two things most worth knowing.
      - name: Apply the schema to the throwaway Postgres
        env:
          PGPASSWORD: octo
        run: psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -q -f sql/schema.sql
      - name: Run the iam tests against a real database
        env:
          TEST_DATABASE_URL: postgres://postgres:octo@127.0.0.1:5432/postgres
        run: task iam:test -- -race
      - run: task sidecars:tidy
      - run: task sidecars:fmt
      # tidy and fmt can repair sidecars/go.* and Go sources and still exit 0, so a
      # PR that needed either would otherwise merge with the drift unmade. Fail if
      # they changed anything tracked under sidecars/.
      - name: Verify sidecars is tidy and formatted
        run: git diff --exit-code -- sidecars
      - run: task sidecars:lint
      # -race because the reload coordinator's whole job is serialising concurrent
      # requests, and a data race there is exactly the bug that passes without it.
      - run: task sidecars:test -- -race
      - run: task sidecars:build
      # The release builds the CLI archives from .goreleaser.yaml. Validate it here so
      # a broken config surfaces on the PR that broke it, not on the release that
      # needed it.
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check

  # Both Next apps, plus the desktop shell. `standalone` had no job at all until
  # now, so nothing was failing on its lint, its tests or its build — the same gap
  # the Go service modules had in the job above, and the same one `desktop` would
  # have had if it were merely added to the root `task test` aggregator: this job
  # enumerates what it runs, and what it enumerates is the whole guarantee.
  web:
    runs-on: ubuntu-latest
    env:
      # apps/desktop devDepends on electron, whose postinstall downloads a ~150MB
      # platform binary. Nothing in CI launches the app — typecheck reads the
      # package's .d.ts, the tests cover main-process logic that imports no
      # electron, and the build externalizes it — so every job that installs the
      # workspace can skip the download. Packaging in release.yml does not, and
      # sets this to 0.
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/platform/.nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter platform lint
      - run: pnpm --filter platform test
      - run: pnpm --filter platform build
      - run: pnpm --filter standalone lint
      - run: pnpm --filter standalone test
      - run: pnpm --filter standalone build
      # The desktop shell carries no eslint config (the repo lints only the two
      # Next apps, which get one from eslint-config-next); for a bundled TS app
      # tsc is the check that actually catches things. Two projects, because
      # main and preload have different libs — preload touches the DOM, main
      # must not.
      - run: pnpm --filter desktop typecheck
      - run: pnpm --filter desktop test
      - run: pnpm --filter desktop build

  # The Helm chart targets clusters CI cannot spin up on demand — GKE Autopilot,
  # EKS — so rendering every environment profile and validating the output
  # against the real Kubernetes schemas is the automated gate. Without it, a
  # change to the octo-common library that renders fine under the defaults could
  # only be caught by deploying to the cluster it broke.
  helm:
    runs-on: ubuntu-latest
    # Renders and validates locally; writes nothing anywhere.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Pinned, not floating. Chart packaging and template resolution are exactly
      # the behaviour that must not change under us between runs — the chart
      # vendors a library chart under charts/, and how Helm treats that is the
      # thing being tested.
      - uses: azure/setup-helm@v4
        with:
          version: v3.21.3
      - name: Install kubeconform and Task
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C "$HOME/bin" kubeconform
          sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - run: task helm:test

  terraform:
    runs-on: ubuntu-latest
    # Read-only, and the checkout token is not left in .git/config afterwards:
    # this job runs `terraform init`, which downloads and executes provider
    # binaries, so it should hold nothing worth stealing.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Pinned to a version that satisfies the strictest root: the eks root needs
      # >= 1.10 for the S3 backend's native locking.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - name: Install Task
        run: |
          mkdir -p "$HOME/bin"
          sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      # fmt + validate across every root and module. `validate` needs providers, so
      # it needs an init — but the task passes -backend=false, so this runs with no
      # cloud credentials, no state bucket and nothing to clean up. The committed
      # .terraform.lock.hcl files carry linux_amd64 hashes precisely so this step
      # resolves the same providers a laptop does.
      - run: task tf:check

  docs:
    runs-on: ubuntu-latest
    env:
      # Nothing here needs the Electron binary; see the web job above.
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Task
        run: |
          sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b "$(go env GOPATH)/bin"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/platform/.nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: task runtime:build
      # Fails when a registered connector/block type has no docs page (or a
      # docs page claims a type that no longer exists). See AGENTS.md
      # "Documentation policy".
      - run: node scripts/check-docs-drift.mjs
      # The downloadable platform API contract is a COPY of the one embedded in
      # the binary, so unlike the drift tests beside it in Go, only a diff can
      # tell whether it is current.
      - run: task docs:openapi
      - run: git diff --exit-code -- apps/docs/public/octo-platform-api.yaml
      # Static-export build doubles as an MDX/broken-link check.
      - run: pnpm --filter docs build
