name: release

# Triggered automatically by the release-please workflow once it creates a version
# tag (it calls this as a reusable workflow — release-please can't cascade-trigger
# a tag-driven workflow because it pushes the tag with the default GITHUB_TOKEN).
# Also runnable on a manually-pushed v* tag or from the Actions UI.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to build/publish (e.g. v0.1.6). Blank = just run checks on the default branch."
        required: false
  workflow_call:
    inputs:
      tag:
        description: "Version tag to build and publish (e.g. v0.1.6)."
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The release tag for call/dispatch, else the triggering ref (a v* tag).
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # `task build` builds the pnpm workspace (apps/platform + apps/standalone)
      # alongside the Go runtime, so Node + pnpm must be on PATH here too.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/platform/.nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Task
        run: |
          sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b "$(go env GOPATH)/bin"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: task release-check
      - run: task build

  # Publish the self-contained standalone "try Octo" image to public Docker Hub,
  # multi-arch so it runs natively on Apple Silicon and x86. Runs only when a
  # version tag is in play (call/dispatch input, or a pushed v* tag).
  publish-standalone:
    needs: release-check
    if: ${{ inputs.tag != '' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: ver
        run: |
          REF="${{ inputs.tag || github.ref_name }}"
          echo "version=${REF#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/standalone/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            docker.io/juancavallotti/octo:${{ steps.ver.outputs.version }}
            docker.io/juancavallotti/octo:latest

  # Publish the runtime-only image so users can run integrations from Docker
  # without the editor or a cluster. Same Dockerfile as the cluster's
  # octo-runtime, but built with the DEFAULT (untagged) binary: GOTAGS="" selects
  # the standalone services provider, so the image has no NATS/Kubernetes
  # dependency. The cluster image the orchestrator deploys keeps -tags k8s and is
  # built separately by cloudbuild.yaml into Artifact Registry.
  publish-runtime:
    needs: release-check
    if: ${{ inputs.tag != '' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: ver
        run: |
          REF="${{ inputs.tag || github.ref_name }}"
          echo "version=${REF#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          # The repo root is the build context: the Go module is rooted there.
          context: .
          file: runtime/Dockerfile
          build-args: |
            GOTAGS=
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            docker.io/juancavallotti/octo-runtime:${{ steps.ver.outputs.version }}
            docker.io/juancavallotti/octo-runtime:latest

  # Cross-compile both CLIs — octo, and dolphin, its test runner — and attach the
  # archives to the GitHub release, so users can install them without a Go toolchain.
  # GoReleaser does the work; .goreleaser.yaml is the source of truth for the targets,
  # the archive names, and the checksums file. release-please has already created the
  # release and its notes by the time this runs, so goreleaser only uploads the
  # assets (release.mode: keep-existing).
  publish-cli:
    needs: release-check
    if: ${{ inputs.tag != '' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      # Release assets are uploaded to the release for this tag.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          # GoReleaser derives the version from git history and refuses a shallow clone.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The binaries report a version const that release-please stamps into the commit
      # being tagged — nothing is injected at link time, so if a const ever disagrees
      # with the tag, the release would ship a binary lying about what it is. The most
      # likely cause is a new CLI whose version.go was never added to the extra-files
      # list in release-please-config.json, which this is here to catch.
      - name: The version consts must match the tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          want="${TAG#v}"
          for f in runtime/octo/version.go runtime/dolphin/version.go; do
            got="$(grep -o 'Version = "[^"]*"' "$f" | cut -d'"' -f2)"
            if [ "$got" != "$want" ]; then
              echo "::error file=$f::says $got, but the tag says $want — is $f listed in release-please-config.json extra-files?"
              exit 1
            fi
            echo "$f: $got"
          done
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Pin the version goreleaser builds rather than letting it infer one with
          # `git describe`, which also covers the workflow_dispatch path.
          GORELEASER_CURRENT_TAG: ${{ inputs.tag || github.ref_name }}
