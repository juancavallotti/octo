name: release

# Triggered automatically by the release-please workflow once it creates a version
# tag (it calls this as a reusable workflow — release-please can't cascade-trigger
# a tag-driven workflow because it pushes the tag with the default GITHUB_TOKEN).
# Also runnable on a manually-pushed v* tag or from the Actions UI.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to build/publish (e.g. v0.1.6). Blank = just run checks on the default branch."
        required: false
  workflow_call:
    inputs:
      tag:
        description: "Version tag to build and publish (e.g. v0.1.6)."
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The release tag for call/dispatch, else the triggering ref (a v* tag).
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # `task build` builds the pnpm workspace (apps/platform + apps/standalone)
      # alongside the Go runtime, so Node + pnpm must be on PATH here too.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/platform/.nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Task
        run: |
          sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b "$(go env GOPATH)/bin"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: task release-check
      - run: task build

  # Publish the self-contained standalone "try Octo" image to public Docker Hub,
  # multi-arch so it runs natively on Apple Silicon and x86. Runs only when a
  # version tag is in play (call/dispatch input, or a pushed v* tag).
  publish-standalone:
    needs: release-check
    if: ${{ inputs.tag != '' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: ver
        run: |
          REF="${{ inputs.tag || github.ref_name }}"
          echo "version=${REF#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/standalone/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            docker.io/juancavallotti/octo:${{ steps.ver.outputs.version }}
            docker.io/juancavallotti/octo:latest

  # Publish the runtime-only image so users can run integrations from Docker
  # without the editor or a cluster. Same Dockerfile as the cluster's
  # octo-runtime, but built with the DEFAULT (untagged) binary: GOTAGS="" selects
  # the standalone services provider, so the image has no NATS/Kubernetes
  # dependency. The cluster image the orchestrator deploys keeps -tags k8s and is
  # built separately by cloudbuild.yaml into Artifact Registry.
  #
  # This one build is also pushed as octo-devruntime-paas — the runtime a dev run
  # executes, which a private-registry install pulls under the -paas name. It is
  # byte-for-byte the standalone runtime (GOTAGS=""), so it is TAGGED from this
  # single build rather than built again in publish-paas-images: two independent
  # docker builds of the same source guarantee nothing about their digests, and a
  # dev run whose runtime silently drifts from the advertised public one is the
  # bug this arrangement exists to prevent.
  publish-runtime:
    needs: release-check
    if: ${{ inputs.tag != '' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: ver
        run: |
          REF="${{ inputs.tag || github.ref_name }}"
          echo "version=${REF#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          # The repo root is the build context: the Go module is rooted there.
          context: .
          file: runtime/Dockerfile
          build-args: |
            GOTAGS=
          platforms: linux/amd64,linux/arm64
          push: true
          # Both repository names come off this one build, so octo-devruntime-paas
          # and the public octo-runtime share a digest by construction.
          tags: |
            docker.io/juancavallotti/octo-runtime:${{ steps.ver.outputs.version }}
            docker.io/juancavallotti/octo-runtime:latest
            docker.io/juancavallotti/octo-devruntime-paas:${{ steps.ver.outputs.version }}
            docker.io/juancavallotti/octo-devruntime-paas:latest

  # Publish the API-delegating runtime: the flavour whose platform capabilities
  # all come from an HTTP API the operator implements (RUNTIME_SERVICES_MODULE=api,
  # OCTO_PLATFORM_API_URL naming the server).
  #
  # It is published under both names off one build, the same arrangement and for
  # the same reason as octo-runtime / octo-devruntime-paas above: the public
  # octo-api is what somebody runs on Cloud Run or beside their own service, and
  # octo-api-paas is what a private-registry install of this cluster pulls. Two
  # independent docker builds of the same source guarantee nothing about their
  # digests, and there is no version of this where the two should differ.
  #
  # One image serves all three deployment shapes — a Cloud Run service, a central
  # service that pods call, a sidecar's neighbour — because they differ only in
  # what OCTO_PLATFORM_API_URL points at.
  publish-api-runtime:
    needs: release-check
    if: ${{ inputs.tag != '' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: ver
        run: |
          REF="${{ inputs.tag || github.ref_name }}"
          echo "version=${REF#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          # The repo root is the build context: the Go module is rooted there.
          context: .
          file: runtime/Dockerfile
          build-args: |
            GOTAGS=api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            docker.io/juancavallotti/octo-api:${{ steps.ver.outputs.version }}
            docker.io/juancavallotti/octo-api:latest
            docker.io/juancavallotti/octo-api-paas:${{ steps.ver.outputs.version }}
            docker.io/juancavallotti/octo-api-paas:latest

  # Publish the PaaS-side images — the editor, orchestrator, log aggregator,
  # schema applier, embedding server, and the k8s-flavoured runtime the
  # orchestrator deploys per integration — to public Docker Hub, multi-arch.
  # Previously private, built by cloudbuild.yaml into Artifact Registry only
  # (see #199).
  #
  # The "-paas" suffix (rather than reusing octo-runtime with a tag or suffix for
  # the k8s build) is deliberate: that image isn't actually k8s-specific tuning,
  # it's this cluster/PaaS deployment as a whole, and every image in it gets the
  # same suffix for a consistent, unambiguous identity — distinct from octo /
  # octo-runtime above, the standalone "try it locally" images. Distinct
  # repository names (not a shared name with a different tag) matter most for the
  # runtime: the k8s build needs the orchestrator to exist and cannot run
  # standalone, and the standalone build cannot do leader election — publishing
  # both under one name would be a live incident waiting for whoever pulls the
  # wrong one.
  #
  # WHY THIS IS SPLIT PER ARCHITECTURE AND MERGED AFTERWARDS. It used to be one
  # job per image emitting both platforms from an amd64 runner, with arm64 under
  # QEMU. Every image here but one is Go, which emulates acceptably (~20 min).
  # octo-platform-paas is not: it runs `pnpm install` and a full Next.js build,
  # and emulated that took 25 minutes on the run that published 0.8.10 and then
  # simply never finished on the two runs after it — 0.8.11 was cancelled at the
  # 6-hour job ceiling, and 0.8.12 was still going at 1h20m. Nothing about the
  # app changed between those releases (v0.8.10..v0.8.11 touched one page), so
  # this is not a regression to chase in our code: an emulated Node build was
  # sitting on the edge of viable and fell off it, and the chart has been
  # installing a stale editor ever since.
  #
  # So each platform builds on a runner of its own architecture — no emulation
  # anywhere — and pushes an untagged, digest-only image. The merge job below
  # then assembles the two digests into the tagged multi-arch manifest that
  # users and the chart actually pull. Nothing is tagged until both halves
  # exist, so a half-published release cannot appear under :latest.
  build-paas-images:
    needs: release-check
    if: ${{ inputs.tag != '' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
    strategy:
      # One image failing should not cancel the others: the merge job skips
      # whatever is incomplete, and a rerun of just the failed leg finishes it.
      fail-fast: false
      matrix:
        # Two independent axes, so every image is built on both runners. The
        # target objects carry what is per-image; the platform objects pair an
        # architecture with the runner that is native to it.
        platform:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            # GitHub's hosted arm64 runners, free for public repositories —
            # which this is. This label is the whole reason the split works.
            runner: ubuntu-24.04-arm
        target:
          - image: octo-platform-paas
            context: .
            dockerfile: apps/platform/Dockerfile
          - image: octo-orchestrator-paas
            context: ./orchestrator
            dockerfile: orchestrator/Dockerfile
          - image: octo-observability-paas
            context: ./observability
            dockerfile: observability/Dockerfile
          - image: octo-iam-paas
            context: ./iam
            dockerfile: iam/Dockerfile
          - image: octo-schema-paas
            context: ./sql
            dockerfile: sql/Dockerfile
          - image: octo-runtime-paas
            # The repo root is the build context: the Go module is rooted there.
            context: .
            dockerfile: runtime/Dockerfile
            buildArgs: GOTAGS=k8s
          # The dev-run sidecar. One module holds every sidecar, so the context is
          # sidecars/ and the Dockerfile path selects which one is built.
          - image: octo-devsidecar-paas
            context: ./sidecars
            dockerfile: sidecars/dev/Dockerfile
          # The pod stats sidecar, out of the same module.
          - image: octo-statssidecar-paas
            context: ./sidecars
            dockerfile: sidecars/stats/Dockerfile
          # The agentic runner. Unlike octo-devruntime-paas below it IS built here:
          # it is a genuinely distinct image — its own Dockerfile, its own base, and
          # three binaries rather than one — so there is no single build for it to be
          # tagged off.
          - image: octo-agenticrunner-paas
            # The repo root is the build context: the Go module is rooted there.
            context: .
            dockerfile: runtime/Dockerfile.agentic
          # The embedding server: the standalone binary plus one small app, baked
          # in. Its own Dockerfile because it carries an app as well as a binary,
          # and the repo root is the build context: the Go module is rooted there.
          #
          # It was missing from this list from the day the server was added until
          # 0.8.12 — the chart named octo-embeddings-paas and Docker Hub had never
          # heard of it, so turning embeddings on in a public-images install got an
          # ImagePullBackOff and nothing else went wrong loudly enough to notice.
          # `task release-check` now fails when the chart names an image this
          # workflow does not publish.
          - image: octo-embeddings-paas
            context: .
            dockerfile: embeddings/Dockerfile
          # NOTE: octo-devruntime-paas is NOT built here. It is byte-for-byte the
          # standalone runtime (GOTAGS=""), so publish-runtime tags it from that one
          # build to guarantee an identical digest — building it again here would not.
          #
          # NOTE: octo-api-paas is not built here either, for the same reason:
          # publish-api-runtime tags it from the single GOTAGS=api build.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      # No setup-qemu-action: the runner is already the target architecture, and
      # registering emulators would only invite the build to use them.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.target.context }}
          file: ${{ matrix.target.dockerfile }}
          build-args: ${{ matrix.target.buildArgs || '' }}
          platforms: linux/${{ matrix.platform.arch }}
          # Pushed by digest and deliberately untagged: a tag pushed here would
          # be a single-architecture image wearing the name users pull, for as
          # long as it took the other architecture to finish. The merge job puts
          # the tags on, once.
          outputs: type=image,name=docker.io/juancavallotti/${{ matrix.target.image }},push-by-digest=true,name-canonical=true,push=true
      # The digest is all the merge job needs; the layers are already in the
      # registry. One file per image per architecture, named by architecture and
      # holding the digest, so the merge job can reassemble the tree by directory.
      - name: Record the digest
        env:
          IMAGE: ${{ matrix.target.image }}
          ARCH: ${{ matrix.platform.arch }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$DIGEST"
          mkdir -p "digests/$IMAGE"
          echo -n "$DIGEST" > "digests/$IMAGE/$ARCH"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.target.image }}-${{ matrix.platform.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  # Assemble each image's per-architecture digests into the tagged multi-arch
  # manifest. This is the step that makes :<version> and :latest exist, so until
  # it runs a release has published nothing anyone pulls by name.
  #
  # One job over every image rather than a matrix mirroring the one above: the
  # image list would have to be repeated to do that, and a list repeated in two
  # places is a list that eventually disagrees with itself — which is the exact
  # failure that left octo-embeddings-paas unpublished. Here the images are
  # whatever directories the artifacts carry.
  publish-paas-images:
    needs: build-paas-images
    if: ${{ inputs.tag != '' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          path: digests
          pattern: digest-*
          # Every artifact holds one <image>/<arch> file, so merging them all
          # into one tree reproduces digests/<image>/{amd64,arm64}.
          merge-multiple: true
      - name: Create the multi-arch manifests
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          version="${TAG#v}"
          for dir in digests/*/; do
            image="$(basename "$dir")"
            refs=""
            for arch in amd64 arm64; do
              # A missing architecture means its build leg failed. Publishing the
              # tag anyway would quietly ship a half-architecture release, so stop
              # and let the failed leg be rerun instead.
              if [ ! -f "$dir$arch" ]; then
                echo "::error::$image has no $arch digest — its build job did not succeed"
                exit 1
              fi
              refs="$refs docker.io/juancavallotti/$image@$(cat "$dir$arch")"
            done
            echo "$image: $refs"
            # shellcheck disable=SC2086 # refs is a deliberately word-split list.
            docker buildx imagetools create \
              -t "docker.io/juancavallotti/$image:$version" \
              -t "docker.io/juancavallotti/$image:latest" \
              $refs
            docker buildx imagetools inspect "docker.io/juancavallotti/$image:$version"
          done

  # Publish both Helm charts to GitHub Container Registry, so the stack can be
  # installed without access to this project's Artifact Registry:
  #
  #   helm install octo oci://ghcr.io/juancavallotti/charts/octo --version 0.7.0
  #
  # The chart's own defaults point at the public Docker Hub images published by
  # publish-paas-images above, with image.tag falling back to the chart's
  # appVersion — so that command needs no --set to produce a working install.
  #
  # ghcr rather than Docker Hub OCI: free for public artifacts, no extra secret
  # (the job's own GITHUB_TOKEN suffices), and solid Helm OCI support.
  publish-charts:
    needs: release-check
    if: ${{ inputs.tag != '' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Pushing OCI artifacts to ghcr.io under this repository's owner.
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: azure/setup-helm@v4
        with:
          # Pinned, and kept in step with validate.yml and cloudbuild.yaml.
          version: v3.21.3
      # release-please stamps the chart versions into the commit being tagged, so
      # a mismatch means a version stopped being stamped and the release would
      # publish a chart lying about what it is. All four are checked, because none
      # of them fails loudly on its own:
      #
      #   - appVersion is what image.tag falls back to, so a stale one ships a
      #     chart that installs the wrong images;
      #   - the octo-common pin is not validated against the vendored copy by
      #     `helm package`, so a stale one packages clean and ships a chart
      #     declaring a dependency it does not carry.
      - name: The chart versions must match the tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          want="${TAG#v}"
          check() {
            if [ "$2" != "$want" ]; then
              echo "::error file=$1::$3 is $2, but the tag says $want — does that line still carry its x-release-please-version annotation, and is $1 still in release-please-config.json extra-files?"
              exit 1
            fi
            echo "$1: $3 $2"
          }
          check helm/Chart.yaml "$(awk '/^version:/ {print $2}' helm/Chart.yaml)" version
          check helm/Chart.yaml "$(awk '/^appVersion:/ {print $2}' helm/Chart.yaml)" appVersion
          # Indented, so anchor on the dependency it belongs to rather than on
          # `version:` alone, which would match the top-level key first.
          check helm/Chart.yaml "$(awk '/^  - name: octo-common$/ {f=1; next} f && /^    version:/ {print $2; exit}' helm/Chart.yaml)" "octo-common dependency pin"
          check helm/charts/octo-common/Chart.yaml "$(awk '/^version:/ {print $2}' helm/charts/octo-common/Chart.yaml)" version
      - name: Package and push both charts
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          OWNER: ${{ github.repository_owner }}
          # Through env, not ${{ }} in the script body. An expression is
          # substituted as literal shell text before the shell runs, so a value
          # carrying shell metacharacters would execute as code; an environment
          # variable is just data. The two above already did this — these were
          # the stragglers.
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          set -e
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$GH_ACTOR" --password-stdin
          version="${TAG#v}"
          mkdir -p dist
          # The library chart is vendored inside the app chart tarball by
          # `helm package`, so the octo chart installs on its own; octo-common is
          # pushed separately only so it can be depended on directly.
          helm package helm/charts/octo-common -d dist
          helm package helm -d dist
          helm push "dist/octo-common-${version}.tgz" "oci://ghcr.io/${OWNER}/charts"
          helm push "dist/octo-${version}.tgz" "oci://ghcr.io/${OWNER}/charts"

  # Cross-compile both CLIs — octo, and dolphin, its test runner — and attach the
  # archives to the GitHub release, so users can install them without a Go toolchain.
  # GoReleaser does the work; .goreleaser.yaml is the source of truth for the targets,
  # the archive names, and the checksums file. release-please has already created the
  # release and its notes by the time this runs, so goreleaser only uploads the
  # assets (release.mode: keep-existing).
  # The macOS desktop app: the standalone editor packaged as an .app that opens a
  # working folder. Runs after publish-cli because it CONSUMES that job's release
  # archives rather than compiling its own octo and dolphin — two independent
  # builds of the same source guarantee nothing about their bits, and a desktop
  # app shipping a subtly different runner than the one on the release page is
  # exactly the skew worth designing out. The same reasoning the PaaS runtime
  # images already follow.
  publish-desktop:
    needs: [release-check, publish-cli]
    if: ${{ inputs.tag != '' || startsWith(github.ref, 'refs/tags/v') }}
    # An arm64 macOS runner. It cross-packages the x64 app fine: nothing here is
    # compiled on the runner — the Go binaries are downloaded and the Electron
    # bundle is fetched per target architecture.
    runs-on: macos-14
    permissions:
      # Assets are added to the release publish-cli created for this tag.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/platform/.nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The same guarantee publish-cli makes for the version consts. electron-updater
      # compares the packaged app's version against the release it finds, so a
      # package.json that release-please never stamped means clients that either
      # never update or update in a loop — and nothing else would notice.
      - name: The desktop version must match the tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          want="${TAG#v}"
          got="$(node -p "require('./apps/desktop/package.json').version")"
          if [ "$got" != "$want" ]; then
            echo "::error file=apps/desktop/package.json::says $got, but the tag says $want — is it listed in release-please-config.json extra-files?"
            exit 1
          fi
          echo "apps/desktop/package.json: $got"

      # The exact binaries this release publishes, unpacked into the per-arch
      # layout electron-builder's ${arch} macro copies from — which spells amd64
      # "x64". Deliberately not `task desktop:bins`, which compiles.
      - name: Fetch the released octo and dolphin
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          for pair in "arm64 arm64" "amd64 x64"; do
            set -- $pair; goarch="$1"; ebarch="$2"
            out="apps/desktop/build/bin/$ebarch"
            mkdir -p "$out"
            for bin in octo dolphin; do
              gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
                --pattern "${bin}_darwin_${goarch}.tar.gz" --output "/tmp/${bin}.tgz" --clobber
              tar -xzf "/tmp/${bin}.tgz" -C "$out" "$bin"
              chmod +x "$out/$bin"
            done
            file "$out/octo"
          done

      # Builds the standalone app and stages it, pruning the arch-specific sharp
      # so one build serves both architectures. The task fails if any native
      # module survives, which is what keeps that guarantee honest.
      - name: Install Task
        run: |
          mkdir -p "$HOME/bin"
          sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - run: task desktop:stage

      - run: pnpm --filter desktop build

      # Signing and notarization are OPT-IN on the secrets being present, so this
      # job is green on a fork and on a repo that has not set them up yet: without
      # them electron-builder ad-hoc signs, which is enough for the app to launch
      # locally but not enough to clear Gatekeeper on a download. With them the
      # same command produces a signed, notarized, stapled build — nothing else
      # changes. See the PR that introduced this for how to generate each secret.
      - name: Package the app
        env:
          GH_TOKEN: ${{ github.token }}
          # Packaging needs the real Electron binary, unlike every other job.
          ELECTRON_SKIP_BINARY_DOWNLOAD: 0
          # Not a secret: an Apple Team ID is a public identifier, embedded in the
          # code signature of every app the team has ever shipped. It is here
          # because this account has certificates from three teams, so "sign with
          # whatever is in the keychain" is ambiguous — and an app signed by the
          # wrong team notarizes and then fails to update, which is a slow way to
          # find out.
          APPLE_TEAM_ID: WTWBLR82TY
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Read through the environment, never interpolated into the script body:
          # a ${{ secrets.* }} expansion inside `run` is substituted before bash
          # sees it, which both mangles a multi-line PEM and makes the script's
          # shape depend on the secret's contents.
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          args="--mac --arm64 --x64"
          if [ -n "${CSC_LINK:-}" ]; then
            echo "Developer ID certificate present: signing for distribution."
            if [ -n "${APPLE_API_KEY_P8:-}" ]; then
              # notarytool wants a file on disk, and a secret is a string.
              mkdir -p "$RUNNER_TEMP/notary"
              printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notary/key.p8"
              chmod 600 "$RUNNER_TEMP/notary/key.p8"
              export APPLE_API_KEY="$RUNNER_TEMP/notary/key.p8"
              args="$args --config.mac.notarize=true"
              echo "App Store Connect key present: notarizing."
            else
              echo "::warning::signing without notarization — Gatekeeper will still warn on download."
            fi
          else
            echo "::warning::no MAC_CSC_LINK secret; publishing an ad-hoc signed build that Gatekeeper will block on download."
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          pnpm --filter desktop exec electron-builder $args --publish never

      # Uploaded to the release publish-cli already created, alongside the CLI
      # archives. Names are version-free (Octo_mac_arm64.dmg), matching the CLI
      # archives, so the docs can link to a release asset without every release
      # breaking the link.
      - name: Attach the app to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          cd apps/desktop/dist/release
          ls -la
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            Octo_mac_arm64.dmg Octo_mac_x64.dmg
          echo "uploaded the macOS app to $TAG"

  publish-cli:
    needs: release-check
    if: ${{ inputs.tag != '' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      # Release assets are uploaded to the release for this tag.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          # GoReleaser derives the version from git history and refuses a shallow clone.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The binaries report a version const that release-please stamps into the commit
      # being tagged — nothing is injected at link time, so if a const ever disagrees
      # with the tag, the release would ship a binary lying about what it is. The most
      # likely cause is a new CLI whose version.go was never added to the extra-files
      # list in release-please-config.json, which this is here to catch.
      - name: The version consts must match the tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          want="${TAG#v}"
          for f in runtime/octo/version.go runtime/dolphin/version.go; do
            got="$(grep -o 'Version = "[^"]*"' "$f" | cut -d'"' -f2)"
            if [ "$got" != "$want" ]; then
              echo "::error file=$f::says $got, but the tag says $want — is $f listed in release-please-config.json extra-files?"
              exit 1
            fi
            echo "$f: $got"
          done
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Pin the version goreleaser builds rather than letting it infer one with
          # `git describe`, which also covers the workflow_dispatch path.
          GORELEASER_CURRENT_TAG: ${{ inputs.tag || github.ref_name }}
