name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # When release-please cuts a release it pushes the tag with the default
  # GITHUB_TOKEN, which by design does NOT cascade-trigger the tag-driven release
  # workflow. So invoke it directly here, passing the freshly-created tag.
  release:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit

  # The docs site ships with the release, from the same tag, so the page a reader
  # lands on describes the version they can install — see docs-pages.yml. Pages
  # deployment needs its own token scopes, which a called workflow takes from the
  # job that calls it, hence the permissions here.
  docs:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs-pages.yml
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}
